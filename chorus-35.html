<h2>English Chorus 35</h2><pre>By Your side I would stay;<br>In Your arms I would lay.<br>Jesus, Lover of my soul,<br>Nothing from You I withhold.<br>Lord, I love You, and adore You;<br>What more can I say?<br>You cause my love to grow stronger<br>With every passing day.</pre></body></html>
