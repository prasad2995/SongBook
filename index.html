 died for me.\n\n2.More about Jesus let me learn\nMore of His holy will discern;\nSpirit of God, my Teacher be,\nShowing the things of Christ to me.\n\n3.More about Jesus in His Word,\nHolding communion with my Lord;\nHearing His voice in every line,\nMaking each faithful saying mine.\n\n4.More about Jesus on His throne,\nRiches in glory all His own;\nMore of His kingdom’s sure increase\nMore of His coming, Prince of Peace","ec":"Cheer up for I have overcome (3)\nI have overcome the world.\n\n1.In this world you will have trouble and sorrow,\nIn this world you will be tested and tried;\nDon’t forget My words before I left you\nLet them cheer you up, in you abide.\n\n2.Don’t give up, when facing some sad tomorrow;\nDon’t give up when feeling heartsick, denied.\nThink of me remember how much I love you,\nFind in me your peace, in Me abide.","ts":"1.ఉన్నత దేవుని – చాటున\nనివసించువాడే సర్వశక్తుని\nనీడను - విశ్రమించున్‌\nఆహా! పరమ ధన్యత యిదియే! (2)\n\nతన రెక్కల క్రింద ఆశ్రయము\nతన రెక్కలతో కప్పును (2)\n\n2.దేవుడే నా ఆశ్రయం\nనా కోటయు దుర్గమును\nఆయనే సత్యము - నా కేడెమును\nనే నమ్ముకొను దేవుడు (2)   ||తన||\n\n3.రాత్రిలో భయముకైన పగటి బాణముకైన\nచీకటిలో తిరుగు తెగులుకైనను\nభయపడనే భయపడను(2)  ||తన||\n\n4.వందలు వేలైన\nనీ ప్రక్కను కూలినను\nఆయనే నీదు విమోచకుడు\nఅపాయము తాకదు (2)     ||తన||\n\n5.దేవుడే నీ ఆశ్రయం ఆయనే నీ నివాస స్థలం\nఅపాయము తెగులు గుడారమును\nచెంతకు సమీపించవు (2)    ||తన||\n\n6.నీ...దు మార్గము లన్నిటన్‌ తన\nదూతలు కాపాడున్‌ పాదమునకు రాయి తగులకుండా \nవారు నిన్నెత్తికొందురు (2)    ||తన||\n\n7.కొదమ సింహము నణచి నాగు పాములన్‌ త్రొ....క్కి\nఅతడు నన్ను ప్రేమించెను \nఅతనికి జయమిత్తున్‌ (2)    ||తన||\n\n8.నా...నామము నెరిగెన్‌  అతని ఘనపరచెదను\nశ్రమలో నేనతనికి తోడైయుండి\nనే నుత్తర మిచ్చెదను (2)    ||తన||\n"},{"n":38,"ei":"More love to thee","ci":"Channels only blessed","ti":"పాపమునకు జీతము మరణం","es":"1.More love to Thee, O Christ, more love to thee;\nHear thou the prayer I make on bended knee;\nThis is my earnest plea\n\nMore love, O Christ to thee,\nMore love to Thee,\nMore love to Thee.\n\n2.Once earthly joy I craved,\nsought peace and rest;\nNow thee alone I seek,\ngive what is best;\nThis all my prayer shall be\n\nMore love, O Christ to Thee,\nMore love to Thee,\nMore love to Thee:\n\n3.Let sorrow do its work, \nsend grief and pain:\nSweet are thy messengers, sweet their refrain,\nWhen they can sing with me\n\nMore love, O Christ to Thee,\nMore love to Thee,\nMore love to Thee.\n\n4.Then shall my latest breath \nwhisper Thy  praise;\nThis be the parting cry my heart shall raise\nThis still its prayer shall be\n\nMore love, O Christ to Thee,\nMore love to Thee,\nMore love to Thee.","ec":"Channels only, blessed Master,\nBut with all Thy wondous power;\nFlowing through us, Thou canst use us,\nEv’ry day and ev’ry hour.","ts":"1.పాపమునకు జీతము మరణం\nఓ పాపి భయపడవా చూచునదెల్ల\nనశించు నిశ్చయం చూడనిదే నిత్యము\n\nయేసురాజు వచ్చును ఇంకాకొంత\nకాలమే మోక్షమందు జేరుదుము(2)\n\n2.లోక సుఖము నమ్మకు నమ్మకు\nఆ యిచ్ఛలన్ని మాయమగును\nనీ జీవము పోవు సమయమున\nచిల్లిగవ్వ వెంటరాదు\t||యేసు||\n\n3.నీ కాలమెల్ల వ్యర్థమగుచున్నది \nలోకమాయలలో– చిక్కినందున \nదైవకోపము దిగివచ్చుటకు ముందు\nనీ రక్షకుని జేరుము\t ||యేసు||\n\n4.దేవుని ప్రేమ పారుచున్నది \nకల్వరి గిరి నుండి యిదిగో\nనీ పాప మెల్లపోవును అందున\nస్నానము చేసినట్లయిన  ||యేసు||\n\n5.మహా పాపినైన నన్నును నన్నును\nనా మిత్రుడంగీకరించెనే\nఓ పాపి నీవు పరుగిడుమా\nదేవ దీవెనలు పొందుమా  ||యేసు||\n\n6.కష్ట దుఃఖము లెక్కుడగుచో\nఇష్టు డేసుని వీడకు వీడకు\nసిగ్గులేక చేరుము దేవుని\nచెంత నెప్పుడు వసించుము ||యేసు||\n\n7.నీ పాపములకై మనస్తాపము \nబొంది యేసు నొద్దకు వేగరా\nభయమును పోగొట్టి మన్నింపగా\nస్తుతిపాడు హల్లెలూయా  ||యేసు||"},{"n":39,"ei":"My faith looks up to thee","ci":"Clap your hands","ti":"సంతోషం పొంగెను - సంతోషం పొంగెను","es":"1.My faith looks up to Thee,\nThou Lamb of calvary,\nSaviour Divine:\nNow hear me while I pray,\nTake all my guilt away,\nOh, let me from this day\nBe wholly Thine!\n\n2.May Thy rich grace impart\nStrength to my fainting heart,\nMy zeal inspire;\nAs Thou hast died for me,\nOh, may my love to Thee\nPure warm, and changeless be,\nA living fire!\n\n3.When life’s dark maze I tread,\nAnd griefs around me spread,\nBe Thou my Guide\t\nBid darkness turn to day,\nWipe sorrow’s tears away,\nNor let me ever stray\nFrom Thee aside.\n\n4.When ends life’s transient dream,\nWhen death’s cold, sullen stream,\nShall o’er me roll;\nBlest Saviour, then in love\nFear and distrust remove;\nOh, bear me safe above,\nA ransomed soul.","ec":"Clap your hands together\nAnd praise the Lord. (2)\nJoin together and sing,\nJoy to the whole world bring\nClap your hands together\nAnd praise the Lord.","ts":"సంతోషం పొంగెను - సంతోషం పొంగెను\nసంతోషం పొంగిపొర్లెను... హల్లెలూయ\nయేసునన్ను రక్షించెన్‌... నా పాపము\nకడిగెన్‌ సంతోషం పొంగి పొర్లెను\n\n1.త్రోవ తప్పి తిరుగుచుంటిని\nఆ త్రోవలోనే పడిపోతిని\nఅయినన్‌ యేసు కరుణించెన్‌\nతానె నన్ను రక్షించెన్‌ (2)\nఇంత వరకు కాచినాడు  మంచి యేసుడే   ||సంతోషం||\n\n2.దేవుని సెలవు పొంది\nసాతాను శోధించును\nఅయినన్‌ యేసు విడువడు\nతానె వచ్చి రక్షించును (2)\nఇంత మంచి యేసు నాకు స్వంతమాయెను  ||సంతోషం||\n\n3. మారుమనసు లేని ప్రజలు\nపాతాళ మందు ప్రలాపింతురు\nనేను పరమందున\nక్రొత్త గీతం పాడెదన్‌ నాలోనున్న యేసుతో \nనిరంతరముందును\t||సంతోషం||"},{"n":40,"ei":"My Jesus, I love thee","ci":"Come, all India, to God","ti":"లెమ్ము తేజరిల్లుము నీకు వెలుగు వచ్చియున్నది","es":"1.My Jesus, I love Thee, i know Thou art mine:\nFor Thee all the follies of sin I resign;\nMy gracious Redeemer, My Saviour, art Thou;\nIf ever I loved Thee, My Jesus, ’tis now.\n\n2.I love Thee because Thou hast first loved me,\nAnd purchased my pardon on Calvary’s tree;\nI love Thee for wearing the thorns on Thy brow;\nIf ever I loved Thee, my Jesus, ’tis now.\n\n3.I love Thee in life, I will love Thee in death,\nAnd praise Thee as long as   \nThou lendest me breath;\nAnd say when the death dew lies \ncold on my brow,\nIf ever I loved Thee,                         \nMy Jesus, ’tis now.\n\n4.In mansions of glory and endless delight,\nI’ll ever adore Thee  in heaven so bright;\nI’ll sing with the glittering  crown on my brow,\nIf ever I loved Thee,\nMy Jesus, ’tis now.","ec":"Come, all India, to God, to the most loving Father.\nCome, all India, to God, to the God and Father of our Lord Jesus Christ.\n\n1.To the God of Abram and Isaac and Jacob.\nTo the one and only, true and living God.\n\n2.Come to God confessing, repenting acknowledging,\nJesus Christ as Saviour, as your Lord and King.","ts":"లెమ్ము తేజరిల్లుము నీకు వెలుగు వచ్చియున్నది\nయెహోవా మహిమ నీపై ప్రకాశముగా నుదయించె ||లెమ్ము||\n\n1.జనములు నీదు వెలుగునకు\nపరుగెత్తి వచ్చెదరు\nరాజులు నీదు ఉదయ\nకాంతికి వచ్చెదరు ||లెమ్ము||\n\n2.సముద్ర వ్యాపారము నీవైపు త్రిప్పబడును\nజనముల ఐశ్వర్యము\nనీ యొద్దకు వచ్చును     ||లెమ్ము||\n\n3.దేవదారు సరళ గొంజి\nచెట్లు నా ఆలయమునకు తేబడును నాదు పాద\nస్థలము మహిమ పరచెదను  ||లెమ్ము||\n\n4.నిన్ను శాశ్వతమైన\nశోభాతిశయముగ జేతున్‌\nబహుతరములకు సంతోష\nకారణముగ జేసెదను   ||లెమ్ము||\n\n5.వారిలో ఒంటరియైన\nవాడుపది వందలగును\nఎన్నిక లేనివాడు బలమైనట్టి జనమగును  ||లెమ్ము||"},{"n":41,"ei":"Now thank we all our God","ci":"Come bless the Lord","ti":"భయమేల జనులారా ప్రియ రక్షకుని చేర","es":"1.Now thank we all our God, \nWith hearts, and hands, and voices, \nWho wondrous things hath done, \nIn whom His world rejoices; \nWho, from our mother’s arms \nHath blessed us on our way \nWith countless gifts of love, \nAnd still is ours today.\n\n2.Oh, may this bounteous God \nThrough all our life be near us, \nWith ever-joyful hearts \nAnd blessed peace to cheer us; \nAnd keep us in His grace, \nAnd guide us when perplexed, \nAnd free us from all ills \nIn this world and the next.\n\n3.All praise and thanks to God \nThe father now be given, \nThe Son, and Him who reigns \nWith them in highest heaven; \nThe one eternal God, \nWhom heaven and earth adore; \nFor thus it was, is now, \nAnd shall be evermore.","ec":"Come bless the Lord,\nAll ye servants of the Lord,\nWho stand by night in the house of the Lord.\nLift up your hands in the holy place,\nCome bless the Lord (2)","ts":"భయమేల జనులారా \nప్రియ రక్షకుని చేర\nజయశీలుండౌ యేసున్‌\nభయభక్తులతో ప్రార్థింపన్‌\n\n1. వేష భాషలు మాని \nమోస మార్గము వీడి \nదోషంబులను బాపున్‌ \nనీ సురక్షకుని యాసించు  ||భయ||\n\n2.తిన్నని మార్గము విడిచి అన్న యేసుని మరచి\nఎన్నాళ్ళు పాపములో నీదులాడుచు నుండెదవు? ||భయ||\n\n3.మన కలుషంబులు గడుగన్‌ \nమన గాయంబులు మాన్పన్‌ \nతన రక్తంబును గార్చెన్‌ \nమనకై తన ప్రాణము బెట్టెన్‌   ||భయ||\n\n4.సిలువలో నీ కొరకై కలిగించె రక్షణను \nపలుమారు గాయములన్‌ - తలచుచు \nధ్యానించుము ప్రభుని   ||భయ||\n\n5.హృదయంబు మోసంబు హృదయంబు ఘోరంబు\nహృదయ వ్యాధిని మాన్ప యెద నేరికైనను దరమే  ||భయ||\n\n6.హృదయ మంతటినిచ్చి హృదయ శుద్ధిని బొంది హృదయ మంతటితోను\nసదయుండేసుని భజియింపన్‌   ||భయ||\n\n7.జీవంబు మార్గంబు సత్యంబులను జూపెన్\nభావంబులను మార్చి జీవజలంబులు దయచేయున్‌ ||భయ||\n\n8.కోరుదువా యా ప్రభుని జేరుదువా యీ క్షణమే \nకోరెడు వారిని నేడే  కోరిక దీరను రక్షించున్‌   ||భయ||"},{"n":42,"ei":"O bless the Lord from","ci":"Come, God invites us","ti":"యేది నీ సాక్ష్యము యేది నీ త్యాగము","es":"1.O, bless the Lord from the depth of your soul,\nForget not the good He has done;\nForgiveth your sins and He maketh you whole\nFor Jesus your sin load has borne.\n\nLongsuffering and merciful, gracious is He,\nFar more than a father can be;\nHe casts all our sins in the depths of the sea;\nCome, worship the everlasting  One.\n\n2.You can surely trust Him in  life's darkest hour;\nWhen everything seems to go wrong:\nFor He loved us while we were\nsinners and foes \nSuch love man hath never yet known.\n\n3.In praising the Lord new life comes to the soul\nNew longings till now quite unknown;\nThat every one should be a child of the Lord,\nAn heir through Christ Jesus the Son.\n\n4.Through Jesus you will be a\nmember of heaven\nBlessed with the obedience of faith;,\nReceiving the mind of a servant like Christ\nYou follow the path of the saints.","ec":"Come, God invites us to His feast, don’t delay!\nLet’s tell all the people\nwhom we meet along the way.\nCome, God invites us!\nKeep it fixed in your mind,\nWhy are you waiting?\nCome let’s be going!\nLeave everything behind!\n\n1.Living in darkness,\nwithout a purpose,\nQuestions and doubts arise;\nHatred and envy, bring only worry,\nWhere will we find the light?\nIn this frustration,\nWhere hope has left us,\nWe get a message true:\nGive up your mourning,\nSorrow and sighing,\nJoy is awaiting you.\n\n2.Search in the factories,\nAnd in the boutiques,\nWhere people are so sad;\nGo to the highways,\nGo to the byways,\nGo and invite God’s guests:\nThose who are working,\nThose who are rushing,\nTell them the news of joy;\nThose who are sleeping,\nThose who are resting,\nCall to the feast of God.","ts":"యేది నీ సాక్ష్యము యేది నీ త్యాగము యేసు వార్తను చాటింపను యేల నిర్లక్ష్యము లేచి రారమ్ము ఓ క్రైస్తవ\n\n1.అపొస్తలులు శిష్యులు అపనిందలు హింసలు అన్నిటి భరియించిరి ఆత్మలు రక్షించిరి  ||యేది||\n\n2.అగ్నికి ఆహుతియై అసువుల నర్పించిరి ఆరని నరకాగ్నికి దూరంబుగా నుండిరి  ||యేది||\n\n3.ప్రాణాలు బలిచేసిరి ప్రభునెంతో సేవించిరి సింహాలకెరయైనను చింతేమి లేకుండిరి  ||యేది||\n\n4.ఆపదలు అపనిందలు నిర్భంధమో బంధము చెఱసాల సంకెళ్ళును నీకేమి లేదిప్పుడు  ||యేది||\n\n5.కోతెంతో విస్తారము కోసెడి వారెవ్వరు కొంతైన చేయంగను కోరిక గలిగుండాలి  ||యేది||"},{"n":43,"ei":"O could I speak the matchless","ci":"Come let us worship","ti":"చీకటి కాలము వచ్చుచుండె కృపకాలము నుపయోగించు","es":"1.O could I speak the matchless worth,\nO could I sound the glories forth\nWhich in my Saviour shine,\nI'd soar and touch the heav’nly strings,\nAnd vie with Gabriel while he sings\nIn notes almost divine, In notes almost divine.\n\n2.I’d sing the precious blood He spilt\nMy ransom from the dreadful guilt\nOf sin and wrath divine!\nI’d sing His glorious righteousness\nIn which all perfect heavenly dress\nMy soul shall ever shine, \nMy soul shall ever shine.\n\n3.I'd sing the characters He bears,\nAnd all the forms of love He wears,\nExalted on His throne.\nIn loftiest songs of sweetest praise,\nI would to everlasting days \nMake all His glories known, \nMake all His glories known.\n\n4.Soon, the delightful day will come \nWhen my dear Lord will  \nbring me home,\nAnd I shall see His face;\nThen with my Saviour, Brother, Friend,\nA blest eterinity I'll spend,\nTriumphant in His grace,\nTriumphant in His grace.","ec":"Come let us worship and bow down,\nLet us kneel before the Lord, our God, our Maker.\nCome let us worship and bow down,\nLet us kneel before the Lord, our God, our Maker.\nFor He is our God and we are the people of His pasture.\nAnd the sheep of His hand\nJust the sheep of His hand.","ts":"చీకటి కాలము వచ్చుచుండె కృపకాలము నుపయోగించు తలుపులు తెరచి యుండగనే విరిగి మనస్సుతో సాగెదవా\n\nతలుపులు తెరచియుండగనే  విరిగిన మనస్సుతో సాగెదవా కాలమపాయముగా నుండే సమయము సద్వినియోగించు\n\n1.బీడు భూములధికముగాచూచిన నీవు సాగిరా యేసుని వారికి చూపించు ప్రేమా వార్తను చాటించు   ||తలు||\n\n2.ఎన్నో రాజ్యములీనాడు దేవుని పనికి మూయబడె తెరచిన తలుపులు యెదురుండన్‌ ప్రవేశింతురు జ్ఞానులు   ||తలు||\n\n3.విశ్వాసుల సహవాసమున ప్రేమా ఐక్యత గలదు అని చెప్పెడి దినములు మన మధ్యకు రావలెను    ||తలు||\n\n4.రానైయున్న బాధ్యతలు మన కధికము ప్రియులారా మనకు జయము కలుగుటకై  వినయమున పోరాడెదము     ||తలు||\n\n5.మాదు హృదయముల నింపు నీదు ప్రేమతో మా ప్రభువా హిందూ దేశపు వీధులలో నాథా నిన్నే చాటెదము   ||తలు||"},{"n":44,"ei":"O day of rest and glandness","ci":"Come now is the time","ti":"కుమ్మరీ ఓ కుమ్మరీ... జగదుత్పత్తిదారీ...","es":"1.O day of rest and gladness,\nO day of joy and light,\nO balm of care and sadness,\nMost beautiful, most bright;\nOn thee the high and lowly,\nBefore the eternal throne,\nSing Holy, Holy, Holy,\nTo the great Three in One.\n\n2.On thee, at the creation, \nThe light first had its birth;\nOn thee, for our salvation, \nChrist rose from depths of earth;\nOn thee our Lord victorious\nThe Spirit sent from heaven;\nAnd thus on thee most glorious\nA triple light was given.\n\n3.Thou art a cooling fountain\nIn life’s dry, dreary sand,\nFrom thee, like Pisgah’s mountain,\nWe view our promised land;\nA day of sweet reflection,\nA day of holy love,\nA day of resurrection\nFrom earth to things above.\n\n4.Today on weary nations\nThe heavenly manna falls,\nTo holy convocations\nThe silver trumpet calls.\nWhere Gospel-light is glowing\nWith pure and radiant beams,\nAnd living water flowing\nWith soul-refreshing streams.\n\n5.New graces ever gaining\nFrom this our day of rest,\nWe reach the rest remaining\nTo spirits of the blest.\nTo Holy Ghost be praises,\nTo Father and to Son;\nThe Church her voice upraises\nTo Thee, blest Three in One.","ec":"Come now is the time to worship\nCome now is the time to give your heart\nCome just as you are to worship\nCome just as you are before your God.\nOne day every tongue will confess You are God\nOne day every knee will bow\nStill the greatest treasure remains for those\nWho gladly choose You now","ts":"కుమ్మరీ ఓ కుమ్మరీ... జగదుత్పత్తిదారీ...\t\nజిగట మన్నయిన నా వంక చల్లగ చూడుమయా  ||కుమ్మరీ||\n\n1.పనికి రాని పాత్రననీ పారవేయకుమా\nపొంగి పొరలు పాత్రగచేసి-నన్ను నింపుమా\nసువార్తలోని పాత్రలన్నీ శ్రీ యేసునే పొగడుచుండ\nసాక్షిగ నుండు పాత్రగజేసి సత్యముతో నింపుము తండ్రీ  ||కుమ్మరీ||\n\n2.విలువలేని పాత్రను నేను కొనువారు లేరెవ్వరూ\nవెలలేని నీదు రక్తంబుతో వెలుగొందు పాత్రగ జేసి\nఆటంకములనుండి తప్పించి నన్ను ఎల్లప్పుడు కావుమయ్యా\t\nపగిలియున్న పాత్రను నేను సరిచేసి వాడుమయ్యా   ||కుమ్మరీ||\n\n3.లోకాశలతో నిండి ఉప్పొంగుచు మార్గంబు నే తప్పితిన్‌\nమనుషేచ్ఛలన్నియును స్థిరమనుచునే మనశ్శాంతి కోల్పోతిని\nపోగొట్టుకున్న పాత్ర యనుచు పరుగెత్తి నిను పట్టితి\nప్రాణంబు నాలో నున్నప్పుడే నీ పాదంబుల్‌ నే బట్టితిన్‌  ||కుమ్మరీ||"},{"n":45,"ei":"Oh, gor a thousand tongues","ci":"Come on and celebrate","ti":"ఉన్నత దేవుడు నీతో నుండగ","es":"1.Oh, for a thousand tongues to sing\nMy great Redeemer’s praise:\nThe glories of my God and King,\nThe triumphs of His grace.\n\n2.My gracious Master and my God,\nAssist me to proclaim,\nAnd spread through all the earth abroad\nThe honours of Thy Name.\n\n3.Jesus, the Name that charms   our fears,\nThat bids our sorrows cease;\n’Tis music in the sinner’s ears,\n’Tis life and health and peace.\n\n4.He breaks the power of  cancelled sin,\nHe sets the prisoner free;\nHis blood can make the foulest clean\nHis blood availed for me.\n\n5.He speaks, and listening to His voice\nNew life the dead receive,\nThe mournful, broken hearts rejoice,\nThe humble poor believe.\n\n6.Hear Him, ye deaf; His praise, Ye dumb,\nYour loosened tongues employ;\nYe blind, behold  your Saviour come;\nAnd leap, ye lame, for joy.","ec":"Come on and celebrate!\nHis gift of love we will celebrate\nThe Son of God,who loved us\nAnd gave us life.\nWe’ll shout your praise,O King:\nYou give us joy nothing else can bring;\nWe’ll give to You our offering\nin celebration praise.\nCome on and celebrate, celebrate, celebrate and sing,\nCelebrate and sing to the King.\n(Repeat)","ts":"ఉన్నత దేవుడు నీతో నుండగ దిగులెందుకే మనసా!\nఎంతో మంచివాడు శక్తి సంపన్నుడు మేళ్లకు కొదువలేదే   ||ఉన్నత||\n\n1.పాపిగానున్న నిన్ను పరిశుద్ధ పరచెనుగా\nలేమిలోనున్న నిన్ను తన దయతో లేపెనుగా    ||ఉన్నత||\n\n2.ఆనాడు మొఱ్ఱపెట్టిన ఆ హన్నా ప్రార్థన వినెను\nఅనాధగానుండిన ఆ హాగరు నోదార్చెను   ||ఉన్నత||\n\n3.యేసు నీ ముందు నడిస్తే ఆ యోర్దానున్‌ దాటగలవు\nవిశ్వాసం నీకుంటే ఆ యెరికోనే కూల్చగలవు   ||ఉన్నత||"},{"n":46,"ei":"O God our help in ages past","ci":"Create in me a clean heart","ti":"ఏలీయా దేవుడు మన దేవుడు","es":"1.O, God our help in ages past,\nOur hope for years to come;\nOur shelter from the stormy blast,\nAnd our eternal home.\n\n2.Under the shadow of Thy throne\nThy saints have dwelt secure;\nSufficient is Thine arm alone,\nAnd our defence is sure.\n\n3.Before the hills in order stood,\nOr earth received her frame,\nFrom everlasting Thou art God,\nTo endless years the same.\n\n4.A thousand ages in Thy sight\nAre like an evening gone;\nShort as the watch that ends the night\nBefore the rising sun.\n\n5.Time, like an ever-rolling stream,\nBears all its sons away;\nThey fly, forgotten, as a dream\nDies at the opening day.\n\n6.O God, our help in ages past,\nOur hope for years to come;\nBe thou our guard while life shall last,\nAnd our eternal home.","ec":"Create in me a clean heart, O God,\nAnd renew a right spirit within me.\nCast me not away from Thy\npresence, O Lord\nAnd take not Thy Holy Spirit from me\nRestore unto me\nThe joy of Thy salvation\nAnd renew a right spirit within me.","ts":"1.ఏలీయా దేవుడు మన దేవుడు\nబలమైన దేవుడు మన దేవుడు(2)\nదాసుల యొక్క మొఱలు విని\nపరాక్రమకార్యముల్‌ చేయువాడు(2)\n\nయెహోవాయే దేవుడు (2)\nయంచు ఆర్భాటింతుం\nయెహోవాయే దేవుడు (2)\nయంచు ఆర్భాటింతుము\n\n2.వేడుచుండు భక్తుల మొఱను విని\nవడగండ్లనాపిన గొప్ప దేవుడు\nకరువులోను విధవ యింట\nపాత్రలను ఆయనాశీర్వదించెన్‌\n\n3.గగనము తెరచిన గొప్ప దేవుడు\nఅగ్నితోను బదులిచ్చెన్‌ జీవదేవుడు\nఆ ప్రభువే దేవుడంచును సాగిలపడిరి దైవప్రజలు"},{"n":47,"ei":"O Jesus, I have promised","ci":"Delight yourself in God","ti":"నీకు సాటి ఎవరు నా యేసు నాథా","es":"1.O Jesus, I have promised\nTo serve Thee to the end;\nBe Thou for ever near me,\nMy Master and my Friend;\nI shall not fear the battle\nIf Thou art by my side,\nNor wander from the pathway,\nIf Thou wilt be my Guide.\n\n2.Oh, let me feel Thee near me;\nThe world is ever near;\nI see the sights that dazzle,\nThe tempting sounds I hear;\nMy foes are ever near me\nAround me and within;\nBut, Jesus, draw Thou nearer,\nAnd shield my soul from sin.\n\n3.Oh, let me hear Thee speaking,\nIn accents clear and still,\nAbove the storms of passion,\nThe murmurs of self-will,\nOh, speak to reassure me,\nTo hasten, or control;\nOh, speak, and make me listen,\nThou Guardian of my soul.\n\n4.O Jesus, Thou hast promised\nTo all who follow Thee,\nThat where Thou art in glory \nThere shall Thy servant be;\nAnd, Jesus, I have promised\nTo serve Thee to the end;\nOh, give me grace to follow\nMy Master and my Friend.\n\n5.Oh, let me see Thy footmarks,\nAnd in them plant mine own;\nMy hope to follow duly\nIs in Thy strength alone.\nOh, guide me, call me, draw me,\nUphold me to the end;\nAnd then in heaven receive me,\nMy Saviour and my Friend.","ec":"Delight yourself in God,\nAnd He will give your heart’s desire to you;\nDelight yourself in God,\nAnd He will give you, your heart’s desire.\n\nDelight yourself, delight yourself,\nDelight yourself in God. (twice)\n\nCommit your way to God,\nAnd trust Him to bring good to come to pass;\nCommit your way to God,\nAnd He will bring good to come to pass.\n\nCommit your way, commit your way,\nCommit your way to God. (twice)\n\nBe restful in the\nAnd patiently wait for the lord  to act;\nBe restful in the Lord,\nAnd patiently wait for the Lord to act.\n\nBe restful in, be restful in,\nBe restful in the Lord.  (twice)","ts":"నీకు సాటి ఎవరు నా యేసు నాథా\nఈ లోకమందున నీకు సాటి ఎవరు?\nపాపపు ఊబిలో చిక్కి నేనుంటిన్‌\nదేవా నీ ప్రేమతో నన్ను మన్నించితివి\n\n1.లోకము శరీరం సాతాను క్రిందను\nబానిసగానే పాపిన్‌ జీవించితిని\nనెమ్మది లేకయే అపవిత్రునిగా\nనడిచితిని, మోసపోతినిగా\nవెదకితివా-నన్ను అయ్యా యేసునాథా\nనిన్ను మరచిన ఒక ద్రోహినయ్యా\nవెదకితివా-నన్ను అయ్యా యేసునాథా\nనీకే నేనిక దాసుడను\n\n2.ఈ నాడు నే చేయు ఈ తీర్మానమును\nకాపాడుకొనను ఆత్మతో నింపుము\nవిరచు, మలచు, వంచుము, నింపుము\nపరిమళమిచ్చి పవిత్రపరచుము\nపంచేంద్రియములు నీలో నిమగ్నమై\nయేసు నీ యాత్మతో నింపుము\nజయ జీవితము కలిగియుండను\nఅగ్నితో నన్ను దహించుము.\n\n3.ఇంటను బయటను వెళ్ళు ప్రతిచోటను\nశోధనల్‌ వచ్చిన ప్రభువా కాయుము\nమెస్సీయా వచ్చు కాలము వరకు\nకొందరిన్‌ సిలువ యొద్దకు ఆకర్షింపచేయుం\nమోకాళ్ళ మీదను వాక్యము ధ్యానింప\nదిన దినము కృపనిమ్ము\nనీకును నాకును అడ్డు ఏమి లేకుండ\nఎప్పుడు కాపాడు నన్నును"},{"n":48,"ei":"O worship the King","ci":"Do you wonder why it is","ti":"నా హృదయము వింతగా మారెను","es":"1.O worship the King,\nAll-glorious above:\nOh, gratefully sing\nHis power and His love:\nOur Shield and Defender,\nThe Ancient of Days,\nPavilioned in splendour,\nAnd girded with praise.\n\n2.Oh, tell of His might,\nOh, sing of His grace,\nWhose robe is the light,\nWhose canopy space;\nHis chariots of wrath\nThe deep thunder-clouds form,\nAnd dark is His path\nOn the wings of the storm\n.\n3.The earth, with its store\nOf wonders untold,\nAlmighty! Thy power\nHath founded of old;\nHath ’stablished it fast,\nBy a changeless decree,\nAnd round it hath cast,\nLike a mantle, the sea.\n\n4.Thy bountiful care\nWhat tongue can recite?\nIt breathes in the air,\nIt shines in the light;\nIt streams from the hills,\nIt descends to the plain,\nAnd sweetly distils\nIn the dew and the rain.\n\n5.Frail children of dust,\nAnd feeble as frail,\nIn Thee do we trust,\nNor find Thee to fail;\nThy mercies, how tender:\nHow firm to the end:\nOur Maker, Defender,\nRedeemer, and Friend:","ec":"1.Do you wonder why it is I *love Him?\nI *love Him, I *love Him?\nDo you wonder why it is I *love Him?\nI will gladly tell you why.\nIt’s because He left His Home in glory to die for me,\nThis is why I cannot help but *love Him,\nJesus Christ, who died for me.\n\n2.Do you wonder...I *trust Him...\n\n3.Do you wonder...I *serve Him...\n\n4.Do you wonder...I *praise Him...","ts":"1.నా హృదయము వింతగా మారెను (3)\nనాలో యేసు వచ్చినందున\n\nసంతోషమే సమాధానమే (3)\nచెప్పనశక్యమైన సంతోషం\n\n2.తెరువబడెను నా మనోనేత్రము\nయేసు నన్ను ముట్టినందున   ||సం||\n\n3.ఈ సంతోషము నీకు కావలెనా\nనేడే యేసు నొద్దకు రమ్ము   ||సం||\n\n4.సత్య సమాధానం నీకు కావలెనా\nనేడే యేసు నొద్దకు రమ్ము   ||సం||\n\n5.నిత్యజీవము నీకు కావలెనా\nనేడే యేసు నొద్దకు రమ్ము   ||సం||\n\n6.మోక్ష భాగ్యము నీకు కావలెనా\t\t\nనేడే యేసు నొద్దకు రమ్ము   ||సం||\n\n7.యేసు క్రీస్తును నేడే చేర్చుకో\nప్రవేశించు నీ యుల్లమందు    ||సం||"},{"n":49,"ei":"Oh, what a wonderful","ci":"Don't build your house","ti":"లోయలెల్ల పూడ్చబడాలి కొండలు కోనలు","es":"1.Oh! what a wonderful, wonderful day,\nDay I will never forget,\nAfter I wandered in darkness away,\nJesus my Saviour I met.\nOh! what a tender, compassionate friend,\nHe met the need of my heart,\nShadows dispelling, with joy I am telling,\nHe made all the darkness depart.\n\nHeaven came down and glory filled my soul,\nWhen at the cross my Saviour \nmade me whole,\nMy sins were washed away,\nand my night was turned to day\nHeaven came down and glory filled my soul.\n\n2.Now I’ve a hope that will surely endure,\nAfter the passing of time,\nI have a future in Heaven for sure,\nThere in those mansions sublime.\nAnd it’s because of that wonderful day,\nThere on the cross I believed,\nRiches eternal and blessings supernal,\nFrom His precious hands I received.","ec":"Don’t build your house on the sandy Land---\nDon’t build it too near the shore;\nWell, it might look kind of nice,\nBut you’ll have to build it twice,\nOh! you’ll have to build your house once more.\nYou better build your house upon a rock;\nMake a good foundation on a solid spot,\nOh, the storms may come and go\nBut the peace of God you will know.","ts":"లోయలెల్ల పూడ్చబడాలి\nకొండలు కోనలు కదలిపోవాలి\nవక్రమార్గము సక్రమవ్వాలి\nకరకు మార్గము నునుపవ్వాలి(2)\n\nరాజు వస్తున్నాడు ఆయత్తమవుదాం\nయేసు వస్తున్నాడు ఎదురు వెళ్ళుదాం (2)\n\n1.ఫలం ఇవ్వని చెట్టులెల్ల\n నరకబడి అగ్నిలో వేయబడును (2)\n\n2.గోధుమను వేర్పరచి గింజలను చేర్చి\nపొట్టును నిప్పులో కాల్చివేయును (2)\n\n3.పరిశుద్ధులుగా మచ్చలు లేక\nప్రభుకై జీవించి సాగిపోదాం (2)\n\n4.రోజు రోజు మేల్కొని ప్రార్ధించెదం\nఅభిషేక తైలముతో నింపబడెదం (2)"},{"n":50,"ei":"Praise Him Praise Him!","ci":"Don't do a half day's work","ti":"యేసు నీ ప్రియ నామ-శబ్దం","es":"1.Praise Him, Praise Him!\nJesus,our blessed Redeemer:\nSing, O earth, His  \nwonderful love proclaim!\nHail Him, hail Him    \nhighest archangels in glory,\nStrength and honour \ngive to His Holy Name.\nLike a Shepherd,\nJesus will guard His children,\nIn His arms He carries them all day long;\nO ye saints that dwell in the mountains of Zion,\nPraise Him, praise Him, ever in joyful song.\n\n2.Praise Him, Praise Him  \nJesus, our blessed Redeemer:\nFor our sins He \nsuffered and bled and died:\nHe, our rock, our \nhope of eternal salvation,\nHail Him, hail Him, \nJesus the Crucified;\nLoving Saviour,   \nmeekly enduring sorrow,\nCrowned with thorns that   \ncruelly pierced His brow;\nOnce for us rejected,  \ndespised, and forsaken,\nPrince of glory,  \never triumphant now.\n\n3.Praise Him, Praise Him   \nJesus, our blessed Redeemer:\nHeavenly portals    \nloud with hosannas ring:\nJesus, Saviour, \nreigneth for ever and ever,\nCrown Him, crown Him, prophet \nand Priest and King:\nDeath is vanquished, \ntell it with joy, ye faithful;\nWhere is now thy victory, boasting grave?\nJesus lives, no longer \nthy portals are cheerless;\nJesus lives, the \nmighty and strong to save.","ec":"Don’t do a half day’s work for the Lord\nAnd expect a whole day’s pay.\nOnly what’s done with all of your heart\nCounts on the judgement day.\nHow can I sit idly by\nKnowing souls are doomed to die!\nDon’t do... pay.","ts":"యేసు నీ ప్రియ నామ-శబ్దం  విశ్వాసుని చెవికి\nదివ్య-మైన ప్రీతి నిచ్చున్‌ ఆహా ఎంతో మధురం\n\n1.ఆకలి-బాధన్‌ తీర్చు ఆత్మా- హారం అదియే\nగాయపడి-నట్టి-ఆత్మన్‌ ఆదరించు నామం\n\n2.చింతలను బాపి బాధ-లన్ని-యు తీర్చున్‌\nయేసు నామమందు భయమంతా పారిపోవున్‌\n\n3.గాయపడిన ఆత్మకు బలమొసగెడి నామం\nపాపకూపము-నుండి  విడుదల - నిచ్చెడి నామం\n\n4.ఎల్ల-ల్లేని-విస్తార కృప నొసగెడి నామం\nకాలమెల్ల స్థిరమైనట్టి ఆస్థి యేసు నామం.\n\n5.మూర్ఛిల్లు వారికి ఆత్మీయ-భోజనం\nమాయ లోకమందు తన జ్ఞాన ధనమిచ్చున్‌\n\n6.నా ప్రభువా - నా జీవమ నా మార్గము-మరియు\nస్తుతి గీతి-స్తుతి- స్తోత్రము లంగీకరించుం"},{"n":51,"ei":"Praise, my soul, the King","ci":"Ev'ry day with Jesus","ti":"సర్వశక్తుడు నా సొంతమయ్యెను","es":"1.Praise, my soul,the King of heaven;\nTo His feet thy tribute bring;\nRansomed, healed, restored, forgiven,\nWho like thee His praise should sing\n\nPraise Him, praise Him!\nPraise the everlasting King.\n\n2.Praise Him for His grace and favour\nTo our fathers in distress;\nPraise Him, still the same for ever,\nlow to chide. and swift to bless.\n\nPraise Him, praise Him!\nGlorious in His faithfulness.\n\n3.Father-like, He tends and spares us;\nWell our feeble frame He knows;\nIn His hands He gently bears us,\nRescues us from all our foes.\n\nPraise Him, praise Him!\nWidely yet His mercy flows.\n\n4.Angels, help us to adore Him;\nYe behold Him face to face;\nSun and moon, bow down before Him;\nDwellers all in time and space:\n\nPraise Him, praise Him!\nPraise with us the God of grace.","ec":"Ev’ry day with Jesus\nIs sweeter than the day before,\nEv’ry day with Jesus\nI love Him more and more,\nJesus saves and keeps me\nAnd He’s the One I’m waiting for,\nEv’ry day with Jesus\nIs sweeter than the day before.","ts":"సర్వశక్తుడు నా సొంతమయ్యెను\nమృత్యుంజయుడు నా జీవమయ్యెను - (2)\n\nఅహహా ఇది అద్భుతమేగా  ఓహోహో ఇది నిజమేగా\n\n1 కనుగొంటిని ఐశ్వర్యము చేపట్టితి ఒక గనిని\nయేసుడే నా రక్షకుడు యేసుడే నా రారాజు\n\n2 సంతోషము సమాధానము నా మదిలో పొంగునయా\nపాపమంతా పెకిలించే భయమంతా తొలగించే\n\n3 పరలోకములో నా పేరు వ్రాశాడు నా యేసు\nబ్రతుకంతా ఒక ఆశ యేసునికై నే జీవిస్తా"},{"n":52,"ei":"Praise to the Lord","ci":"Ev'ry promise in the book","ti":"రమ్మూ నీ తరుణమిదే పిలుచుచున్నాడు","es":"1.Praise to the Lord, the Almighty \nthe King of creation;\nO my soul, praise Him, for He is thy \nhealth and salvation;\nAll ye who hear, \t\nBrothers and sisters, draw near,\nPraise Him in glad adoration.\n\n2.Praise to the Lord, who doth prosper\nThy work and defend thee;\nSurely His goodness and mercy\nhere daily attend thee:\nPonder anew\nWhat the Almighty can do,\nIf with His love He befriend thee.\n\n3.Praise to the Lord, Who, when\t        \ntempests their warfare are waging,\nWho, when the elements madly\t\naround thee are raging\nBiddeth them cease,\nTurneth their fury to peace,\nWhirlwinds and waters assuaging.\n\n4.Praise to the Lord, Who, when \ndarkness and sin are abounding,\nWho, when the godless do triumph,\nAll virtue confounding,\nSheddeth His light,\nChaseth the horrors of night,\nSaints with His mercy surrounding.\n\n5.Praise to the Lord! Oh,\nlet all that is in me adore Him!\nAll that hath life and breath, \nCome now with praises before Him!\nLet the Amen\nSound from His people again:\nGladly for aye we adore Him.","ec":"Ev’ry promise in the Book is mine,\nEv’ry chapter, ev’ry verse, ev’ry line;\nAll are blessings of His love divine,\nEv’ry promise in the Book is mine.","ts":"రమ్మూ నీ తరుణమిదే పిలుచుచున్నాడు\nనీ ప్రభువైన యేసు నొద్దకు - రమ్మూ\n\n1.జీవితమంతయు వ్యర్థముగాను\nదుఃఖముతోను గడుపుటయేల\nవచ్చి ఆయన శరణుజొచ్చినచో\nవాంఛతో నిన్ను స్వీకరించున్‌ ||రమ్మూ||\n\n2.కట్టిన యిల్లు ధన ధాన్యములు\nకనబడు బంధు మిత్రాదులును\nగూడు విడచి నీవు పోయినచో\nవెంట నీతో రారెవరు   ||రమ్మూ||\n\n3.అందము మాయ నిలకడలేనిది\nదాని నమ్మకుము మోసగించును\nమరణము ఒకనాడు వచ్చున్‌\nమరువకు నీ ప్రభువును   ||రమ్మూ||\n\n4.మిన్ను క్రిందన్‌ భూమి మీదన్‌\nమిత్రుడు యేసునామముగాక\nరక్షణ పొందు దారిలేదు\nరక్షకుడేసే మార్గము   ||రమ్మూ||\n\n5.తీరని పాప వ్యాధులను\nమారని నీదు బలహీనతను\nఘోర సిలువలో మోసి తీర్చెన్‌\nగాయములచే బాగుపడన్‌  ||రమ్మూ||\n\n6.సత్యవాక్కును నమ్మిరమ్ము\nనిత్యజీవము నీకు యిచ్చును \nనీ పేరు జీవపుస్తకమునందు\nనిజముగ ఈనాడే వ్రాయున్‌ ||రమ్మూ||"},{"n":53,"ei":"Rejoice, the Lord is King!","ci":"Ev'ry body ought to love","ti":"బిడ్డా ! నీహృదయము నాకిమ్ము","es":"1.Rejoice, the Lord is King!\nYour Lord and King adore;\nMortals, give thanks and sing,\nAnd triumph evermore:\n\nLift up your heart, lift up your voice;\nRejoice! again I say: rejoice!\n\n2.Jesus, the Saviour, reigns,\nhe God of truth and love:\nWhen He had purged our stains,\nHe took His seat above:\n\n3.His kingdom cannot fail,\nHe rules o’er earth and heaven;\nThe keys of death and hell\nAre to our Jesus given:\n\n4.He sits at God’s right hand\nTill all His foes submit,\nAnd bow to His command,\nAnd fall beneath His feet:","ec":"Ev’rybody ought to love Him\nEv’rybody everywhere;\nEv’rybody ought to love Him\nHe will banish ev’ry care:\nHe’s the Author of Salvation;\nCondemnation He did bear;\nJesus died for every nation;\nEv’rybody everywhere.","ts":"బిడ్డా ! నీహృదయము నాకిమ్ము\nనిత్య జీవము నిచ్చెదనని- యెరుగవా\n\n1.అంతరంగంబెల్ల - కడిగెదన్‌\nఅపవిత్రతన్‌ - దొలగించి కృప నిత్తున్‌\n\n2.నీ పాపమంత పరిహరింప\nనాదు ప్రాణము నీకై - బలి చేసితి\n\n3.పాపంబు నుండి - పారిపోదువా\nనిత్య జీవము - నేడే నీవు పొందవా\n\n4.ఇహ లోకాశనుండి – తొలగిపో\nఊహకందని – యానందమునే నిత్తును\n\n5.నీదు యాత్మను-నా కర్పించుము\nఅందు నిత్యము వసింప నాకు స్థలమిమ్ము"},{"n":54,"ei":"The Church's one foundaton","ci":"Faith, mighty faith, the","ti":"కన్నతల్లి చేర్చునట్లు నన్ను చేర్చు నా ప్రియుడు","es":"1.The Church’s one foundation\nIs Jesus Christ her Lord;\nShe is His new creation\nBy water and the Word;\nFrom heaven He came and  sought her\nTo be His holy Bride,\nWith His own blood He bought her,\nAnd for her life He died.\n\n2.Elect from every nation,\nYet one o’er all the earth,\nHer charter of salvation\nOne Lord, one faith, one birth;\nOne holy name she blesses,\nPartakes one holy food,\nAnd to one hope she presses\nWith every grace endued.\n\n3.Though with a scornful wonder\nMen see her sore oppressed,\nBy schisms rent asunder,\nBy heresies distressed,\nYet saints their watch are keeping,\nTheir cry goes up,”How long?”\nAnd soon the night of weeping\nShall be the morn of song.\n\n4.‘Mid toil and tribulation,\nAnd tumult of her war,\nShe waits the consummation\nOf peace forever more;\nTill with the vision glorious\nHer longing eyes are blest,\nAnd the great Church victorious\nShall be the church at rest.\n\n5.Yet she on earth hath union\nWith God the Three in One,\nAnd  mystic sweet communion\nWith those whose rest is won.\nOh, happy ones and holy!\nLord, give us grace that we,\nLike them, the meek and lowly,\nOn high may dwell with Thee.","ec":"Faith, mighty faith, the promise sees\nAnd looks to God alone;\nLaughs at impossibilities,\nAnd cries it shall be done;\nAnd cries it shall, it shall be done (2)\nLaughs at impossibilities,\nAnd cries it shall be done.","ts":"కన్నతల్లి చేర్చునట్లు\nనన్ను చేర్చు నా ప్రియుడు \nహల్లెలూయ  (4)\n\n1.కౌగిటిలో హత్తుకొనున్‌ \nనా చింతలన్‌ బాపును\n\n2.చేయిపట్టి నడుపును\nశిఖరముపై నిలుపును\n\n3.నా కొరకై మరణించె\nనా పాపం భరియించె\n\n4.చేయి విడువడు ఎప్పుడు\nవిడనాడడు ఎన్నడు"},{"n":55,"ei":"The God of Abraham","ci":"Faithful one,so unchan","ti":"భూమియు దాని - సంపూర్ణత","es":"1.The God of Abraham praise,\nWho reigns enthroned above,\nAncient of everlasting days,\nAnd God of love!\nJehovah! Great I AM!\nBy earth and heaven confessed,\nI bow and bless the sacred Name,\nForever blest.\n\n2.The God of Abraham praise,\nAt whose supreme command\nFrom earth I rise, and seek the joys\nAt His right hand.\nI all on earth forsake,\nIts wisdom, fame and power;\nAnd Him my only portion make,\nMy Shield and Tower.\n\n3.He by Himself hath sworn,\nI on His oath depend:\nI shall, on eagles’ wings upborne,\nTo heaven ascend.\nI shall behold His face,\nI shall His power adore,\nAnd sing the wonders of His grace\nForever more.\n\n4.There dwells the Lord our King,\nThe Lord our righteousness,\nTriumphant o’er the world and sin:\nThe Prince of Peace.\nOn Zion’s sacred height\nHis kingdom still maintains,\nAnd glorious with His saints in light\nFor ever reigns.\n\n5.The whole triumphant host\nGive thanks to God on high;\n“Hail, Father, Son and Holy Ghost!”\nThey ever cry.\nHail, Abraham’s God and mine!\nI join the heavenly lays;\nAll might and majesty are Thine,\nAnd endless praise.","ec":"Faithful One, so unchanging,\nAgeless One,\nYou’re my rock of peace;\nLord of all, I depend on You,\nI call out to You again and again (2)\nYou are my rock in times of trouble,\nYou lift me up when I fall down;\nAll through the storm,\nYour love is the anchor,\nMy hope is in You alone.","ts":"భూమియు దాని - సంపూర్ణత\t\t\t\nలోకము దాని - నివాసు - లెహోవావే\n\n1.ఆయన సముద్రము\nమీద దాని పునాది వేసెను\nప్రవాహ జలముల\nమీద దాని స్థిర పరచెను       ||భూమి||\n\n2.యెహోవా పర్వతమునకు\nఎక్కదగినవాడెవడు?\nఆయన పరిశుద్ధ – స్థలములలో\nనిలువదగినవాడెవడు?     ||భూమి||\n\n3.వ్యర్థమైన దానియందు\nమనస్సు పెట్టకయు\nనిర్దోష చేతులు - శుద్ధ\nహృదయము కలిగిన వాడే      ||భూమి||\n\n4.వాడాశీర్వాదము నీతి\nమత్వము నొందును\nనిన్నాశ్రయించి - నీ\nసన్నిధిని వెదకెడువాడే    ||భూమి||\n\n5.గుమ్మములారా మీ తలలు పైకెత్తుడి\nపురాతన తలుపులారా\nమహిమగల ఈ రాజు ప్రవేశింప\nమిమ్ము లేవనెత్తుకొనుడి      ||భూమి||\n\n6.మహిమ గల ఈ రాజెవడు\nబల శౌర్యముగల ప్రభువే\nయుద్ధ శూరుడైన యెహోవా \nప్రరాక్రమము గల ప్రభువే   ||భూమి||\n\n7.మహిమగల ఈ రాజెవడు\nసై-న్యముల యెహోవాయే\nఆ..య..నే ఈ మహిమగల\nరాజు హల్లెలూయ ఆమెన్‌   ||భూమి||"},{"n":56,"ei":"The King of love my Shepherd","ci":"Father God, I wonder how","ti":"యేసు కూడా వచ్చును అద్భుతములెన్నో చేయును","es":"1. The king of love my Shepherd is,\nWhose goodness faileth never;\nI nothing lack if I am His,\nAnd He is mine forever.\n\n2.Where streams of living water flow\nMy ransomed soul He leadeth,\nAnd, where the verdant pastures grow,\nWith food celestial feedeth.\n\n3.Perverse and foolish oft I strayed,\nBut yet in love He sought me,\nAnd on His shoulder gently laid,\nAnd home rejoicing brought me.\n\n4.In death’s dark vale I fear no ill\nWith Thee, dear Lord, beside me;\nThy rod and staff my comfort still,\nThy cross before to guide me.\n\n5.Thou spread’st a table in my sight;\nThy unction grace bestoweth:\nAnd oh, what transport of delight\nFrom Thy pure chalice floweth!\n\n6.And so through all the length of days\nThy goodness faileth never;\nGood Shepherd,may I sing Thy praise\nWithin Thy house forever!","ec":"Father God, I wonder how I managed to exist\nWithout the knowledge of Your parenthood and Your loving care.\nBut now I am Your son,\nI am adopted in Your family,\nAnd I can never be alone,\n’Cause Father God, You’re there beside me.\n\nI will sing Your praises,\nI will sing Your praises,\nI will sing Your praises forever more.   (Repeat)","ts":"యేసు కూడా వచ్చును\nఅద్భుతములెన్నో చేయును\n\n1.శ్రమలను సైతానున్‌ వెళ్లగొట్టును\nకుమిలియున్న హృదయాన్ని ఆదరించును\n\n2.వేదన శోకము తీర్చి వేయును\nసమాధానము సంతోషము నాకిచ్చును\n\n3.అప్పు బాధ కష్టాలను తొలగించును\nకంటినుండి కన్నీరు తుడిచివేయును\n\n4.తలంచిన కార్యములో జయం పొందుదున్‌ \nశత్రువైన సాతానును ఓడించెదన్‌"},{"n":57,"ei":"The love of God is greater","ci":"Father I heaven","ti":"నేను నా ఇంటివారలం యెహోవానే సేవింతుం","es":"1.The love of God is greater far\nThan tongue or pen can ever tell;\nIt goes beyond the highest star,\nAnd reaches to the lowest hell.\nThe guilty pair, bowed down with care,\nGod gave His Son to win;\nHis erring child He reconciled,\nAnd pardoned from his sin.\n\nOh, love of God, how rich and pure \nHow measureless and strong!\nIt shall for evermore endure— \nThe saints’ and angels’ song.\n\n2.When hoary time shall pass away,\nAnd earthly thrones and kingdoms fall;\nWhen men who here refuse to pray\nOn rocks and hills and mountains call;\nGod’s love, so pure, shall still endure,\nAll measureless and strong;\nRedeeming grace to Adam’s race,\nThe saints’ and angels’ song.\n\n3.Could we with ink the ocean fill,\nAnd were the skies of parchment made;\nWere ev’ry stalk on earth a quill,\nAnd ev’ry man a scribe by trade;\nTo write the love of God above\nWould drain the ocean dry;\nNor could the scroll contain the whole,\nTho’ stretched from sky to sky.","ec":"Father in heaven, how we love you,\nWe lift your name in all the earth\nMay Your Kingdom\nbe established in our praises\nAs Your people declare Your mighty works.\nBlessed be the Lord God Almighty,\nWho was and is and is to come;\nBlessed be the Lord God Almighty,\nWho reigns forever more.","ts":"నేను నా ఇంటివారలం\nయెహోవానే సేవింతుం\nనీవు సేవింతువా - నీవు సేవింతువా\n\n1.యెహోవనే సేవించుట\nఅసాధ్యమని తలచిన\nఏ దేవుని నీవు సేవింతువో\nఈనాడే తీర్మానించు\n\n2.దాస్యములో నున్న మనలన్‌\nయెహోవ రక్షించెను\nగొప్ప సూచనలెన్నో\nచేసినట్టి దేవుని సేవింతువా\n\n3.మన త్రోవలో కాపాడుచు\nయెహోవ నడిపించెన్‌\nదేవుడిచ్చిన యాశీర్వాదం\nచూచి కీర్తించి సేవింతువా\n\n4.మేలైనట్టి ఈవులను\nదేవాది దేవుడిచ్చెన్‌\nఆయన స్వరంబుకు లోబడి \nసాక్షిగా జీవింతువా"},{"n":58,"ei":"The master hath come","ci":"Father, we thank you","ti":"ప్రభుయేసు నా రక్షకా నొసగు కన్నులు","es":"1.The Master hath come,    \nand He calls us to follow\nThe track of the footprints  \nHe leaves on our way;\nFar over the mountain,  \nand through the deep hollow, \nThe path leads us on \nto the mansions of day.\n\nThe Master hath called us, \nthe children who fear Him,\nWho march ‘neath Christ’s banner,\nHis own little band:\nWe love Him, and seek Him, \nwe long to be near Him,\nAnd rest in the light of His beautiful land.\n\n2.The Master hath called us;  \nthe road may be dreary,\nAnd dangers and sorrows are \nstrewn on the track;\nBut God’s Holy Spirit shall comfort \nthe weary— \nWe follow the Saviour,    \nand cannot turn back.\n\nThe Master hath called us:\nthough doubt and temptation \nMay compass our journey, \nwe cheerfully sing,\n“Press onward, look upward,” \nthrough much tribulation \nThe children of Zion must follow their King.\n\n3.The Master hath called us: in life’s \n early morning \nWith spirits as fresh as the dew on the sod:\nWe turn from the world, with its \nsmiles and its scorning, \nTo cast in our lot with the people of God.\n\nThe Master hath called us\nHis sons and His daughters,\nWe plead for His blessing,  \nand trust in His love;\nAnd through the green pastures,\nbeside the still waters,\nHe’ll lead us at last to His \nkingdom above.","ec":"Father, we thank You,\nFather, we thank You,\nFather, we thank You, for Your love.\nMay we enter Your gates with thanksgiving,\nMay we enter Your courts with our praise,\nMay we fall at Your throne\nWhere Your glory is shown,\nAnd be lost in Your love and Your grace.","ts":"ప్రభుయేసు నా రక్షకా నొసగు కన్నులు నాకు నిరతమునే నిన్ను జూడ\nఅల్ఫయు నీవె ఓమేగయు నీవే\n\n1.ప్రియుడైన యోహాను పత్మాసులో\nప్రియమైన యేసుని స్వరూపము\nప్రియమార జూచి బహు ధన్యుడయ్యె\nప్రియప్రభు నిను జూడనిమ్ము    ||ప్రభు||\n\n2.లెక్కలేని మార్లు పడిపోతిని\nదిక్కులేనివాడనేనైతిని\nచక్క జేసి నా నేత్రాలు దెరచి\nగ్రక్కున నిను జూడనిమ్ము     ||ప్రభు||\n\n3.ఎరిగి ఎరిగి నే చెడిపోతిని\nయేసు నీ గాయము రేపితిని\nమోసపోతి నేను దృష్టి దొలగితి\nదాసుడ నిను జూడనిమ్ము   ||ప్రభు||\n\n4.ఎందరేసునివైపు చూచెదరో\nపొందెదరు వెల్గు ముఖమున\nసందియంబులేక సంతోషించుచు\nముందుకు పరుగెత్తెదరు      ||ప్రభు||\n\n5.విశ్వాస కర్త ఓ యేసు ప్రభూ\nకొనసాగించువాడ యేసు ప్రభూ\nవినయముతోనేను నీవైపు జూచుచు\nవిసుగక పరుగెత్తనేర్పు       ||ప్రభు||\n\n6.కంటికి కనబడనివెన్నియో\nచెవికివినబడని వెన్నియో\nహృదయ గోచరము కాని వెన్నియో\nసిద్ధపరచితివా నాకై       ||ప్రభు||\n\n7.లోకభోగాలపై నా నేత్రాలు\nసోకకుండునట్లు కృప జూపుము\nనీ మహిమ దివ్యస్వరూపమును\nనిండార నను జూడనిమ్ము     ||ప్రభు||"},{"n":59,"ei":"There shall be showere","ci":"Fear not rejoice and be  gland","ti":"జయ జెండా పట్టుకొనెదం మనం వీరులుగ నడిచెదము","es":"1.“There shall be showers of blessing:”\nThis is the promise of love:\nThere shall be seasons refreshing,\nSent from the Saviour above.\n\nShowers of blessing,\nShowers of blessing we need;\nMercy drops round us are falling,\nBut for the showers we plead.\n\n2.“There shall be showers of blessing:”\nPrecious reviving again;\nOver the hills and the valleys,\nSound of abundance of rain.\n\n3.“There shall be showers of blessing:”\nSend them upon us, O Lord:\nGrant to us now a refreshing;\nCome and now honour Thy word.\n\n4.“There shall be showers of blessing:”\nOh, that today they might fall,\nNow as to God we’re confessing,\nNow as on Jesus we call!","ec":"Fear not, Rejoice and be glad,\nThe Lord hath done a great thing;\nHath poured out His Spirit on all mankind \nOn those who confess His name.\n\n1.The fig tree is budding, the vine beareth fruit,\nThe wheat fields are golden with grain\nThrust in the sickle, the harvest is ripe\nThe Lord has given us rain.\n\n2.Ye shall eat in plenty and be satisfied\nThe mountains will drip with sweet wine.\nMy children shall drink of the fountain of life,\nMy children will know they are Mine.\n\n3.My people shall know that I am the Lord,\nTheir shame I have taken away.\nMy Spirit will lead them together again,\nMy Spirit will show them the way.\n\n4.My children shall dwell in a Body of love,\nA light to the world they will be.\nLife shall come forth from the Father above,\nMy Body will set mankind free.","ts":"జయ జెండా పట్టుకొనెదం\nమనం వీరులుగ నడిచెదము (2)\n\n1.వెల్లువై సాతానొచ్చిన ఆత్మతానే జెండా పైకెత్తును\nజడియకు నా సోదరా నీవు జడియకు నా సోదరి\n\n2.వేవేలు శ్రమలొచ్చినన్‌ శోకముల్‌ దరికిరావు\nఆత్మఖడ్గముచే మనం సాతానున్‌ జయించితిమి\n\n3.గుట్టలైన మిట్టలైననూ ప్రభువును వెంబడించెదం నాగటిపై చేయి వేశాము\nమనం వెనుకకు తిరిగిచూడము"},{"n":60,"ei":"To God be the glory","ci":"Fill up with your Spriti","ti":"నీ పాద సన్నిధికి  కృపామయా యేసయ్యా","es":"1.To God be the Glory!  great things He hath done!\nSo loved He the world that  He gave us His Son,\nWho yielded His life  an atonement for sin,\nAnd opened the life-gate  that all may go in.\n\nPraise the Lord! Praise the Lord!\nLet the earth hear His voice!\nPraise the Lord! Praise the Lord!\nLet the people rejoice!\nOh, come to the Father,\nthrough Jesus the Son;\nAnd give Him the glory! \ngreat things He hath done!\n\n2. Oh, perfect redemption, the purchase of blood!\nTo every believer the promise of God;\nThe vilest offender who truly believes,\nThat moment from Jesus a pardon receives.\n\n3.Great things He hath taught us,\ngreat things He hath done,\nAnd great our rejoicing through\nJesus the Son:\nBut purer and higher and greater will be\nour wonder, our transport, when Jesus we see!","ec":"1.Fill me up with Your Spirit.\nFill me up Holy Friend.\nFill me up with Your Spirit.\nHoly Spirit descend.\n\n2.From the top of my head, Lord,\nTo the soles of my feet,\nFill me up with Your Spirit,\n’til there’s no more defeat.\n\n3.Fill me up with You, Jesus,\nFill me upto the brim,\n’til there’s no room for me, Lord;\n’til there’s no room for sin.\n\n4.From the top of my head, Lord,\nTo the tip of my toes,\nFill me up with You, Jesus;\nSanctify all my clothes.\n\n5.Fill me up with You, Jesus,\nFill me up with Your love,\nFill me up with Your Spirit,\nRest on me, Holy Dove.\n\n6.Fill me up with Your Spirit.\nFill me with Spirit life.\nLive Your life in me, Jesus,\n’til there’s no room for strife.\n\n7.’til there’s no room for sickneess,\n’til there’s no room for grief.\nFill me with Your Spirit;\nFill with joy and relief.\n\n8.Fill me with Your patience,\nFill me up with Your peace,\nFill me up with Your goodness,\nGentleness, Lord, release.\n\n9.Fill me up with Your Spirit\nOverflow with Your sign\nFill me up with Your Spirit\n’til I’m drunk with ‘New Wine’.\n\n10.So that I can declare it,\nMighty works You have done.\nFill me up with Your Spirit,\nFill me up Holy Son.\n\n11.Fill me up with Your Spirit,\nFill me up to the brim;\nOverflow living waters,\nto the world, without end.\n\n12.Glory be to the Father,\nGlory be to the Son,\nGlory be to the Spirit,\nGlory be, Three-in-one.\n\n13.Fill me up with Your Spirit\nFill me up Holy Friend,\nFill me up with Your Spirit,\nHoly Spirit descend.","ts":"నీ పాద సన్నిధికి  కృపామయా యేసయ్యా\nనీ ప్రేమ కనుగొనుచూ దేవా నే వచ్చితిని (2)\n\n1.విశ్రాంతి నిచ్చెడు దేవా\nశ్రమలెన్నో తీర్చుమయా(2)\nసిలువాయే నా ఆశ్రయము\nహాయిగా నచటుండెదను(2) ||నీ||\n\n2.ప్రార్థించు మంటివి ప్రభువా\nసంకాట సమయములో (2)\nదయ చూపి నను కరుణించి\nప్రేమతో ఆదరించుమయా(2) ||నీ||\n\n3.దీవించు వరమౌనట్లు\nజయజీవితం నిమ్ము (2)\nక్షమియించి ఆశీర్వదించుటకై\nప్రభువా నీ కృప నిమ్ము (2) ||నీ||"},{"n":61,"ei":"We praise thee O God","ci":"Flawless in his perfection","ti":"సహాయం చేయు శిఖరములను చూచెదను","es":"1.We praise Thee O God! \nfor the Son of Thy love,\nFor Jesus who died, \nand is now gone above.\n\nHallelujah! Thine the glory,\nHallelujah! Amen;\nHallelujah! Thine the glory,\nRevive us again.\n\n2.We praise Thee, O God! \t\t\t               \nfor Thy spirit of light,\nWho has shown us our Saviour,\nand has scattered our night.\n\n3.All glory and praise to the Lamb \nthat was slain,\nWho has borne all our sins, and\nhas cleansed ev’ry stain.\n\n4.Revive us again; fill each heart with Thy love;\nMay each soul be rekindled with\nfire from above.","ec":"1.Flawless in His perfection\nPeerless in His purity,\nBoundless in His grace to sinners\nThat’s my Jesus!\n\nThat’s my Jesus,\nMy matchless Saviour!\nCrown Him now\nLord of your life\nAnd joy unspeakable will flood your soul\nAnd joy unspeakable will flood your soul.\n\n2.Incomparable in compassion\nMeasureless in His Might and power\nEverlasting, His unchanging love\nThat’s my Jesus!","ts":"సహాయం చేయు శిఖరములను చూచెదను భూమి ఆకాశము చేసిన కర్తను చూచెదను\n\n1.కాలు తల్లడిల్ల విడువను కాచే దేవుడు కునుకడు\nఇశ్రాయేలున్‌ కాచువాడు ఎన్నడు నిద్రించడు\nలల్లల్లా లల్లల్లా\n\n2.ప్రభువు నన్ను గాచును నాకు నీడగా ఉండును\nపగలంతా రాత్రియంతా కాచుచున్నాడు\n\n3.ప్రభువే పలు కీడులన్ని తప్పించి నన్ను కాపాడును\nఆయనే ఆత్మను అనుదినం కాపాడును\n\n4.పోవునప్పుడు కాచును వచ్చునప్పుడు కాచును\nఇప్పుడును ఎప్పుడును ఎల్లప్పుడు కాచును."},{"n":62,"ei":"With harps and with vials","ci":"Follow, Jesus, I will","ti":"సిల్వలో నాకై కార్చెను యేసు రక్తము","es":"1.With harps and with vials there\nstand a great throng\nIn the presence of Jesus, \nand sing this new song:\n\nUnto Him who hath loved us and\nwashed us from sin,\nUnto Him be the glory for ever! Amen.\n\n2. All these once were sinners, \ndefiled in His sight;\nNow arrayed in pure garments in\npraise they unite:\n\n3.He maketh the rebel a priest and \na king;\nHe hath bought us, and taught us \nthis new song to sing:\n\n4.How helpless and hopeless we\nsinners had been\nIf he never had loved us till \ncleansed from our sin!\n\n5.Aloud in His praises our voices \nshall ring,\nSo that others, believing, this new \nsong shall sing.","ec":"Follow, Jesus, I will follow Jesus\nAnywhere He leads me I will follow,\nFollow Jesus, I will follow Jesus;\nAnywhere He leads I’ll go.\nAcross the river, Down through the valley,\nOr if it be on the mountain high;\nI’ll go, Lord, anywhere You want me;\nTake me, here am I.","ts":"సిల్వలో నాకై కార్చెను యేసు రక్తము\nశిలనైన నన్ను మార్చెను యేసు రక్తము\nయేసు రక్తము ప్రభు యేసు రక్తము (2)\nఅమూల్యమైన రక్తము యేసు రక్తము(2)\n\n1.సమకూర్చు నన్ను తండ్రితో యేసు రక్తము\nసంధిచేసి చేర్చును యేసు రక్తము\nయేసు రక్తము ప్రభు యేసు రక్తము(2)\nఐక్యపరచును తండ్రితో యేసు రక్తము (2)\n\n2.సమాధానపరచును యేసు రక్తము\nసమస్యలన్ని తీర్చును యేసు రక్తము\nయేసు రక్తము ప్రభు యేసు రక్తము (2)\nసంపూర్ణ శాంతినిచ్చును యేసు రక్తము (2)\n\n3.నీతి మంతులుగా చేయును యేసు రక్తము\nదుర్నీతినంత బాపును యేసు రక్తము\nయేసు రక్తము ప్రభు యేసు రక్తము (2)\nనిబంధన నిలుపు రక్తము యేసు రక్తము (2)\n\n4.రోగములను బాపును యేసు రక్తము\nదురాత్మల పారద్రోలును యేసు రక్తము\nయేసు రక్తము ప్రభు యేసు రక్తము (2)\nశక్తి బలము నిచ్చును యేసు రక్తము (2)"},{"n":63,"ei":"All to Jesus I Surrender","ci":"For God so loved the","ti":"ప్రియ యేసు రాజును నే చూచిన చాలు","es":"All to Jesus I surrender,\nAll to Him I freely give;\nI will ever love and trust Him,\nIn His presence daily live.\n\nI surrender all, I surrender all;\nAll to Thee, my blessed Saviour, I surrender all.\n\n2.All to Jesus I surrender,\nHumbly at his feet I bow;\nWordly pleasures all forsaken,\nTake me, Jesus, take me now.\n\n3.All to Jesus I surrender,\nMake me, Saviour, wholly Thine;\nLet the Holy Spirit witness\nI am Thine and Thou art mine.\n\n4.All to Jesus I surrender,\nLord, I give myself to Thee;\nFill me with Thy love and power,\nLet Thy blessing rest on me.\n\n5.All to Jesus I surrender,\nNow I feel the sacred flame!\nOh, the joy of full salvation!\nGlory, glory to His Name.","ec":"For God so loved the world,\nHe gave His only Son,\nTo die on Calv’ry’s tree\nFrom sin to set me free,\nSome day He’s coming back,\nWhat glory that will be!\nWonderful His love to me.","ts":"ప్రియ యేసు రాజును నే చూచిన చాలు మహిమలో నేనాయనతో నుంటే చాలు\nనిత్యమైన మోక్ష గృహమునందు చేరి భక్తులగుంపులో హర్షించిన చాలు\n\n1.యేసుని రక్తమందు కడుగబడి వాక్యముచే నిత్యం భద్ర పరచబడి\nనిష్కళంక పరిశుద్ధులతో పేదన్‌ నేను బంగారు వీధులలో తిరిగెదను\n\n2.దూతలు వీణెలను మీటునపుడు గంభీర జయధ్వనులు మ్రోగునపుడు\nహల్లెలూయ పాటల్‌ పాడుచుండ ప్రియయేసుతోను నేను యుల్లసింతున్‌\n\n3.ముండ్ల మకుటంబైన తలను జూచి స్వర్ణకిరీటంబెట్టి యానందింతున్‌\nకొరడాతో కొట్టబడిన వీపున్‌ చూచి ప్రతి యొక్క గాయమును ముద్దాడెదన్‌\n\n4.హృదయము స్తుతులతో నింపబడె నా భాగ్య గృహమును స్మరించుచుంటే\nహల్లెలూయ ఆమెన్‌ హల్లెలూయ వర్ణింప నా నాలుక చాలదయ్యా\n\n5.ఆహా యా బూర ఎపుడు ధ్వనించునో ఆహా నా యాశ ఎపుడు తీరుతుందో \nతండ్రి నా కన్నీటిని తుడుచునెపుడో ఆశతో వేచియుండె నా హృదయం"},{"n":64,"ei":"Come, Thou Almighty","ci":"For I'm persuaded to","ti":"ఆశీర్వదించు - మా తండ్రీ","es":"1.Come, Thou Almighty King,\nHelp us Thy name to sing, help us to praise:\nFather, all glorious, o’er all victorious,\nCome and reign over us, Ancient of Days.\n\n2.Come, Thou Incarnate Word,\nGird on Thy mighty sword, our prayer attend\nCome and Thy people bless,\nAnd give Thy word success\nSpirit of holiness, on us descend.\n\n3.Come, Holy Comforter, \nThy sacred witness bear in this glad hour:\nThou who almighty art,\nnow rule in every heart,\nAnd ne’er from us depart, Spirit of pow’r.\n\n4.To the great One in Three \nEternal praises be, hence evermore:\nHis sov’reign majesty may we in glory see,\nAnd to eternity love and adore.","ec":"For I’m persuaded to believe\nNothing can seperate us\nFrom the wonderful love of  God;\nFor above it will send us\nIf we let Him live within us\nWhile in the simple world we trod;\nNeither height nor depth, nor principalities\nThings present, or things to come,\nThough the devil hate us he can never seperate us\nFrom the wonderful love of God","ts":"ఆశీర్వదించు - మా తండ్రీ ఆ-నందం – పొంగను\nనీ ముఖకాంతి వీరిపై ప్రకాశింప నీ! దేవా! పంపు నీ యాశీర్వాదము\nనీ దీవెన నిత్యముండును తరతరముల వరకు పొర్లి - పారున\n\n1.దంపతులతో నీవుండి ని...త్యం నడిపించు\nనిన్నే వెంబడించునట్లు దారి చూపుమా\nఇహమే మోక్షముగ చేయు దేవా ప్రేమయు విశ్వాసములతో\nనీలో వసించి తరించ కృపనీయుమా!\n\n2.ఐక్యపర్చుము వీరిని నీదు చిత్తములో\t\nజ్ఞానులై దీనులై నిన్ను ధరన్‌ సేవింప\nజయశాలులుగాను జీవింపను పాలించు వీరి హృదయముల్‌\nనీ మహిమను చాటింప దేవా! దీవించుమా"},{"n":65,"ei":"Come, Thou  Fount","ci":"For me to live is Christ","ti":"మంగళ మర్పింప కృపను ఇమ్మయా","es":"1.Come, Thou Fount of every blessing,\nTune my heart to sing Thy grace;\nStreams of mercy, never ceasing,\nCall for songs of loudest praise\nTeach me some melodious measure\nSing by flaming tongues above\nO the vast, the boundless treasure\nOf my Lord’s unchanging love.\n\n2.Here I raise my Ebenezer\nHither by Thy help I’m come\nAnd I hope by Thy good pleasure,\nSafely to arrive at home\nJesus sought me when a stranger,\nWandering from the fold of God;\nHe, to rescue me from danger,\nInterposed His precious blood\n\n3.Oh, to grace how great a debtor\nDaily I’m constrained to be!\nLet that grace, Lord like a fetter,\nBind my wandering heart to Thee.\nProne to wander, Lord I feel it,\nProne to leave the God I love;\nHere’s my heart; Lord, take and seal it,\nSeal it from Thy courts above.","ec":"For me to live is Christ to die is gain,\nTo hold His hand and walk His narrow way,\nThere is no peace\nNo joy no thrill\nLike walking in His will,\nFor me to live is Christ to die is gain.\n\n1.Now once my heart was full of sin and shame\nTill someone told me Jesus came to save\nThen He said,’come home to me’\nHe set my poor heart free;\nFor me to live is Christ to die is gain\n\n2.Now there are things which I still do not know\nBut of this one thing I’m completely sure\nHe who called me on that day\nWashed all my sins away;\nFor me to live is Christ to die is gain","ts":"మంగళ మర్పింప కృపను ఇమ్మయా మంగళ నాథుడా!\n\n1.నిత్యమంగళము నీవే ప్రభూ మంగళమునకు ప్రభుడవు స్తోత్రపాత్రుడవు, స్తుతికియర్హుడవు\nఉత్తమ భక్తులు నిత్యము స్తుతించు\nశ్రేష్ఠ ప్రభువును అన్నిటిమించిన అబ్రహాం దేవుడవు\n\n2.పెండ్లి కుమారుడు........కు పెండ్లి కుమార్తైన................కు\nమహానుభావునకు,ఇమ్మానుయేలునకు\nభక్తితో బుద్ధిని చేర్చుము నా ప్రభు \t\nనిత్యుడగు తండ్రి నడిపించు సత్యంలో వేద వాక్యంతో"},{"n":66,"ei":"How I praise thee","ci":"For this prupose Christ","ti":"బెత్లెహేములో పుట్టెనేసు స్తుతియించుము","es":"1.How I praise Thee, precious Saviour,\nThat Thy love laid hold of me;\nThou hast saved and cleansed and filled me,\nThat I might Thy channel be.\n\nChannels only, blessed Master,\nBut with all Thy wondrous power\nFlowing through us,  Thou canst use us\nEvery  day and every hour.\n\n2.Just a channel, full of blessing, \nTo the thirsty hearts around;\nTo tell out Thy full salvation, \nAll Thy loving message sound.\n\n3.Emptied that Thou shouldest fill me,\nA clean vessel in Thine hand;\nWith no power but as Thou givest\nGraciously  with each command.\n\n4.Witnessing Thy power to save me,\nSetting free from self and sin;\nThou hast bought me to possess me:\nIn Thy fulness, Lord, come in.\n\n5.Jesus, fill now with Thy Spirit\nHearts that full surrender know;\nThat the streams of living water\nFrom our inner man may flow.","ec":"1.For this purpose Christ was revealed,\nTo destroy all the works of the evil one;\nChrist in us has overcome,\nSo with gladness we sing\nAnd welcome His Kingdom in.\n\nOver sin He has conquered,\nHallelujah, He has conquered;\nOver death victorious,\nHallelujah, victorious;\nOver sickness He has triumphed,\nHallelujah, He has triumphed;\nJesus reigns over all!\n\n2.In the name of Jesus we stand\nBy the power of His blood,\nwe now claim this ground;\nSatan has no authority here,\nPowers of darkness must flee\nFor Christ has the victory.","ts":"బెత్లెహేములో పుట్టెనేసు స్తుతియించుము మనసా - నేడే (2)\n\n1. సర్వమును సృష్టించిన – సృష్టికర్తయే\nతానే తాలిమితో తల్లి ఒడిలో తలనాన్చెను  ||బెత్లె||\n\n2. సింహాసనా సీనుడైన దేవపుత్రుడే తానే\nపసివానిగ పశుల తొట్టిలో పవళించెను  ||బెత్లె||\n\n3. లేఖనములు చెప్పినట్లు- నెరవేర్చుటకై\nతానే మోక్షం వీడి దీనునిగా దిగివచ్చెను  ||బెత్లె||\n\n4.పరలోక దూతలతో - పరవశించెను\nతానే మన కొరకే పశుల పాకలో జనియించెను  ||బెత్లె||\n\n5.ఇంత గొప్ప ప్రేమ చూపినా యేసుని\nమనం సంతసముగ కలసి వెళ్లి స్తుతియించెదం  ||బెత్లె||\n"},{"n":67,"ei":"When morning gilds the shies","ci":"For unto us a child is","ti":"హోసన్నా పాడేదం - దేవుని దాసులం","es":"1.When morning gilds the skies,\nMy heart awaking cries,\nMay Jesus Christ be praised!\nAlike at work and prayer\nTo Jesus I repair:\nMay Jesus Christ be praised!\n\n2.To Thee, My God above,\nI cry with glowing love,\nMay Jesus Christ be praised!\nThe fairest graces spring\nIn hearts that ever sing,\nMay Jesus Christ be praised!\n\n3.Does sadness fill my mind?\nA solace here I find.\nMay Jesus Christ be praised!\nOr fades my earthly bliss?\nMy comfort still is this,\nMay Jesus Christ be praised!\n\n4.When evil thoughts molest,\nWith this I shield my breast,\nMay Jesus Christ be praised!\nThe powers of darkness fear\nWhen this sweet chant they hear,\nMay Jesus Christ be praised!\n\n5.When sleep her balm denies,\nMy silent spirit sighs,\nMay Jesus Christ be praised!\nThe powers of darkness fear\nWhen from the heart we say,\nMay Jesus Christ be praised!\n\n6.Be this while life is mine,\nMy canticle divine,\nMay Jesus Christ be praised!\nBe this the eternal song\nThrough all the ages on,\nMay Jesus Christ be praised!","ec":"For unto us a Child is born,\nUnto us a Son is given.\nAnd the government shall be upon His shoulder,\nAnd His Name shall be called Wonderful, Counsellor, the Mighty God,\nThe Everlasting Father\nAnd the Prince of Peace is He.","ts":"హోసన్నా పాడెదం - దేవుని దాసులం  దావీదు కుమారునికి ఘనమైన - హోసన్నా \n\n1.యెరుషలేము - పిల్లలంత సంతసించి పాడిరి వారి పోలె - మేమీనాడు స్తుతులను - పాడెదం    ||హోస||\n \n2.ఆనాడు గాడిద మీద స్వారి చేసి పోయెను ఈనాడు నా హృదయ రాజ్యమును పాలించును   ||హోస||\n \n3.పాపము – పరిహరింప నన్ను నుద్ధరింపను ప్రేమ మూర్తి - యేసునాథ పయనమై పోయెను   ||హోస||\n \n4.బాలల గీతముల్‌ విని యేసు సంతసించెను పాదములన్‌ ముద్దిడి మే మేసు నారాధింతుము  ||హోస||\n\n5.మట్టలాది వారము ప్రభుని కొనియాడెదం ఆయన కృప కొరకు మేము వేడుకొందుము    ||హోస||\t"},{"n":68,"ei":"When I saw the cleansing","ci":"Give me oil in my lamb","ti":"యేసురాజు వచ్చుచున్నాడు","es":"1. When I saw the cleansing fountain,\n Open wide for all my sin,\n I obeyed the Spirit’s calling\n When He said, “Wilt thou be clean?”\n\nI will praise Him! I will praise Him!\nPraise the Lamb for sinners slain;\nGive Him glory, all ye people,\nFor His blood can wash away each stain.\n\n2.Though the way seems straight and narrow,\n All I claimed was swept away;\n My ambitions, plans and wishes\n At my feet in ashes lay.\n\n3.Then God’s fire upon the altar\n Of my heart was set a flame;\n I shall never cease to praise Him\n Glory, glory to His name!\n\n4.Blessed be the name of Jesus!\n I’m so glad He took me in;\n He’s forgiven my transgression,\n He has cleansed my heart from sin.\n\n5.Glory, glory to the Father!\n Glory, glory to the Son!\n Glory, glory to the Spirit!\n Glory to the Three in One!","ec":"1.Give me oil in my lamp, keep me burning---\nGive me oil in my lamp, I pray;\nGive me oil in my lamp, keep me burning---\nKeep me burning till the break of day\n\nSing Hosanna, sing Hosanna,\nSing Hosanna to the King of Kings;\nSing Hosanna, Sing Hosanna,\nSing Hosanna to the King.\n\n2.Make me a fisher of men Keep me seeking,\nMake me a fisher of men, I pray,\nMake me a fisher of men, Keep me seeking,\nSeeking souls till Jesus comes again.","ts":"యేసురాజు వచ్చుచున్నాడు\nహోసన్నా గీతం పాడెదం (2)\nత్వరగా వెళ్లెదము(2)\nహోసన్నా జయమే (2)\nహోసన్నా జయం మనదే(2)\n\n1.యోర్దాను పొంగి పొర్లినా యెరికో కోట ఎదురైనా\nభయము లేదు కలత లేదు (2)\nరక్షకుడున్నాడు...\n\n2.శ్రమలు చుట్టినను కష్టనష్టాలు వచ్చినను\nభయము లేదు కలత లేదు (2)\nప్రభువు వున్నాడు...\n\n3.హల్లెలూయ స్తుతి మహిమ \nఎల్లప్పుడు హల్లెలూయ స్తుతి మహిమ\nయేసు రాజు మనకు ప్రభువు కీర్తింతు... మెల్లప్పుడు"},{"n":69,"ei":"Have thine own way","ci":"Give thanks with a great","ti":"క్రీస్తు యేసు నాదు రాజా!","es":"1.Have Thine own way, Lord,\nHave Thine own way!\nThou art the potter; I am the clay!\nMould me and make me after Thy  will,\nWhile  I am waiting, yielded and still.\n\n2.Have Thine own way, Lord,\nHave Thine own way!\nSearch me and try me, Master, today!\nWhiter than snow, Lord, wash me just now,\nAs in Thy presence humbly I bow.\n\n3.Have Thine own way, Lord,\nHave Thine own way!\nWounded and weary, help me, I pray!\nPower,all power, surely is Thine!\nTouch me and heal me, Saviour divine!\n\n4.Have Thine own way, Lord, \nHave Thine own way!\nHold o’er my being absolute sway!\nFilled with Thy Spirit till all shall see\nChrist only, always, living in me!","ec":"Give thanks with a grateful heart,\nGive thanks to the Holy one,\nGive thanks because He’s given Jesus Christ His Son\nAnd now, let the  weak say,\n“I am strong”\nLet  the poor  say, “I am rich”\nBecause  of  what  the Lord  has done for us.\nGive thanks.","ts":"క్రీస్తు యేసు నాదు రాజా! నీ సిలువే నా మహిమ (2) \nరమ్యమైనవి భూమి మీద ఎంత యధికముగా నుండినను ||క్రీస్తు||\n\n1.మిగుల ఆస్థి - అధిక విద్య పలుకుబడి ఎంతో ఉండినను\nసిలువన్‌ జూడ - నాదు సర్వ గర్వమంతయు వ్యర్థంబేను  ||క్రీస్తు||\n\n2.జీవపూట - నీదు సిలువ జీవనది లోక మంతటికి\nశుద్ధ రక్త – ఊటలోన మునిగి నేను - శుద్ధుడనైతిన్‌  ||క్రీస్తు||\n\n3.కాలు సేతుల్‌ - శిరము నుండి\nచిందుచుండె రక్తంబదిగో యేసు రాజా! ఇట్టి ప్రేమ\nనాదు బ్రతుకున గాంచలేదు  ||క్రీస్తు|| \n\n4.ఇంత వింత ప్రేమ కొరకై యేమి కానుక చెల్లించెదను కోటి యాస్తుల్‌ సాటి కావు \nనన్ను నేను సమర్పింతు   ||క్రీస్తు|| "},{"n":70,"ei":"Angels , from the realms","ci":"Glory Jesus.glory","ti":"ఏ పాప మెరుగని - యో పావన మూర్తి","es":"1.Angels, from the realms of glory,\nWing Your flight o’er all the earth,\nYe who sang creation’s story,\nNow proclaim Messiah’s birth:\n\nCome and worship (2)\nWorship Christ, the new born King!\n\n2.Shepherds in the fields abiding\nWatching o’er their flocks by night\nGod with man is now residing\nYonder shines the infant-light:\n\n3.Sages, leave your contemplations\nBrighter visions beam afar,\nSeek the great “Desire of nations”\nYe have seen His natal star:\n\n4.Saints before the altar bending\nWatching long in hope and fear\nSuddenly the Lord, descending\nIn His temple shall appear:","ec":"Glory Jesus, glory,\nYou do the fighting for me;\nPraise you Jesus, praise you.\nIn you there’s always victory.\nYe are of  God’s  little children,\nAnd have overcome him;\nFor greater is He that is in you,\nThan he that is in the world.","ts":"ఏ పాప మెరుగని - యో పావన మూర్తి పాప - విమోచకుండ\nఏ పాప మెరుగని - యో పావన మూర్తి పాప - విమోచకుండ\n\n1.ముళ్ళతో  గిరీట - మల్లి నీ శిరముపైఁ జల్లాటమున మొత్తిరా\nముళ్ళ పోట్లకు శిరము తల్లడిల్లగ  సొమ్మ సిల్లిపోతివి రక్షకా   ||ఏ||\n\n2.కలువరి  గిరి దనుక - సిలువ మోయలేక - కలవరము నొందినావా\nసిలువ నీతో మోయ - దులువలు వేరొకని దోడుగా నిచ్చినారా   ||ఏ||\n\n3.చెడుగు యూదులు బెట్టు పడరాని పాట్లకు – సుడివడి నడచినావా\nకడకు కల్వరిగిరి - కడకేగి సిల్వను  గ్రక్కున దించినావా  ||ఏ||\t\n\n4.ఆ కాల కర్ములు భీకరంబుగ నిన్నునా కొయ్యపై నుంచిరా - నీ\nకాలు సేతుల నా కొయ్యకే సూది మేకులతో గ్రుచ్చినారా  ||ఏ||\t\n\n5.పలువిధంబుల శ్రమలు-చెలరేగఁ  దండ్రికి-నెలుగెత్తి మొరలిడితివా\nసిలువపై బలుమారు - కలుగుచుండెడి బాధ - వలన దాహము నాయెనా ||ఏ||\n\n6.బల్లిదుండగు బంటు బల్లెమున నీ ప్రక్క - జిల్లిబడ బొడిచినాడా\nఉల్లోలముల వలె - నల్ల  నీ రుబుకంగ - జల్లారె గద కోపము ||ఏ||\n\n7.కటకటా పాప సంకటముఁబాపుట కింత - పటు బాధ నొందినావా\nఎటువంటి దీ ప్రేమ యెటువంటి దీశాంత  మెటుల వర్ణింతు స్వామి  ||ఏ||"},{"n":71,"ei":"As with gladness","ci":"Go tell in on the mountains","ti":"నీ రక్తమే జయం - కల్వరి యేసు","es":"1.As with gladness men of old\nDid the guiding star behold,\nAs with joy they hailed its light,\nLeading onward, beaming bright,\nSo, most gracious Lord, may we\nEvermore be led to Thee.\n\n2.As with joyful steps they sped,\nSaviour, to Thy lowly bed,\nThere to bend the knee before\nThee whom heaven and earth adore:\nSo may we with willing feet\nEver seek the mercy seat.\n\n3.As they offered gifts most rare\nAt Thy cradle rude and bare,\nSo may we with holy joy,\nPure, and free from sin’s alloy,\nAll our costliest treasures bring,\nChrist, to Thee, our heavenly King.\n\n4.Holy Jesus, every day\nKeep us in the narrow way,\nAnd, when earthly things are past,\nBring our ransomed souls at last\nWhere they need no star to guide,\nWhere no clouds Thy glory hide.","ec":"Go tell in on the mountains,\nOver the hills and every where,\nGo tell it on the mountains,\nThat Jesus Christ is born.","ts":"నీ రక్తమే జయం - కల్వరి యేసు\nకరుణ యేసు - నీ రక్తమే జయం\n\n1.పాపాన్ని కడిగిన రక్తమే జయం\nశాపాన్ని మాపిన రక్తమే జయం\nపరిశుద్ధ పరచిన రక్తమే జయం\nశాంతిని నొసగిన రక్తమే జయం\n\n2.విడుదల నిచ్చిన రక్తమే జయం\nకొరతలు తీర్చిన రక్తమే జయం\nజయము నిచ్చిన రక్తమే జయం\nబలము నొసగిన రక్తమే జయం\n\n3.ద్వేషము తీర్చిన రక్తమే జయం\nప్రేమతో నింపిన రక్తమే జయం\nఅధికారమొసగిన రక్తమే జయం\nఆశ్రయదుర్గమైన రక్తమే జయం\n\n4.సాతానుని బంధించిన రక్తమే జయం\nనా కోసము క్రయమైన రక్తమే జయం\nసందేహము తీర్చిన రక్తమే జయం\n పరలోక మార్గమైన రక్తమే జయం"},{"n":72,"ei":"Away in a manger","ci":"God can do anything","ti":"ప్రేమ కల్వరి ప్రేమ నిన్ను చూడగానే","es":"1. Away in a manger, No crib for a bed\nThe little Lord Jesus laid down His sweet head,\nThe stars in the bright sky Looked down where He lay;\nThe little Lord Jesus Asleep on the hay.\n\n2.The cattle are lowing, The Baby awakes\nBut little Lord Jesus, No crying He makes:\nI love Thee, Lord Jesus! Look down from the sky\nAnd stay by my side Until morning is nigh.\n\n3. Be near me, Lord Jesus; I ask Thee to stay\nClose by me for ever, And love me, I pray.\nBless all the dear children In Thy tender care,\nAnd fit us for heaven To live with Thee there.","ec":"God can do anything, anything, anything,\nGod can do anything but fail.\nHe can save, He can keep,\nHe can cleanse, and He will,\nGod can do anything but fail.\nHe’s the Alpha and Omega,\nThe beginning and the end,\nHe’s the fairest of ten  thousand to my soul:\nGod can do anything, anything, anything,\nGod can do anything, but fail.","ts":"ప్రేమ కల్వరి ప్రేమ నిన్ను చూడగానే\nనా హృదయం పగిలెనయ్యా\n\n1.దాహం దాహమంటివి నా కోసం వేచితివి\nపాపాలన్ని మోసి  పరిహారబలియైతివి  ప్రేమ||\n\n2.యాలు చూస్తున్నాను కన్నీరు కార్చుచున్నాను \nపరిశుద్ధమైన రక్తం తల్లడిల్లె తల్లి హృదయం ప్రేమ||\n\n3.గలించు కరములలో మేకులా స్వామి\nస్మరించి ధ్యానింప నా హృదయము కరిగెనయ్యా ||ప్రేమ||\n\n4.దలో ఒక ఊట నదిలా పారెనయ్యా\nజనులెల్ల మునగాలి రుజన్మ పొందాలి  ||ప్రేమ||\n"},{"n":73,"ei":"Brightest and best","ci":"God forgave my sin in","ti":"లోకులు నిన్ను ద్వేషించినా","es":"1.Brightest and best of the sons of the morning,\nDawn on our darkness, and lend us thine aid!\nStar of the east, the horizon adorning, \nGuide where our infant Redeemer is laid!\n\n2.Cold on His cradle the dew-drops are shining,\nLow lies His head with the beasts of the stall;\nAngels adore Him in slumber   reclining\nMaker and Monarch and saviour of all!\n\n3.Say, shall we yield Him, in costly devotion\nOdours of Edom and offerings Divine;\nGems of the mountain, and pearls of the ocean,\nMyrrh from the forest, and gold from the mine?\n\n4.Vainly we offer each ample oblation;\nVainly with gifts would His favour secure;\nRicher by far is the heart’s adoration;\nDearer to God are the prayers of the poor.\n\n5.Brightest and best of the sons of the morning\nDawn on our darkness, and lend us thine aid!\nStar of the east, the horizon adorning\nGuide where our infant Redeemer is laid!","ec":"1.God forgave my sin in Jesus’ Name,\nI’ve been born again in Jesus’ Name;\nAnd in Jesus’ Name I come to you,\nTo share His love as He told me to.\n\nHe said, ”Freely, freely you have received;\nFreely freely give.\nGo in My Name and because you believe,\nOthers will know that I live.”\n\n2.All pow’r is given in Jesus’ Name,\nIn earth and heaven in Jesus’ Name;\nAnd in Jesus’ Name I come to you,\nTo share His pow’r as He told me to.","ts":"1.లోకులు నిన్ను ద్వేషించినా లోతైన ప్రేమను పొందెదవా\nబంధువులే నిన్ను వెలివేసినా నిందతో సిలువను మోసెదవా.. నిందతో\n\nనీ కొరకై మరణించితిని  కొరకేమి చేసితివి\nనీ కొరకై మరణించితిని\nనా కొరకేమి చేసితివి  కొరకేమి చేసితివి\n\n2.లోక ఘనత వట్టిదని లోకపు యాస్థి వ్యర్థమని \nహృదయమంతటితో నీవు సేవను చేయ వచ్చెదవా...సేవను\n\n3.కాపరి లేని మంద వలె పాపపు గడ్డిని మేయుచున్నారు...\nకాపరి యేసును ఎరిగి నీవు ఉన్నత పదవులు వెదకెదవా...ఉన్నత\n\n4.యేసు అంటే ఎవరు యని డిగెడివారు ఎంతమందో\nఆకలితోను ఉన్నవారికి వాహారం యిచ్చెదవా?...జీవా"},{"n":74,"ei":"Christian awake!","ci":"God is good all the time","ti":"ఓ ఘోర పాపములు నా చేతులు చేసినవి","es":"1.Christians awake, salute the happy morn\nWhereon the Saviour of mankind was born;\nRise to adore the mystery of love,\nWhich hosts of angels chanted from above;\nWith them the joyful tidings first begun\nOf God Incarnate and the Virgin’s Son.\n\n2.Then to the watchful shepherds it was told,\nWho heard the angelic herald's voice:\"Behold,\nI bring good tidings of a Saviour's birth\nTo you and all the nations of the earth:\nThis day hath  God fulfilled His promised word,\nThis day is born a Saviour, Christ the Lord,\"\n\n3.He spake: and straightway the celestial choir\nIn hymns of joy, unknown before, conspire;\nThe praises of redeeming love they sang,\nAnd heaven's whole orb with hallelujahs rang;\nGod’s highest glory was their anthem still,\nPeace upon earth, and unto men good will.\n\n4.To Bethlehem straight the \nenlightened shepherds ran,\nTo see the wonder God  had wrought for man;\nAnd found, with  Joseph and the blessed Maid,\nHer Son, the Saviour, in a manger laid;\nThen to their flocks, still praising God, return,\nAnd their glad hearts with holy rapture burn.\n\n5.Oh! may we keep and ponder in our mind,\nGod’s wondrous love in saving lost  mankind;\nTrace we the Babe who hath retrieved our loss,\nFrom His poor manger to His bitter cross;\nTread in His steps, assisted by His grace,\nTill man's first heavenly state again takes place.\n\n6.Then may we hope, the angelic hosts among,\nTo sing , redeemed a glad triumphal song;\nHe that was born upon this joyful day\nAround us all His glory shall display;\nSaved by His love, incessant we shall sing\nEternal praise to heaven's Almighty King.","ec":"God is good all the time\nHe put a song of praise\nIn this heart of mine\nGod is good all the time,\nThrough the darkest night\nHis light will shine\nGod is good, God is good,\nAll the time\n\n1.If you’re walking through the valley\nThere are shadows all around.\nDo not fear He will guide you\nHe will keep you safe and sound\nHe has promised to never leave you\nNor forsake you, and His word is true.\n\n2.We were sinners so unworthy,\nStill for us He chose to die,\nHe filled us with His Holy spirit,\nNow we can stand and testify,\nThat His love is everlasting,\nAnd His mercies they will never end.","ts":"1 ఓ ఘోర పాపములు నా చేతులు చేసినవి\nనీ చేతులలో స్రవియించు – రక్తంతో నా చేతులు కడుగు మయా\n\n2  ఘోర పాపములు నా కాళ్ళు చేసినవి\nనీ కాళ్ళలో స్రవియించు రక్తంతో నా కాళ్ళను కడుగుమయా\n\n3 ఓ ఘోర పాపముతో నా హృదయము చెడి పోయెన్\nనీ యెద నుండి స్రవియించు - రక్తంతో\nనా హృదయము కడుగుమయా\n\n4.ఘోర పాపములు నా తలతో తలంచినవి\nనీ శిరస్సున స్రవియించు – రక్తంతో  శిరస్సును కడుగుమయా"},{"n":75,"ei":"Harh the herald angels","ci":"Go is so good","ti":"యేసు-అనుభవించితివా సిలువ","es":"1.Hark, the herald angels sing,\n“Glory to the new-born King!\nPeace on earth and mercy mild\nGod and sinners reconciled.”\nJoyful, all ye nations, rise,\nJoin the triumph of the skies;\nWith the angelic host proclaim\n“Christ is born in Bethlehem!”\n\nHark! The herald angels sing,\n“Glory to the new-born king!”\n\n2.Hail, the heaven-born \nPrince of Peace!\nHail, the Sun of Righteousness!\nLight and life to all He brings,\nRisen with healing in His wings.\nMild He lays His glory by,\nBorn that man no more may die;\nBorn to raise the sons of earth\nBorn to give them second birth\n\n3.Come, Desire of nations, come\nFix in us Thy humble home;\nRise, the woman’s conquering Seed,\nBruise in us the serpent’s head,\nSing we then, with angels sing:\n“Glory to the  new-born King!\nGlory in the highest heaven,\nPeace on earth, and sins forgiven.”","ec":"1.God is so good (3)\nHe’s so good to me\n\n2.He answers prayers (3)\nHe’s so good to me\n\n3.I love Him so (3)\nHe’s so good to me","ts":"యేసు-అనుభవించితివా సిలువను \nకలువరి మెట్టపై పలుమారు శ్రమలను  \nఅనుభవించితివా-నా యేసు  ||యేసు||\n\n1 ప్రభో - పలుమారు నిన్నునే గొట్టితి\nవలదని చెప్పిన - వినక నే జేసితి\t\nపలునిందలు మోపితి - నీ మీద ||యేసు||\n\n2 నీదు - పవిత్ర మోము పైనే నిన్ను  నాదు ఉమ్మివేసి - హద్దు లేక\nజేసి నీచపర్చితినయ్యా – నా యేసు ||యేసు||\n\n3 కృప - తో నిండి వచ్చిన నిన్నునే\tకాలు చేతులు \nగట్టి-సీలలతో గొట్టి ట్టపై బెట్టితి - నేనిన్ను ||యేసు||\n\n4 ప్రేమ - తో నిండి వచ్చిన నిన్నునే\nనాదు చెడు తలంపులతో\nనీదు శిరస్సుపైని ముల్లుల కిరీటము గొట్టితిని ||యేసు||\n\n5 మేళ్ళ - తో నిండి వచ్చిన నిన్నునే\nనాదు చెడు నడతలతో నీదు ప్రక్కలోన\nబళ్ళెంపు పోటును బొడిచితిని ||యేసు||\n\n6 ఇన్ని - చేసినగాని నన్ను నీవు\nచేపట్టి బుజ్జగించితివయ్యా నా తండ్రి \nనాకు తెలియకున్నది - నీ ప్రేమ ||యే||"},{"n":76,"ei":"It came upon the","ci":"God is still on the throne","ti":"పాపిని కృప జూపవయ్యా - దాపు జేరితిని యేసయ్యా","es":"1.It came upon the midnight clear,\nThat glorious song of old,\nFrom angels bending near the earth\nTo touch their harps of gold:\nPeace on the earth, goodwill to men\nFrom heaven’s all-gracious King!\nThe world in solemn stillness lay\nTo hear the angels sing.\n\n2.Still through the cloven skies they come\nWith peaceful wings unfurled;\nAnd still their heavenly music floats\nO’er all the weary world:\nAbove its sad and lowly plains\nThey bend on hovering wing,\nAnd ever, o’er its Babel-sounds,\nThe blessed angels sing.\n\n3.O ye, beneath life’s crushing load\nWhose forms are bending low,\nWho toil along the climbing way\nWith painful steps and slow;\nLook up! for glad and golden hours\nCome swiftly on the wing;\nOh, rest beside the weary road,\nAnd hear the angels sing!\n\n4.For lo! the days are hastening on,\nBy prophet-bards foretold,\nWhen, with the ever-circling years,\nComes round the age of gold;\nWhen peace shall over all the earth\nIts ancient splendours fling,\nAnd the whole world send back the song\nWhich now the angels sing!","ec":"God is still on the throne\nAnd He will remember His own\nThough trials may press us\nAnd burdens distress us,\nHe  never will leave us alone.\nGod is still on the throne,\nHe never forsaketh His own;\nHis promise is true,\nHe will not forget you,\nGod is still on the throne","ts":"పాపిని కృప జూపవయ్యా - దాపు జేరితిని యేసయ్యా\nపాప భారము క్రింద శ్రమపడి కృంగియున్నాను యేసయ్యా\n\n1 వేషభాషల తోడ నిండి మోసపోయితిని యేసయ్యా \nదోసిలొగ్గి నిన్ను జేరితి దాసునిగ బ్రోవు మేసయ్యా   ||పాపిని||\n\n2 నీతిలేని నాదు జీవిత  మేల నికనయ్యా యేసయ్యా\nనీతి గరపి బ్రోవుమయ్యా నీతి నిడవయ్యా యేసయ్యా  ||పాపిని||\n\n3 నీదు సిలువలోని ప్రేమ నెంచదరమౌనె యేసయ్యా\nనాదు కలుషమంత బాపి కనికరింపుమా యేసయ్యా  ||పాపిని||\n\n4 నీదు రక్తధారలే యిల పాపికాశ్రయము యేసయ్యా\nనీతిమంతుల జేయుమయ్యా నీతి సూర్యుండా యేసయ్యా  ||పాపిని||\n\n5 దాపుగోరిన వారలకు నీ పాప్రు జూపితివి యేసయ్యా\nపాపశాపము బాపి నిత్య జీవమిడవయ్యా యేసయ్యా  ||పాపిని||\n\n6 శాంతి గోరువారలెల్ల నీ చెంత కరిగినచో యేసయ్యా \nచింతలెల్ల దీర్చగలవు శాంతి నొసగెదవు యేసయ్యా ||పాపిని||\n\n7 పరమ రక్షకా నీదు ప్రేమ నెరుగ దరమౌనె యేసయ్యా\nపరులమైన మమ్ము బ్రోవ వేచియున్నావా యేసయ్యా ||పాపిని||\n\n8 నాదు హృదయము నీదె సుమ్మా నీవె గైకొనుమా యేసయ్యా \nశుద్ధ హృదయము జేసినను నీ సుతునిగా జేయు మేసయ్యా ||పాపిని||"},{"n":77,"ei":"Jesus my Saviour","ci":"God will make a way","ti":"అపరాధిని యేసయ్యా కృప జూపి బ్రోవుమయ్యా","es":"1.Jesus my Saviour, to Bethlehem came\nBorn in a manger to sorrow and shame\nOh it was wonderful blest be His Name\nSeeking for me, for me!    - 3\nOh it was….\n\n2.Jesus my Saviour, On Calvary’s tree\nPaid the great debt and my soul he set free\nOh It was wonderful-how could it be?\nDying for me, for me!     – 3 \nOh it was...\n\n3.Jesus my Saviour, the same as of old\nWhile I was wandering afar from the fold\nGently and long did He plead with my soul\nCalling for me, for me!   - 3\nGently...\n\n4.Jesus my Saviour, shall come from on high\nSweet is the promise as passing years fly\nOh I shall see Him descending the sky\nComing for me, for me!  - 3\nOh I shall ...","ec":"God will make a way\nWhere there seems to be no way\nHe works in ways we cannot see\nHe will make a way for me\nHe will be my guide\nHold me closely to His side\nWith love and strength\nFor each new day\nHe will make a way (2)\n\nBy a roadway in the wilderness He will lead me.\nRivers in the desert will I see\nHeaven and earth will fade\nBut His Word will still remain\nHe will do something new today","ts":"అపరాధిని యేసయ్యా కృప జూపి బ్రోవుమయ్యా\nనెపమెంచకయె నీ కృపలో నపరాధములను క్షమించు\n\n1.సిలువకు నిను నే గొట్టితిని తులువలతో జేరితిని  \nకలుషంబులను మోపితిని దోషుండ నేను ప్రభువా  ||అప||\n\n2.ప్రక్కలో బళ్ళెపు పోటు గ్రక్కున బొడిచితి నేనే \nమిక్కిలి బాధించితిని మక్కువ జూపితివయ్యా  ||అప||\n\n3.ముళ్ళతో కిరీటంబు నల్లి నీ శిరమున నిడితి \nనా వల్ల నేరమాయె చల్లని దయగల తండ్రి  ||అప||\n\n4.దాహంబు గొనగా చేదు చిరకను ద్రావనిడితి\nద్రోహుండనై జేసితిని దేహంబు గాయంబులను ||అప||\n\n5.ఘోరంబుగా దూరితిని నేరంబులను జేసితిని\nక్రూరుండనై గొట్టితిని ఘోరంపు పాపిని దేవా  ||అప||\n\n6.చిందితి రక్తము నాకై పొందిన దెబ్బల చేత\nనిందలు పెట్టితినయ్యో సందేహ మేలనయ్యా  ||అప||\n\n7.రక్షణ దెచ్చితివయ్యా శిక్షకు పాత్రుడనయ్యా\nఅక్షయ భాగ్యమునియ్య మోక్షంబు జూపితివయ్యా  ||అప||"},{"n":78,"ei":"Joy to the world!","ci":"Greater is He that is in me","ti":"యుదా రాజ సింహం - తిరిగి లేచెను","es":"1.Joy to the world! The Lord is come:\nLet earth receive her King;\nLet every heart prepare Him room,\nAnd heaven and nature sing\nAnd heaven and nature sing\nAnd heaven, and heaven and nature sing.\n\n2.Joy to the world! The Saviour reigns:\nLet men their songs employ;\nWhile fields and floods, rocks, hills and plains,\nRepeat the sounding joy\nRepeat the sounding joy\nRepeat, repeat the sounding joy.\n\n3.No more let sins and sorrows grow,\nNor thorns infest the ground;\nHe comes to make His blessings flow\nFar as the curse is found\nFar as the curse is found\nFar as, far as the curse is found.\n\n4.He rules the world with truth and grace.\nAnd makes the nations prove\nThe glories of His righteousness,\nAnd wonders of His love\nAnd wonders of His love\nAnd wonders, wonders of His love.","ec":"Greater is He that is in me (3)\nThan he that is in the world\nSatan’s like a roaring lion\nRoaming to and fro\nSeeking whom he may devour\nThe Bible tells me so\nMany souls have been deceived\nTo fall in some weak hour\nBut God has promised us today\nHis overcoming power.\nGreater is He . . .","ts":"యూదా రాజ సింహం - తిరిగి లేచెను\nతిరిగి లేచెను - మృతిన్‌ గెలిచి లేచెను\n\n1.నరక శక్తులన్ని ఓడిపోయెను\nఓడిపోయెను - ఆవి వాడి పోయెను \n\n2.దూత సైన్యమంత – స్తుతించు చుండ\nస్తుతించు చుండ - యేసుని సన్నుతించుచుండ    \n\n3.మరణ సంకెళ్ళను - త్రెంచి వేసెను\nత్రెంచి వేసెను  - వాటిన్‌ వంచి వేసెను\n\n4.యేసు లేచెనని - మ్రోగుచున్నది\nమ్రోగుచున్నది - భయమున్‌  ద్రోలుచున్నది\n\n5.వనితల్‌ దూత వార్త - విశ్వసించిరి\nవిశ్వసించిరి - మదిన్‌ సంతసించిరి\n\n6.పునరుద్ధానుడెన్నడు - మరణించడు\nమరణించడు - మరణించడెన్నడు\n\n7.యేసూ! నీదు పాదం - మ్రొక్కెదము\nమ్రొక్కెదము - మము ముద్రించుము"},{"n":79,"ei":"come, all ye faithful","ci":"Hallelujah! I will sing","ti":"గీతం గీతం - జయ జయ గీతం","es":"1.Oh, come, all ye faithful,\nJoyful and triumphant;\nOh, come ye, oh, come ye to Bethlehem;\nCome and behold Him,\nBorn the King of angels;\n\nOh,come, let us adore Him,   (3)\nChrist the Lord!\n\n2.God of God, Light of light,\nLo! he abhors not the Virgin’s womb;\nVery God Bego
