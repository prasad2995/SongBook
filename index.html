n\n1 పచ్చికగల చోట్ల నన్ను పరుండజేయును\nశాంతికరమైన జలములకు నన్ను నడిపించును\n\n2 గాఢాంధకారపు లోయలలో సంచరించినను\nఅపాయమే కలుగదు నాకు నీతోడు నాకుండగ\n\n3 చిరకాలము నేను యెహోవా సన్నిధిలో\nనివాసముండెదను నేను నిత్యము జీవింతును"},{"n":208,"ei":"Just as I am,","ci":"O it is wonderful to be a","ti":"నే సాగెద యేసునితో\nనా జీవిత కాలమంత(","es":"1.Just as I am, without one plea, \nBut that Thy blood was shed for me,\nAnd that Thou bidd’st me come to Thee,\nO Lamb of God, I come!\n\n2.Just as I am, and waiting not,\nTo rid my soul of one dark blot,\nTo Thee whose blood can cleanse each spot,\nO Lamb of  God, I come!\n\n3.Just as I am, though tossed about\nWith many a conflict,many a doubt,\nFightings and fears, within, without,\nO Lamb of  God, I come!\n\n4.Just as I am, poor,wretched, blind,\nSight, riches, healing of the mind,\nYea, all I need, in Thee to find,\nO Lamb of God, I come!\n\n5.Just as I am, Thou wilt receive\nWilt welcome, pardon, cleanse, relieve\nBecause Thy promise I believe,\nO Lamb of God, I come!\n\n6.Just as I am, Thy love unknown\nHath broken every barrier down;\nNow  to be Thine, yea, Thine alone,\nO Lamb of God, I come!","ec":"O it is wonderful to be a Christian,\nO it is wonderful to be God’s child!\nO it is wonderful to have your sins forgiven,\nO it is wonderful to be redeemed,\nJustified forever reconciled!","ts":"నే సాగెద యేసునితో నా జీవిత కాలమంత(2)\n\n1 యేసుతో గడిపెద యేసుతో నడిచెద\nపరమున చేరగ నే వెళ్ళెద,\nహనోకు వలె సాగెదా...   ||నే||\n\n2 తల్లియే మరచిన తండ్రియే విడిచిన\nబంధువులే నన్నువెలివేసినా\nబలవంతునితో సాగెదా...  ||నే||\n\n3 వెనుక శత్రువుల్‌ - వెంటాడినను\nముందు సముద్రము ఎదురొచ్చినా\nమోషేవలె సాగెదా...\t ||నే||\n\n4 మరణ శాసనం – హెచ్చరించినను\nసింహపు బోనులో నను వేసినా\nదానియేల్‌  వలె సాగెదా...   ||నే||\n\n5 లోకపు శ్రమలు -నన్నెదిరించినన్‌\nకఠినులు రాళ్ళతో హింసించినా\nస్తెఫను వలె సాగెదా...  ||నే||\n\n6 బ్రతుకుట క్రీస్తే - చావయినా మేలే\nక్రీస్తుకై హత సాక్షిగా మారిన\nపౌలు వలె సాగెదా...  ||నే||"},{"n":209,"ei":"Lead us, heavenly Father","ci":"O it's amazing what praising","ti":"దేవుడు మీకు యెల్లప్పుడు తోడుగనున్నాడు","es":"1.Lead us, heavenly Father, lead us\nO’er the worlds tempestuous sea;\nGuard us, guide us, keep us, feed us,\nFor we have no help but Thee;\nYet possessing every blessing,\nIf our God our Father be.\n\n2.Saviour, breathe forgiveness o’er us;\nAll our weakness Thou dost know;\nThou didst tread this earth before us,\nThou didst feel its keenest woe;\nLone and dreary, faint and weary,\nThrough the desert Thou didst go.\n\n3.Spirit of our God, descending,\nFill our hearts with heavenly joy;\nLove with every passion blending,\nPleasure that can never cloy:\nThus provided, pardoned, guided,\nNothing can our peace destroy.","ec":"O it’s amazing what praising can do\nHallelujah! Hallelujah!\nO it’s amazing what praising can do, Hallelujah!\nI don’t worry when things go wrong\nJesus fills my heart with a song\nOh it’s amazing what praising can do, Hallelujah!","ts":"దేవుడు మీకు యెల్లప్పుడు తోడుగనున్నాడు  (2)\t\n\n1 ఏదెనులో ఆదాముతో నుండెన్‌ హనోకు తోడ నేగెను\nదీర్ఘ దర్శకులతో నుండెన్‌  ధన్యులు దేవుని గలవారు\n\n2 దైవాజ్ఞను శిరసావహించి దివ్యముగ నబ్రహాము\nకన్న కొమరుని ఖండించుటకు ఖడ్గమునెత్తినయపుడు\n\n3 యోసేపు ద్వేషించబడినపుడు గోతిలో త్రోయబడినపుడు\nశోధనలో చెఱసాలయందు సింహాసన మెక్కినపుడు\n\n4 ఫరోరాజు తరిమినయపుడు ఎఱ్ఱ సంద్రపు తీరమున\nయోర్దానునది దాటునపుడు యెరికో కూలిన యపుడు \n\n5 దావీదు సింహము నెదిరించి ధైర్యాన చీల్చినయపుడు\nగొల్యాతును హతమార్చినయపుడు సౌలుచే తరుమబడినపుడు\n\n6 సింహపు బోనులో దానియేలు షడ్రకు మెషాకబెద్నెగో\nఅగ్నిగుండములో వేయబడన్‌ నల్గురుగా కనబడినపుడు\n\n7 పౌలు బంధించబడినపుడు పేతురు చెఱలోనున్నపుడు\nఅపోస్తలులు విశ్వాసులు హింసించబడిన యపుడు"},{"n":210,"ei":"Let me come closer","ci":"O Lord, do a work in me","ti":"యేసుని ప్రేమను నేమారకను\n","es":"1.Let me come closer to Thee, Lord Jesus, \nOh, closer day by day;\nLet me lean harder on Thee, Lord Jesus, \nYes, harder all the way.\n\n2.Let me show forth Thy beauty, Lord Jesus,\nLike sunshine on the hills;\nOh, let my lips pour forth Thy sweetness\nIn joyous sparkling rills!\n\n3.Yes, like a fountain, precious Lord Jesus, \nMake me and let me be;\nKeep me and use me daily, Lord Jesus, \nFor Thee, for only Thee.\n\n4.In all my heart and will, O Lord Jesus, \nBe altogether King;\nMake me a loyal subject, Lord Jesus, \nTo Thee in everything.\n\n5.Thirsting and hungering for Thee, Lord Jesus, \nWith blessed hunger here,\nLooking for home on Zion’s mountain—\nNo thirst, no hunger there.","ec":"O Lord, do a work in me\nTake all my sin and iniquity\nO Lord, do a mighty  work in me\nI want to be holy, pure and holy\nTo be like Thee.\nTake it up, take it out\nEvery fear and every doubt\nI want to be full of Your power and love.","ts":"యేసుని ప్రేమను నేమారకను నెప్పుడు దలచవె యో మనసా\nవాసిగ నాతని – వరనామంబును వదలక పొగడవె యో మనసా\n\n1.పాపుల కొరకై - ప్రాణము బెట్టిన ప్రభు నిల దలచవె యో మనసా\nశాపము నంతయు - జక్కగ నోర్చిన శాంతుని పొగడవె యో మనసా\n\n2.కష్టములలో మన - కండగ నుండిన కర్తను దలచవె యో మనసా\nనష్టములన్నియు - నణచిన యా గురు శ్రేష్టుని పొగడవె యో మనసా\n\n3.మరణతరిని మన - శరణుగ నుండెడు మాన్యుని దలచవె యో మనసా\nకరుణను మన క - న్నీటిని దుడిచిన కర్తను పొగడవె యో మనసా\n\n4.ప్రార్థనలు విని - ఫలముల నొసగిన ప్రభునిక దలచవె యో మనసా\nవర్ధన గోరుచు - శ్రద్ధతో దిద్దిన వంద్యుని పొగడవె యో మనసా\n\n5.వంచన లేక - వరముల నొసగిన వరదుని దలచవె యో మనసా\nకొంచెము కాని - కూర్మితో దేవుని కొమరుని పొగడవె యో మనసా"},{"n":211,"ei":"Oh, the dee, deep love of Jesus!","ci":"O lord, you've done great things","ti":"దేవుని ప్రేమ యీదిగో జనులార","es":"1.Oh, the deep, deep love of Jesus!\nVast, unmeasured, boundless, free;\nRolling as a mighty ocean\nIn its fulness over me.\nUnderneath me, all around me,\nIs the current of Thy love;\nLeading onward, leading homeward,\nTo my glorious rest above.\n\n2.Oh, the deep, deep love of Jesus!\nSpread His praise from shore to shore;\nHow He loveth, ever loveth,\nChangeth never, nevermore;\nHow He watcheth o’er His loved ones,\nDied to call them all His own;\nHow for them He intercedeth,\nWatcheth o’er them from the throne.\n\n3.Oh, the deep, deep love of Jesus!\nLove of every love the best:\n’Tis an ocean vast of blessing, \n’Tis a haven sweet of rest.\nOh, the deep, deep love of Jesus! \n’Tis a heaven of heavens to me;\nAnd it lifts me up to glory, \nFor it lifts me up to Thee.","ec":"O Lord, you’ve done great things, and I will praise you;\nI will extol you and magnify Your Name.\nO Lord, You’ve done great things, and I will praise you;\nI will extol You and magnify Your Name.\nI will sing praises unto You, and remember Your goodness;\nMy past is forgiven and now I have life.\nYou crown me with steadfast love and tender mercy,\nI’ll do Your will and bless-You, O Lord.","ts":"యేసుని ప్రేమను నేమారకను నెప్పుడు దలచవె యో మనసా\nవాసిగ నాతని – వరనామంబును వదలక పొగడవె యో మనసా\n\n1.పాపుల కొరకై - ప్రాణము బెట్టిన ప్రభు నిల దలచవె యో మనసా\nశాపము నంతయు - జక్కగ నోర్చిన శాంతుని పొగడవె యో మనసా\n\n2.కష్టములలో మన - కండగ నుండిన కర్తను దలచవె యో మనసా\nనష్టములన్నియు - నణచిన యా గురు శ్రేష్టుని పొగడవె యో మనసా\n\n3.మరణతరిని మన - శరణుగ నుండెడు మాన్యుని దలచవె యో మనసా\nకరుణను మన క - న్నీటిని దుడిచిన కర్తను పొగడవె యో మనసా\n\n4.ప్రార్థనలు విని - ఫలముల నొసగిన ప్రభునిక దలచవె యో మనసా\nవర్ధన గోరుచు - శ్రద్ధతో దిద్దిన వంద్యుని పొగడవె యో మనసా\n\n5.వంచన లేక - వరముల నొసగిన వరదుని దలచవె యో మనసా\nకొంచెము కాని - కూర్మితో దేవుని కొమరుని పొగడవె యో మనసా"},{"n":212,"ei":"Take my life, and let it be","ci":"O Lord, our Lord, how majestic","ti":"శాశ్వతమైనది ప్రేమ\nయెహోవా తండ్రి ప్రేమ\n","es":"1.Take my life, and let it be\nConsecrated, Lord, to Thee;\nTake my moments and my days,\nLet them flow in ceaseless praise.\n\n2.Take my hands, and let them move\nAt the impulse of Thy love;\nTake my feet, and let them be\nSwift and beautiful for Thee.\n\n3.Take my voice, and let me sing\nAlways, only, for my King;\nTake my lips, and let them be\nFilled with messages from Thee.\n\n4.Take my silver and my gold,\nNot a mite would I withhold;\nTake my intellect, and use\nEvery power as Thou shalt choose.\n\n5.Take my will, and make it Thine;\nIt shall be no longer mine;\nTake my heart, it is Thine own;\nIt shall be Thy royal throne.\n\n6.Take my love; my Lord, I pour\nAt Thy feet its treasure store:\nTake myself, and I will be,\nEver, only, all, for Thee.","ec":"1.O Lord,our Lord, how majestic\nThy Name is\nHow great is\nThy Name in all the earth,\nWho has set Thy glory\nAbove the high heavens\nAnd stilleth Thy foes through a child in it’s birth.\n\n2.When I think on Thy heavens the work of Thy fingers\nThe moon and the stars which Thou has ordained\nWhat is man in Thy mem’ry a man that Thou mindest\nThe son of man\nThat Thou carest for him?\n\n3.Thou hast made him but little lower than angels,\nAnd crowned him with\nhonour and glory\nThou gavest dominion o’er\nall of the wide earth\nAnd all of the creatures that\nrun in the sea.","ts":"శాశ్వతమైనది ప్రేమ యెహోవా తండ్రి ప్రేమ\nప్రేమలో భయమేమియు లేదు ప్రేమ పరిపూర్ణంబైయున్న\nభయమును పారగ ద్రోలున్‌ \n\n1 దీర్ఘకాలము ప్రేమ దయచూపి సహించును\nమత్సరపడ దీయుత్తమ ప్రేమ డంబముగా నడువని దీ ప్రేమ\nఉప్పొంగని దీ ప్రేమ\n\n2 స్వప్రయోజనమును ఎప్పుడు కోరనిదీ ప్రేమ\nఅమర్యాదగ నడువని ప్రేమ త్వరగా కోపపడని ప్రేమ\nతలచదు అపకారమును\n\n3 దుర్నీతిలో గాక సత్యాన సంతోషించున్‌\nఅన్నిటికి తాళుకొను ప్రేమ అన్నిటిని నమ్మి యోర్చెడి ప్రేమ\nఅన్నిటి నిరీక్షించున్‌\n\n4 నిలుచును విశ్వాసము నిరీక్షణయు మరి ప్రేమ\nవీటిలో శ్రేష్టమైనది ప్రేమ ప్రేమను కల్గియుండుటకు\nప్రయత్నించుడి మీరు\n\n5 ప్రేమ లేనివాడు దేవుని యెరుగనివాడు\nమన దేవుడు ప్రేమ స్వరూపి తన ప్రేమ మనలో సంపూర్ణ\nసిద్ధిని పొందవలయు\n\n6 నిన్నడుగుచున్నాడు నిను ప్రేమించిన ప్రభు యేసు\nనన్ను ప్రేమించుచున్నావా? వీరికంటె నాపై నీకు\nఎక్కువ ప్రేమగలదా\n\n7 నను ప్రేమించినయెడల నా యాజ్ఞలను గైకొనుము\nమీలో మీరు ఒకరి నొకరు ప్రేమించుకొనుచున్నయెడల\nఅదియే మహదానందం"},{"n":213,"ei":"Take time to be holy","ci":"O sing unto the Lord a new song","ti":"యేసూ నన్ను\nప్రేమించినావు\t\nపాపినైన నన్ను\nప్రేమించినావు\n","es":"1.Take time to be holy, speak oft with thy Lord,\nAbide in Him always, and feed on His Word.\nMake friends of God’s children, help those who are weak;\nForgetting in nothing His blessing to seek.\n\n2.Take time to be holy, the world rushes on;\nSpend much time in secret with Jesus alone.\nBy looking to Jesus like Him thou shalt be.\nThy friends, in thy conduct, His likeness shall see.\n\n3.Take time to be holy, let Him be thy Guide;\nAnd run not before Him whatever betide;\nIn joy or in sorrow still follow thy Lord\nAnd, looking to Jesus, still trust in His Word.\n\n4.Take time to be holy, be calm in thy soul\nEach thought and each temper beneath His control.\nThus led by His Spirit to fountains of Love,\nThou soon shalt be fitted for service above.","ec":"O sing unto the Lord a new song\nFor He has done marvellous things\nHis right hand and His holy arm hath gotten Him the victory.\nThe Lord has made known His salvation\nHis righteousness has\nHe openly showed,in the sight of the heathen:\nO sing unto the Lord a new song\nHe has remembered His mercy and His truth to all the house of Israel.\nAll the ends of the earth hath seen, the salvation of our God.","ts":"యేసూ నన్ను ప్రేమించినావు\nపాపినైన నన్ను ప్రేమించినావు\n\n1 నన్ను ప్రేమింపమా నవరూప మెత్తి దానముగా జీవము సిల్వపై\nనిచ్చి కన్న తలిదండ్రుల యన్న దమ్ముల ప్రేమ కన్న మించిన ప్రేమతో\n\n2 తల్లి గర్భముననే ధరియింప బడినపుడే దురితుండనై యుంటిని\nనా వల్ల జేయ బడెడు నెల్ల కార్యము లెప్పు డే హ్యంబులై యుండగా\n\n3 మంచినాలో పుట్ట దంచు నీ వెరిగినన్‌ మించి బ్రేమించి నావు\nఆహా యెంచ శక్యముగాని మంచి నాలో బెంచ నెంచి ప్రేమించినావు \t\n\n4 నన్ను బ్రేమింప నీ కున్నకష్టములన్ని మున్నె తెలిసి యుంటివి\nతెలిసి నన్ను బ్రేమింప నీకున్న కారణమేమో యన్నా తెలియదు చిత్రము \n\n5 నా వంటి నరుడొకడు నన్ను ప్రేమించిన నా వలన ఫలము గోరు\nఆహా నీవంటి పుణ్యునికి నా వంటి పాపితో కేవలం బేమిలేక\t"},{"n":214,"ei":"Who is on the Lord's side?","ci":"Oh the joy of the Lord is in me","ti":"నా యేసుని ప్రేమ కన్నా మిన్న ఏమున్నది","es":"1.Who is on the Lord’s side? \nWho will serve the King? \nWho will be His helper, \nOther lives to bring? \nWho will leave the world’s side? \nWho will face the foe?\nWho is on the Lord’s side? \nWho for Him will go?\n\nBy Thy grand redemption  \nBy Thy grace Divine,\nWe are on the Lord’s side\nSaviour, we are Thine!\n\n2.Not for weight of glory, \nNot for crown and palm, \nEnter we the army, \nRaise the warrior psalm; \nBut for Love that claimeth \nLives for whom He died: \nHe whom Jesus nameth \nMust be on His side.\n\nBy Thy love constraining, \nBy Thy grace Divine, \nWe are on the Lord’s side:\nSaviour, we are Thine!\n\n3.Jesus, Thou hast bought us,\n Not with gold or gem, \nBut with Thine own life-blood,\nFor Thy diadem; \nWith Thy blessing filling  \t\nAll who come to Thee, \nThou hast made us willing, \nThou hast made us free.\n\nBy Thy grand redemption, \nBy Thy grace divine, \nWe are on the Lord’s side:\nSaviour, we are Thine!\n\n4.Fierce may be the conflict, \nStrong may be the foe, \nBut the King’s own army \nNone can overthrow; \nRound His standard ranging,\nVict’ry is secure, \nFor His truth unchanging\nMakes the triumph sure.\n\nJoyfully enlisting, \nBy Thy grace divine, \nWe are on the Lord’s side \nSaviour we are Thine!\n\n5.Chosen to be soldiers\nIn an alien land,\n“Chosen called, and faithful,”\nFor our Captain’s band\nIn His service royal,\nLet us not grow cold;\nLet us be right loyal,\nNoble, true, and bold.\n\nMaster, Thou wilt keep us \nBy Thy grace divine,\nAlways on the Lord’s side,\nSaviour, always Thine!","ec":"1.Oh the joy of the Lord is in me\nOh what happiness He brings\nWhile I’m walking where He leads me\nThat’s why you often hear me sing.\n\nBless the Name of Jesus\nPraise the Name of Jesus\nSing unto the King of Israel (2)\nAnd we sing glory, glory, glory to His name forever,\nGlory, glory, glory to His name.\n\n2.Oh let’s worship Him in the Spirit\nOh no matter who you are\nHe has done such mighty wonders\nThat’s why this music stirs my heart.","ts":"నా యేసుని ప్రేమకన్నా మిన్న ఏమున్నది\nఆ ప్రేమ కల్వరి గిరిలో సార్థకంబైనది\n\n1.నీదు ప్రేమే నాకు జీవము నా సమస్తమును \t\t\nవర్ణించగలనా నీదు ప్రేమ ప్రాణ ప్రియుడా   ||నా||\n\n2.నీవు పొందిన శ్రమలన్నియును నాదు డెందములో\nసాక్ష్యమిచ్చు చుండ నేను నిన్ను విడతునా   ||నా||\n\n3.నీవు కార్చిన రక్తమే నా ముక్తి మార్గమై\nసిల్వలో స్రవించుచునన్‌ శుద్ధి చేయును   ||నా||\n\n4.అర్పింతు నేను నా సమస్తము నాదు హృదయమును\nనీదు ప్రేమ నన్ను తొందర చేయుచున్నది   ||నా||\n"},{"n":215,"ei":"Whosoever heareth!","ci":"Oh, the King is coming","ti":"ఈలాటిదా యేసు ప్రేమ\n","es":"1.”Whosoever heareth!” Shout, shout the sound!\nSend the blessed tidings all the world around!\nSpread the joyful news wherever man is found,\n“Whosoever will may come.”\n\n“Whosoever will! whosoever will!”\nSend the proclamation over vale and hill;\n‘Tis a loving Father calls the wand’rer home:\n“Whosoever will may come!”\n\n2.“Whosoever cometh!” need not delay,\nNow the door is open, enter while you may,\nJesus is the true, the only Living Way:\n“Whosoever will may come.”\n\n3.“Whosoever will,” the promise is secure;\n“Whosoever will,” forever must  endure;\n“Whosoever will,” tis life for evermore;\n“Whosoever will may come.”","ec":"Oh, the King is coming\nThe King is coming\nI just heard the trumpet sounding\nAnd now His face I see\nOh the King is coming\nThe king is coming praise God\nHe’s coming for me.","ts":"ఈలాటిదా యేసు ప్రేమ నన్ను - తూలనాడక తనదు జాలి జూపినదా\n\n1 ఎనలేని పాపకూపమున\nనేను-తనికి మినుకుచును\nనే- దరిగానకు డన్‌\nకనికరము బెంచి నాయందు\nవేగ గొనిపోవ నా మేలు\nకొరకిందు వచ్చె\t\n\n2 పెనుగొన్న దుఃఖాబ్దిలోన\nనేను-మునిగి కుములుచు నేడు\nపునగుందునపుడు\nనను నీచుడని త్రోయలేక\nతనదు నెనరు నా కగు పరచి\nనీతిజూపించె\n\n3 నెమ్మిరవ్వంతైన లేక\nచింత-క్రమ్మి పొగలుచునుండగా\nనన్నుజూచి\nసమ్మతిని ననుబ్రోవదలఁచి\nకరము జాచి నా చేయిపట్టి\nచక్కగా బిలిచె\t\n\n4 పనికిమాలిన వాడనైన\nనేను-కనపరచు\nనాదోష కపటవర్తనము\nమనసు నుంచక తాపపడక\nయింత-ఘనమైన రక్షణ-మును\nనాకుజూపె\n\n5 నా కోర్కెలెల్ల సమయములన్‌\nక్రింది-లోక వాంఛల\nభ్రమసి లొంగెడు వేళన్‌\nచేర్చి దృఢము చిత్తమునన్‌\nశుభము నాకొసంగెజీవింప\nనా రక్షకుండు\n\n6 శోధనలు ననుజుట్టినపుడు\nనీతి-బోధ నా మనసులో\nబుట్టించి పెంచి\nబాధ లెల్లను బాపి మాపి\nయిట్టి యాదరణ జూపెనా\nయహహ యేమందు\n\n\n\n"},{"n":216,"ei":"Work, for the night is coming","ci":"On the vict'ry side","ti":"నన్నెంతగానో ప్రేమించెను\nనన్నెంతగానో కరుణించెను\n","es":"1.Work, for the night is coming, \nWork through the morning hours,\nWork while the dew is sparkling, \nWork `mid springing flowers: \nWork, when the day grows brighter, \nWork in the glowing sun,\nWork, for the night is coming, \nWhen man’s work is done.\n\n2.Work, for the night is coming, \nWork through the sunny noon:\nFill brightest hours with labour \nRest comes sure and soon. \nGive ev’ry flying minute \nSomething to keep in store: \nWork, for the night is coming, \nWhen man works no more.\n\n3.Work, for the night is coming, \nUnder the sunset skies;\nWhile their bright tints are glowing, \nWork, for daylight flies. \nWork, till the last beam fadeth, \nFadeth to shine no more: \nWork, while the night is darkening, \nWhen man’s work is o’er.","ec":"On the vict’ry side, (2)\nNo foe can daunt me,\nNo fear can haunt me,\nOn the vict’ry side (3)\nWith Christ within, the fight we’ll win,\nOn the vict’ry side.","ts":"నన్నెంతగానో ప్రేమించెను నన్నెంతగానో కరుణించెను\nనా యేసుడు నా పాపము నా శాపము\nతొలగించెను నన్ను కరుణించెను (2)\n\n1 సాతాను బంధాలలో జీవపు డంబాలలో\nపడనీయక దరి చేరనీయక \nతన కృపలో నిరతంబు నను నిల్పెను\n\n2 సత్యంబు జీవంబును ఈ బ్రతుకు సాఫల్యము\nనేర్పించెను నాకు చూపించెను\nవర్ణించగా లేను ఆ ప్రభువును\n\n3 కల్వరిగిరి పైనను ఆ సిల్వ మరణమును\nనాకోసమే ప్రభు శ్రమ పొందెను\nనా పాపమంతటిని క్షమియించెను\n\n4 ఘనమైన ఆ ప్రేమకు వెలలేని త్యాగంబుకు\nఏమిత్తును నేనేమిత్తును\nనను నేను ఆ ప్రభుకు సమర్పింతును"},{"n":217,"ei":"Yield not to temptation","ci":"One way God said to get to","ti":"ఆశ్చర్యమైన ప్రేమ –\nకల్వరిలోని ప్రేమ\n","es":"1.Yield not to temptation, for yielding is sin;\nEach victory will help you some other to win;\nFight manfully onward, dark passions subdue,\nLook ever to Jesus, He’ll carry you through.\n\nAsk the Saviour to help you,\nComfort, strengthen, and keep you;\nHe is willing to aid you,\nHe will carry you through.\n\n2.Shun evil companions, bad language disdain,\nGod’s Name hold in reverence, nor take it in vain;\nBe thoughtful and earnest, kind- hearted and true,\nLook ever to Jesus, He’ll carry you through.\n\n3.To Him that o’ercometh God giveth a crown,\nThrough faith we shall conquer,ough often cast down;\nHe, who is our Saviour, our strength will renew;\nLook ever to Jesus, He’ll carry you through.","ec":"One way God said to get to heaven,\nJesus is the only way;\nOne way to reach those pearly mansions,\nJesus is the only way.\nNo other way, No other way\nNo other way to God.\nOne way God said to get to heaven,\nJesus is the only way.","ts":"ఆశ్చర్యమైన ప్రేమ –కల్వరిలోని ప్రేమ\nమరణము కంటె - బలమైన ప్రేమది నన్ను జయించె నీ ప్రేమ\n\n1.పరమును వీడిన ప్రేమ, ధరలో పాపిని వెదకిన ప్రేమ\nనన్ను కరుణించీ, ఆదరించీ, సేదదీర్చే నిత్య జీవమిచ్చే\n\n2.పావన యేసుని ప్రేమ, సిలువలో పాపిని మోసిన ప్రేమ\nనాకై మరణించి, జీవమిచ్చీ, జయమిచ్చే తన మహిమ నిచ్చే\n\n3.నా స్థితి జూసిన ప్రేమ, నాపై జాలిని చూపిన ప్రేమ\nనాకై పరుగెత్తి కౌగలించీ ముద్దాడె కన్నీటిని తుడిచె\n\n4.శ్రమను సహించిన ప్రేమ, నాకై శాపము నోర్చిన ప్రేమ\nనను విడనాడనీ యెడబాయనీ ప్రేమదీ వాడబారదు"},{"n":218,"ei":"Abide with me","ci":"Only to be what He wants me","ti":"ప్రేమామృత ధారల చిందిన మన\n","es":"1.Abide with me, fast falls the eventide;\nThe darkness deepens: Lord, with me abide;\nWhen other helpers fail, and comforts flee,\nHelp of the helpless, oh, abide with me.\n\n2.Swift to its close ebbs out life’s little day;\nEarth’s joys grow dim, its glories pass away;\nChange and decay in all around I see;\nO Thou, who changest not, abide with me.\n\n3.I need Thy presence every passing hour,\nWhat but Thy grace can foil the  tempter’s  power?\nWho like Thyself my guide and stay be?\nThrough cloud and sunshine,Lord, abide with me.\n\n4.I fear no foe, with Thee at hand to bless,\nIlls have no weight, and tears no bitterness:\nWhere is death’s sting? there, grave, thy victory?\nI triumph still, if Thou abide with me.\n\n5.Reveal Thyself before my closing eyes,\nShine through the gloom and point me to the skies:\nHeaven’s morning breaks, and earth’s vain shadows flee:\nIn life, in death, O Lord, abide with me.","ec":"Only to be  what He wants me to be,\nEv’ry  moment of ev’ry day;\nYielded completely to Jesus alone,\nEv’ry step of this pilgrim way.\nJust to be clay in the potter’s hands,\nReady to do what His word commands.\n(Repeat lines 1 & 2)","ts":"ప్రేమామృత ధారల చిందిన మన\nయేసుకు సమమెవరు ఆ...ఆ..ఆ\nప్రేమయె తానై నిలచి ప్రేమవాక్కులనే బలికి\nప్రేమతో ప్రాణము బెట్టి ప్రేమ నగరికి చనియే \n\n1 నిశ్చలమైన ప్రేమజీవికి ఇలలో తావేది\nప్రేమ ద్రోహులే గాని ప్రియమున జేరరు వాని\nచేరిన చెలికాడగురా సమయమిదే పరుగిడరా \n\n2 ఎంత ఘోర పాపాత్ములనైనా ప్రేమించును రారా\nపాపభారముతో రారా పాదములపై బడరా\nపాపుల రక్షకుడేసు తప్పక నిన్ను రక్షించున్‌ \n\n3 ఇంత గొప్ప రక్షణను నిర్లక్ష్యము చేసెదవేల\nరక్షణ దినమిదియేరా తక్షణమే కనుగొనరా\nఇదియే దేవుని వరము ముదమారగ చేకొనుము "},{"n":219,"ei":"All the way my saviour","ci":"Open thou mine eyes","ti":"ప్రేమా యేసుని ప్రేమా  \nఅది ఎవ్వరు కొలువలేనిది\n","es":"1.All the way my Saviour leads me:\nWhat have I to ask beside?\nCan I doubt His tender mercy,\nWho through life has been my Guide?\nHeavenly peace, divinest comfort,\nHere by faith in Him to dwell!\nFor I know whate’er befall me,\nJesus doeth all things well.\n\n2.All the way my Savior leads me:\nCheers each winding path I tread\nGives me grace for every trial,\nFeeds me with the living bread.\nThough my weary steps may falter,\nAnd my soul athirst may be,\nGushing from the rock before me,\nLo! a spring of joy I see.\n\n3.All the way my Saviour leads me;\nOh, the fulness of His love!\nPerfect rest to me is promised\nIn my Father’s house above,\nWhen my spirit, clothed  immortal,\nWings its flight to realms of day,\nThis my song through endless ages\nJesus led me all the way.","ec":"Open Thou mIne eyes,\nThat I may behold\nWondrous,wondrous things\nOut of Thy law.","ts":"ప్రేమా యేసుని ప్రేమా అది ఎవ్వరు కొలువలేనిది\nనిజము దీనిని నమ్ము ఇది భువి నందించలేనిది\n\n1 తల్లిదండ్రుల ప్రేమ నీడవలె గతియించును\nకన్నబిడ్డల ప్రేమ కలలా కరిగిపోవును\n\nఎన్నడెన్నడు మారనిది నా యేసుని నిత్య ప్రేమ\nఎన్నడెన్నడు వీడనిది నా యేసుని దివ్య ప్రేమ\n\n2 భార్యభర్తల మధ్య వికసించిన ప్రేమ పుష్పము\nవాడిపోయి రాలును త్వరలో మోడులా మిగిలిపోవును\n\n3 బంధు మిత్రులయందు వెలుగుచున్న ప్రేమ దీపము\nనూనె ఉన్నంతకాలమే వెలుగు నిచ్చి ఆరిపోవును\n\n4 ధరలోని ప్రేమలన్నియు స్థిరముకావు తరిగిపోవును\nక్రీస్తు యేసు కల్వరి ప్రేమ కడవరకు ఆదరించును"},{"n":220,"ei":"Be thou my vision","ci":"Over and over Like a mighty","ti":"ప్రభు ప్రేమ తొలికేక\nహృదయములో ప్రతి ధ్వనియించె\n","es":"1.Be thou my vision. O Lord of my heart\nNought ba all else to me, save that thou art;\nThou my best throught, by day or by night\nWaking or sleeping, thy presencemy light.\n\n2.Be thou my wisdom, and thou my true word\nI ever with thee and thou with me, Lord;\nThou my great Father, I thy true son\nThou in me dwelling, and I with thee one.\n\n3.Riches I heed not, nor man's empty praise\nThou mine inheritance, now and always;\nThou and thou only, first in my heart\nHigh King of heaven, mytreasure thou art.\n\n4.High King of heaven, my victory won,\nMay i reach heaven's joys, O bright heav'n's Sun!\nHeart of my own heart, whatever befall,\nStill be my vision, O Rulerof all.\n","ec":"Over and over,\nLike a mighty sea ,\nComes the love of Jesus,\nRolling over me.\nOver the sea, over the sea,\nJesus, Saviour, pilot me;\nOver the sea, over the sea,\nOver the Jasper sea.","ts":"ప్రభు ప్రేమ తొలికేక హృదయములో ప్రతి ధ్వనియించె\nపాపక్షమ-యేసునిలో శరణునొసంగుచు కనిపించె\n\n1.పాపవికారము పొడసూప జీవిత విలువలు మరుగాయె\nపతితనుగా లోకములో బ్రతుకుటయే నా గతియాయె\nపలువురిలో కనబడలేక దాహముతో నే నొంటరిగా\nబావికని పయనింప నాథుని దర్శనమెదురాయె\nపావనుడు దాహముతో పానము నిమ్మని ననుగోరె\n\n2.జాతిని చూడని నేత్రముతో పాపము శోకని హృదయముతో\nజాలిని చాటించుచునే తాకను నా మది వేదనతో \nజాప్యము చేయక తెమ్మనియె దాచుకొనిన నా పాపమును\nజడియుచునే తెలిపితిని ప్రభు వెరిగిన నా నిజస్థితిని\nజయమొందె నా తనువు సరిగనుడితివని ప్రభు తెలుప \n\n3.దేహమునే నా సర్వముగా భావించుచు మది పూజింప\nదినదినము జీవితము చావుగ మారిన కాలముతో\nదేవునిగా నా బంధువుగా మరణ బంధములు ఛేదించి\nదరిచేర్చి దీవించి నూతన జన్మ ప్రసాదించె\nదయ్యాల కుహరమును స్తుతిమందిరముగ రూపించె \t\n\n4.పాపము దాగొను నా బావి లోతును ఎరిగిన వారెవరు\nపోరాట వాటికయౌ నా  బ్రతుకును జూచినదెవరు\nపాపికి పాపమునకును భేదము జూపిన వారెవరు\nపాపిని కాపాడుటకై సిలువ ధరించిన వారెవరు\nపరదైసు ద్వారములు ప్రేమతో-తెరచెను నా కొరకై \n\n5.ఘటముతో వెడలితి నొంటరిగా పితరులు త్రావిన జలములకై\nకనబడెను బావికడ రక్షణయూటల ప్రభుయేసు\nకుండను వీడి పరుగిడితి బావిని చేకొని హృదయములో\nఘనమైన శుభవార్త ఆతృతతో ప్రజలకు తెలుపా\nగ్రామ ప్రజా కనుగొనిరి విశ్వ విమోచకుడగు యేసున్‌ "},{"n":221,"ei":"Down in the valley","ci":"Perfect in purity peerless","ti":"రండి సువార్త సునాదముతో\n","es":"1.Down in the valley with my Saviour I would go, \nWhere the flowers are blooming and the sweet waters flow;\nEverywhere He leads me I would follow, follow on:\nWalking in His footsteps till the crown be won.\n\nFollow! follow! I would follow Jesus;\nAnywhere, everywhere, I would follow on!\nFollow! follow! I would follow Jesus!\nEverywhere He leads me I would follow on!\n\n2.Down in the valley with my Saviour I would go,\nWhere the storms are sweeping and the dark waters flow;\nWith His hand to lead me I will never, never fear;\nDanger cannot harm me if my Lord is near.\n\n3.Down in the valley or upon the mountain steep, \nClose beside my Saviour would my soul ever keep; \nHe will lead me safely in the path that He has trod, \nUp to where they gather on the hills of God.","ec":"1.Perfect in purity\nPeerless in Thy love\nBoundless in compassion\nMy Jesus, how precious Thou art!\n\n2.Thro’ all time and Ages\nThere is none like Thee,\nMy fainting soul to save\nTo give me peace never ceasing.\n\n3.Jesus Lord most precious\nAt Thy Feet I fall\nFashion me to be\nPerfect and pure, like unto Thee.","ts":"రండి సువార్త సునాదముతో రంజిలు సిలువ నినాదముతో\nతంబుర సితార నాదముతో ప్రభు యేసు దయానిధి సన్నిధికి\n\n1 యేసే మానవ జాతి వికాసం యేసే మానవనీతి విలాసం\nయేసే పతిత పావన నామం భాసుర క్రైస్తవ శుభనామం\n \n2 యేసే దేవుని ప్రేమ స్వరూపం యేసే సర్వేశ్వర ప్రతిరూపం\nయేసే ప్రజాపతి పరమేశం  ఆశ్రిత జనముల సుఖవాసం\t\n\n3 యేసే సిలువను మోసిన దైవం యేసే ఆత్మల శాశ్వత జీవం\nయేసే క్షమాపణ అధికారం దాసుల ప్రార్థన సహకారం\n\n4 యేసే సంఘములో మన కాంతి యేసే హృదయములో ఘనశాంతి\nయేసే కుటుంబ జీవన జ్యోతి పసి పాపల దీవెన మూర్తి\n\n5 యేసే జీవన ముక్తికి మార్గం యేసే భక్తుల భూతల స్వర్గం\nయేసే ప్రపంచ శాంతికి సూత్రం వాసిగ నమ్మిన జనస్తోత్రం"},{"n":222,"ei":"Guide me, O thou","ci":"Praise and glory wisdom","ti":"ఓ పాపి ప్రభు చెంతకు రా\nనీ ప్రాపు యేసు ప్రభువేగా\n","es":"1.Guide me, O Thou great Jehovah,\nPilgrim through this barren land;\nI am weak, but Thou art mighty;\nHold me with Thy powerful hand:\nBread of heaven, Bread of heaven,\nFeed me till I want no more.\n\n2.Open now the crystal fountain,\nWhence the healing waters flow;\nLet the fiery, cloudy pillar\nLead me all my journey through:\nStrong deliverer, Strong deliverer,\nBe Thou still my strength and shield.\n\n3.When I tread the verge of Jordan,\nBid my anxious fears subside;\nBear me through the swelling current,\nLand me safe on Canaan’s side:\nSongs of praises, Songs of praises,\nI will ever give to Thee.","ec":"Praise and glory\nWisdom and thanks\nHonour, power and strength\nBe to our God forever and ever.\nAmen.","ts":"ఓ పాపి ప్రభు చెంతకు రా\nనీ ప్రాపు యేసు ప్రభువేగా\n\n1 పాపుల వెదకుటకై వచ్చెన్‌\nపాపుల రక్షింపను వచ్చెన్‌\nపాపంబులకు విలపించగదే\n\n2 సిలువయె మనమరిగెడుబాట\nకలుషంబులు కడిగెడు చోటు\nవిలువైన ప్రేమ గలదచట\n \n3 భారము తొలగెడి యా చోటు\nనేరము మన్నించెడు చోటు\nపరిపూర్ణ విడుదల-గనుమచట\n\n4 కని విని యరుగుము యా చోటున్‌\nమనమున దలపోయుము వేగ\nఎనలేని ప్రేమ గలదచట\n\n5 తన ప్రాణము మనకై బెట్టెన్‌\nతన జీవము మనకై నిచ్చెన్‌\nమన ప్రాపు యేసు ప్రభువేగా\n\n6 తన రక్షణ మనకై దెచ్చెన్‌\nమన శిక్షను తా భరియించెన్‌\nమన ప్రాపు యేసు ప్రభువేగా"},{"n":223,"ei":"He leadeth me! Oh","ci":"Praise him on the trumpet","ti":"రమ్మనుచున్నాడేసు రాజు\nరండి సర్వ జనులారా\n","es":"1.He leadeth me! Oh blessed thought!\nOh, words with heavenly comfort fraught!\nWhate’er I do, where’er I be,\nStill ‘tis God’s hand that leadeth me!\n\nHe leadeth me! He leadeth me!\nBy His own hand He leadeth me!\nHis faithful follower I would be;\nFor by His hand He leadeth me!\n\n2.Sometimes ‘mid scenes of deepest gloom,\nSometimes where Eden’s bowers bloom,\nBy waters still, o’er troubled sea,\nStill ‘tis His hand that leadeth me!\n\n3.Lord, I would place my hand in Thine, \nNor ever murmur nor repine;\nContent, whatever lot I see,\nSince ‘tis my God that leadeth me.\n\n4.And when my task on earth is done,\nWhen by Thy grace, the victory’s won,\nE’en death’s cold wave I will not flee;\nSince Thou through Jordan leadest me.","ec":"Praise Him on the trumpet, the psaltery and harp,\nPraise Him on the timbrel and the dance,\nPraise Him with stringed instruments too.\nPraise him on the loud cymbals,\nPraise him on the loud cymbals,\nLet everything that has breath praise the Lord.\nHallelujah, praise the Lord,\nHallelujah, praise the Lord,\nLet everything that has breath praise the Lord!\nHallelujah, praise the Lord,\nHallelujah, praise the Lord,\nLet everything that has breath praise the Lord!","ts":"రమ్మనుచున్నాడేసు రాజు\nరండి సర్వ జనులారా\n\n1 ఇల్లు వాకిలి లేని వారలు ఇహాన నమ్మదగని వారలు\nతన రాజ్యము మీకిచ్చును యేసు   ||ర||\n\n2 కరవుచే కృశించుచున్న మరణించుచున్న ప్రజలారా\nఆకలి దప్పులు తీర్చును మీకు    ||ర||\n\n3 ముండ్ల మకుటము ప్రక్క గాయము పాద హస్తములలో గాయములు\nపొందిన ప్రభువే పిల్చెను మిమ్ము  ||ర||\n\n4 రయమున ప్రియులారా కూడి రండి పరీక్ష చేయండి\nభరియించును మీ భారములన్ని  ||ర||"},{"n":224,"ei":"Holy Spirit. Faithful","ci":"Purify my heart let me be","ti":"జాలమేలా జేసె దరూ\nమేలుకొని ప్రభు జేరన్‌\nప్రాలుమాలిన జీవమేల? \n","es":"1.Holy Spirit, faithful Guide,\nEver near the Christian’s side,\nGently lead us by the hand,\nPilgrims  in a desert land.\nWeary souls for e’er rejoice\nWhile they hear that sweetest voice,\nWhisper softly, “Wand’rer, come,\nFollow Me, I’ll guide thee home.”\n\n2.Ever present, truest Friend, \nEver near Thine aid to lend,\nLeave us not to doubt and fear, \nGroping on in darkness drear;\nWhen the storms are raging sore,\nHearts grow faint and hopes give o’er,\nWhisper softly, “Wand’rer, come,\nFollow Me, I’ll guide thee home.”\n\n3.When our days toil shall cease,\nWaiting still for sweet release,\nNothing left but heav’n and prayer,\nWond’ring if our names are there;\nWading deep the dismal flood,\nPleading naught but Jesus’ blood,\nWhisper softly, “Wand’rer, come,\nFollow Me, I’ll guide thee home.”","ec":"1.Purify my heart\nLet me be as gold and precious silver\nPurify my heart\nLet me be as gold, pure gold\n\nRefiner’s fire, my hearts one desire\nIs to be holy, set apart for You Lord\nI choose to be holy, set apart for You my Master\nReady to do Your will.\n\n2.Purify my heart\nCleanse me from within\nAnd make me holy\nPurify my heart\nCleanse me from my sin, deep within.","ts":"జాలమేలా జేసె దరూ\nమేలుకొని ప్రభు జేరన్‌\nప్రాలుమాలిన జీవమేల?\nకాలయాపనదేలా?\nమేలుకొనుడీ మీ మనములన్‌\nజాలిగల పిలుపున్‌ మీరల్‌ విని\n\n1 ఎంత కాలము చింతలలో\nమునిగి యుండెదరేలా\nచెంతజేర రండి నేడే\nచింతలన్‌ దీర్చున్‌ ప్రభు వింతగ \n\n2 లోక పుటాశలు జుట్టి మనలన్‌\nలోక మునకే జేర్చున్‌\nలోకరక్షకుడేసే మనలన్‌\nప్రాకటము బ్రోచున్‌ వాస్తవమిదె\n\n3 సందియంబులు గలిగి నీవు\nగుంది యుండెదవేలా\nవందితుండౌ యేసు ప్రభు\nపాదములను-బ్రతిమాలుము\n\n4 కఠిన హృదయము కరుగదేలా?\nకఠిన హృదయమదేలా\nకుటిల వర్తనమంత వీడుము\nపఠన జేయుచు దైవగ్రంథము\n\n5 మోసబోకుడి దాసజనమా\nనాశనమె మన గతియౌ\nనీ సురక్షకుడేసు ప్రభువే\nయాశ్రయమె సుమ్మాయని నమ్ముము\n\n6 పాప దాస్యమందు జిక్కి\nశాపగ్రస్తుడవౌదు\nపాపజీవితము మరణమౌగా\nకృపయే యేసుని దానము జీవము\n\n7 మారుమనసు నొంద రండి\nభారములు కడద్రోసి\nనేరమెంచని యేసు కృపను\nకోరుకొని జీవింపగ రండి\n\n8 కోరుకొనుడి రక్షణంబును\nకోరుకొనుడి నేడే\nకోరువారికి జీవజలముల్‌\nకోరికలు దీర నిచ్చును ప్రభు "},{"n":225,"ei":"Oh, for a closer walk","ci":"Put your trust in the love of","ti":"ప్రజలార వేగమె రారె\nనిజ దైవమును కనుగొనరె\n","es":"1.Oh, for a closer walk with God,\nA calm and heavenly frame\nA light to shine upon the road \nThat leads me to the Lamb!\n\n2.Where is the blessedness I knew\nWhen first I saw the Lord?\nWhere is the soul-refreshing view\nOf Jesus and His Word?\n\n3.What peaceful hours I once enjoyed!\nHow sweet their memory still!\nBut they have left an aching void\nThe world can never fill.\n\n4.The dearest idol I have known,\nWhate’er that idol be, \nHelp me to tear it from Thy throne, \nAnd worship only Thee.\n\n5.So shall my walk be close with God,\nCalm and serene my frame:\nSo purer light shall mark the road\nThat leads me to the Lamb.","ec":"Put your trust in the love of Christ and sing, sing, sing,\nPut your trust in the love of Christ and sing, sing, sing,\nTurn your old frown upside down and sing, sing, sing,\nPut your hand in the hand of Christ and you’ll sing, sing, sing.","ts":"ప్రజలార వేగమె రారె నిజ దైవమును కనుగొనరె\nప్రతివాడు మోక్షము జేర ప్రభు యేసు కథ విని పోరె \n\n1 పాపాత్ము లనబడు వారి భారంబు దీయను గోరి\nప్రభు యేసు చూపిన దారి పరమందు సుఖమిడు దారి\n\n2 ఏ జాతి వారల నైన ఏ దేశ వాసుల నైన\nఏమైన భేదము లేక యేసయ్య బ్రోచును గాన \n\n3 పాపాత్ములే తన సుతులు ప్రభు యేసుకు స్నేహితులు\nనీ పాపమెల్లను పోవున్‌ నీకింక మోక్షము కలుగున్‌  \n\n4 యేసయ్య గాకను వేరే యెవరైన లేరిక రారె\nదోషంబు లెల్లను బాపి ఆశీర్వదించును గాన   \n\n5 ప్రయాసపడి భారమును మోసెడి ఓ ప్రజలారా\nప్రభు యేసు క్రీస్తే మీకు ప్రశాంతి నిచ్చును రండి  "},{"n":226,"ei":"Out in the highways","ci":"Rejoice evermore, for this is","ti":"హృదయమనెడు తలుపు నొద్ద","es":"1.Out in the highways and byways of  life, \nMany are weary and sad; \nCarry the sunshine where darkness is rife, \nMaking the sorrowing glad.\n\nMake me a blessing, make me a blessing \nOut of my life may Jesus shine; \nMake me a blessing, O Saviour, I pray, \nMake me a blessing to someone today.\n\n2.Tell the sweet story of Christ and His love, \nTell of His pow’r to forgive; \nOthers will trust Him if only you prove \nTrue, every moment you live.\n\n3.Give as ‘twas given to you in your need, \nLove as the Master loved you; \nBe to the helpless a helper indeed, \nUnto your mission be true.","ec":"Rejoice evermore, for this is the will of God (3)\nIn Christ Jesus, concerning you.\nPray without ceasing, for this is the will of God (3)\nIn Christ Jesus, concerning you.\nIn ev’rything give thanks, for this is the will of God (3)\nIn Christ Jesus, concerning you.","ts":"హృదయమనెడు తలుపు నొద్ద యేసునాథుండు\nనిలచి సదయుడగుచు దట్టుచుండు\nసకల విధములను   ||హృదయ||\n\n1.పరుని బోలి - నిలుచున్నాడు పరికించి చూడ - నతడు \nపరుడు గాడు - రక్షకుండు ప్రాణ స్నేహితుడు   ||హృదయ||\n\n2.కరుణా శీలుండతడు గాన గాచియున్నాడు\nయేసు కరుణ నెరిగి గారవింప గరము న్యాయంబు   ||హృదయ||\n\n3.ఎంతసేపు నిలువ బెట్టి  యేడ్పింతురతని\nనాత-డెంతో దయచే బిలుచుచున్నాడిప్పుుడు మిమ్ములను   ||హృదయ||\t\n\n4.అతడు మిత్రుడతడు మిత్రు-డఖిల పాపులకు\nమీర లతని పిలుపు వింటి రేని యతడు-ప్రియుడగును   ||హృదయ||\n\n5.జాలిచేత దన హస్తముల జాపియున్నాడు\nమిమ్ము-నాలింగనము సేయగోరి యనిశము కనిపెట్టు   ||హృదయ||\n\n6.సాటిలేని దయగల వాడు సర్వేశు సుతుడు\nతన-మాట వినెడు వారల నెల్ల-సూటిగ రక్షించు   ||హృదయ||\n\n7.చేర్చుకొనుడి మీ హృదయమున శ్రీ యేసు నాధు\nనతడు - చేర్చు కొనుచు మీ కిచ్చును-చిరజీవము గృపను   ||హృదయ||\n\n8.బ్రతుకు  శాశ్వతంబు కాదు పరికించి చూడ\nగాన-బ్రతికియుండు కాలముననే ప్రభుని గొలువండి   ||హృదయ||"},{"n":227,"ei":"Saviour, like a shepherd","ci":"Rejoice for the steps","ti":"పాపిగానే జీవింతువా\nపాపమునందే మరణింతువా ప్రియుడా \n","es":"1.Saviour, like a shepherd lead us,\nMuch we need Thy tender care;\nIn Thy pleasant pastures feed us,\nFor our use Thy fold prepare:\nBlessed Jesus,\nThou hast bought us, Thine we are.\n\n2.  We are Thine, do thou befriend us;\nBe the guardian of our way:\nKeep Thy flock, from sin defend us,\nSeek us when we go astray:\nBlessed Jesus,\nHear Thy children when they pray.\n\n3.Thou hast promised to receive us,\nPoor and sinful though we be;\nThou hast mercy to relieve us,\nGrace to cleanse, and power to free:\nBlessed Jesus,\nLet us early turn to thee.\n\n4.Early let us seek Thy favour,\nEarly let us do Thy will;\nBlessed Lord and only Saviour,\nWith Thyself our bosoms fill:\nBlessed Jesus,\nThou hast loved us, love us still.","ec":"Rejoice for the steps\nOf the righteous man\nThey are ordered by God. (2)\nIn the time of trouble\nGod will uphold you\nGod will preserve you\nGod will sustain you\nIn the time of trouble God will lift you up\nSo rejoice your steps are ordered by God.","ts":"పాపిగానే జీవింతువా\nపాపమునందే మరణింతువా ప్రియుడా\nప్రభుని ప్రేమను గుర్తింపవా\n\n1 ఆశలు నిండిన లోకమునందు\nఆశలు ఎన్నో వుండునుగా\nఅవి-నాశనమునకే నడుపునుగా\nఆశలు త్రెంచి-ప్రేమను పెంచి\nప్రభుని పథమున నడువుమా... ప్రియుడా\n\n2 విన్న బోధ యిది-నాకు కాదుయని\nనిర్లక్ష్యముగా వెడలెదవా!\nనీవు మారు మనస్సు పొందవా\nరేపు యనెడి రోజున యందు\nమరణము సంధించగా-మోక్ష\nమార్గము ఇక లేదుగా... ప్రియుడా\n\n3 పాపము వలన శాపము కల్గెను\nశాపము వలన మరణము కల్గెను\nమరణపు ముల్లును విరచిన యేసు\nపాపివైన నీ కోసరమే\nపాపినైన నా కోసరమే\nప్రభువు  సిలువ నొందెనుగా... ప్రియుడా\n\n4 లోకము నీది కాదని తెలుసు\nతెలిసిన నీవు తెలియకుందువా\nవిడుదల లేని-జీవితమునకు వేదన\nకలదోయీ నరక\nవేదన కలదోయీ ...ప్రియుడా\n\n5 నీదు జీవితము స్థిరము కాదుయని\nయాత్రికుడవని మరచిపోతివా\nనీదు గమ్యము ఏదో తెలుసా\nతెలియకపోయినచో నీకు\nనరకము తప్పదుగా... ప్రియుడా"},{"n":228,"ei":"Tenderly guide us","ci":"Rejoice in the Lord always","ti":"ఇదియే సమయంబు రండి యేసుని చేరండి","es":"1.Tenderly guide us, O Shepherd of love, \nTo the green pastures and waters above; \nGuarding us ever by night and by day, \nNever from Thee would we stray.\n\nNever!...Never!... \nNever! oh, never, for Thou art the Way \nNever...Never!... \nNever from Thee would we stray!\n\n2.What though the heavens with clouds be o’ercast \nFearful the tempest, and bitter the blast? \nStill with the light of Thy Word on the way, \nNever from Thee would we stray.\n\n3.Over our weakness Thy strength has been cast; \nKeep us in meekness, Thine own till the last: \nThen safely folded, with joy we shall say \nNever from Thee would we stray.","ec":"Rejoice in the Lord always, and again I say rejoice,\nRejoice in the Lord always, and again I say rejoice,\nRejoice, rejoice and again I say rejoice,\nRejoice, rejoice and again I say rejoice.","ts":"ఇదియే సమయంబు రండి యేసుని చేరండి\nఇక సమయము లేదండీరండి రక్షణ పొందండి\n\n1.పాపుల నందరిని తన దాపున జేర్చుటకై \nప్రాణము దానముగా తన ప్రాణము నిచ్చెనుగా\nమరణపు ముల్లును విరచి విజయము నిచ్చెనుగా   ||ఇదియే||\n\n2.రాజులకు రాజైన యేసు రానై యున్నాడు\nగురుతులు జరిగెనుగా మీరు సరిగా చూడండి\nతరుణముండగానే మీరు తయ్యారవ్వండి   ||ఇదియే||\n\n3.బుద్ధిలేని కన్యకల వలె మొద్దులుగా నుంటే\nసిద్దెలతో నూనె మీరు సిద్ధపడక పోతే\nద్వారము మూయగనే మీకు దారి దొరకదేమో   ||ఇదియే||\n\n4.వెలుపల నుంటేను మీరు వేదన నొందెదరు\nతలుపు తట్టినను మీకు తెరువడు సుమ్మండి\nమిమ్మును ఎరుగనూ మీరు ఎవరో పొమ్మనును   ||ఇదియే||\n\n5.నమ్మిన వారికి క్రీస్తు నెమ్మది నిచ్చునుగా\nనమ్మని వారికి నిత్య నరకమె సుమ్మండి\nనిర్లక్ష్యము చేయకను రండి రక్షణ నొందండి   ||ఇదియే||\n\n6.సందియ పడకండి మీరు సాకులు చెప్పకను\nతరుణముండగానే మీరు త్వరపడి రారండి\nమరణమెప్పుడొచ్చున్‌ మనకు తెలియదు సుమ్మండి   ||ఇదియే||\n\n7.జాలము చేయకను మీరు హేళన చేయకను\nకులము స్థలమనుచు మీరు కాలము గడుపకను\nహల్లెలూయ పాటలు బాడ నెల్లరును రండి   ||ఇదియే||"},{"n":229,"ei":"Thy way, not mine","ci":"Righteousness, peace, joy in the","ti":"రండీ రండీ యేసుని యొద్దకు\nరమ్మనుచున్నాడు\n","es":"1.Thy way, not mine, O Lord,\nHowever dark it be;\nLead me by Thine own hand,\nChoose Thou the path for me.\n\n2.Smooth let it be or rough,\nIt will be still the best:\nWinding or straight, it leads\nRight onward to Thy rest.\n\n3.I dare not choose my lot; \nI would not if I might; \nChoose Thou for me, my God, \nSo shall I walk aright.\n\n4.Take Thou my cup, and it\nWith joy or sorrow fill, \nAs best to Thee may seem:\nChoose Thou my good or ill.\n\n5.Choose Thou for me my friends,\nMy sickness or my health:\nChoose Thou my cares for me,\nMy poverty or wealth.\n\n6.Not mine, not mine the choice,\nIn things or great or small:\nBe Thou my Guide, my Strength, \nMy Wisdom and my All.","ec":"1.Righteousness, peace, joy in the Holy Ghost; (2)\nThat’s the Kingdom of God (Repeat)\nDon’t you want to be a part of the kingdom, (3)\nCome on, everybody!     (Repeat)\n\n2.There’s love in the kingdom,\nSo much love in the kingdom;\nThere’s love in the kingdom,\nCome on everybody.\n\n3.There’s peace in the kingdom,\nSo much peace in the kingdom;\nThere’s peace in the kingdom,\nCome on everybody.\n\n4.There’s joy in the kingdom,\nSo much joy in the kingdom;\nThere’s joy in the kingdom,\nCome on everybody.\n\n5.I’m an heir to the kingdom,\nI’m heir to the kingdom;\nI’m an heir to the kingdom,\nCome on everybody.\nYeah!","ts":"రండీ రండీ యేసుని యొద్దకు రమ్మనుచున్నాడు\nప్రయాసపడి భారము మోయువారలు - ప్రభుని చెంతకు పరుగిడి వేగమె\n\n1. యేసుని పిలుపు వినియు నింక యోచింపరేల?\nఅవనిలో అగచాట్ల  పాలైన అబ్బదు శాంతి ఆత్మకు నిలలో\n\n2. కరవు మరణము రణముల జూచి కలుగదు మారుమనసు\nప్రవచనములు సంపూర్ణములాయెను యూదులు తిరిగి వచ్చియున్నారు\n\n3.ప్రభు యేసు నీ కొరకై తనదు ప్రాణము నిచ్చెగదా\n సిలువను రక్తము చిందించియును బలియాయెను యా ఘనుడు మనకై\n\n4 యేసుని నామము నందే పరమ నివాసము దొరుకును\nముక్తిని పాప విమోచనమును శక్తిమంతుడు యేసేయిచ్చును\n\n5. నేనే మార్గము నేనే సత్యము నేనే జీవమును\nనేనే గాకింకెవ్వరు లేరని యెంచి చెప్పిన యేసుని యొద్దకు\n\n6. హల్లెలూయా హల్లెలూయా  హల్లెలూయామెన్‌\nహల్లెలూయా హల్లెలూయా  హల్లెలూయా హల్లెలూయా"},{"n":230,"ei":"I can hear my Savior","ci":"Salvation belongs to our God","ti":"తలుపులు తీయండి యేసుకు - తలుపులు తీయండి\n","es":"1.I can hear my Saviour calling,\nI can hear my Saviour calling,\nI can hear my Saviour calling,\n“Take thy cross and follow, follow Me.”\n\nWhere He leads me I will follow,\nWhere He leads me I will follow,\nWhere He leads me I will follow,\nI’ll go with Him, with Him all the way.\n\n2.I’ll go with Him through the garden,\nI’ll go with Him through the garden,\nI’ll go with Him through the garden,\nI’ll go with Him, with Him all the way.\n\n3.I’ll go with Him through the judgement,\nI’ll go with Him through the judgement,\nI’ll go with Him through the judgement,\nI’ll go with Him, with Him all the way.\n\n4.He will give me grace and glory,\nHe will give me grace and glory,\nHe will give me grace and glory,\nAnd go with me, with me all the way.","ec":"1.Salvation belongs to our God\nWho sits upon the Throne\nAnd unto the Lamb.\n\nPraise and glory, wisdom and thanks.\nHonour and power and strength\nBe to our God, forever and ever (3)\nAmen.\n\n2.And we the redeemed shall be strong\nIn purpose and unity, declaring aloud.","ts":"తలుపులు తీయండి యేసుకు - తలుపులు తీయండి\nహృదయమనే కోవెల తలుపులు -యేసుకు తీయండి\nప్రభు యేసుకు తీయండి\n\n1. దేహము దేవుని ఆలయము\nఅది దేవుడు మలచిన మందిరము\nదేహమనే ఆలయమందు\nదేవుని నిలుపండి\nయేసు దేవుని నిలుపండి\n\n2.గుమ్మముల్‌ తెరవండి\nఆలయ గుమ్మముల్‌ తెరవండి\nగుమ్మముల్‌ తెరచి గంభీరముగా\nగీతముల్‌ పాడండి\nస్తుతి గీతముల్‌ పాడండి\n\n3. మోకరించండి-అందరు మోకరించండి\nమోకరించి మరియా సుతునికి\nప్రార్థన చెయ్యండి\nప్రభువా అని వేడండి"},{"n":231,"ei":"Is your life a channel","ci":"Scatter the last remain of","ti":"యేది నీ యర్పణ ఏది సమర్పణ\n","es":"1.Is your life a channel of blessing?\nIs the love of God flowing through you?\nAre you telling the lost of the Saviour?\nAre you ready his service to do?\n\nMake me a channel of blessing today,\nMake me a channel of blessing, I pray;\nMy life possessing, my service blessing,\nMake me a channel of blessing today.\n\n2.Is your life a channel of blessing?\nAre you burdened for those that are lost?\nHave you urged upon those who are straying\nThe Saviour who died on the cross?\n\n3.Is your life a channel of blessing?\nIs it daily telling for Him?\nHave you spoken the word of salvation\nTo those who are dying in sin?\n\n4.We cannot be channels of blessing\nIf our lives are not free from known sin;\nWe will barriers be and a hindrance \nTo those we are trying to win.","ec":"Scatter the last remains of sin,\nAnd seal me Thine abode;\nO make me glorious all within\nA temple built by God!","ts":"యేది నీ యర్పణ ఏది సమర్పణ\nఏది హృదయ మేది ఏది నీ కానుక ఏది నీ యీవి\nఏది కృతజ్ఞత ఏది నీభక్తి ఏది వినయమేది\n\n1. ఇమ్ము నీ హృదయము కానుకగా నేడే - రమ్ము రక్షణ వస్త్రము ధరియించుము\nకుమ్మరించును విమలాత్మ వరమ్మును నమ్మి ప్రార్థించు నేడే\n\n2.పాపుల కొరకై ప్రాణము బెట్టితి\nశాపము బాపి నీకు జీవము నిచ్చితి\n\n3.చింతలు దీర్చితి భ్రాంతిని మార్చితి\nచెంతను జేర్చి నీ శాంతిని గూర్చితి\n\n4.భావము నందున భక్తిని గూర్చితి\nజీవ జలంబుల ద్రావుటకిచ్చితి\n\n5.రక్తము గార్చి విముక్తుల జేసితి\nరక్షణ పాపికి దెచ్చి నే నిచ్చితి\n\n6.దీన దయాపరుడా నీకేమిత్తును - దీనుల రక్షక నేనేమి దెత్తును\nగైకొనుమా నా యావజ్జీవము -గొనుమిదె కానుకగా"},{"n":232,"ei":"Nothing between, Lord","ci":"Search me, O God","ti":"నీ ధనము-నీ ఘనము-ప్రభు యేసుదే \n","es":"1.Nothing between, Lord, \nNothing between;\nLet me Thy glory see, \nDraw my soul close to Thee; \nThen speak in love to me\nNothing between.\n\n2.Nothing between, Lord, \nNothing between;\nLet not earth’s din and noise \nStifle Thy still small voice;\nIn it let me rejoice\nNothing between.\n\n3.Nothing between, Lord, \nNothing between;\nUnbelief disappear, \nVanish each doubt and fear, \nFading when Thou art near\nNothing between.\n\n4.Nothing between, Lord, \nNothing between;\nTill Thine eternal light, \nRising on earth’s dark night, \nBursts on my open sight\nNothing between.","ec":"Search me, O God,\nAnd know my heart today,;\nTry me, O Saviour,\nKnow my thoughts, I pray ---\nSee if there be ---\nSome wicked way in me ---\nCleanse me from every sin and set me free.\nLord, take my life ---\nAnd make it wholly Thine;\nFill my poor heart with\nThy great love divine:\nTake all my will,\nMy passion and my pride; ---\nI now surrender: Lord, in me abide.","ts":"నీ ధనము-నీ ఘనము-ప్రభు యేసుదే\nనీ దశమభాగము నీయ-వెనుదీతువా\n\n1. ధరలోన ధనధాన్యముల నీయగా కరుణించి కాపాడి రక్షింపగా\nపరలోక నాథుండు నీకీయగా - మరి యేసు కొరకీయ వెనుదీతువా\n\n2. పాడిపంటలు ప్రభువు నీకీయగా కూడు గుడ్డలు నీకు దయచేయగా\nవేడంగ ప్రభు యేసు నామంబును గడువేల ప్రభుకీయ నో క్రైస్తవా\n\n3.వెలుగు నీడలు గాలి వర్షంబులు కలిగించె ప్రభు నీకు ఉచితంబుగా\nవెలిగించ ధరపైని ప్రభు నామము కలిమి కొలది ప్రభునకర్పించవా\n\n4. కలిగించె సకలంబు సమృద్ధిగా తొలగించె పలు బాధ భరితంబులు\nబలియాయె నీ పాపముల కేసువే చెలువంగ ప్రభుకీయ చింతింతువా"},{"n":233,"ei":"Pass me not","ci":"Seek ye first the Kingdom of","ti":"జగతి కేతెంచె రక్షణ కర్త\n","es":"1.Pass me not, O gracious Saviour,\nHear my humble cry;\nWhile on others Thou art calling,\nDo not pass me by.\n\nSaviour, Saviour,Hear my humble cry;\nWhile on others Thou art calling,\nDo not pass me by.\n\n2.Let me at the throne of mercy\nFind a sweet relief;\nKneeling there in deep contrition,\nHelp my unbelief.\n\n3.Trusting only in Thy merit,\nWould I seek Thy face;\nHeal my wounded, broken spirit,\nSave me by Thy grace.\n\n4.Thou, the spring of all my comfort,\nMore than life to me;\nWhom have I on earth beside Thee?\nWhom in heaven but Thee?","ec":"1.Seek ye first the Kingdom of God, And His righteousness,\nAnd all these things shall be added unto you\nHallelu, Hallelujah.\n\nHallelujah, Hallelujah, Hallelujah\nHallelu, Hallelujah.\n\n2.Men shall not live by bread alone, But by every word\nThat proceeds from the mouth of God\nHallelu, Hallelujah.\n\n3.Ask, and it shall be given unto you, Seek and you shall find;\nKnock and it shall be opened unto you\nHallelu, Hallelujah.","ts":"జగతి కేతెంచె రక్షణ కర్త\nపాపుల మొర వినెను యేసు\n\n1 కృంగిన వారిని నింగికి యెత్తి \nపాపము శాపము ఆపదలన్ని-బాపెను యేసు\nఆ...ఆ... బాపెను యేసు \n\n2 పాపపు పాత్రను – పానము జేసి\nమరణపు ముల్లును విరచి జయించి\nతెరచె మోక్షద్వారమున్‌ ఆ...ఆ...\n\n3 లెండి రండీపాడుచు వేగ\nచాటెద మెల్లెడ కోట్ల ప్రజలకు\nప్రేమమయు డేసున్‌ ఆ...ఆ...\t\n\n"},{"n":234,"ei":"Saviour! thy dying love","ci":"Silver and gold have I none","ti":"యేసు క్రీస్తు దొరికెనేని\nయేమి కొదువింకేమి భయము\n","es":"1.Savior, thy dying love\nThou gavest me;\nNor should I aught withhold, \nDear Lord, from thee.\nIn love my soul would bow,\nMy heart fulfill its vow,\nSome offering bring thee now,\nSomething for thee.\n\n2.Over the blest mercy seat,\nPleading for me,\nMy feeble faith looks up,\nJesus, to thee.\nHelp me the cross to bear, \nThy wondrous love declare,\nSome song to raise or prayer,\nSomething for thee.\n\n3.Give me a faithful heart,\nLikeness to thee,\nThat each departing day\nHenceforth may see\nSome work of love begun,\nSome deed of kindness done,\nSome wanderer sought and won,\nSomething for thee.\n\n4.All that I am and have,\nThy gifts so free,\nIn joy, in grief, through life,\nDear Lord, for thee!\nAnd when thy face I see, \nMy ransomed soul shall be \nThrough all eternity \nSomething for thee.","ec":"’Silver and gold have I none;\nBut such as I have give I thee:\nIn the Name of Jesus Christ\nOf Nazareth rise up and walk.’\n(He went) walking and leaping and praising God (twice).\nIn the Name of Jesus Christ of Nazareth rise up and walk.","ts":"యేసు క్రీస్తు దొరికెనేని యేమి కొదువింకేమి భయము\nదోసకారి జనుల కెంతో గ్రాసమవు నా యేసు పేరు\n\n1 తల్లిదండ్రుల కన్న చాలా దన ప్రేమ మన మీద\nనెల్లకాల మందు నుంచు యేసుడే మా తండ్రి యౌను \n\n2 వల్లగాని వశములేని యెల్ల మేళ్ళన్నిటి నెల్లపుడు\nకొల్లగా మన కిచ్చెడి దేవ కొమరుడే వేరెవరు లేరు\n\n3 దండియైన గండములు మెండుగాను మముజుట్టిన\nతండ్రివలె మా దరికి వచ్చి గండములను గదిమి బ్రోచున్‌\n\n4 సత్యము మార్గము తానె నిత్య జీవ మింకా తానే\nభృత్యుల మన కీయ మోక్షము భువిని రక్తమంత గార్చె\n\n5 ఎన్నరాని పాపాత్ముల కన్నులారా కనికరించి\nపున్నెమైన తన ప్రాణము భువిని బలి పెట్టినాడు\n\n6 ఒడలు నిండా గాయములతో నడరుచుండ మరల లేచి\nవెడలి పరమందునుండి వేడుకలు మా కంపినాడు\n\n7 ఆశతోడ దన్ను నమ్ము యాత్మలకు దర్శన మిచ్చెడి\nయేసుతో నింకెవరు సాటి లేశమైనా లేరు సుండీ"},{"n":235,"ei":"Onward, Christian Soldiers","ci":"Sing with me hallelujahs","ti":"పరిశుద్ధ గ్రంథము చొప్పున\nనిర్దోషిగ నడచువారలు\n","es":"1.Onward, Christian Soldiers,\nMarching as to war,\nLooking unto Jesus,\nWho is gone before.\nChrist, the royal Master,\nLeads against the foe;\nForward into battle,\nSee, His banners go.\n\nOnward,Christian soldiers,\nMarching as to war,\nLooking unto Jesus, Who is gone before.\n\n2.At the Name of Jesus\nSatan’s host doth flee;\nOn then, Christian soldiers,\nOn to victory!\nHell’s foundations quiver\nAt the shout of praise:\nBrothers, lift your voices:\nLoud your anthems raise.\n\n3.Like a mighty army,\nMoves the church of God:\nBrothers, we are treading \nWhere the saints have trod;\nWe are not divided,\nAll one body we,\nOne in hope and doctrine,\nOne in charity.\n\n4.Crowns and thrones may perish,\nKingdoms rise and wane;\nBut the church of Jesus\nConstant will remain:\nGates of hell can never\n‘Gainst that Church prevail;\nWe have Christ’s own promise,\nAnd that cannot fail.\n\n5.Onward, then, ye people,\nJoin our happy throng;\nBlend with ours your voices\nIn the triumph-song;\nGlory, praise and honour,\nUnto Christ the King;\nThis through countless ages\nMen and angels sing.","ec":"Sing with me hallelujahs,\nSing with me a song of praise;\nFor in thanking there is blessing,\nLet us sing our grateful praise.\n\n1.For the rest during the night,\nFor the sunshine full and bright\nFor the air that we can breathe so freely.\n\n2.For the change He wrought in us\nThrough the wonder of the Cross\nWhen He died that we may ever live.\n\n3.From the dead He rose again\nSatan’s forces having slain\nThat we all may live in victory.","ts":"పరిశుద్ధ గ్రంథము చొప్పున నిర్దోషిగ నడచువారలు\nపరలోకమునకు జేరుచుందురు ప్రభు సన్నిధిలో కాన్పింతురు\n\n1 యేసుని వాక్యములన్నిటిన్‌ నీ హృదయములో భద్రపరచుము\nబండమీద కట్టిన గృహమువలె భద్రముగ నుందువు సంఘమా\n\n2 ద్రాక్షావల్లియైన క్రీస్తులో తీగవైన నీవు కట్టబడిన\nబహుగా ఫలించుచుందువు ఫలభరితంబుగా నుందువు\n\n3 మంచి గొఱ్ఱెల కాపరియైన యేసు కాపుదల క్రింద నీవు\nదొడ్డిలో జీవించుచుండిన తోడేళ్ళు నిన్ను జేరలేవు\n\n4 వెలుగైన యేసు మార్గమును వెంబడించుచుండుము సంఘమా\nఅంధకార క్రియలు నీవు చేయవు వెలుగు బిడ్డవై తేజరిల్లుమా\n\n5 పునరుత్థాన జీవమైన క్రీస్తున్‌ పూర్ణమనస్సుతో ప్రేమించు\nనీతిమంతుల పునరుత్థానములో నిత్యజీవములో నివసింతువు\n\n6 సత్యమూర్తియైన క్రీస్తేసు శ్రీఘ్రముగా రానైయుండె\nసంధించుటకు శక్తి కొరకు సత్యమార్గములో నడువు సంఘమా \t\n\n7 సత్య సంఘంబు లన్నియున్‌ సత్య గ్రంథంబు చొప్పున\nజీవించవలెనని కోరి జీవమిచ్చి పోయె నేసు క్రీస్తు\n\n8 శ్రమలెన్నో సంఘము పైకి బహు శ్రీఘ్రముగ రానైయుండె\nహల్లెలూయ స్తోత్రములతో ఆనందించుచు ముందుకు సాగు \t"},{"n":236,"ei":"Revive thy work, O Lord","ci":"Somewhere beyond the blue","ti":"క్రైస్తవ సంఘమ క్రీస్తు జనమా\nక్రీస్తును కనుగొనుమా\n","es":"1.Revive Thy work, O Lord!\nThy mighty arm make bare;\nSpeak with the voice that wakes the dead,\nAnd make Thy people hear!\n\nRevive Thy work, O Lord!\nWhile here to Thee we bow;\nDescend, O gracious Lord, descend!\nOh, come, and bless us now!\n\n2.Revive Thy work, O Lord!\nExalt Thy precious Name!\nAnd may Thy love in every heart\nBe kindled to a flame!\n\n3.Revive Thy work, O Lord!\nAnd bless to all Thy Word!\nAnd may its pure and sacred truth\nIn living faith be heard!\n\n4.Revive Thy work, O Lord!.\nGive Pentecostal showers!\nBe Thine the glory, Thine alone!\nThe blessing, Lord, be ours! ","ec":"Somewhere beyond the blue, \tthere’s a mansion for me,\nSomewhere beyond the blue\nI am longing to be;\nI’ll see my Saviour’s face\nAnd sing of saving grace,\nSomewhere beyond the blue, someday.","ts":"క్రైస్తవ సంఘమ క్రీస్తు జనమా క్రీస్తును కనుగొనుమా\nక్రీస్తును మీ రాజుగ నభిషేకిం చుట కిదె తరుణంబు\nక్రీస్తుకొరకు సాక్ష్యంబులివ్వ  సేవింతము లెండి-రండీ నేడే\nక్రీస్తుడు మనలను కొనెను గావున క్రీస్తుని వారముగా\nక్రీస్తుకొరకు పరిమళవాసనగా జీవింతములెండీ\n\n1 ఇల మీ దేహంబులు మన దేవుని కాలయములు గావా\nవెలయిచ్చెను మనకై కలువరిపై విలువగల రక్తముతోన్‌ \t\nకలుషజాలమును పారద్రోలిన ప్రభువును - జేరగను - రండీ నేడే \nగొనుమిదె రక్షణ భాగ్యము మనకై దెచ్చెను మన ప్రభువే\nయేసుక్రీస్తు పాదార విందములు సేవింతము లెండీ\n\n2 దేవుని వాక్యము మీ హృదయములలో నివసింపగ నిండు\nదేవుని పిల్లలుగా జీవించుట భాగ్యంబే గదా\nదైవభక్తిగలిగి నడచుట యిల ధన్యతయే గదా మనకు నిరతం \nపుణ్యుని ప్రాయశ్చిత్తపు బలియె ప్రవిమలులుగ జేయున్‌\nపుణ్యుడేసు పరిశుద్ధుని రక్తము పావనులుగ జేయున్‌ \n\n3 ప్రభు రాజ్య వ్యాప్తికి కారణ సా ధనములు గనరండి\nప్రభు సామ్రాజ్యము మన మధ్యనే స్థాపింపగ బూనండి\nప్రభువుల ప్రభువునకు ప్రభుడేసునకే మహిమలు చెల్లింపన్‌\nలెండి రండీ - ప్రభునకు స్తుతి యాగము నర్పించుట మన విధియె కాదా  \nస్తోత్రపాత్రుడౌ-యేసు ప్రభునకే గీతము పాడండీ"},{"n":237,"ei":"Stand up! Stand up","ci":"Spirit of the living God","ti":"మన పాపము మన శాపము\nయేసు సిలువలో మోసెను\n","es":"1.Stand up! Stand up for Jesus!\nYe soldiers of the cross;\nLift high His royal banner,\nIt must not suffer loss:\nFrom victory unto victory\nHis army shall He lead,\nTill every foe is vanquished,\nAnd Christ is Lord indeed.\n\n2.Stand up! stand up for Jesus!\nThe trumpet call obey;\nForth to the mighty conflict\nIn this His glorious day!\nYe that are men, now serve Him\nAgainst unnumbered foes;\nLet courage rise with danger,\nAnd strength to strength oppose.\n\n3.Stand up! stand up for Jesus!\nStand in His strength alone;\nThe arm of flesh will fail you;\nYe dare not trust your own.\nPut on the Gospel armour,\nAnd, watching unto prayer,\nWhere duty calls,or danger,\nBe never wanting there.\n\n4.Stand up! stand up for Jesus!\nThe strife will not be long;\nThis day the noise of battle\nThe next the victor’s song.\nTo him that overcometh\nA crown of life shall be;\nHe, with the King of glory,\nShall reign eternally.","ec":"Spirit of the Living God, fall afresh on me;\nSpirit of the Living God, fall afresh on me.\nBreak me! Melt me! Mould me! Fill me!\nSpirit of the Living God, fall afresh on me.","ts":"మన పాపము మన శాపము యేసు సిలువలో మోసెను\nకల్వరి సిలువలో సాతాను సైన్యమున్‌-కూల్చివేసెను\n\n1 యేసు రక్తములో ముద్రించిన వారు\nబూర వూదగానే లోక పునాదులు వణికెన్‌\n\n2 విజయము పొందిన రాజు సైన్యముల ముందు నిలచే\nభయమేల మనకు జయము మనదే నిత్యం\n\n3 సకల వాద్యములతో ఆయన జయమును పాడి\nసంతోష గానములతో పరిశుద్ధుల మధ్య నిలచి\n\n4 శత్రు సమూహములను ఎఱ్ఱ సముద్రములోన\nముంచి వేయబడగా శత్రుక్రియ లికలేవు\n\n5 జయము జయము జయము ఎల్లవేళల జయము\nయేసు నామమునకే ఎల్లవేళల జయము"},{"n":238,"ei":"To the work","ci":"Sweep over my soul","ti":"యేసన్న స్వరమన్న నీవెపుద్దేనా  వినవా ....","es":"1.To the work ! to the work! we are servants of God,\nLet us follow the path that our Master has trod:\nWith the balm of His counsel our strength to renew,\nLet us do with our might what our hands find to do,\n\nToiling on,... Toiling on,...\nToiling on,... Toiling on,...\nLet us hope,... Let us watch,...\nAnd labour till the Master comes.\n\n2.To the work! to the work! let the hungry be fed,\nTo the fountain of life let the weary be led!\nIn the cross and its banner our glory shall be,\nWhile we herald the tidings, “Salvation is free!”\n\n3.To the work! to the work! there is labour for all,\nFor the kingdom of darkness and error shall fall:\nAnd the name of Jehovah exalted shall be,\nIn the loud-swelling chorus,“Salvation is free!”\n\n4.To the work! to the work! in the strength of the Lord,\nAnd a robe and a crown shall our labour reward,\nWhen the home of the faithful our dwelling shall be,\nAnd we shout with the ransomed,“Salvation is free!”","ec":"1.Sweep over my soul,\nSweep over my soul,\nCome gracious Spirit,\nSweep over my soul\n\n2.I open my heart\nCome and dwell In me\nOh ! May I be Thine lord\nSweep over my soul.","ts":"యేసన్న స్వరమన్నా నీవెపుడైనా విన్నావా ...ఆ ...ఆ\n\n1.జనముల శబ్ధము జలముల శబ్ధము బలమైన ఉరుములతో\nకలిసిన స్వరము పిలిచిన యేసు పిలిచిన పిలుపును నీవింటివా   ||యే||\n\n2.ఏదేను తోటలో ఆదాము చెడగా ఆ దేవుడే పిలిచే\nయెహోవా యెదుటను ఆదాము దాగెను అటులనే నీవును దాగెదవా   ||యే||\n\n3.పనులను వదలి జనులను విడిచి నను కనుగొనుమనగా\nకనిపెట్టి నందునఘనుడ బ్రాహాముకు కనిపించె మనకన్న తండ్రి యేసే   ||యే||\n\n4.ఆనాడు దేవుడు మోషేను పిలువగ ఆలకించెను స్వరము\nఈనాడు నీవును ఈ స్వరము వినగ కానాను చేరగ కదలిరావా   ||యే||\n\n5.ఆ రీతిగానే సమూయేలు వినగా ఆశీర్వాదమరసె \nధారాళముగను పరమ వరుని దరిజేరుకొని నీవు సేవించుమా   ||యే||\n\n6.సౌలా సౌలా నన్నేల హింసింతువు చాలించు మనె స్వరము\nసౌలాధిపునంత సంధించగానే సద్భక్తుడై పౌలుగా మారెగా   ||యే||\n\n7.స్వరమును వినగా పరమార్థ జ్ఞాని స్థిరుడైన యోహాను\nపరమ మర్మాలు భవిష్యద్విషయాలు ప్రకటించె ప్రతిరోజు స్మరించుమా   ||యే||"},{"n":239,"ei":"Sweet hour of prayer!","ci":"Take our love, Lord, make it","ti":"వార్తలలో యేసు సువార్త\nనరుల విమోచన శుభవార్త\n","es":"1.Sweet hour of prayer! sweet hour of prayer!\nThat calls me from a world of care,\nAnd bids me at my Father’s throne\nMake all my wants and wishes known;\n\nIn seasons of distress and grief,\nMy soul has often found relief,\nAnd oft escaped the tempter’s snare,\nBy thy return, sweet hour of prayer!\n\n2.Sweet hour or prayer! sweet hour of prayer!\nThy wings shall my petition bear\nTo him whose truth and faithfulness\nEngage the waiting soul to bless;\n\nAnd since He bids me seek His face,\nBelieve His word, and trust His grace,\nI’ll cast on Him my every care,\nAnd wait for thee, sweet hour of prayer!\n\n3.Sweet  hour of prayer! sweet hour of prayer!\nMay I thy consolation share,\nTill from mount Pisgah’s lofty height,\nI view my home and take my flight.\n\nThis robe of flesh I’ll drop and rise\nTo seize the everlasting prize;\nAnd shout, while passing thro’the air,\n“Farewell, farewell, sweet hour of prayer!”","ec":"Take our love, Lord, make it Your love,\nTake our life, Lord, make it Your life,\nTake our home, Lord, make it Your home,\nTake it all, Lord, make it Yours.","ts":"1 వార్తలలో యేసు సువార్త నరుల విమోచన శుభవార్త\nశరణార్థుల ఆశ్రయవార్త ధరణిని వెలసిన ఘన వార్త\nనిరుపమ రక్షణ మార్గముగా మర్మము దెలిపిన జ్ఞానముగా \nకర్మను బాపు క్షమాపణగా ధర్మమునంతటిన్‌ నెరవేర్చి\nతరతరములు బ్రోచు సువార్త\n\n2 జగతినిగాయు ప్రజాపతిగా నిగమముజాటిన యాగముగా\nవిగతుల ప్రార్థన తుదిగతిగా యుగముల నోముల బహుమతిగా\nఆగ్రహుడౌ ప్రభున్‌ శాంతింప ఉగ్రతపాత్రను త్రాగుటచే\nఅగణిత రుధిర ప్రవాహములో భగవంతుని కృప ప్రసరించి\nభక్తులగను సిలువ సువార్త\n\n3 పాపికి బదులుగా మరణించి శాపఋణములను చెల్లించెన్‌\nఅపవాదిని ఓడించుటచే అపరాజితునిగా మృతిగెల్చెన్‌\nరిపులను వారసులుగ చేసి ఆప్తునిగా విలసిల్లుటచే\nఉపవాదిగ దేవుని యెదుట తపనగ విజ్ఞాపన చేయు\nసఫలీకృత సిలువ సువార్త  \n\n4 ధర జీవితమున అభయములు పరమార్థములో విజయములు\nస్వర్గములో చిర సౌఖ్యములు పరమాత్ముని స్తోత్రార్పణలు\nమరియ సుతుని పునరాగమము అరయుచు ప్రియులతో మురియుటయు\nపరిశుద్ధుల సహవాసమును వరుడగు యేసుని పరిణయము \nపరిపూర్ణము చేయు సువార్త"},{"n":240,"ei":"Breath upon us","ci":"Teach me, aLord, to wait","ti":"ఓ సంఘమా-సర్వాంగమా\n","es":"1.Breathe upon us, Lord from heaven, \nFill us with the Holy Ghost; \nPromise of the Father given, \nSend us now a Pentecost.\n\nBreathe upon us, breathe upon us,\nWith Thy love our hearts inspire;\nBreathe upon us, breathe upon us,\nLord, baptize us now with fire.\n\n2.While the Spirit hovers o’er us, \nOpen all our hearts, we pray; \nTo Thine image, Lord, restore us, \nWitness in our souls today.\n\n3.From all sin grant us exemption,\nWash us in the cleansing blood.\nLet us know the full redemption,\nPurchased for us by the blood.\n\n4.Lift us, Lord, oh, lift us higher, \nFrom the carnal mind set free, \nFill us with refining fire, \nGive us perfect liberty.","ec":"1.Teach me, Lord, to wait\ndown on my knees\n’Til in your own good time\nyou answer my pleas.\nTeach me not to rely on\nwhat others do,\nBut to wait in prayer for an\nanswer from you.\n\n“They that wait upon the\nLord shall renew their strength;\nThey shall mount up with wings as eagles;\nThey shall run and not be weary;\nThey shall walk and not faint.”\nTeach me Lord, Teach me Lord, to wait.\n\n2.Teach me, Lord, to wait\nwhile hearts are aflame,\nLet me humble my pride,\nand call on your name.\nKeep my faith renewed, my\neyes on Thee,\nLet me be on this earth,\nwhat you want me to be.","ts":"ఓ సంఘమా-సర్వాంగమా  పరలోక రాజ్యపు-ప్రతిబింబమా\nయేసయ్యను-ఎదుర్కొనగా నీతి నలంకరించి సిద్ధపడుమా\nఓ సంఘమా వినుమా\n\n1.రాణి ఓఫిరు అపరంజితో స్వర్ణవివర్ణ వస్త్ర ధారణతో\nవీణ వాయిద్య తరంగాలతో  ప్రాణేశ్వరుని ప్రసన్నతతో\nఆనందతైల సుగంధాభిషేకము పొందితివే యేసునందు\n\n2.క్రీస్తే నిన్ను ప్రేమించెనని తన ప్రాణమునర్పించెనని\nస్వస్థపరచె నిర్దోషముగా ముడత కళంకములేనిదిగా\nమహిమయుక్తంబుగా నిలుప గోరె యేసువా\nసహింతువా తీర్పునాడు\n\n3.చీకటిలో నుండి వెలుగునకు లోకంలో నుండి వెలుపలకు\nశ్రీ కర్త గుణాతిశయములను ప్రకటించుటకే పిలిచెనని\nగుర్తించు చుంటివా క్రియలను గంటివా\nసజీవముగా నున్నావా \n\n4.చల్లగానైన వెచ్చగాను నుండిన నీకది మేలగును\nనులివెచ్చని స్థితి నీకుండిన బయటకు ఉమ్మివేయబడుదువేమో\nనీ మనస్సు మార్పుకో తొలి ప్రేమ కూర్చుకో\nఆసక్తితో రక్షణ పొందుమా\n\n5.కడపటి బూర మ్రోగగానే కనురెప్ప పాటున మారెదవా\nవడిగ మేఘాసీనుడవై నడియాకాశము పోగలవా\nగొఱ్ఱెపిల్ల సంఘమా క్రీస్తు రాజు సంఘమా\nరారాజు నెదుర్కొనగలవా"},{"n":241,"ei":"Breath on me","ci":"Teenager, are you lonely","ti":"మా యేసుక్రీస్తుని-మఱుఁగు గల్గెనురా\n","es":"1.Breathe on me, Breath of God\nFill me with life anew,\nThat I may love what Thou dost love\nAnd do what Thou wouldst do.\n\n2.Breathe on me, Breath of God,\nUntil my heart is pure;\nUntil my will is one with Thine\nTo do and to endure.\n\n3.Breathe on me, Breath of God,\nTill I am wholly Thine;\nUntil this earthly part of me\nGlows with Thy fire divine.\n\n4.Breathe on me, Breath of God,\nSo shall I never die,\nBut live with Thee the perfect life,\nOf Thine eternity.","ec":"Teenager, are you lonely?\nDo you need a friend?\nTake Jesus as your Saviour,\nHe will be with you to the end;\nHe'll be your Guide,\nStay by your side,\nTeenager, take Jesus to-day","ts":"మా యేసుక్రీస్తుని-మఱుగు గల్గెనురా\nనా యాత్మ ఘన రక్షా నగము నెక్కెనురా\n\n1 ముందు నాలో పాప-ములు\nజూడబడెరా డెందము తానన్ని\nటిని నొప్పుకొనెరా-యందుకై\nబలుదుఃఖమాత్మ జెందెనురా\nసందేహములు వీడు-జాడగన్గొనెరా\n\n2 సువిశేష బోధనా చెవులాలించెనురా\nఅవివేక శాస్త్రోక్తు-లంటు వీడెనురా \nనవసత్క్రైస్తవ గోష్ఠి-భువి నా కబ్బెనురా\nవివిధములగు వేల్పు-ల్విషమైరిగదరా\n\n3 బాధగురువుల మోము-ల్బహు\nలజ్జబడెరా-గాధ మంత్రములన్నికడగండ్లయి చెడెరా-శోధించి\nనా యాత్మ-శుద్ధి గోరెనురా-సాధించి\nప్రభు క్రీస్తు-శరణజొచ్చెనురా\n\n4 మతిలోని లోతు మ-ర్మము గానబడెరా\nమితిలేని ఘన-మే నిండు కొనెరా \nహితముగా తన జీవ మిచ్చెక్రీస్తుడురా\nమృతి చేత మన పాప వితతి గొట్టెనురా\n\n5 కులగోత్రముల బుద్ధి కుటిలంబుదెగెరా\nబలవత్పిశాచశృంఖలము విఱిగెనురా \nసిలువ మోసినవాని -చిర సౌఖ్యోన్నతిరా\nనెలవుగ నాలోన నిలచియున్నదిరా\n\n6 తనపోల్కెనొరులగన్గొనబ్రేమయ్యెనురా\nమనసు దేవునికి న-ర్పణ సేయఁబడెరా \nఘన కృపశాంతులు-గొనెను నెమ్మదిరా \nమనసు మార్పడి మోక్ష మహిమ గన్గొనెరా"},{"n":242,"ei":"God is here and that to bless us","ci":"Thank you for the cross Lord","ti":"ఇదిగో మీ రాజు-ఏతేoచుచున్నాడు","es":"1.God is here, and that to bless us\nWith the Spirit’s quickening power!\nSee the cloud, already bending,\nWaits to drop the grateful shower.\n\nLet it come,...O Lord, we pray Thee,\nLet the shower ... of blessing fall;\nWe are waiting, we are waiting—\nOh, revive...the hearts all!\n\n2. God is here! we feel His presence\nIn this consecrated place;\nBut we need the soul-refreshing\nOf His free, unbounded grace.\n\n3. God is here! oh, then, believing, \nBring to Him, our one desire,\nThat His love may now be kindled,\nTill its flame each heart inspire.\n\n4. Saviour, grant the prayer we offer,\nWhile in simple faith we bow;\nFrom the windows of Thy mercy\nPour us out a blessing now.","ec":"Thank you for the cross, Lord\nThank you for the price You paid\nBearing all my sin and shame\nIn love You came\nAnd gave amazing grace\nThank you for this love, Lord\nThank you for the nail pierced hands\nWashed me in Your cleansing flow\nNow all I know\nYour forgiveness and embrace\n\nWorthy is the Lamb\nSeated on the throne\nCrown You now with many crowns\nYou reign victorious\nHigh and lifted up\nJesus Son of God\nThe Darling of Heaven crucified\nWorthy is the Lamb\nWorthy is the Lamb. (2)\n","ts":"ఇదిగో మీ రాజు-ఏతెంచుచున్నాడు మీ తలలెత్తుడి\nసమీపమాయె-మీ విడుదల ధైర్యము నొందుడి\n\n1.యుద్ధములు కలహములు వైరములు\nనిందలు హింసలు అపవాదులు\nఅంతము వరకు సూచనలివియే\nమేల్కొని యుండుము   ||ఇది||\n\n2.అక్రమము అవినీతి-ప్రబలును\nఅందరి ప్రేమలు చల్లారును\nఅంతము వరకు కాపాడు కొమ్ము\nమొదటి ప్రేమను   ||ఇది||\n\n3.చిగురించుచున్నది అంజూరము\nఏతెంచియున్నది వసంతము\nఉరి యొచ్చునట్లు అందరిపైకి\nఅంతము వచ్చును   ||ఇది||\n\n4.ఎల్లప్పుడు ప్రార్థన చేయుచు\nమత్తును చింతను వీడుము\nవిశ్వాస ప్రేమ నిరీక్షణల్‌\nధరించియుండుము\t   ||ఇది||"},{"n":243,"ei":"How firm a foundation","ci":"Thank you, Lord Jesus","ti":"చాటించుడి మనుష్యజాతి కేసు నామము","es":"1. How firm a foundation, ye Saints of the Lord,\nIs laid for your faith in his excellent word!\nWhat more can he say than to you he hath said,\nWho unto the Savior, who unto the Savior,\nWho unto the Savior for refuge have fled?\n\n2.In ev'ry condition--in sickness, in health,\nIn poverty's vale or abounding in wealth,\nAt home or abroad, on the land or the sea--\nAs thy days may demand, as thy days may demand,\nAs thy days may demand, so thy succor shall be.\n\n3.Fear not, I am with thee; oh, be not dismayed,\nFor I am thy God and will still give thee aid.\nI'll strengthen thee, help thee, and cause thee to stand,\nUpheld by my righteous, upheld by my righteous,\nUpheld by my righteous, omnipotent hand.\n\n4.When through the deep waters I call thee to go,\nThe rivers of sorrow shall not thee o'erflow,\nFor I will be with thee, thy troubles to bless,\nAnd sanctify to thee, and sanctify to thee,\nAnd sanctify to thee thy deepest distress.\n\n5.The soul that on Jesus hath leaned for repose\nI will not, I cannot, desert to his foes;\nThat soul, though all hell should endeavor to shake,\nI'll never, no never, I'll never, no never,\nI'll never, no never, no never forsake!","ec":"Thank you, Lord Jesus,\nThat I can freely speak\nWith you, my God\nThank you, Lord Jesus,\nMy prayer is heard by you.\n\n1.All my griefs and all my sorrows,\nAll my worries, all my fears,\nAll my pain and all my conflicts,\nLord, I bring with tears.\n\n2.Every joy and every blessing\nLord, I bring to you in prayer;\nThrough your faithfulness alone\nI see this loving care.\n\n3.I can bring you all the problems\nI could tell nobody else\nFor dear Lord, you understand me,\nYou’re my closest friend","ts":"1 చాటించుడి మనుష్యజాతి కేసు నామము\nచాటించుడి యవశ్యమేసు ప్రేమసారము\nజనాదులు విశేష రక్షణ\nసునాదము - విను పర్యంతము\n\nచాటుదము-చాటుదము\nచాటుదము-చాటుదము\nచాటుదము-చాటుదము శ్రీయేసు నామము\n\n2 కన్నీళ్ళతో విత్తెడు వార లానందంబుతో\nనెన్నడు గోయుదురనెడి వాగ్దత్తంబుతో\nమన్నన గోరు భక్తులారా\nనిండు మైత్రితో - మానవ ప్రేమతో\n\nచాటుదము-చాటుదము\nచాటుదము-చాటుదము \nచాటుదము-చాటుదము\nచక్కని మార్గము\n\n3 సమీపమందు నుండునేమో చావుకాలము\nసదా నశించిపోవు వారికీ సుభాగ్యము\nవిధంబు జూపగోరి యాశతోడ నిత్యము\nవిన్పించుచుందుము\n\nచాటుదము-చాటుదము\nచాటుదము-చాటుదము\nచాటుదము-సత్యసువార్తను"},{"n":244,"ei":"I am thine O Lord","ci":"Thanks be to God, who gives","ti":"పైనున్న ఆకాశమందున\nక్రిందున్న భూలోకమందున\n","es":"1.I am Thine O Lord; I have heard Thy voice,\nAs it told Thy love to me;\nBut I long to rise in the arms of faith,\nAnd be closer drawn to Thee.\n\nDraw me near...er, nearer, blessed Lord,\nTo the cross where Thou hast died;\nDraw me nearer, nearer, nearer, blessed Lord, \nTo thy precious wounded side.\n\n2.Consecrate me now to Thy service, Lord,\nBy the power of grace divine;\nLet my soul look up with a steadfast hope,\nAnd my will be lost in Thine.\n\n3.Oh, the pure delight of a single hour,\nThat before Thy throne I spend,\nWhen I kneel in prayer, and with Thee, my God,\nI commune as friend with friend.\n\n4.There are depths of love that I cannot know\nTill I cross the narrow sea;\nThere are heights of joy that I may not reach\nTill I rest in peace with Thee.","ec":"Thanks be to God, who gives us the victory through\nJesus, Jesus, Jesus Christ our Lord. (repeat)\n\n1.For He won the battle over death and evil,\nYes, He did, We know He did.\nHe can still deliver in the day of trouble,\nYes, He can,\nWe know He can.\n\n2.Since our future victory is guaranteed,\nBe strong and steady, very steady.\nDo continue to abound in all God’s work,\nFor nothing’s wasted, nothing’s wasted.","ts":"పైనున్న ఆకాశమందున\nక్రిందున్న భూలోకమందున\nలేదు రక్షణ ఏ నామమున\nలేదు పాప విమోచన\n\n1 అన్ని నామములకు పైన గలదు\nఉన్నతంబగు యేసు నామము\nయేసు నామములో శక్తిగలదు(2)\nదుష్టులకు శాశ్వత ముక్తిగలదు(2)\n\n2 యేసు నామము స్మరియించగానే\nమనసు మారి నూతన మగును\nభేదమేమియు-లేదెవ్వరికిని (2)\nనాథుని స్మరియింప తరింప (2)\n\n3 యేసు నామములో శక్తిగలదు\nశాశ్వతానంద శాశ్వత శాంతము\nయేసు నామములో-రోగశుద్ధి(2)\nవిశ్వసించిన-మోక్ష సమృద్ధి(2)"},{"n":245,"ei":"I will sing the wondrous","ci":"The B - I - B - L - E","ti":"యేసుని స్వీకరించు \nక్రీస్తేసుని స్వీకరించు\n","es":"1.I will sing the wondrous story\nOf the Christ who died for me;\nHow He left His home in glory\nFor the cross on Calvary.\n\nYes, I’ll sing the wondrous story\nOf the Christ who died for me;\nSing it with the saints in glory,\nGathered by the crystal sea.\n\n2.I was lost: but Jesus found me---\nFound the sheep that went astray;\nThrew His loving arms around me, \nDrew me back into His way.\n\n3.I was bruised: but Jesus healed me--\nFaint was I from many a fall;\nSight was gone, and fears possessed me:\nBut He freed me from them all.\n\n4.Days of darkness still come o’er me;\nSorrow’s paths I often tread:\nBut the Saviour still is with me,\nBy His hand I’m safely led.\n\n5.He will keep me till the river \nRolls its waters at my feet:\nThen He’ll bear me safely over,\nWhere the loved ones I shall meet.","ec":"The B - I - B - L - E\nYes that’s the Book for me\nI stand alone on the  word of God\nThe B - I - B - L - E.","ts":"యేసుని స్వీకరించు క్రీస్తేసుని స్వీకరించు\nనీ హృదయపు ద్వారము తెరువుము\nత్వరితము తానే ప్రవేశించును\n\n1 కనికరముగల దేవుండు నిను వాత్సల్యముతో విమోచించును\nభయంకరమైన పాపము నుండి విడిపింపనిన్ను వెదకివచ్చె\n\n2 మన్నించు సర్వ పాపములన్‌ తానే మాన్పును సర్వరోగములన్‌\nకృపకనికరముల మకుటము నీకు ధరియింపజేసి ఘనపరచున్‌\n\n3 అంధులకు దృష్టి కలుగజేసే అంగహీనులను లేపి నడువజేసెన్‌\nపలువిధములగు వ్యాధి గ్రస్తులకు స్వస్థత నిచ్చెను తక్షణమే\n\n4 పాపపు భారము భరియించెన్‌ నీ రోగములన్నిటి తొలగించన్‌\nసహించెను కొరడా దెబ్బల బాధను జయించెను అన్ని శోధనలన్‌\n\n5 కలువరి సిలువలో వ్రేలాడి తన రక్తము చిందించె ధారలుగా\nచేతులలో తన కాళ్లలో చీలలు ముండ్ల కిరీటము ధరియించె\n\n6 జీవమిచ్చుటకు ప్రాణమిడె మరి జయించెను ప్రతి విధ శోధనలు\nనీ కొరకై మరణించి లేచెను శక్తిమంతుడై నిను రక్షింప"},{"n":246,"ei":"I am not ashamed","ci":"The birds upon the tree tops","ti":"సాటిలేనిది యేసుని రక్తము\nపాపమును కడుగును ","es":"1.I’m not ashamed to own my Lord,\nOr to defend His cause,\nMaintain the honour of His Word, \nThe glory of His cross.\n\nAt the cross! at the cross!\nWhere I first saw the light,\nAnd the burden of my heart rolled away:\nIt was there by faith I received my sight,\nAnd now I am happy all the day!\n\n2.Jesus, my God! I know His Name;\nHis Name is all my trust; \nNor will He put my soul to shame,\nNor let, my hope be lost.\n\n3.Firm as His throne His promise stands,\nAnd He can well secure \nWhat I’ve committed to His hands,\nTill the decisive hour.\n\n4.Then will He own my worthless name\nBefore His Father’s face; \nAnd, in the New Jerusalem, \nAppoint my soul a place.","ec":"The birds upon the tree tops sing their song,\nThe angels chant the chorus all day long;\nThe flowers in the garden blend their hues\nSo why shouldn’t I,\nWhy shouldn’t you, praise Him too?","ts":"సాటిలేనిది యేసుని రక్తము\nపాపమును కడుగును ప్రియుడా\nపాపమునే కడుగును\n\n1 చూడుము సోదరా దేవుడు ఎంతో\nప్రేమించె నీ జగతిన్‌ ప్రియుడా ప్రేమించె నీ జగతిన్‌\nసిలువలో ప్రాణము నర్పించ క్రీస్తు\nయేసుని పంపెను  ప్రియుడా యేసుని పంపెను\n\n2 లోకమున కరుదెంచి క్రీస్తు ప్రభువు\nప్రాణము బలిగా నిచ్చె ప్రియుడా ప్రాణము బలిగా నిచ్చె\nలోక పాపమెల్ల సిలువలో మోసి\nతొలగించె శాపముల్‌ ప్రియుడా తొలగించె శాపముల్‌\n\n3 వినుము సోదరా ప్రభు యేసు క్రీస్తుని\nపరలోక వార్తను ప్రియుడా పరలోక వార్తను\nఉన్నతమైన పరలోక ప్రేమను\nచాటించుచుంటిమి ప్రియుడా చాటించు చుంటిమి\n\n4 యేసుని నీవు క్షమించుమనివేడు\nవిరిగిన హృదయముతో ప్రియుడా విరిగిన హృదయముతో\nయేసుని అమూల్యరక్తధారలే\nకడుగును పాపమెల్ల ప్రియుడా కడుగును పాపమెల్ల\n\n5 పాప భారమును మోసికొని నీవు\nప్రయాస మొందెదవా ప్రియుడా ప్రయాస మొందెదవా\nపాపమొప్పుకొని యేసు పాదముల\nచెంతకు చేరుమా ప్రియుడా చెంతకు చేరుమా\n\n6 గతించుచున్నది స్వల్ప జీవితము\nశీఘ్రముగా రమ్ము ప్రియుడా శీఘ్రముగా రమ్ము\t\nకర్త యేసు నందు విశ్వాసముంచి\nరక్షణ పొందుము ప్రియుడా రక్షణ పొందుము\n\n7 కృప, ఆనందము, పవిత్ర ప్రేమలో\nభాగము పొందుము ప్రియుడా భాగము పొందుము\nపాప సాగరము దాటించగలడు\nయేసు రక్షకుడే ప్రియుడా యేసు రక్షకుడే"},{"n":247,"ei":"Lord, in the fullness","ci":"The earth is the Lord's and","ti":"దేవుని వారసులం\nప్రేమ నివాసులము\n","es":"1.Lord, in the fulness of my might \nI would for Thee be strong;\nWhile runneth o’er each dear delight \nTo Thee should soar my song.\n\n2.I would not give the world my heart,\nAnd then profess Thy love;\nI would not feel my strength depart\nAnd then Thy service prove.\n\n3.I would not with swift-winged zeal\nOn the world’s errands go,\nAnd labour up the heavenly hill\nWith weary feet and slow.\n\n4.Oh, not for Thee my weak desires,\nMy poorer, baser part!\nOh, not for Thee my fading fires,\nThe ashes of my heart.\n\n5.Oh, choose me in my golden time,\nIn my dear joys have part;\nFor Thee the glory of my prime,\nThe fulness of my heart!\n\n6.I cannot, Lord, too early take\nThe covenant divine:\nOh, ne’er the happy heart may break\nWhose earliest love was Thine.","ec":"The earth is the Lord’s and everything in it,\nThe earth is the Lord’s, the work of His hands\nThe earth is the Lord’s and everything in it\nAnd all things were made for His glory\nThe mountains are His, the seas and the islands,\nThe cities and towns, the houses and streets,\nLet rebels bow down and worship before Him,\nFor all things were made for His glory.\nThe earth is the Lord’s and everything in it for\nAll things were made, yes all things were made\nAnd all things were made for His glory.","ts":"దేవుని వారసులం ప్రేమ నివాసులము\nజీవన యాత్రికులం యేసుని దాసులము\nనవయుగ సైనికులం పరలోకపౌరుల\nహల్లెలూయ-నవయుగ\n\n1 దారుణ హింసలలో దేవుని దూతలుగా\nఆరని జ్వాలలలో ఆగని జయములతో\nమారని ప్రేమ సమర్పణతో సర్వత్ర యేసును కీర్తింతుము\n\n2 పరిశుద్ధాత్మునికై ప్రార్థన సలుపుదము\nపరమాత్ముని రాక బలము ప్రసాదింప ధరణిలో \nప్రభువును జూపుటకై సర్వాంగహోమము జేయుదము\n\n3 అనుదిన కూటములు అందరి గృహములలో\nఆనందముతోను ఆరాధనలాయే వీనులవిందగు పాటలతో\nధ్యానము చేయుచు మురియుదము\n\n4 సజీవ సిలువ ప్రభు సమాధి గెలుచుటచే\nవిజేత ప్రేమికులం విధేయ బోధకులం\nనిజముగ రక్షణ ప్రబలుటకై ధ్వజముగ సిలువను నిలుపుదము \n\n5 గోధుమ గింజవలె క్రీస్తుడు చావగను\nనాధుని మరణములో శాశ్వత జీవమును\nనిధులుగ పండించి తేవగను\nమాధుర్య రక్షణ లభియించెను\n\n6 హత సాక్షుల కాలం అవనిలో చెలరేగ\nగతకాలపు సేవ గొల్గొత గిరి చేర\nభీతులలో బహురీతులలో\nనూతన లోకము కాంక్షింతుము \n\n7 ప్రభువును చూచుటకై ప్రజలందరు రాగ\nవిభు మహిమను గాంచ విశ్వమే మముగోర\nశుభములు గూర్చుచు మాలోన \nశోభిల్లు యేసును జూపుదము "},{"n":248,"ei":"Lord,speak to me that","ci":"The grand old book","ti":"ఇదిగో నేనొక-నూతన క్రియను చేయుచున్నాను\n","es":"1.Lord, speak to me that I may speak\nIn living echoes of Thy tone;\nAs Thou hast sought, so let me seek\nThy erring children, lost and lone.\n\n2.Oh, lead me, Lord, that I may lead\nThe wandering and the wavering feet;\nOh, feed me, Lord, that I may feed\nThy hungering ones with manna sweet.\n\n3.Oh, strengthen me, that while I stand\nFirm on the rock, and strong in Thee,\nI may stretch out a loving hand\nTo wrestlers with the troubled sea.\n\n4.Oh, teach me, Lord, that I may teach\nThe precious things Thou dost impart;\nAnd wing my words, that they may reach\nThe hidden depths of many a heart.\n\n5.Oh, give thine own sweet rest to me,\nThat I may speak with soothing power,\nA word in season, as from Thee,\nTo weary ones in needful hour.\n\n6.Oh, fill me with Thy fulness, Lord\nUntil my very heart o’erflow\nIn kindling thought and glowing word,\nThy love to tell, Thy praise to show.\n\n7.Oh, use me, Lord, use even me,\nJust as Thou wilt, and when,and where\nUntil Thy blessed face I see,\nThy rest, Thy joy, thy glory share.","ec":"The grand old Book, the grand old Book,\nYou’ll find the words of comfort wherever you may look\nIn sorrow or in pain,\nHis promises are plain,\nSo keep on believing in the grand old Book.","ts":"ఇదిగో నేనొక-నూతన క్రియను చేయుచున్నాను\nఈనాడే అది మొలచును దాని నాలోచింపరా\n\n1 అడవిలో త్రోవను జేసి ఎడారిలో నదులను నేను\nఎల్లప్పుడు సమృద్ధిగా వ్రవహింప జేసెదను\n\n2 నాదు ప్రజలు త్రాగుటకు నే నరణ్యములో నదులు\nసమృద్ధిగా పారునట్లు సృషించెదను నేను\n\n3 అరణ్యములో జంతువులు కృర పక్షులు సర్పములు\nఘనపరచును స్తుతియించును దీని నాలోచించుడి \n\n4 నూతన సృష్టిగ నినుజేసి నీ శాంతిని నదివలెజేసి\nనను జూచి మహిమ పరచి స్తుతి పాడ జేసెదను\n\n5 నేనే దేవుడనని దెలసి నా కార్యములను నెరవేర్చి\nముందున్న వాటికన్న ఘన కార్యములను జేతున్‌\n\n6 మరుగైన మన్నానిచ్చి మరి తెల్లని రాతినిచ్చి\nచెక్కెదనా రాతిమీద నొక క్రొత్త నామమును\n\n7 పరలోక భాగ్యంబులు నరలోకములో మన కొసగెన్‌\nకరుణా సంపన్నుండగు మన ప్రభునకు హల్లెలూయా "},{"n":249,"ei":"Make me a channel","ci":"The joy of the Lord is my","ti":"సువార్తను చాటింప\nసుసమయం బిదియేను\n","es":"1.Make me a channel of your peace:\nWhere there is hatred, let me bring your love,\nWhere there is injury, your pardon, Lord,\nAnd where there’s doubt, true faith in You.\n\n2.Make me a channel of your peace:\nWhere there’s despair in life, let me bring hope,\nWhere there is darkness, only light\nAnd where there’s sadness, ever joy.\n\nOh! Master, grant that I may never seek\nSo much to be consoled as to console,\nTo be understood as to understand,\nTo be loved as to love with all my soul.\n\n3.Make me a channel of your peace:\nIt is in pardoning that we are pardoned,\nIn giving to all men that we receive,\nAnd in dying that we’re born to eternal life.","ec":"The joy of the Lord is my strength! (4)\n\n1.The word of God is nigh thee even in thy mouth (3)\n\n2.He gives me living water till I thirst no more (3)\n\n3.He fills my mouth with laughter, Ha, Ha, Ha, Ha, Ha (3)","ts":"సువార్తను చాటింప సుసమయం బిదియేను\nశ్రీయేసుని నామంబు ఎంతో మధురము మనకు\n\n1 సంతసమున సాగెదము పురికొల్పుచు మనసులను\nసంకటములు ఎన్నయిన చనిపోవుటె మేలనుచు\n\n2 సిలువను మోయుచు భుజమున్‌ చేత సువార్తల బూని\nలోకమునకు చాటెదము ప్రశాంతుండగు యేసున్‌\n\n3 శ్రీ యేసునికే యిలలో జయమార్భటించెదము\nజయశాలులుగా మేము జగదేవత నొణికింతుం\n\n4 ప్రవక్తలలో ఘనుడు పరమున దూతలు బొగడున్‌\nనేత్రముల కాయన తార అరుణోదయ నక్షత్రం \n\n5 చిరునగవులతో మేము చిందింతుము రక్తమును\nహృదయములు ప్రకాశించున్‌ మనసానందం బిదియే"},{"n":250,"ei":"More holiness give me","ci":"The law of the Lord is perfect","ti":"నా పేరే తెలియని ప్రజలు\nఎందరొ వున్నారు\n","es":"1.More holiness give me, \nMore striving, within;\nMore patience in suffering, \nMore sorrow for sin;\nMore faith in my Saviour, \nMore sense of His care;\nMore joy in His service, \nMore purpose in prayer.\n\n2.More gratitude give me, \nMore trust in the Lord;\nMore zeal for His glory, \nMore hope in His Word;\nMore tears for His sorrows, \nMore pain at His grief;\nMore meekness in trial, \nMore praise for relief.\n\n3.More purity give me, \nMore strength to o’ercome;\nMore freedom from earth stains, \nMore longings for home;\nMore fit for the kingdom, \nMore used would I be,\nMore blessed and holy, \nMore, Saviour, like Thee!","ec":"1.The law of the Lord is perfect\nConverting the soul;\nThe tes
