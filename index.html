tten not created;\n\n3.Sing, choirs of angels,\nSing in exultation,\nSing, all ye citizens of heaven above:\n“Glory to God in the highest:”\n\n4.Yea, Lord, we greet Thee,\nBorn this happy morning;\nJesus, to Thee be glory given;\nWord of the Father,Now in flesh appearing.","ec":"Hallelujah! I will sing all about it\nHallelujah! I will shout all about it\nHallelujah can’t live without it, praise God, praise God!\nNow I’m living in a new creation\nNow I’m drinking at the well of salvation,\nNow there is no condemnation, praise God, praise God!","ts":"గీతం గీతం - జయ జయ గీతం చేయి తట్టి పాడెదము యేసు రాజు లేచెను - హల్లెలూయ జయ మార్భటించెదము\n\n1.చూడు సమాధిని - మూసిన రాయి దొరలుచు పొరలిడెను అందు వేసిన ముద్ర - కావలి నిల్చున దైవ సుతుని ముందు ఆ..ఆ..  ||గీతం||\n \n2.వలదు వలదు - ఏడువ వలదు పరుగిడి ప్రచురించుడి తాను చెప్పిన విధమున - తిరిగి లేచెను వెళ్ళుడి గలిలయకు ఆ..ఆ..   ||గీతం||\n \n3.అన్న కయప - వారల సభయును అదరుచు పరుగిడిరి – ఇంకా దూతగణముల - ధ్వనిని వినుచు వణకుచు భయపడిరి ఆ..ఆ..    ||గీతం||\n\n4.గుమ్మముల్‌ తెరచి - చక్కగ నడువుడి జయవీరుడు రాగా – మీమేళతాళ - బూర వాయిద్యము లెత్తి ధ్వనించుడి ఆ..ఆ..   ||గీతం||"},{"n":80,"ei":"O little town of Bethlehem","ci":"Happiness is to know the","ti":"పరమ జీవము నాకు నివ్వ...","es":"1.O little town of Bethlehem,\nHow still we see thee lie!\nAbove thy deep and dreamless sleep\nThe silent stars go by.\nYet in thy dark streets shineth\nThe everlasting light;\nThe hopes and fears of all the years\nAre met in thee tonight.\n\n2.O morning stars, together\t\nProclaim the holy birth!\nAnd praises sing to God the King,\nAnd peace to men on earth;\nFor Christ is born of Mary,\nAnd, gathered all above,\nWhile mortals sleep,the angels keep\nTheir watch of wond’ring love.\n\n3.How silently, how silently,\nThe wondrous gift is giv’n!\nSo God imparts to human hearts\nThe blessings of His Heav’n.\nNo ear may hear His coming;\nBut in this world of sin,\nWhere meek souls will receive im, still \nThe dear Christ enters in.\n\n4.O holy Child of Bethlehem!\nDescend to us, we pray;\nCast out our sin, and enter in,\nBe born in us today.\nWe hear the Christmas angels\nThe great glad tidings tell;\nOh, come to us, abide with us,\nOur Lord Emmanuel.","ec":"1.Happiness is to know the saviour,\nLiving a life within His favour\nHaving a change in my behaviour-\nHappiness is the Lord:\n\n2.Happiness is a new creation-\n“Jesus and me” in close relation,\nHaving a part in His salvation,\nHappiness is the Lord:\nReal joy is mine, no matter if tear drops start;\nI’ve found the secret -it’s Jesus in my heart!\n\n3.Happiness is to be forgiven,\nLiving a life that’s worth the living,\nTaking a trip that leads to heaven---\nHappiness is the Lord:\nHappiness is the Lord, Happiness is the Lord!","ts":"1.పరమ జీవము నాకు నివ్వ...తిరిగి లేచెను నాతో నుండ  నిరంతరము నడిపించును మరల వచ్చి యేసు కొని పోవును\n\nయేసు చాలును యేసు చాలును యే సమయమైన యే స్థితికైనా నా జీవితములో యేసు చాలును\n\n2.సాతాను శోధన లధికమైన సొమ్మసిల్లక సాగి వెళ్లెదను లోకము శరీరము లాగినను లోబడక నేను వెళ్ళెదను   ||యేసు||\n\n3.పచ్చిక బయలులో పరుండ జేయున్‌ శాంతి జలము చెంత నడిపించును అనిశము ప్రాణము తృప్తిపరచున్‌ మరణలోయలో నన్ను కాపాడును   ||యేసు||\n\n4.నరులెల్లరు నన్ను విడిచినను శరీరము కుళ్ళి కృశించినను హరించినన్‌ నా ఐశ్వర్యము విరోధివలె నను విడిచినను     ||యేసు||"},{"n":81,"ei":"Once in royal David's city","ci":"He gave me beauty for","ti":"సిలువను మోసి ఈ లోకమును","es":"1.Once in royal David’s city\nStood a lowly cattle-shed,\nWhere a mother laid her Baby,\nIn a manger for His bed.\nMary was that mother mild,\nJesus Christ her little child.\n\n2.He came down to earth from heaven,\n Who is God and Lord of all,\nAnd His shelter was a stable,\nAnd His cradle was a stall\nWith the poor and mean and lowly\nLived on earth our Saviour holy.\n\n3.And through all His \nWondrous childhood\nHe would honour and obey,\nLove and watch the lowly mother,\nIn whose gentle arms He lay.\nChristian children all must be.\nMild, obedient, good as He.\n\n4.For He is our childhood’s pattern,\nDay by day like us He grew;\nHe was little, weak and helpless;\nTears and smiles like us He knew\nAnd He feeleth for our sadness,\nAnd He shareth in our gladness.\n\n5.And our eyes at last shall see Him,\nThrough His own redeeming love;\nFor that Child, so dear and gentle,\nIs our Lord in heaven above;\nAnd He leads His children on \nTo the place where He is gone\n\n6.Not in that poor, lowly stable,\nWith the oxen standing by,\nWe shall see Him; but in heaven,\nSet at God’s right hand on high;\nWhen like stars His children crowned.\nAll in white shall wait around","ec":"He gave me beauty for ashes, the oil of joy for mourning\nThe garment of praise for the spirit of heaviness\nThat we might be trees of righteousness\nThe planting of the Lord, that He might   be glorified.","ts":"సిలువను మోసి ఈ లోకమును తలక్రిందులు చేయు తరుణమిదే\n\n1.లే లెమ్ము సోదరుడా నిద్ర నుండి ప్రకటించను యేసు నామమును సోమరి యేల నిద్రించెదవు ఈ ధరను లేపెడు సమయమిదే\n \n2.పరిశుద్ధాత్మ కవచముతొడిగి నీ నడుము కట్టి తయ్యారగుమా సోదరుడా ప్రతి వీధికి వెళ్లి సువార్తను చాటెడు సమయమిదే\n \n3.లోక రక్షణకై ప్రభు యేసు వీకతో నరుదెంచెను ఈ ధరకు వెలుగును మనకు నిచ్చెను యేసు తన స్తుతులను పాడెడు సమయమిదే\t\n \n4.పాతాళమునకు కొనిపోయెడి నీ పాత నిద్రను విడనాడు మిక సిలువ మర్మము నెరుగుమిపుడే కునికెడు సమయము కాదిది ప్రియుడా\t\n \n5.రక్షింపబడుట కాశించినచో పశ్చాత్తాపపడు మీ దినమే కలుషాత్ముండా తడవేల నికన్‌ కనుమా నీ తీర్పు సమయమిదే "},{"n":82,"ei":"Silent night! Holy night!","ci":"He is Lord, He is Lord","ti":"దేవ దేవుని సన్నిధిలో సముహముగా","es":"1.Silent night! Holy night!\nAll is calm, all is bright,\nRound yon virgin mother and Child\nHoly infant so tender and mild,\nSleep in heavenly peace,\nsleep in heavenly peace.\n\n2.Silent night! Holy night!\nShepherds quake at the sight\nGlories stream from heaven afar,\nHeavenly hosts sing Alleluia;\nChrist the Saviour is born,\nChrist the Saviour is born.\n\n3.Silent night! Holy night! \nSon of God, love's pure light,\nRadiant beams from Thy Holy face\nWith the dawn of redeeming grace\nJesus Lord at Thy birth,\nJesus Lord at Thy birth.","ec":"He is Lord, He is Lord\nHe is risen from the dead\nAnd He is Lord\nEvery knee shall bow,\nEvery tongue shall confess\nThat Jesus Christ is Lord","ts":"దేవ దేవుని సన్నిధిలో సముహముగా ఉన్నదెవరో\nఅధిపతి ప్రభు యేసుని సైన్యములో నిలచిన ఈ ధీరులెవరో (2)  ||దేవ||\n\n1 ఒక్క తలాంతో రెండు ఉన్నవో ఐదు ఉన్నను వాడినవారు\nచిన్న పనిలో పెద్ద పనిలో ఇచ్చినట్టి పనిని చేసినవారు  ||దేవ||\n\n2 అడవులలో పయనించి ప్రభుని ప్రేమ పంచినవారు\nకలిమిలోను లేమిలోను పట్టుదలగా ప్రార్థించువారు  ||దేవ||\n\n3 ఒంటరితనం పేదరికంలో లాజరులా నిలబడిరి\nయాచించిన పోషించిన విశ్వాసము వీడనివారు  ||దేవ||\n\n4 జాతులన్నియు గోత్రాలన్నియు భాషలన్నియు  మాట్లాడువారు \nసిలువ క్రింద యేసు రక్తంలో మంచి పోరాటం పోరాడినారు  ||దేవ||"},{"n":83,"ei":"Tell me the story of Jesus","ci":"He is my everything","ti":"బూరాధ్వని ఆకాశములోధ్వనియించగా\n","es":"1.Tell me the story of Jesus, \nWrite on my heart ev’ry word;\nTell me the story most precious, \nSweetest that ever was heard!\nTell how the angels, in chorus, \nSang as they welcomed His birth,\n“Glory to God in the highest! \nPeace and good tidings to earth!”\n\nTell me the story of Jesus, \nWrite on my heart ev’ry word;\nTell me the story most precious, \nSweetest that ever was heard!\n\n2.Fasting alone in the desert! \nTell of the days that He passed\nHow for our sins He was tempted, \nYet was triumphant at last.\nTell of the years of His labour, \nTell of the sorrows He bore\nHe was despised and afflicted, \nHomeless, rejected and poor\n\n3.Tell of the cross where they nailed Him, \nHanging in anguish and pain;\nTell of the grave where they laid Him, \nTell how He liveth again!\nLove, in that story so tender, \nClearer than ever I see:\nStay, let me weep while you whisper, \nLove paid the ransom for me!","ec":"He is my everything\nHe is my all\nHe is my everything\nBoth great and small\nHe gave himself for me\nMade everything new\nHe is my everything\nNow how about you.","ts":"బూరాధ్వని ఆకాశములోధ్వనియించగా\nమా యేసు మహా రాజు-వచ్చుచుండెను\n\n1.ఆ దినం మిక్కిలి సమీపం శుద్ధులుఅందరు చేరెదరు(2)\nదేవుని బూర ధ్వనియించగా దేవాది దేవుని సంధించెదము(2)  ||బూర||\n\n2.ఆకాశం భూమియు మారినను శక్తిమంతుని వాగ్దానం మారదు\nదేవుని బూర ధ్వనియించగా దేవాది దేవుని దర్శించెదము  ||బూర||\n\n3.దొంగలు అటు యిటు తిరుగుచును దేవుని వాక్యాన్ని మార్చుచున్నారు\nఓ దేవారమ్ము వాంఛను తీర్చుము మెలకువతో వేచియున్నాము  ||బూర||\n\n4.కనురెప్పపాటున మారెదము మోక్షంలో అందరము చేరెదము\nకన్నీరుదిగులు అచ్చటలేవు దేవుడు తానే వెలుగై యుండును  ||బూర||\n"},{"n":84,"ei":"While shepherds watched","ci":"He lives, He lives","ti":"ప్రకాశమైన - ఆశ్చర్యదేశము","es":"1.While shepherds watched \ntheir flocks by night,\nAll seated on the ground,\nThe angel of the Lord came down,\nAnd glory shone around.\n\n2.“Fear not,” said he, for mighty dread\nHad seized their troubled mind;\n“Glad tidings of great joy I bring\nTo you and all mankind.”\n\n3. “To you, in David’s town, this day”\nIs born, of David’s line,\nA Saviour, who is Christ the Lord;\nAnd this shall be the sign;\n\n4.“The heavenly Babe you there shall find\nTo human view displayed.\nAll meanly wrapped in swathing bands  \nAnd in a manger laid.”\n\n5.Thus spake the seraph; and forthwith\nAppeared a shining throng\nOf angels, praising God, who thus\nAddressed their joyful song;\n\n6.“All glory be to God on high,\nAnd on the earth be peace;\nGood will henceforth from heaven to men\nBegin and never cease.”","ec":"He lives, He lives\nChrist Jesus lives today\nHe walks with me and talks with me\nAlong life’s narrow way.\nHe lives, He lives, Salvation to impart!\nYou ask me how I know He lives\nHe lives within my heart.","ts":"ప్రకాశమైన - ఆశ్చర్యదేశము ప్రియుని దేశము ప్రేమించు దేశము\n\n1.పాపరహిత దేశము ఏ శాపము కనబడదు నిత్యానందం - ఆగని గీతము ఆకాశమందు హోసన్నా హల్లెలూయ\n\n2.సూర్యచంద్రులు లేరు కాని చీకటి కనబడదు దైవకుమారుడు – తేజోమయుడు నిత్యము వెలుగిచ్చును పగలెప్పుడు\n\n3. పలువిధ బోధలతో నుండు గుంపుల పేరుండదు యేక కుటుంబము ఒక నాయకుడే ప్రేమామయ దేశము ప్రియులు వెళ్ళు\n\n4.ప్రశ్నలు యేవుండవు ఎట్టి కలవరమే వుండదు జాతి, రంగు - భాష భేదము కలవారెవరు లేరు  ప్రేమే పల్కున్‌\n\n5.పలువిధ ప్రణాళికలు పరిపాలించు చట్టములు చెరసాలలు - శిక్షయు లేవు నరుల పరిపాలన అందుండదు\n\n6.సంత వీధులు లేవు కర్మాగారములే లేవు ధనికులు దరిద్రులు - చిన్నలు పెద్దలు అనుబేధము లేదు అందరు సమం\n\n7.యేసుని రక్తమందు పాపం కడిగిన చేరుదువు ఈ గొప్ప ధన్యత - పోగొట్టుకొను వారెవరును కావలదు నేడే రమ్ము\n"},{"n":85,"ei":"I cannot tell why He","ci":"He owns the cattle on","ti":"సీయోను పాటలు సంతోషముగ","es":"1.I cannot tell why He, whom angels worship\nShould set His love upon the sons of men,\nOr why, as Shepherd, He should seek the wanderers,\nTo bring them back, they know not how or when.\nBut this I know, that He was born of Mary\nWhen Bethlehem’s manger was His only home,\nAnd that He lived at Nazareth and laboured,\nAnd so the Saviour, Saviour of the world, is come.\n\n2.I cannot tell how silently He suffered,\nAs with His peace He graced this place of tears,\nOr how His heart upon the cross was broken,\nThe  crown of pain to three and thirty years.\nBut this I know, He heals the broken-hearted\nAnd stays our sin, and calms our lurking fear,\nAnd lifts the burden from the heavy-laden,\nFor yet the Saviour, Saviour of the world, is here.\n\n3.I cannot tell how He will win the nations,\nHow He will claim His earthly heritage,\nHow satisfy the needs and aspirations\nOf East and West, of sinner and of sage.\nBut this I know, all flesh shall see His glory,\nAnd He shall reap the harvest He has sown,\nAnd some glad day His sun shall shine in splendour\nWhen He the Saviour, Saviour of  the world, is known\n\n4.I cannot tell how all the lands shall worship,\nWhen, at his bidding, every storm is stilled,\nOr who can say how great the jubilation\nWhen all the hearts of men with love are filled.\nBut this I know, the skies will thrill with rapture,\nAnd myriad, myriad human voices sing,\nAnd earth to heaven, and heaven  to earth, will answer\nAt last the Saviour, Saviour of the world, is King!","ec":"He owns the cattle on a thousand hills,\nThe wealth in ev’ry mine;\nHe owns the rivers and the rocks and rills,\nThe sun and stars that shine;\nWonderful riches more than tongue can tell,\nHe is my Father’s so they’re mine as well;\nHe owns the cattle on a thousand hills,\nI know that He will care for me.","ts":"సీయోను పాటలు సంతోషముగ\t\t\t\nపాడుచు సీయోను వెళ్ళుదము\n \n1.లోకాన శాశ్వతానంద మేమియు లేదని చెప్పెను ప్రియుడేసు\nపొందవలె నీ లోకమునందు కొంతకాల మెన్నో శ్రమలు   ||సీయో||\n \n2.ఐగుప్తును విడిచినట్టి మీరు అరణ్య వాసులె ఈ ధరలో\nనిత్య నివాసములే దిలలోన నేత్రాలు కానాను పై నిల్పుడి    ||సీయో||\n \n3.మారాను పోలిన చేదైన స్థలముల ద్వారా పోవలసియున్ననేమి\nనీ రక్షకుండగు యేసే నడుపును మారని తనదు మాట నమ్ము   ||సీయో||\n \n4.ఐగుప్తు ఆశలన్నియు విడిచి రంగుగ యేసుని వెంబడించి\nపాడైన కోరహు పాపంబు మాని విధేయులై విరాజిల్లుడి   ||సీయో||\n \n5.ఆనందమయ పరలోకంబు మనది అక్కడనుండి వచ్చు నేసు\t\nసీయోను గీతము సొంపుగ గలిసి పాడెదము ప్రభు యేసునకు   ||సీయో||"},{"n":86,"ei":"A even ere  the sun","ci":"He shall feed his flock","ti":"యెహోవా నీ నామము  ఎంతో బలమైనది","es":"1.At even ere the sun was set,\nThe sick, O Lord, around Thee lay;\nOh, in what divers pains they met;\nOh, with what joy they went away!\n\n2.Once more ‘tis eventide, and we\nOppressed with various ills draw near\nWhat if Thy form we cannot see?\nWe know and feel that Thou art here.\n\n3.O Saviour Christ, our woes dispel:\nFor some are sick; and some are sad;\nAnd some have never loved Thee well;\nAnd some have lost the love they had;\n\n4.And some have found the world is vain,\nYet from the world they break not free;\nAnd some have friends who give them pain,\nYet have not sought a Friend in Thee.\n\n5.And none, O Lord, have perfect rest,\nFor none are wholly free from sin;\nAnd they who fain would serve Thee best\nAre conscious most of wrong within.\n\n6.O Saviour  Christ Thou too art Man;\nThou hast been troubled, tempted, tried;\nThy kind but searching glance can scan\nThe very wounds that shame would hide.\n\n7.Thy touch has still its ancient power;\nNo word from Thee can fruitless fall;\nHear, in this solemn evening hour,\nAnd in Thy mercy heal us all.","ec":"He shall feed His flock like a shepherd,\nHe shall gather the lambs in His arms\nAnd carry them in His bosom,\nAnd shall gently lead those that are with young.","ts":"యెహోవా నీ నామము  ఎంతో బలమైనది ఎంతో  బలమైనది ఎంతో ఘనమైనది\n\n1. మోషే ప్రార్థించగా మన్నాను కురిపించితివి యెహోషువ ప్రార్థించగా సూర్యచంద్రులనాపితివి   ||యెహో||\n\n2. నీ ప్రజల పక్షముగా యుద్ధములు చేసిన దేవా అగ్నిలో పడవేసినా భయమేమి లేకుండిరి  ||యెహో||\n\n3. పేతురును బంధించినా చెఱసాలలో వేసినా సంఘము ప్రార్థించగా సంకెళ్లువిడిపోయెను  ||యెహో||\n\n4. సింహాల బోనులకైనా సంతోషముగా వెళ్లిరి ప్రార్థించినా వెంటనే రక్షించే నీ హస్తము  ||యెహో||\n\n5. చెఱసాలలో వేసినా సంకెళ్లు బిగియించినా పాటలతో ప్రార్థించగా చెఱసాల బ్రద్ధలాయె ||యెహో||\n\n6. మానవుల రక్షణ కొరకై నీ ప్రియ కుమారుని లోకమునకు పంపగా ప్రకటించే నీ వాక్యము  ||యెహో||"},{"n":87,"ei":"How sweet the Name","ci":"He that is in us is greater","ti":"స్తోత్రం చెల్లింతుము స్తుతి స్తోత్రం చెల్లింతుము","es":"1.How sweet the Name of Jesus sounds \nIn a believer’s ear!\nIt soothes his sorrows, heals his wounds,\nAnd drives away his fear.\n\n2.It makes the wounded spirit whole,\nAnd calms the troubled breast;\n‘Tis manna to the hungry soul,\nAnd to the weary rest.\n\n3.Dear Name, the rock on which I build,\nMy shield and hiding-place,\nMy never-failing treasury, filled\nWith boundless stores of grace!\n\n4.Jesus! my Shepherd, Saviour, Friend;\nMy Prophet, Priest, and King;\nMy Lord, my Life, my Way, my End;\nAccept the praise I bring.\n\n5.Weak is the effort of my heart,\nAnd cold my warmest thought;\nBut when I see Thee as Thou art,\nI’ll praise Thee as I ought.\n\n6.Till then, I would Thy love proclaim\nWith every fleeting breath;\nAnd may the music of Thy name\nRefresh my soul in death.","ec":"He that is in us is greater than he\nThat is in the world\nHe that is in us is greater than he\nThat is in the world\nTherefore I will sing and I will rejoice\nFor His Spirit lives in me\nChrist the Living One has overcome\nAnd we share in His victory","ts":"స్తోత్రం చెల్లింతుము స్తుతి స్తోత్రం చెల్లింతుము యేసు నాథుని మేలులు తలంచి\n \n1.దివారాత్రములు కంటిపాపవలె కాచి దయగల హస్తముతో బ్రోచి నడిపించితివి   ||స్తోత్రం||\n \n2.గాఢాంధకారములో కన్నీటి లోయలలో కృశించిపోనీయక కృపలతో  బలపరచితివి   ||స్తోత్రం||\n \n3.సజీవ యాగముగా మా శరీరముల్‌ సమర్పించి సంపూర్ణ సిద్ధినొంద శుద్ధాత్మను నొసగితివి  ||స్తోత్రం||\n \n4.సీయోను మార్గములో పలుశోధనలు రాగా సాతాన్ని జయించుటకు విశ్వాసము నిచ్చితివి   ||స్తోత్రం||\n \n5.సిలువను మోసికొని సువార్తను చేపట్టి యేసుని వెంబడింప ఎంత భాగ్యమునిచ్చితివి   ||స్తోత్రం||\n \n6.పాడెద హల్లెలూయ మరనాత హల్లెలూయ సదపాడెద హల్లెలూయ ప్రభు యేసుకె హల్లెలూయ     ||స్తోత్రం||"},{"n":88,"ei":"I gave life for thee","ci":"He'll go with me all the","ti":"మన కొరకై వచ్చాడు \nతన ప్రాణం పెట్టాడు \n","es":"1.I gave my life for thee,\nMy precious blood I shed,\nThat thou might'st ransomed be,\nAnd quickened from the dead:\nI gave My life for thee;\nWhat hast thou given for me?\n\n2.I spent long years for thee \nIn weariness and woe,\nThat an eternity\nOf joy thou mightest know:\nI spent long years for thee;\nHast thou spent one for me?\n\n3.My Father's home of light,\nMy rainbow-circled throne,\nI left for earthly night,\nFor wanderings sad and lone:\nI left it all for thee;\nHast thou left aught for Me?\n\n4.I suffered much for thee,\nMore than thy tongue can tell\nOf bitter agony \nTo rescue thee from hell:\nI suffered much for thee;\nWhat canst thou bear for Me?\n\n5.Lord, let my life be given,\nAnd every moment spent,\nFor God, for souls for heaven,\nAnd all earth's ties be rent.\nThou gav'st Thyself for me,\nNow I give all for Thee.","ec":"He’ll go with me all the way,\nHe’s my comfort and my stay,\nBy His tender love and mercy,\nI will never never stray.\nO’er the mountains rough and steep,\nThrough the valleys dark and deep,\nTill I reach my home in glory,\nHe’ll go with me all the way.","ts":"మన కొరకై వచ్చాడు తన ప్రాణం పెట్టాడు నిన్ను నన్ను యేసు ప్రేమించాడు\nతన అరచేతిలో నిన్ను చెక్కుకున్నాడు తన అరచేతిలో నన్ను చెక్కుకున్నాడు\n\n1 స్వంత జనం మరచినను మరువడాయన నీతి సూర్యుడైన తండ్రి  యేసు దేవుడే\nపరిస్థితులు మారినను యేసు నిన్ను మరచిపోడు సిలువలో ప్రాణం బెట్టె సమయంలో మరువలేదే\n\n2 పనికిరాని వాడవని త్రోసివేసినా అబ్రాహాము దేవుడు నిన్నుత్రోసివేయడు\nదిక్కులేని వారినంతా చేర్చుకొనే రక్షకుడు జడియకు నా బిడ్డలారా యంటు ఆదరించు\n\n3 వ్యాధి గలవాడవని నెట్టి వేశారు సూటి పోటి మాటలతో గాయపరిచారు\nచావనా బ్రతకనాయని నీవేడ్చి కుమిలిపోతే బ్రతికే వుండాలని నీ వ్యాధిని తీసివేసె\n\n4 కష్టపడెటప్పుడు ఎవ్వరు సాయం చేయరు అప్పులను తీర్చువారు అసలే లేరు\nఇష్టమైన దేవతలను  పూజించి చూశాము మన కష్టాలను తీర్చ అవి  ముందుకు రాలేదు\n\n\nఈ లోక దేవతలు అన్నియును వట్టివండి యేసుక్రీస్తు ఒక్కడే నిజమైన దేవుడండి పాపములన్ని బాపి రక్షించే దేవుడండి"},{"n":89,"ei":"Man of sorrows!","ci":"He's able, He's able","ti":"చూడుము గెత్సెమనే తోటలో నా ప్రభువు \n","es":"1.“Man of sorrows!” what a name\nFor the Son of God, who came\nRuined sinners to reclaim:\nHallelujah! what a Saviour:\n\n2.Bearing shame and scoffing rude,\nIn my place condemned he stood;\nSealed my pardon with His blood;\nHallelujah! what a Saviour:\n\n3.Guilty, vile, and helpless, we;\nSpotless Lamb of God was He:\n“Full atonement” - can it be?\nHallelujah! what a Saviour:\n\n4.“Lifted up” was He to die,\n“It is finished!” was His cry,\nNow in heaven exalted high:\nHallelujah! what a Saviour!\n\n5.When He comes, our glorious King\nAll His ransomed home to bring\nThen anew this song we’ll sing:\n“Hallelujah! what a Saviour!”","ec":"He’s able,He’s able, I know He’s able\nI know my Lord is able to carry me thru.\nHe’s able He’s able, I know He’s able\nI know my Lord is able to carry me thru.\nHe healed the broken-hearted and sets the captive free,\nHe made the lame to walk again and caused the blind to see.\nHe’s able. . .","ts":"చూడుము గెత్సెమనే తోటలో నా ప్రభువు పాపి నాకై వి-జ్ఞాపన చేసెడి ధ్వని వినబడుచున్నది పాపి నీకై విజ్ఞాపన చేసెడి ధ్వని వినబడుచున్నది\n\n1 దేహమంతయు నలిగి శోకము చెందినవాడై దేవాది దేవుని ఏకైక సుతుడు పడు వేదనలు నా కొరకే\n\n2 తండ్రి ఈ పాత్ర తొలగున్‌ నీ చిత్తమైన యెడల ఎట్లయినను నీ చిత్తము చేయుటకు నన్నప్పగించితివనెను\n\n3 రక్తపు చెమట వలన మిక్కిలి బాధనొంది రక్షకుడేసు హృదయము పగులగ విజ్ఞాపనము చేసెనే\n\n4 ముమ్మారు భూమి మీదపడి మిక్కిలి వేదనచే మనయేసు ప్రభువు తానే వేడుకొనెను పాపుల విమోచన కొరకే\n\n5 ప్రేమామృత వాక్కులచే ఆదరించెడి ప్రభువు వేదన సమయమున బాధపరచెడి వారి కొరకు ప్రార్థన చేసెనే\n\n6 నన్ను తన వలె మార్చెడి ఈ మహా ప్రేమను తలచి తలచి హృదయము కరుగగ సదా కీర్తించెదను\n"},{"n":90,"ei":"Ride on! Ride on","ci":"He's still working on me","ti":"నీ రక్తమే - నీ రక్తమే-నన్ శుధ్దీకరించున్","es":"1.Ride on! Ride on in majesty!\nHark! all the tribes “Hosanna!” cry;\nO Saviour meek, pursue Thy road,\nWith palms and scattered garments strowed.\n\n2.Ride on! Ride on in majesty!\nIn lowly pomp ride on to die:\nO Christ, Thy triumphs now begin\nO’er captive death and conquered sin.\n\n3.Ride on! Ride on in majesty!\nThe angel armies of the sky\nLook down with sad and wondering eyes\nTo see the approaching sacrifice.\n\n4.Ride on! Ride on in majesty!\nThy last and fiercest strife is nigh:\nThe Father on His sapphire throne\nAwaits His own anointed Son.\n\n5.Ride on! Ride on in majesty!\nIn lowly pomp ride on to die:\nBow Thy meek head to mortal pain, \nThen take, O God, Thy power, and reign.","ec":"He’s still working on me\nTo make me what I ought to be ;\nIt took Him just a week to make the moon and stars\nThe Sun and the Earth and Jupiter and Mars,\nHow loving and patient He must be!\nHe’s still working on me!\nIn the mirror of His word, reflections that I see\nMake me wonder why He never gave upon me!\nBut He loves me as I am and helps me when I pray;\nRemember He’s the potter I’m the clay.","ts":"నీ రక్తమే-నీ రక్తమే-నన్‌ శుద్ధీకరించున్‌  నీ రక్తమే నా బలము\n \n1.నీ రక్తధారలే యిల పాపి కాశ్రయం బిచ్చును పరిశుద్ధ తండ్రి పాపిని కడిగి పావన పర్చుము    ||నీరక్తమే||\n \n2.నశించు వారికి  నీ సిలువ వెఱ్ఱితనముగ నున్నది రక్షింపబడుచున్న  పాపికి దేవుని శక్తియైయున్నది    ||నీరక్తమే||\n \n3.నీ సిలువలో కార్చినట్టి విలువయిన రక్తములోన పరమపావన కడుగుము పవిత్ర పరచుము పాపిని    ||నీరక్తమే||\n \n4.పందివలె పొర్లిన నన్ను కుక్కవలె తిరిగిన నన్ను ప్రేమతో చేర్చుకొంటివి ప్రేమార్హ నీకె స్తోత్రము     ||నీరక్తమే||\n \n5.నన్‌ వెంబడించు సైతానున్‌నన్‌ బెదరించు సైతానున్ దునుమాడేది నీ రక్తమే దహించేది నీ రక్తమే     ||నీరక్తమే||\n \n6.స్తుతి మహిమ ఘనతయు యుగ యుగంబులకును స్తుతి పాత్ర నీకే చెల్లును స్తోత్రార్హ నీకెే తగును   ||నీరక్తమే||\n"},{"n":91,"ei":"Who can cheer the heart like Jesus","ci":"Heaven came down","ti":"ఓ యేసు నీ ప్రేమ ఎంతో మహనీయము","es":" 1.Who can cheer the heart like Jesus, \nBy His presence all divine?\nTrue and tender, pure and precious, \nO how blest to call Him mine!\n\nAll that thrills my soul is Jesus;\nHe is more than life to me;\nAnd the fairest of ten thousand,\nIn my blessed Lord I see.\n\n2.Love of Christ so freely given\nGrace of God beyond degree,\nMercy higher than the heaven,\nDeeper than the deepest sea.\n\n3.What a wonderful redemption! \nNever can a mortal know\nHow my sin, tho’ red like crimson, \nCan be whiter than the snow.\n\n4.Ev’ry need His hand supplying, \nEv’ry good in Him I see;\nOn His strength divine relying, \nHe is all in all to me.\n\n5.By the crystal flowing river\nWith the ransomed I will sing\nAnd forever and forever\nPraise and glorify the King.","ec":"Heaven came down and glory filled my soul;\nWhen at the Cross my Saviour made me whole\nMy sins were washed away and my night was turned to day\nHeaven came down and glory filled my soul.","ts":"ఓ యేసు నీ ప్రేమ ఎంతో మహనీయము ఆకాశ తార పర్వత సముద్ర ముల కన్న గొప్పది\n\n1 ఆగమ్య ఆనందమే హృదయము నిండెను ప్రభుని కార్యములు గంభీరమైనవి\nప్రతి ఉదయ సాయంత్రములు  స్తుతికి యోగ్యములు స్తుతికి యోగ్యములు\n\n2 సంకట సమయములో సాగలేకున్నాను  దయచూపు నా మీద  అని నేను మొఱ్ఱ పెట్టగా\nవింటినంటివి - నా మొఱ్ఱకు ముందే తోడు నుందు నంటివి తోడు నుందు నంటివి\n\n3 మరణాంధకారంపు లోయనే సంచరించినా నిరంతరము యేసు నాదు కాపరియై\nకరము నిచ్చి నన్ను కాయుచు నడుపును కరుణ గల ప్రభువా కరుణ గల ప్రభువా\n\n4 కొదువ లెన్నియున్న భయపడను నే నెపుడు పచ్చిక బయలులో పరుండ జేయును\nభోజన జలములతో తృప్తి పరచుచు నాతో నుండు యేసు నాతో నుండు యేసు\n\n5 దేవుని గృహములో సదా స్తుతించెదను సంపూర్ణ హృదయముతో సదా భజించెదను\nస్తుతి ప్రశంసలకు యోగ్యుడేసు  హల్లెలూయ ఆమెన్‌ హల్లెలూయ ఆమెన్‌"},{"n":92,"ei":"Who is He in yonder stall","ci":"His name is wornderful","ti":"మందలో చేరని గొఱ్ఱెలెన్నో \nకోట్ల కొలదిగా కలవు ","es":"1.Who is He in yonder stall,\nAt whose feet the shepherds fall?\n\n‘Tis the Lord! Oh, wondrous story!\n‘Tis the Lord, the king of glory!\nAt His feet we humbly fall\nCrown Him! crown Him, Lord of all!\n\n2.Who is He in deep distress\nFasting in the wilderness?\n\n3.Who is He the people bless\nFor His words of gentleness?\n\n4.Who is He to whom they bring\nAll the sick and sorrowing?\n\n5.Who is He that stands and weeps\nAt the grave where Lazarus sleeps?\n\n6.Who is He the gathering throng\nGreet with loud triumphant song?\n\n7.Lo! At midnight, who is He\nPrays in dark Gethsemane?\n\n8.Who is He on yonder tree\nDies in grief and agony?\n\n9.Who is He who from the grave\nComes to succour, help, and save?\n\n10.Who is He who from His throne\nRules through all the worlds alone?","ec":"His name is wonderful (3)\nJesus, my Lord---\nHe is the mighty King,\nMaster of everything,\nHis Name is wonderful, Jesus my Lord.\nHe’s the great Shepherd,\nThe Rock of all ages,\nAlmighty God is He\nBow down before Him\nLove and adore Him,\nHis name is wonderful, Jesus my Lord.","ts":"మందలో చేరని గొఱ్ఱెలెన్నో కోట్ల కొలదిగా కలవు యిల ఆత్మల కొరకై వేదనతో \nవెదకెదము రమ్ము ఓ సంఘమా రమ్మనె యేసు రాజును చేరా-నడిపించు\n\n1 అడవులలో పలు స్థలములలో నా ప్రజలెందుకు చావవలెన్‌ వారి నిమిత్తమై శ్రమపడితిన్‌\nమరి వారిని వెదకెడి వారెవరు రమ్మనె యేసు రాజును చేరా-నడిపించున్‌ ||మంద||\n\n2 ప్రకటించని స్థలములు కలవు చాటించు వారు కలరిచ్చట పిలువబడిన వారందరును\nమన ప్రభువాజ్ఞకు లోబడుడి రమ్మనె యేసు రాజును చేరా-నడిపించున్‌   ||మంద||\n\n3 నాకై పలికెడు నాలుకలు నా వలె నడిచెడి పాదములు నన్ను ప్రేమించెడి హృదయములు\nకావలె నాకవి నీవిచ్చెదవా రమ్మనె యేసు రాజును చేరా-నడిపించున్‌   ||మంద||\n"},{"n":93,"ei":"Forty days and fortynights","ci":"Holy, Holy, Holy","ti":"ఎన్ని తలచినా ఏది అడిగినా ","es":"1.Forty days and forty nights,\nThou wast fasting in the wild,\nForty days and forty nights,\nTempted, and yet undefiled.\n\n2.Sunbeams scorching all the day\nChilly dew drops nightly shed,\nProwling beasts about Thy way,\nStones Thy pillow, earth Thy bed.\n\n3.Let us Thy endurance share\nAnd from earthly greed abstain\nWith Thee watching unto prayer,\nWith Thee strong to suffer pain.\n\n4.And if Satan, vexing sore,\nFlesh or spirit should assail,\nThou, his Vanquisher before,\nGrant we may not faint nor fail.\n\n5.So shall we have peace divine;\nHolier gladness ours shall be;\nRound us too shall angels shine,\nSuch as ministered to Thee.","ec":"1.Holy, Holy, Holy, Holy,  Holy, Holy\nLord God almighty!\nAnd we lift our hearts before You\nAs a token of our love;\nHoly, holy, holy, holy.\n\n2.Gracious Father, gracious Father\nWe’re so blessed to be Your children, gracious Father\nAnd we lift our hearts before\nYou as a token of our love:\nGracious Father, gracious Father.\n\n3.Precious Jesus, precious Jesus\nWe’re so glad that You’ve redeemed us, precious Jesus;\nAnd we lift our hands before You\nAs a token of our love,\nPrecious Jesus, precious Jesus.","ts":"ఎన్ని తలచినా ఏది అడిగినా జరిగేది నీ చిత్తమే ప్రభువా\nనీ వాక్కుకై వేచి యుంటిని నా ప్రార్థన ఆలకించుమా - ప్రభువా\n\n1.నీ తోడు లేక నీ ప్రేమ లేక యిలలోన ఏ ప్రాణి నిలువలేదు (2)\nఅడవి పువ్వులే నీ ప్రేమ పొందగా నా ప్రార్థన ఆలకించుమా ప్రభువా\n\n2.నా యింటి దీపం నీవే అని తెలిసి నా హృదయం నీ కొరకై పదిలపరచితి (2)\nఆరిపోయిన నా వెలుగు దీపము (2) వెలిగించుము నీ ప్రేమలో ప్రభువా\n\n3.ఆపదలు నన్ను వెన్నంటియున్ననా కాపరి నీవై నన్నాదుకొంటివి (2)\nలోకమంతయు నన్ను విడిచిన (2) నీ నుండి వేరు చేయవు ప్రభువా\n\n4.నా స్థితి గమనించి నన్ను ప్రేమించి నా కొరకై కల్వరిలో యాగమైతివి\nనీదు యాగమే నా మోక్ష భాగ్యము నీ యందే నిత్య జీవము ప్రభువా\n"},{"n":94,"ei":"Jesus, thou joy of","ci":"Hosanna, Hosanna","ti":"ఎందుకో నన్నింతగా నీవు","es":"1.Jesus, Thou joy of loving hearts, \nThou Fount of Life, Thou Light of men,\nFrom the best bliss that earth imparts\nWe turn unfilled to Thee again.\n\n2.Thy truth unchanged hath ever stood; \nThou savest those that on Thee call; \nTo them that seek Thee, Thou art good; \nTo them that find Thee, All in all.\n\n3.We taste Thee, O Thou living Bread, \nAnd long to feast upon Thee still; \nWe drink of Thee, the Fountain head,\nAnd thirst our souls from Thee to fill.\n\n4.Our restless spirits yearn for Thee, \nWhere’er our changeful lot is cast;\nGlad, when Thy gracious smile we see; \nBlest,when our faith can hold Thee fast.\n\n5.O Jesus, ever with us stay; \nMake all our moments calm and bright;\nChase the dark night of sin away; \nShed o’er the world Thy holy light.","ec":"1.Hosanna, Hosanna\nHosanna in the highest,\n\nLord we lift up Your name\nWith hearts full of Praise,\nBe exalted O Lord our God\nHosanna in the Highest.\n\n2.Glory, Glory, Glory to the King of kings.\n\n3.Jesus, Jesus, Jesus is the King of kings.","ts":"ఎందుకో నన్నింతగా నీవు ప్రేమించితివో దేవా అందుకో నా దీన స్తుతి పాత్ర హల్లెలూయ యేసయ్య    ||ఎందుకో||\n \n1.నా పాపము బాప నరరూపివైనావు నా శాపము బాప నలిగి వ్రేలాడితివి నాకు చాలిన దేవుడవు నీవే నా స్థానములో నీవే   ||ఎందుకో||\n \n2.నీ రూపము నాలో నిర్మించియున్నావు నీ పోలికలోనే నివసించుచున్నాను నీవు నన్ను యెన్నుకున్నావు నీ కొరకే నీ కృపలో   ||ఎందుకో||\n \n3.నా శ్రమలు సహించి నా ఆశ్రయమైనావు నా వ్యధలు భరించి నన్నాదుకొన్నావు నన్ను నీలో చూచుకున్నావు నన్ను దాచియున్నావు  ||ఎందుకో||\n \n4.నీ సన్నిధి నాలో నా సర్వము నీలో నీ సంపద నాలో నా సంతసము నీలో నీవు నేను ఏకమగువరకు నన్ను విడువనందువే     ||ఎందుకో||\n \n5.నా మనవులు ముందే నీ మనస్సులో నెరవేరె నా మనుగడ ముందే నీ గ్రంథములో నుండె ఏమి అద్భుత ప్రేమ-సంకల్పం నేనేమి చెల్లింతు  ||ఎందుకో||"},{"n":95,"ei":"Jesus, what a beautiful","ci":"How lovely on the mountains","ti":"అత్యున్నత సింహాసనముపై \nఆశీనుడవైన నా దేవా ","es":"1.Jesus, what a beautiful name!\nSon of God, Son of man\nLamb that was slain\nJoy and peace, strength and hope\nGrace that blows all fear away\nJesus, what a beautiful name!\n\n2.Jesus what a beautiful name!\nTruth revealed, my future sealedHealed my pain\nLove and freedom, life and warmth\nGrace that blows all fear away\nJesus, what a beautiful name!\n\n3.Jesus, what a beautiful name!\nRescued my soul, my strong hold\nLift me from shame\nForgiveness security, power and love\nGrace that blows all fear away\nJesus, what a beautiful name!","ec":"How lovely on the mountains\nAre the feet of Him\nWho brings good news,good news.\nProclaiming peace announcing news of happiness,\nOur God reigns. (6)","ts":"అత్యున్నత సింహాసనముపై ఆశీనుడవైన నా దేవా అత్యంత ప్రేమ స్వరూపివినీవే\nఆరాధింతును నిన్నే ఆహాహా హల్లెలూయా (3) ఆ..మేన్‌\n\n1.ఆశ్చర్యకరుడా స్తోత్రం ఆలోచనకర్తా స్తోత్రం\nబలమైన దేవా నిత్యుడవగు తండ్రి సమాధాన అధిపతి స్తోత్రం\n\n2.కృపాసత్య సంపూర్ణుడ స్తోత్రం కృపతో రక్షించితివే స్త్తోత్రం\nనీరక్తమిచ్చి విమోచించినావే నా రక్షణ కర్తా స్తోత్రం\n\n3.స్తుతులపై ఆసీనుడా స్తోత్రం సంపూర్ణుడా నీకు స్తోత్రం\nమా ప్రార్థనలను ఆలించువాడా మా ప్రధాన యాజకుడా స్తోత్రం\n\n4.మృత్యుంజయుడా స్తోత్రం మహా ఘనుడా స్తోత్రం\nమమ్మును కొనిపోవా త్వరలో రానున్న మేఘవాహనుడా స్తోత్రం\n\n5. ఆమేన్‌ అనువాడా స్తోత్రం ఆల్ఫా ఓమేగా స్తోత్రం\nఅగ్నిజ్వాలల వంటి కన్నులు కలవాడా అత్యున్నతుడా స్తోత్రం"},{"n":96,"ei":"O to be like thee","ci":"I am a debtor, Lord","ti":"స్తోత్రించి  కీర్ర్తింతుము ఘనపరచేదము","es":"1.O to be like Thee! Blessed Redeemer\nThis is my constant longing and prayer;\nGladly I’ll forfeit all of earth’s treasures,\nJesus Thy perfect likeness to wear\n\nO to be like Thee! O to be like Thee,\nBlessed Redeemer, pure as Thou art!\nCome in Thy sweetness, come in Thy fullness;\nStamp Thine own image deep on my heart.\n\n2.O to be like Thee! Full of compassion,\nLoving, forgiving, tender and kind;\nHelping the helpless, cheering the fainting,\nSeeking the wand’ring sinner to find.\n\n3.O to be like Thee! LowIy, in spirit,\nHoly and harmless, patient and brave;\nMeekly enduring cruel reproaches,\nWilling to suffer others to save.\n\n4.O to be like Thee! Lord, I am corning\nNow to receive that anointing divine;\nAll that I am and have I am bringing\nLord, from this moment all shall be Thine.\n\n5.O to be like Thee! While I am pleading,\nPour out Thy Spirit, fill with Thy love;\nMake me a temple meet for Thy dwelling,\nFit me for life and heaven above.","ec":"I am a debtor, Lord,a debtor for life\nKeep me from wasteful self and strife\nB’cause of the Cross,O Lord, I owe you my all\nMy spirit’s moved by Your tender call.\nYou have brought me I know, With your precious Blood\nTimeless Calvary’s pleading love has stood\nHow can I draw back\nAnd not be wholly Thine\nLove and serve,nor call anything mine.","ts":"స్తోత్రించి కీర్తింతుము ఘనపరచెదము – కొనియాడెదము ఆదరించి - కాపాడువాడు యీడేర్చువాడు    ||స్తోత్రి||\n\n1.మన కింతవరకు - సహాయపడెన్‌ తానప్పగిం - చుకొనె మనకై మనల నడిపెను – సుఖముగను తనదు సత్యము నేర్పించి కనుపాపగ కాచె ఆ...ఆ...ఆ... తనదు సత్యము నేర్పించి...  ||స్తోత్రి||\n\n2.ఈ ధరలోని నరులలో యథార్థ హృదయులకు ముదమున తన చి - త్తము తెలుపన్‌ పదిలముగా ప్రభు కన్నులు పృధివిని పరుగెత్తు ఆ...ఆ...ఆ... పదిలముగా ప్రభు కన్నులు...  ||స్తోత్రి||\n \n3.అన్ని సమయ – ములలో కన్నులతో బోధించును నన్ను మార్చెను తప్పినన్ పన్నుగ హృదయము నాదరించె అన్న గురు యేసు ఆ...ఆ...ఆ...  పన్నుగ హృదయము...   ||స్తోత్రి||\n \n4.అగ్నివంటి కన్నులు విఘ్నముల నుండి విడిపించున్ తగిన సహాయము చేయును ఎక్కాల మందును కునుకవు మక్కువ పిల్లలకు ఆ...ఆ...ఆ...  ఎక్కాలమందును... ||స్తోత్రి||\n \n5.హాగరును చూచిన కన్నులు అనేకుల చూచెను ఇశ్రాయేలును కనికరించె ఎజ్రాకు సహాయపడెన్‌ నిద్రించవు నెపుడు ఆ...ఆ...ఆ...  ఎజ్రాకు సహాయ...   ||స్తోత్రి||\n \n6.నీతిమంతు - ల జూచె  దాది బోలి కాచెను జ్యోతులవలె నుండును అతి బలమిచ్చును అవసరతన్‌ క్షితి నిను విడువడు ఆ...ఆ...ఆ... అతి బలమిచ్చును అవ...   ||స్తోత్రి||\n \n7.ఏడు కన్నులు - గలవాడు  నేడు నాడు కాపాడున్‌  ఎడతెగని  చెడుగుల బాపున్‌ ఱేడుల నేర్పరచువాడు పాడుడి హల్లెలూయ ఆ...ఆ...ఆ...  ఱేడుల నేర్పరచువాడు   ||స్తోత్రి||"},{"n":97,"ei":"When I survey","ci":"I am the way, the Truth","ti":"స్తోత్రము రాజా ఆ...ఆ... స్తోత్రము రాజా \n","es":"1.When I survey the wondrous Cross\nOn which the Prince of glory died,\nMy richest gain  I count but loss,\nAnd pour contempt on all my pride.\n\n2.Forbid it Lord, that I should boast,\nSave in the Cross of Christ my God:\nAll the vain things that charm me most,\nI sacrifice them to His blood.\n\n3.See from His head, His hands, His feet,\nSorrow and love flow mingled down:\nDid e’er such love and sorrow meet\nOr thorns compose so rich a crown?\n\n4.Were the whole realm of nature mine,\nThat were an offering far too small;\nLove so amazing, so divine,\nDemands my soul, my life, my all!","ec":"I am the Way, the Truth and the Life\nThat’s what Jesus said (2)\nWithout the Way, there is no going,\nWithout the Truth, there is no knowing,\nWithout the Life, there is no living\nI am the Way, the Truth and the Life,\nThat’s what Jesus said.","ts":"స్తోత్రము రాజా ఆ...ఆ... స్తోత్రము రాజా \nస్తోత్రము రాజాధి రాజా...\n\n1 స్తోత్రపాత్రుడ పూజ్యనీయుడా నిత్యము నాశ్రితుల పాలుడ\nసత్యుడా పరలోక వాసుడ నిత్యుడా శ్రీ యేసు నాథుడా  ||స్తోత్ర||\n\n2 ఆకసము నీ మహిమను యిహ లోకమందలి సర్వమును\nయేకముగ స్తుతియించుచుండ నీ కర్పించెద జిహ్వఫలము  ||స్తోత్ర||\n\n3 యిడుములు కడుసుడుల కైవడి వడివడిగను పెనుగొనంగ\nవిడువను నెడబాయనంచు విజయమిచ్చిన యేసునాథుడా ||స్తోత్ర||\n\n4 మరణచ్ఛాయ లోయలోబడి తెరవు గానక నరుగువేళ \nపరమ కనికర కరముచే నను సరిగ నడిపిన మాదు ప్రభువా ||స్తోత్ర||\n\n5 అరయ నాలో నీదు రూపము సరిగ నేర్పడు వరకు నన్ను\nతరచు శ్రమల యనుభవంబున పొరల జేసిన యేసునాథుడా  ||స్తోత్ర||"},{"n":98,"ei":"Down at the Cross where","ci":"I can do everything","ti":"స్తుతి గీతముల నిలపాడరే","es":"1.Down at the Cross where my Saviour died,\nDown where for cleansing from sin I cried,\nThere to my heart was the blood applied; \nGlory to His name.\n\nGlory to His name. Glory to His name\nThere to my heart was the blood applied; \nGlory to His name.\n\n2.I am so wondrously saved from sin, \nJesus so sweetly abides within;\nThere at the cross where He took me in; \nGlory to His name.\n\n3.Oh, precious fountain that saves from sin, \nI am so glad I have entered in;\nThere Jesus saves me and keeps me clean; \nGlory to His name.\n\n4.Come to this fountain so rich  and sweet; \nCast thy poor soul at the Saviour’s feet;\nPlunge in today, and be made complete; \nGlory to His name.","ec":"I can do everything, (can do)\nEverything through Him,\n(can do) everything through Him\nWho gives me strength,\nI can do, I can do.\nI can do, everything (2)\nEverything, everything, everything\nThough Him who gives me strength.\nI can do...","ts":"స్తుతి గీతముల నిలపాడరె స్తోత్రార్హ ప్రభువునకు మితిలేని ప్రేమచే - పాపుల వెదకియు రక్షింపను వచ్చెన్‌\n \n1.పరమందు దూతలు పరిశుద్ధులు - ప్రభు  సన్నిధినిన్‌ జేరి నిరతంబు యిహమున జరిగిన యీ ఘన - కార్యము దలచెదరు  ||స్తుతి||\n \n2.హల్లెలూయ యనుచును బాడరే ఇమ్మానుయేలునకు కలుషంబులను - బాపను మనకై వెల - సెను కలువరి గిరిపై  ||స్తుతి||\n \n3.జయగీతముల నిల పాడరే జయశీలు డేసునకు జయశీలుడై లేచెను మృతిగెల్చియు మూడవ దివసమున    ||స్తుతి||\n \n4.భూలోక సైన్య సమూహమా ప్రకటింపు మీ ప్రభుని ఏ లోకమందైనను  శ్రీ యేసుడె రక్షకుడె యనుచు  ||స్తుతి||\n \n5.పరిశుద్ధుడు సంపూర్ణుడు పరిపూర్ణుడా ప్రభువే నిరతంబు తను గొల్చెడి నరులకు తన - పరిశుద్ధత నిచ్చున్‌   ||స్తుతి||\n \n6.రా రండి రక్షణ నొంద పరుగిడి రండి ప్రభు కడకున్ జేరండి యేసుని జేరిన త్రోయడు చేరెడు వారలను   ||స్తుతి||\n\n7.ఘనతయు మహిమయు చెల్లును గాక  ఘనుడగు ప్రభువునకు ఘన తండ్రి కొమర - పరిశుద్ధాత్ముల త్రియేక దేవునకు  ||స్తుతి||"},{"n":99,"ei":"Beneath yhe Cross of Jesus","ci":"I cast all my cares upon","ti":"సర్వశక్తుని స్తోత్ర గానము సల్పరే జగ మెల్లను \n","es":"1.Beneath the Cross of Jesus\nI fain would take my stand,\nThe shadow of a mighty rock,\nWithin a weary land;\nA home within the wilderness,\nA rest upon the way,\nFrom the burning of the noontide heat,\nAnd the burden of the day.\n\n2.O safe and happy shelter!\nO refuge tried and sweet!\nO trysting place where heaven’s love\nAnd heaven’s justice meet!\nAs to the holy patriarch\nThat wondrous dream was given,\nSo seems my Saviour’s cross to me, \nA ladder up to heaven.\n\n3.There lies, beneath its shadow,\nBut on the farther side,\nThe darkness of an awful grave\nThat gapes both deep and wide:\nAnd there between us stands the cross\nTwo arms outstretched to save;\nLike a watchman set to guard     the way \nFrom that eternal grave.\n\n4.Upon that cross of Jesus\nMine eye at times can see\nThe very dying form of One\nWho suffered there for me;\nAnd from my smitten heart, with tears\nTwo wonders I confess\nThe wonders of His glorious love,\nAnd my own worthlessness.\n\n5.I take, O cross, thy shadow,\nFor my abiding place;\nI ask no other sunshine\nThan the sunshine of His face;\nContent to let the world go by,\nTo know no gain nor loss\nMy sinful self my only shame,\nMy glory all the cross.","ec":"I cast all my cares upon You,\nI lay all of my burdens,\nDown at Your feet,\nAnd any time I don’t know what to do\nI will cast all my cares upon You.","ts":"సర్వశక్తుని స్తోత్ర గానము సల్పరే జగ మెల్లను \nనిర్వహించును దాస భారము  నిత్యమెద రాజిల్లను\n\n1.ముదముతో నిర్మాణకుండగు మూల కర్తను బాడరే \nవదన మీక్ష్మాన్వంచి దేవుని వందనముతో వేడరే\n\n2.వేదపారాయణము సేయుచు విశ్వమంత జయింపరే\nసాదరముగా దేవునిక మీ స్వాంతమున బూజింపరే\n\n3.ఎదను విశ్రాంతిన్‌ పరేశుని హెచ్చుగా నుతిసేయరే \nసదమలంబగు భక్తితో మీ సర్వ మాయన కీయరే\n\n4.చావు పుట్టుక లేనివాడుగ సతతము జీవించును\nఈవులిచ్చుచు దన్ను వేడుమ హేష్టులను రక్షించును\n\n5.దాసులై దేవునికి నెదలో దర్పమును బోగాల్పరే\nయేసు క్రీస్తుని పుణ్యవస్త్రము నే మరక మైదాల్పరే"},{"n":100,"ei":"Blessed be the fountain","ci":"I delight greatly in the","ti":"దేవునికి స్తోత్రము – గానము చేయుటయే - మంచిది\n","es":"1.Blessed be the fountain of blood,\nTo a world of sinners revealed;\nBlessed be the dear Son of God,\nOnly by His stripes we are healed.\nThough I’ve wandered far from His fold,\nBringing to my heart pain and woe,\nWash me in the blood of the Lamb,\nAnd I shall be whiter than snow.\n\nWhiter than the snow!\nWhiter than the snow!\nWash me in the blood of the Lamb!\nAnd I shall be whiter than snow!\n\n2.Thorny was the crown that He wore\nOn the cross, with scoffing and shame;\nGrievous were the sorrows He bore,\nMy  eternal salvation to gain.\nMay I to that fountain be led,\nOpened for my sins here below;\nWash me in the blood that He shed,\nAnd I shall be whiter than snow!\n\n3.Father, I have wandered from Thee,\nOften has my heart gone astray;\nCrimson do my sins seem to me\nWater cannot wash them away.\nJesus, to that fountain of Thine,\nLeaning on Thy promise, I go!\nCleanse me by Thy washing divine,\nAnd I shall be whiter than snow!","ec":"I delight greatly in the Lord,\nMy soul rejoices in my God (2)\nFor He has clothed me with  garments of salvation,\nAnd arrayed me in a robe of righteousness.-2","ts":"దేవునికి స్తోత్రము – గానము చేయుటయే - మంచిది\nమనమందరము స్తుతి - గానము చేయుటయే - మంచిది\n\n1.యెరూషలేము యెహోవయె  కట్టుచున్న వాడని ఇశ్రాయేలీయులను ప్రోగు చేయువాడని\n\n2.గుండె చెదరిన వారిని  బాగుచేయువాడని వారి గాయములన్నియు కట్టుచున్న వాడని\n\n3.ప్రభువు గొప్పవాడును అధికశక్తి సంపన్నుడు జ్ఞానమునకు ఆయనే మితియు లేని వాడని\n\n4.దీనులకు అండాయనే భక్తిహీనుల కూల్చును సితారాతో దేవుని స్తుతులతో కీర్తించుడి\n\n5.గుఱ్ఱముల నరులందలి బలము నా నందించడు కృపకు వేడువారిలో  సంతసించువాడని\n\n6.యెరూషలేమ యెహోవాను సీయోనూ నీ దేవుని కీర్తించుము కొనియాడుము ఆనందించువాడని"},{"n":101,"ei":"Jesus keep me near","ci":"I delight to do thy will","ti":"యెహోవాను గానము చేసెదము ఏకముగా\n","es":"1.Jesus keep me near Cross;\nThere a precious fountain,\nFree to all- a healing stream-\nFlows from Calvary’s mountain.\n\nIn the cross, In the cross,\nBe my glory ever;\nTill my raptured soul shall find\nRest beyond the river.\n\n2.Near the Cross,a trembling soul,\nLove and mercy found me;\nThere the Bright and Morning Star,\nShed its beams around me.\n\n3.Near the cross, O Lamb of God,\nBring its scenes before me;\nHelp me walk from day to day,\nWith its shadow o’er me.\n\n4.Near the Cross I’ll watch and wait,\nHoping, trusting ever,\nTill I reach the golden strand,\nJust beyond the river.","ec":"I delight to do Thy will, O Lord\nI delight to do Thy will\nAnd to walk with Thee is not grievous unto me,\nFor I delight to do Thy will.","ts":"యెహోవాను గానము చేసెదము ఏకముగా\nయెహోవాను గానము చేసెదము ఏకముగా\n\n1.యుద్ధశూరు డెహోవా  నా బలము నా గానము నా పితరుల దేవుడు ఆయన పేరు యెహోవా\n\n2.ఫరో రథముల సేనలను తన శ్రేష్ఠాధి పతులను ఎఱ్ఱసముద్రములోన ముంచివేసె నెహోవా\n\n3. నీ మహిమాతిశయమున కోపాగ్ని రగులజేసి చెత్తవలె దహించెదవు నీపై లేచువారిని\n\n4.దోపుడు సొమ్ము పంచుకొని  ఆశ తీర్చుకొందును నా కత్తి దూసెదను అని శత్రువనుకొనెను\n\n5.వేల్పులలో నీ సముడెవడు పరిశుద్ధ మహనీయుడా అద్భుతమైన పూజ్యుండా  నీ వంటి వాడెవడు\n\n6.ఇశ్రాయేలీయులంతా  ఎంతో సురక్షితముగా సముద్రము మధ్యను ఆరిన నేలను నడిచిరి "},{"n":102,"ei":"Oh, teach me what it","ci":"I have decided to follow","ti":"కొండల తట్టు - కన్నులెత్తుచున్నాను\n","es":"1.Oh, teach me what it meaneth \nThat cross uplifted high,\nWith One - the Man of Sorrows \nCondemned to bleed and die!\nOh, teach me what it cost Thee \nTo make a sinner whole;\nAnd teach me, Saviour, teach me \nThe value of a soul!\n\n2.Oh, teach me what it meaneth \nThat sacred crimson tide -\nThe blood and water flowing \nFrom Thine own wounded side.\nTeach me that if none other \nHad sinned, but I alone,\nYet still, Thy blood, Lord Jesus,\nThine only, must atone.\n\n3.Oh, teach me what it meaneth -\nThy love beyond compare,\nThe love that reacheth deeper \nThan depths of self-despair!\nYea, teach me, till there gloweth \nIn this cold heart of mine\nSome feeble, pale reflection \nOf that pure love of Thine.\n\n4.Oh, teach me what it meaneth, \nFor I am full of sin\nAnd grace alone can reach me, \nAnd love alone can win.\nOh, teach me, for I need Thee, \nI have no hope beside -\nThe chief of all the sinners \nFor whom the Saviour died!\n\n5.O infinite Redeemer! \nI bring no other plea,\nBecause Thou dost invite me \nI cast myself on Thee.\nBecause Thou dost accept me \nI love and I adore;\nBecause Thy love constraineth, \nI’ll praise Thee evermore!","ec":"I have decided to follow Jesus (3)\nNo turning back. (2)\nThe world behind me,\nThe Cross before me (3)\nNo turning back.","ts":"కొండల తట్టు - కన్నులెత్తుచున్నాను నాకు సహాయ - మెక్కడ నుండి వచ్చును\n\n1.భూమి ఆకాశములను - సృజించిన యెహోవా వలన - సాయము కల్గున్‌\n\n2.నీ పాదము తొట్రిల్ల - నీయడు నిన్ను కాపాడువాడు-కునుకడు\n\n3.ఇశ్రాయేలును కాచు - దేవుడు కునుకడు నిద్రపోడు-యెన్నడు\n\n4.యెహోవాయే నిన్ను - కాపాడును నీ కుడి ప్రక్క నీడగా - నుండున్‌\n\n5.పగటెండ - రాత్రి వెన్నెల - దెబ్బ నీకు తగులకుండ నిను-గాపాడున్‌\n\n6.ఎట్టి అపాయము రా - కుండగను ఆయన నీ ప్రాణమును - గాపాడున్‌\n\n7.ఇది మొదలుకొని నిత్యము నీ రాకపోకలందు నిను-గాపాడున్‌ "},{"n":103,"ei":"On a hill far away","ci":"I have hidden your word","ti":"యేసు నాదు కాపరి వాని వాసిగా స్తుతించెదన్‌ ","es":"1.On a hill far away stood an old, rugged cross,\nThe emblem of suff'ring and shame;\nAnd I love that old cross where the dearest and best\nFor a world of lost sinners was slain.\n\nSo I'll cherish the old rugged cross,\nTill my trophies at last I lay down;\nI will cling to the old rugged cross,\nAnd exchange it some day for a crown.\n\n2.Oh, that old rugged cross, so despised by the world,\nHas a wondrous attraction for me;\nFor the dear Lamb of God left His glory above \nTo bear it to dark Calvary.\n\n3.In the old rugged cross, stained with blood so divine,\nA wondrous beauty I see;\nFor 'twas on that old cross  Jesus suffered and died\nTo pardon and sanctify me.\n\n4.To the old rugged cross I will ever be true,\nIts shame and reproach gladly bear;\nThen He'll call me some day to my home far away,\nWhere His glory forever I'll share.","ec":"I have hidden Your Word in my heart\nThat I might not sin against You(2)\nThat I might not sin against You(2)\nI have hidden . . .","ts":"యేసు నాదు కాపరి వాని వాసిగా స్తుతించెదన్‌ యేసు గొఱ్ఱె పిల్లను పోయెదను తనవెంట\n\n1. పచ్చిక  పట్లకు - మచ్చికతో నడుపున్‌ స్వఛ్ఛ జలము చెంత నిచ్చును విశ్రాంతిన్‌ ముందు ముందు వెళ్ళుచు\nపొందుగ రక్షించు నన్ను తన మాధుర్య స్వరంబున తనివి దీర్చును\n\n2. మరణ లోయ ద్వారా సరిగా నడిపించును అడవి భయము లెల్ల ఎడబాపి రక్షించున్‌ హత్తి \nఒత్తి కట్టి గాయా లెంతో ఆదరించును వింతగు వాని ప్రేమ సేవలో సంతోషింతును\n\n3. శత్రుల ముందాహారం సంసిద్ధము జేయున నా గిన్నె నిండించి పొర్లి పారజేసి కడిగి కడిగి శుద్ధిచేసి \nఆత్మ దాన మిచ్చెను వడిగ వాని సాయమున జయమున వెళ్ళెదను"},{"n":104,"ei":"There is a fountain filled","ci":"I have tasted a freedom","ti":"భజన చేయుచు భక్త్ పాలక","es":"1.There is a fountain filled with blood\nDrawn from Immanuel’s veins,\nAnd sinners plunged beneath that  flood,\nLose all their guilty stains.\n\n2.The dying thief rejoiced to see\nThat fountain in his day:\nAnd there may I, though vile as he, \nWash all my sins away.\n\n3.Dear dying Lamb, Thy precious blood\nShall never lose its power\nTill all the ransomed church of God\nBe saved, to sin no more.\n\n4.E’er since by faith I saw the stream\nThy flowing wounds supply,\nRedeeming love has been my theme,\nAnd shall be till I die.\n\n5.Then in a nobler, sweeter song\nI’ll sing Thy power to save,\n When this poor, lisping, stammering tongue\nLies silent in the grave.","ec":"1.I have tasted a freedom,\nI can go where He’s leading,\nThe shackles can hold me no more.\nI have learned of life’s essence\nAs I stand in His presence,\nAnd sing with my heart, He is Lord.\n\nKeep silent, ye mountains,\nYe fields and ye fountains,\nFor this is the time I must sing;\nIt’s the time to sing praises\nTo the Rock of the Ages,\nAnd this is the time I must sing.\n\n2.There are days filled with sorrow,\nAnd plans for tomorrow,\nBut this is the time I must sing;\nAnd I know there’s a reason\nWhy in His own season\nGod gives me a song I can sing.","ts":"భజన చేయుచు భక్త పాలక ప్రస్తుతింతు నీ నామమును వృజినములపై జయము నిచ్చిన విజయుడా నిను వేడుకొందు  ||భజన||\n\n1.దివ్యపదవిని విడిచి నీవు దీనుడవై పుట్టినావు  భవ్యమైన బోధలెన్నో బాగుగా ధర నేర్పినావు  ||భజన||\n\n2.నరులగావను పరమునుండి ధరకు నీవు వచ్చినావు  పరుడనైన నాకొరకు నీ ప్రాణము నర్పించినావు   ||భజన||\n\n3.చెడినవాడనైన నన్ను జేరదీసి బ్రోచినావు పడిన నాదు గోతి నుండి పైకి లేవనెత్తినావు   ||భజన||\n\n4.ఎంత ప్రేమ యెంత దయ ఎంత కృప యేసయ్య నీకు ఇంతయని వర్ణింప నిలలో నెవరికిని సాధ్యంబు కాదు  ||భజన||\n"},{"n":105,"ei":"What can wash away","ci":"I know a fount where","ti":"హే ప్రభుయేసు - హే ప్రభు యేసు\n","es":"1.What can wash away my stain?\nNothing  but the  blood of Jesus!\nWhat can make me whole again?\nNothing but the blood of Jesus!\n\nOh, precious is the flow\nThat makes me white as snow!\nNo other fount I know\t\nNothing but the blood of Jesus!\n\n2.For my cleansing this I see -\nNothing but the blood of Jesus!\nFor my pardon this my plea -\nNothing but the  blood of Jesus!\n\n3.Nothing can for sin atone -\nNothing but the blood of Jesus!\nNaught of good that I have done -\nNothing but the blood of Jesus!\n\n4.This is all my hope and peace -\nNothing but the blood of Jesus!\nThis is all my righteousness -\nNothing but the blood of Jesus!","ec":"I know a fount where sins are washed away;\nI know a place where night is turned to day;\nBurdens are lifted, blind eyes made to see;\nThere’s a wonder working pow’r in the blood of Calvary.","ts":"హే ప్రభుయేసు - హే ప్రభు యేసు\nహే ప్రభు దేవసుతా సిల్వ ధరా, పాప హరా, శాంతికరా \n\n1.శాంతి సమాధానాధిపతీ స్వాంతములో ప్రశాంతనిధీ\nశాంతి స్వరూపా, జీవనదీపా శాంతి సువార్తనిధీ\n\n2.తపములు తరచిన నిన్నె గదా జపములు గొలిచిన నిన్నెగదా\nవిఫలులు జేసిన విజ్ఞాపనలకు సఫలత వీవెగదా\n\n3.మతములు వెదకిన నిన్నె గదా వ్రతములు గోరిన నిన్నె గదా\nపతితులు దేవుని సుతులని నేర్పిన హితమతి వీవెగదా\n\n3.మతములు వెదకిన నిన్నె గదా వ్రతములు గోరిన నిన్నె గదా\nపతితులు దేవుని సుతులని నేర్పిన హితమతి వీవెగదా\n\n4.పలుకులలో నీశాంతి కథ తొలకరి వానగ గురిసెగదా\nమలమల మాడిన మానవ హృదయము కలకలలాడెకదా\n\n5.కాననతుల్య సమాజములో హీనత జెందెను\nమానవత మానవ మైత్రిని సిల్వపతాకము దానము జేసెగదా\n\n6.దేవుని బాసిన లోకములో చావుయె కాపురముండెగదా\nదేవునితో సఖ్యంబును జగతికి యీవి నిడితివి గదా\n\n7.పాపముచేసిన స్త్రీనిగని పాపులకోపము మండెగదా\nదాపునజేరి పాపిని బ్రోచిన కాపరి వీవెగదా\n\n8.ఖాళీ సమాధిలో మరణమును ఖైదిగ చేసిన నీవెగదా\nఖలమయుడగు సాతానుని గర్వము ఖండనమాయెగదా\n\n9.కలువరిలో నీ శాంతి సుధా సెలయేఱుగ బ్రవహించెగదా\nకలుష యెడారిలో కలువలు పూయుట సిలువ విజయముగదా"},{"n":106,"ei":"Alas! And did my Saviour","ci":"I love the thrill that I fell","ti":"భీకరుండౌ మా యెహోవా ","es":"1.Alas! and did my Saviour bleed? \nAnd did my Sovereign die?\nWould He devote that sacred head \nFor such a worm as I?\n\nHelp me, dear Saviour, Thee to own,\nAnd ever faithful be;\nAnd when Thou sittest on Thy throne,\nO Lord, remember me!\n\n2.Was it for sins that I had done \nHe groaned upon the tree?\nAmazing pity! grace unknown! \nAnd love beyond degree!\n\n3.Well might the sun in darkness hide, \nAnd shut his glories in,\nWhen Christ, the mighty Maker died \nFor man the creature’s sin.\n\n4.Thus might I hide my blushing face \nWhile His dear cross appears,\nDissolve my heart in thankfulness, \nAnd melt mine eyes to tears.\n\n5.But drops of grief can ne’er repay \nThe debt of love I owe:\nHere, Lord, I give myself away; \n‘Tis all that I can do.","ec":"I love the thrill that I feel when\nI get together with,\nGod’s wonderful people;\nLove the thrill that I feel\nwhen I get together with,\nGod’s wonderful people;\nWhat a sight just to see all the happy faces,\nPraising God in heavenly places,\nWhat a thrill that I feel when I get together with\nGod’s wonderful people.","ts":"భీకరుండౌ మా యెహోవా పీఠ మెదుటం గూడరే యేకమై సాష్టాంగపడి సర్వేశ్వరుని గొనియాడరే    ||భీక||\n\n1.మట్టితోనే మమ్ము నెల్ల మానవులుగ సృజించెను ఇట్టి శక్తుండౌ ప్రభున్మే మెచ్చుగా మది నెంతుము  ||భీక||\n\n2.ఏరితోడు లేక మము స ర్వేశ్వరుడు సృష్టించెను ధారుణిందానొక్కడే మా దైవమని పూజింతుము  ||భీక||\n\n3.పుట్టగిట్టంజేయఁదానై నట్టిదేవుని శక్తిని బట్టుగా లోకస్థులారా ప్రస్తుతింపరే భక్తిని   ||భీక||\n\n4.మేటి సంగీతంబులుపై మింట నారవ మొందను జాటరే వేవేల నోళ్లన్‌ సన్నుతుల్‌ ప్రభు వందను  ||భీక||\n\n5.మిక్కిలి కష్టంబులతో మిత్తికిని బాల్పొందను దిక్కులేని గొఱ్ఱెలట్లు దిగరుగజేర్పన్‌ మందను   ||భీక||"},{"n":107,"ei":"Christ has for sin aton","ci":"I love you Lord, and lift","ti":"సర్వచిత్తంబు నీదేనయ్యా ","es":"1.Christ has for sin atonement made:\nWhat a wonderful Saviour!\nWe are redeemed! the price is paid!\nWhat a wonderful Saviour!\n\nWhat a wonderful Saviour is Jesus, my Jesus!\nWhat a wonderful Saviour is Jesus, my Lord!\n\n2.I praise Him for the cleansing blood:\nWhat a wonderful Saviour!\nThat reconciled my soul to God;\nWhat a wonderful Saviour!\n\n3.He dwells within me day by day;\nWhat a wonderful Saviour!\nAnd keeps me faithful all the way:\nWhat a wonderful Saviour!\n\n4.He gives me overcoming power:\nWhat a wonderful Saviour!\nAnd triumph in each conflict hour:\nWhat a wonderful Saviour!\n\n5.To Him I’ve given all my heart:\nWhat a wonderful Saviour!\nThe world shall never share a part:\nWhat a wonderful Saviour!","ec":"I love you Lord, and I lift my voice\nTo worship You,O my soul rejoice.\nTake joy my King, in what You hear,\nMay it be a sweet, sweet sound in Your ear.","ts":"1. సర్వచిత్తంబు నీదేనయ్యా స్వరూపమిచ్చు కుమ్మరివే\nసారెపై నున్న మంటినయ్యా సరియైన పాత్రన్‌ చేయుమయ్యా\nసర్వేశ్వరా నేరిక్తుండను సర్వదా నిన్నే సేవింతును \nసర్వచిత్తంబు నీదేనయ్యా స్వరూపమిచ్చు కుమ్మరివే\n\n2. ప్రభూ! సిద్ధించు నీ చిత్తమే ప్రార్థించుచుంటి నీ సన్నిధి పరికింపు నన్నీదివసంబున\nపరిశుభ్రమైన హిమముకన్న పరిశుద్ధున్‌ చేసి పాలింపుమా పాపంబుబోవ నను గడుగుమా\n\n3. నీ చిత్తమే సిద్ధించు ప్రభూ నిన్నే ప్రార్థింతు నా రక్షకా నీచమౌ గాయముల చేతను\nనిత్యంబు కృంగి అలసియుండ నిజమైన సర్వశక్తుండవే నీ చేత బట్టినన్‌ రక్షింపుమా\n\n4.ఆత్మస్వరూప నీ చిత్తమే అనిశంబు చెల్లు ఇహపరమున అధికంబుగా నన్నీ యాత్మతో\nఆవరింపుమో నా రక్షకా అందరు నాలో క్రీస్తుని జూడ ఆత్మతో నన్ను నింపుముదేవా"},{"n":108,"ei":"Lord Jesus, I long to be","ci":"I own everything, simply","ti":"యేసు ప్రభుని స్తుతించుట\nయెంతో యెంతో మంచిది\n","es":"1.Lord Jesus, I long to be perfectly whole;\nI want Thee forever to live in my soul.\nBreak down ev’ry idol, cast out ev’ry foe\nNow wash me and I shall be whither than snow.\n\nWhiter than snow, yes, whiter than snow\nNow wash me and I shall be whiter than snow.\n\n2.Lord Jesus, look down from Thy throne in the skies\nAnd help me to make a complete sacrifice.\nI give up myself and whatever I know\nNow wash me and I shall be whither than snow.\n\n3.Lord Jesus, for this I most humbly entreat;\nI wait, blessed Lord, at Thy crucified feet.\nBy faith, for my cleansing I see Thy blood flow\nNow wash me and I shall be whiter than snow.\n\n4.Lord Jesus, Thou seest I patiently wait;\nCome now and within me a new heart create.\nTo those who have sought Thee Thou never said’st “No”\nNow wash me and I shall be whiter than snow.","ec":"I owe everything, simply everything\nI owe everything to my Lord.\nI owe everything, every little thing\nI owe everything to my Lord.\n\n1.My Lord loved me first\nHe loved me long ago\nLong before I knew of Him,\nHe had His eye on me,\nBefore I was born, He loved me then\nAnd He loves me still.\n\n2.I owe much to friends\nWho’ve encouraged me\nHelped and prayed for me on my way\nYet I know those friends\nAre just one great part,\nOf the everything from my Lord.\n\n3.Help me share it out,\nAll you’ve given me\nWith the world that I live in\n’Cause I can’t hold it all,\nIt’s too much for me\nHelp me share it out with my friends.","ts":"యేసు ప్రభుని స్తుతించుట \nయెంతో యెంతో మంచిది \n\n1.మహోన్నతుడా - నీ నామమును \nస్తుతించుటయే బహు మంచిది\n\nహల్లెలూయ - హల్లెలూయ\nహల్లెలూయ- హల్లెలూయ\n\n2.విలువైన రక్తము - సిలువలో కార్చి\nకలుషాత్ముల మమ్ము ప్రభు కడిగెను\n\n3.ఎంతో గొప్ప - రక్షణ నిచ్చి \nవింతైన జనముగ - మము జేసెను\n\n4.మా శైలము - మా కేడెము\nమా కోటయు - మా ప్రభువే\n\n5.ఉన్నత దుర్గము - రక్షణ శృంగము \nరక్షించువాడు - మన దేవుడు\n\n6.అతి సుందరుడు - అందరిలోన\nఅతికాంక్షనీయుడు-అతి ప్రియుడు\n\n7.రాత్రింబవళ్ళు - వేనోళ్ళతోను\t \nస్తుతించుటయే - బహుమంచిది "},{"n":109,"ei":"Christ the Lord is risen today","ci":"I took a plunge in the","ti":"నీవు చేసిన ఉపకారములకు\nనేనేమి చెల్లింతును ","es":"1.Christ the Lord is risen today; Hallelujah!\nSons of men and angels say, Hallelujah!\nRaise your joys and triumphs high;   hallelujah!\nSing, ye heavens; thou earth, reply, Hallelujah!\n\n2.Love’s redeeming work is done, Hallelujah!\nFought the fight, the battle won, Hallelujah!\nLo! our Sun’s eclipse is o’er, Hallelujah!\nLo! He sets in blood no more. Hallelujah!\n\n3.Vain the stone, the watch, the seal, Hallelujah!\nChrist hath burst the gates of hell, Hallelujah!\nDeath in vain forbids Him rise! Hallelujah!\nChrist hath opened paradise, Hallelujah!\n\n4.Lives again our glorious King! Hallelujah!\nWhere, O death, is now thy sting? Hallelujah!\nOnce He died our souls to save, Hallelujah!\nWhere thy victory, O grave? Hallelujah!\n\n5.Soar we now where Christ hath led, Hallelujah!\nFollowing our exalted Head, Hallelujah!\nMade like Him, like Him we rise, Hallelujah!\nOurs the cross, the grave, the skies, Hallelujah!\n\n6.Hail the Lord of earth and heaven, Hallelujah!\nPraise to Thee by both be given, Hallelujah!\nThee we greet triumphant now, Hallelujah!\nHail, the Resurrection Thou! Hallelujah!","ec":"I took a plunge in the crimson flood\nThat washes white as snow,\nI took a drink at the Fountain head;\nAnd it satisfies I know;\nI took a look at the Christ of the cross,\nAnd my burdens rolled away -\nAnd I’m shouting singing “Praise the Lord!”\nFor the happy, happy day.","ts":"నీవు చేసిన ఉపకారములకు నేనేమి చెల్లింతును ఏడాది దూడలనా - వేలాది పొట్టేళ్ళనా\n\n1.వేలాది నదులంత విస్తారతైలము నీకిచ్చినా చాలునా గర్భఫలమైన నా జ్యేష్ఠపుత్రుని  నీకిచ్చినా చాలునా\n\n2.మరణ పాత్రుడనైయున్న నాకై మరణించితివి సిలువలో కరుణ చూపి నీ దివ్య మార్గాన  నడిపించుమో యేసయ్యా\n\n3.విరిగి నలిగిన బలియాగముగను నా హృదయమర్పింతును రక్షణ పాత్రను చేబూని నిత్యము నిను వెంబడించెదను\n\n4.ఈ గొప్ప రక్షణ నాకిచ్చినందుకు నేనేమి చెల్లింతును కపట మనస్సు లేకుండ హృదయాన్ని నీకిచ్చినా చాలునా"},{"n":110,"ei":"Low in the grave He lay","ci":"I want a river of life flowing","ti":"సర్ర్వకృపానిధియగు  ప్రభువా","es":"1.Low in the grave He lay -\nJesus, my Saviour!\nWaiting the coming day -\nJesus, my Lord!\n\nch:Up from the grave He arose,\nWith a mighty triumph o’er His foes;\nHe arose a Victor from  the dark domain,\nAnd He lives for ever with His saints to reign!\n\nHe arose! He arose!\nHallelujah! Christ arose!\n\n2.Vainly they watch His bed -\nJesus, my Saviour!\nVainly they seal the dead -\nJesus, my Lord!\n\n3.Death cannot keep his prey -\nJesus, my Saviour!\nHe tore the bars away -\nJesus, my Lord!","ec":"I want a river of life flowing out of me\nThat makes the lame to walk and the blind to see\nOpen prison doors, set the captive free\nI want a river of life . . .\nSpring up O well, within my soul\nSpring up O well, and make me whole\nSpring up O well, and give to me That life abundantly.","ts":"1.సర్వకృపానిధియగు ప్రభువా\nసకల చరాచర సంతోషమా\nస్తోత్రము చేసి స్తుతించెదను\nసంతసముగ నిను పొగడెదను\n\nహల్లెలూయా హల్లెలూయా  హల్లెలూయా యనిపాడెదను\t\nఆనందముతో సాగెదను\n\n2.ప్రేమించి నన్ను వెదకితివి\nప్రీతితో నను రక్షించితివి\nపరిశుద్ధముగ జీవించుటకై \nపాపిని నను కరుణించితివి  ||హ||\n\n3.అల్పకాల శ్రమలనుభవింప\nఅనుదినము కృపనిచ్చితివి\nనాథుని అడుగు జాడలలో\nనడచుటకు నన్ను పిలిచితివి     ||హ||\n\n4.మరణ శరీరము మార్పునొంది\nమహిమ శరీరము పొందుటకై  \nమహిమాత్మతో నను నింపితివి\t\nమరణ భయములను తీర్చితివి   ||హ||\n\n5.భువినుండి శ్రేష్టఫలముగను\nదేవునికి నిత్య స్వాస్థ్యముగా \nభూజనములలో నుండి నను \nప్రేమించి క్రయధనమిచ్చితివి   ||హ||\n\n\n6.ఎవరు పాడని గీతమును\nయేసుని గూర్చి పాడుటకై\nహేతువు లేకయే ప్రేమించెను\nయేసుకు నేనేమివ్వగలను   ||హ||\n\t\nసమస్త దేశములారాఅందరు పాడుడి\nఅందరు పాడుడి అందరు యెహోవాకు\nఉత్సాహధ్వని చేయండి"},{"n":111,"ei":"Hellelujah! Hellelujah! Hellelujah!","ci":"I want to be more than","ti":"సమస్త దేశములారా అందరు పాడుడి\n","es":"1.Hallelujah! Hallelujah! Hallelujah!\nThe strife is o'er, the battle done;\nThe victory of life is won;\nThe song of triumph  has begun.\nHallelujah!\n\n2.The powers of death have done their worst,\nBut Christ their legions hath dispersed;\nLet shouts of holy joy outburst;\nHallelujah!\n\n3.The three sad days have quickly sped:\nHe rises glorious from the dead;\nAll glory to our risen Head!\nHallelujah!\n\n4.He brake the bonds of death and hell;\nThe bars from heaven's high portals fell;\nLet hymns of praise His triumph tell.\nHallelujah!\n\n5.Lord, by the stripes which wounded Thee, \nFrom death's dread sting Thy servants free,\nThat we may live, and sing to Thee\nHallelujah!","ec":"I want to be more than a\nSunday go to meetin’ Christian\nI want a religion that\nThrills me ev’ryday;\nSayin’ “Amen” to the preacher is fine,\nIf all the week I let my light shine;\nI want to be more than a sunday go to meetin’ Christian.","ts":"సమస్త దేశములారా అందరు పాడుడి అందరు పాడుడి \nఅందరు యెహోవాకు ఉత్సాహధ్వని చేయండి\n\n1.సంతోషముతో యెహోవాను స్తుతించుడి ఉత్సాహ గానము చేయుచు సన్నిధికి రండి   ||సమ||\n\n2.యెహోవా మీ దేవుడని తెలిసికొనుడి ఆయనే మనలను కలుగజేసెను  ||సమ||\n\n3.మనము ఆయన ప్రజలమైతిమి ఆయన మేపు గొఱ్ఱెలము నైతిమి   ||సమ||\n\n4.గుమ్మములలో కృతజ్ఞతార్పణలతోను ఆవరణములలో కీర్తనలతో ప్రవేశించుడి  ||సమ||\n\n5.ఆయనను స్తుతించుడి ఆయనను స్తుతించుడి ఆయన నామమునకు స్తుతులు చెల్లించుడి  ||సమ|| \n\n6.యెహోవా దయాళుడాయన కృప నిత్యము ఆయన సత్యము తరతరములుండును   ||సమ|| "},{"n":112,"ei":"Good Christian men, rejoice","ci":"I was sinking deep in sin","ti":"తరతరాలలో, యుగయుగాలలో\n","es":"1.Good Christian men, rejoice and sing!\nNow is the triumph of our King!\nTo all the world glad news we bring:\nAlleluia! Alleluia! Alleluia!\n\n2.The Lord of life is risen for aye;\nBring the flowers of song to strew his way;\nLet all mankind rejoice and say:\nAlleluia! Alleluia! Alleluia!\n\n3.Praise we in songs of victory  \nThat love, that love, that life which cannot die,\nAnd sing with hearts uplifted high: \nAlleluia! Alleluia! Alleluia!\n\n4.Thy name we bless, O risen Lord, \nAnd sing today with one accord\nThe life laid down, the life restored:\nAlleluia! Alleluia! Alleluia!","ec":"I was sinking deep in sin,\nFar from the peaceful shore,\nVery deeply stained within,\nSinking to rise no more;\nBut the Master of the sea\nHeard my despairing cry,\nFrom the waters lifted me\nNow safe am I.\n\nLove lifted me! Love lifted me!\nWhen nothing else could help,\nLove lifted me! (Repeat)","ts":"తరతరాలలో, యుగయుగాలలో జగజగాలలో దేవుడు... దేవుడు... యేసే దేవుడు ఆ... ఆ... ఆ... ఆ... \nహల్లెలూయా  హల్లెలూయా  హల్లెలూయా  హల్లెలూయా\n\n1.భూమిని పుట్టించక మునుపు లోకపు పునాది లేనపుడు ||దే||\n\n2.సృష్టికి శిల్పాకారుడు జగతికి ఆది సంభూతుడు ||దే|| \n\n3.తండ్రి కుమార శుద్ధాత్మయు ఒకటైయున్న దేవుడు   ||దే||"},{"n":113,"ei":"This is the day the Lord","ci":"I was weary and tired","ti":"ప్రభువా తరతరములనుండి మాకు నివాస స్థలము నివే","es":"1.This is the day the Lord hath made,\nHe calls the hours His own;\nLet heaven rejoice, let earth be glad,\nAnd praise surround the throne.\n\n2.Today He rose and left the dead,\nAnd Satan’s empire fell;\nToday the saints His triumphs spread,\nAnd all His wonders tell.\n\n3.Hosanna to the anointed King,\nTo David’s holy Son!\nMake haste to help us, Lord, and bring\nSalvation from Thy throne.\n\n4.Blest be the Lord, who comes to men\nWith messages of grace;\nWho comes, in God His Father’s Name,\nTo save our sinful race.\n\n5.Hosanna in the highest strains\nThe church on earth can raise;\nThe highest heavens in which He reigns\nShall give Him nobler praise.","ec":"I was weary and tired with sins dark ways,\nAnd helplessly lost I could see;\nBut with joy was amazed, as at Calv’ry I gazed,\nThere was grace enough left there for me.\nI cried unto Jesus and bowed to His will\nThe joy of His spirit, my heart then did fill;\nAnd wonder of wonders!\nO sinner, ’tis true,\nThere is grace enough left there for you.","ts":"1.ప్రభువా తరతరములనుండి మాకు నివాస స్థలమునీవే యుగయుగములకును నీవే మా దేవుడవు దేవుడవు దేవుడవు దేవుడవు.\n \n2.పర్వతములు పుట్టకమునుపు భూమిని లోకమును నీవు పుట్టింపక మునుపు గూడ నున్నావు నున్నావు  నున్నావు నున్నావు         \n\n3.నరపుత్రులను మంటికి మార్చి తిరిగి  రండని  సెలవిచ్చెదవ వేయి సంవత్సరములు నీకొక జామువలె జామువలె జామువలె జామువలె\n \n4.నీదు దృష్టికి వేయి యేండ్లు గతించిన నిన్నటివలె నున్నవి రాత్రియందొక జాముకు సమముగ నున్నవి నున్నవి నున్నవి నున్నవి            \n\n5.నీవు వారిని పారగొట్టగ వరద చేతనైన రీతి గడ్డివలె చిగిరించి వాడి పోయెదరు పోయెదరు పోయెదరు పోయెదరు.    \n\n6.ప్రొద్దుట మొలచి చిగిరించును  సాయంత్రమున కోయబడును వాడబారును నీ కోపముచే క్షీణించున్‌ క్షీణించున్‌ క్షీణించున్‌ క్షీణించున్‌     \n\n7.నీదు కోపము వలన మేము క్షీణించుచున్నాము దేవా నీ ఉగ్రతను బట్టి దిగులు పొందెదము పొందెదము  పొందెదము పొందెదము  "},{"n":114,"ei":"I serve a risen Saviours","ci":"I will bless thee, O Lord","ti":"దేవా - నా దేవుడవు నీవె","es":"1.I serve a risen Saviour, \nHe’s in the world today;\nknow that He is living, \nwhatever men may say;\nI see His hand of mercy,\nI hear His voice of cheer,\nAnd just the time I need Him \nHe’s always near.\n\nHe lives, He lives, Christ Jesus lives today!\nHe walks with me and talks with me\nAlong life’s narrow way,\nHe lives, He lives, salvation to impart!\nYou ask me how I know He lives?\nHe lives within my heart.\n\n2.In all the world around me\nI see His loving care,\nAnd though my heart grows weary \nI never will despair;\nI know that He is leading through \nall the stormy blast,\nThe day of His appearing will come at last.\n\n3.Rejoice, rejoice, O Christian,\nLift up your voice and sing\nEternal hallelujahs to Jesus Christ the King!\nThe hope of all who seek Him,\nThe help of all who find,\nNone other is so loving, so good and kind.","ec":"I will bless Thee, O Lord -2\nWith a heart of thanksgiving,\nI will bless Thee, O Lord.\nWith my hands lifted up,\nAnd my mouth filled with praise,\nWith a heart of thanksgiving,\nI will bless Thee, O Lord.","ts":"దేవా - నా దేవుడవు నీవె వేకువనే - వెదకెద నిన్ను \n\n1.నీ బలము ప్రభావములను చూడవలెనని యాశతోడ పరిశుద్ధాలయ మందు నీ తట్టు కనిపెట్టుదును   ||దేవా||\n\n2.నీళ్ళులేక ఎండియున్న దేశమందు నా ప్రాణము నీ కొరకు దాహమొంది దేహము కృశించుచున్నది  ||దేవా||\n\n3.నీ కృప జీవము కన్న ఉత్తమము నా పెదవులు నిన్ను స్తుతించున్‌  జీవితకాలమెల్ల స్తుతింతు నీ నామమును బట్టి చేతులెత్తెదన్‌  ||దేవా||\n\n4.రాత్రి జాములందు నిన్ను ధ్యానించు తరుణమున క్రొవ్వు మెదడు దొరికినట్లుగా నా ప్రాణము తృప్తినొందుచున్నది   ||దేవా||\n\n5.ఉత్సహించెడు పెదవులతో నా నోరు నిన్ను గూర్చి గానము చేయుచున్నది నా సహాయ కుడా నీ రెక్కల చాటున   ||దేవా||"},{"n":115,"ei":"Thine be the glory, risen","ci":"I will call upon the Lord","ti":"రండి యుత్సాహించి పాడుదము","es":"1.Thine be the glory, risen conqu’ring Son\nEndless is the vict’ry Thou o’er death has won.\nAngels in bright raiment rolled the stone away;\nKept the folded grave clothes where Thy body lay.\n\nThine be the glory, risen conqu’ring Son\nEndless is the vict’ry Thou o’er death has won.\n\n2.Lo, Jesus meets us,risen from the tomb!\nLovingly He greets us, scatters fear and gloom\nLet the church with gladness Hymns of triumph sing;\nFor her Lord now liveth, Death hath lost its sting.\n\n3.No more we doubt Thee,Glorious Prince of life;\nLife is naught without Thee,Aid us in our strife;\nMake us more than conquerors,Through Thy deathless love;\nLead us in Thy triumph to Thy  home above.","ec":"I will call upon the Lord\nWho is worthy to be praised\nSo shall I be saved\nFrom mine enemies\n\nThe Lord liveth,\nAnd blessed be my rock\nAnd may the God of my salvation\nBe exalted.   (Repeat)","ts":"రండి యుత్సాహించి పాడుదము రక్షణ దుర్గము మన ప్రభువే\n\n1.రండి కృతజ్ఞత స్తోత్రముతో రారాజు సన్నిధికేగుదము సత్ప్రభు నామము కీర్తనలన్‌ సంతోషగానము చేయుదము  ||రండి||\n\n2.మన ప్రభువే మహాదేవుండు ఘన మహాత్మ్యముగల రాజు భూమ్యాగాధపు లోయలును భూధర శిఖరము లాయనవే   ||రండి||\n\n3.సముద్రము సృస్టించె నాయనదే సత్యుని హస్తమే భువిన్‌ జేసెన్‌ ఆయన దైవము పాలితుల మాయన మేపెడి గొఱ్ఱెలము  ||రండి||\n\n4.ఆ ప్రభు సన్నిధిన్‌ మోకరించి ఆయన ముందర మ్రొక్కుదము ఆయన మాటల గైకొనిన నయ్యవి మనకెంతో మేలగును ||రండి||\n\n5.తండ్రి కుమార శుద్ధాత్మకును దగు స్తుతి మహిమలు కల్గుగాక ఆదిని నిప్పుడు నెల్లప్పుడు - నయినట్లు  యుగములనౌను ఆమెన్‌  ||రండి||"},{"n":116,"ei":"Oh, now I see the cleansing","ci":"I will enter his gates with","ti":"హల్లెలూయ హల్లెలూయ హల్లెలూయ హల్లెలూయ ","es":"1.Oh, now I see the cleansing wave!\nThe fountain deep and wide;\nJesus, my Lord, mighty to save,\nPoints to His wounded side.\n\nThe cleansing stream I see, I see!\nI plunge, and oh, it cleanseth me!\nOh, praise the Lord! it cleanseth me.\nIt cleanseth me, yes, cleanseth me.\n\n2.I see the new creation rise;\nI hear the speaking blood!\nIt speaks! polluted nature dies!\nSinks ‘neath the cleansing flood.\n\n3.I rise to walk in heaven’s own light,\nAbove the world and sin,\nWith heart made pure, and garments white, \nAnd Christ enthroned within.\n\n4.Amazing grace! ‘tis heav’n below\nTo feel the blood applied\nAnd Jesus, only Jesus, know\nMy Jesus crucified.","ec":"I will enter His gates with\nthanksgiving in my heart,\nI will enter His courts with praise.\nI will say, “This is the day that the Lord has made,”\nI  will rejoice for He has made me glad,\nHe has made me glad, (2)\nI  will rejoice for He has made me glad. (Repeat last two lines)","ts":"హల్లెలూయ హల్లెలూయ హల్లెలూయ హల్లెలూయ\nఇది మా స్తుతిగానము అభినందన సుమగీతమాల\nఅనుదినము నూతన వాత్సల్యముతో నడిసించె నాథుడా\nనీ మేలులను తలంచుచు హర్షించి స్తుతిపాడెదం\n\n1. అనుదిన భారములన్‌ భరించు దేవుడవు వెలలేని నీ ప్రేమ శాశ్వతమైనది ప్రభువా హృదయాన్ని అర్పించి నీ చిత్తము చేశా\n\n2.మరణపు లోయలలో సంకటసమయములో విడిపించి కాపాడి ఆదరించిన దేవా సంపూర్ణ హృదయముతో సదా స్తుతించెదము\n"},{"n":117,"ei":"When the morning breaks","ci":"I will make you fishers","ti":"అన్ని కాలంబుల - నున్న యెహోవా\n","es":"1.When the morning breaks, and when I awake\nThis my prayer would be:\nLord, today I would ask of Thee\nMore like Jesus that I should be.\n\nI would be like Jesus, \nOnly by His grace,\nMore and more like Jesus\n'Til I see Him face to face.\n\n2.Through each day as I work  and play;\nHis word commands me to be\nDoing always the things that only will\nTo Him bring the glory.\n\n3.Then when everyone sings that happy song\nWe will join with them too,\n'Til at last when Jesus does arrive,\nWe will go with Him too.\n\nOh! To be like Jesus, \nWalking hand in hand\nTo be like Jesus\n'Til I see Him face to face.","ec":"I will make you fishers of men,\nFishers of men, fishers of men,\nI will make you fishers of men,\nIf you follow Me,\nIf you follow Me,\nIf you follow Me,\nI will make you fishers of men,\nIf you follow Me.","ts":"అన్ని కాలంబుల - నున్న యెహోవా నిన్నెన్నదరంబయో - కన్న తండ్రి \nవన్నె కెక్కిన మోక్ష – వాసాళి సన్నుతు లున్నతమై యుండ - మున్నె నీకు \n\n1 నిన్ను ప్రకటన సేయ నిఖిల లోకములను - బన్నుగ జేసిన బలుడ వీవే - ఉన్న లోకంబుల \nనుడుగక కరుణా సం - పన్నతతో నేలు - ప్రభుడ వీవే అన్ని జీవుల నెరిగి యాహార మిచ్చుచు \nనున్న సర్వజ్ఞుం - డవు నీవే యెన్న శక్యము గాక-ఉన్న లక్షణముల \nసన్నుతించుటకు నే జాలుదునా\n||నన్ని|| \n\n2 పుట్టింప నీవంచు బోషింప నీవంచు గిట్టింప నీవంచు  గీర్తింతును \nవట్టి పనికి మాలి - నట్టి మానవుల చే పట్టి రక్షింప బా - ధ్యుండవంచు – దట్టమైన కృపను – దరిజేర్చ నాకిచ్చి పట్టయి నిలచియుండు – ప్రభుడవంచు గట్టడచే గడ – ముట్టుదనుక నా పట్టుకొలది నిన్ను- బ్రస్తుతింతు \n||నన్ని|| \n\n3 కారుణ్య నిధి వీవు కఠినాత్ముడను నేను \nపరి శుద్ధుడవీవు పాపి నేను సార భాగ్యుడవీవు జగతిలో నాకన్న దారిద్రుడే లేడు - తరచి చూడ\nసార సద్గుణముల సంపన్నుడవు నీవు ఘోర దుర్గుణ సం - చారి నేను \nఏ రీతి స్తుతి యింతు నేరీతి సేవింతు నేరమెన్నక ప్రోవ - నెర నమ్మితి \n||నన్ని|| "},{"n":118,"ei":"Mine eyes have seen","ci":"I will sing of the mercies","ti":"నీతి సూర్యుండ నిను బోలిన రక్షకుడెందును గలడె? ","es":"1.Mine eyes have seen the glory \nOf the coming of the Lord;\nHe is trampling out the vintage \nWhere the grapes of wrath are stored;\nHe hath loosed the fateful lightning \nOf his terrible swift sword;\nHis truth is marching on.\n\nGlory! Glory! Hallelujah!\nGlory! Glory! Hallelujah!\nGlory! Glory! Hallelujah!\nHis truth is marching on.\n\n2.He has sounded forth the trumpet\nThat shall never call retreat;\nHe is sifting out the hearts of men\nBefore his judgment seat;\nO be swift, my soul, to answer him,\nBe jubilant, my feet!\nOur God is marching on.\n\n3.In the beauty of the lilies\nChrist was born across the sea,\nWith a glory in his bosom \nThat transfigures you and me.\nAs he died to make men holy,\nLet us die to make men free!\nWhile God is marching on.\n\n4.He is coming like the glory\nOf the morning on the wave;\nHe is wisdom to the mighty, \nHe is honour to the brave;\nSo the world shall be his footstool,\nAnd the soul of wrong his slave.\nOur God is marching on.","ec":"I will sing of the mercies of the Lord forever,\nI will sing! I will sing!\nI will sing of the mercies of the Lord forever,\nI will sing of the mercies of the Lord.\nWith my mouth will I make known Thy faithfulness,Thy faithfulness.\nWith my mouth will I make known\nThy faithfulness to all generations.\nI will sing of the mercies of the Lord forever\nI will sing of the mercies of the Lord.","ts":"నీతి సూర్యుండ నిను బోలిన రక్షకుడెందును గలడె? పాతకములు బాపగ నీతో జాలిన ప్రభుడెవ్వండో భువిలో నీతికి కర్త నిజస్వరూప \nనిత్యము మము వెలిగించెడు\n\n1 జీవపు వెలుగై జీవులకును నీ జీవంబిచ్చితివా దేవా జీవము నొందగ రారు నీదరికి జీవుల నిరతము బ్రోచెడి\n||నీతి|| \n\n2 రక్తము కార్చి విముక్తుల జేసిన రక్షకుడౌ నీవె జగతిన్‌ రక్తము చిందించితి నా కొరకై రక్షణ పాపికి నిచ్చిన\n||నీతి|| \n\n3 నిను కనుగొన నిజ యత్నము జేసిన మానవులున్‌ గలరా భువిలో నిను వెదకెడు వారికి దొరికెదవు నిను కనుగొందురు నిజముగ   \n||నీతి||"},{"n":119,"ei":"There's a call comes ringing","ci":"I will sing unto the Lord for","ti":"స్తుతియించు ప్రియుడా సదా యేసుని","es":"1. There a call comes ringing o’er the restless wave,\n“Send the light,... send,  the light!”\nThere are souls to rescue, there are souls to save,\n“Send the light... send the light!”...\n\nSend the light,...the blessed gospel light!\nLet it shine... from shore to shore!...\nLet it shine forever more!\n\n2. We have heard the Macedonian call today,\n“Send the light... send the light!”\nAnd our grateful off’rings at the cross we lay,\n“Send the light,... send the light!”...\n\n3. May he grace of Jesus unto all a bound,\n“Send the light,... send the light!”\nAnd a Christ like spirit ev’ry where be found,\n“Send the light,... send the light!”...\n\n4. Let us not grow weary in the work of love,\n“Send the light,... send the light!”\nWhile we gather jewels for our crown above,\n“Send the light,... send the light!”...","ec":"I will sing unto the Lord ,\nFor He has triumphed gloriously,\nThe horse and rider fell into the sea. (repeat)\n\n1.The Lord is God and \nI will praise Him;\nThe Lord is God and \nI will exalt Him.  (repeat)\n\n2.I will sing unto the Lord, for He has \ntriumphed gloriously,\nThe grave is empty won’t you \ncome and see.  (repeat)","ts":"స్తుతియించు ప్రియుడా - సదా యేసుని ఓ... ప్రియుడా - సదా యేసుని\n\n1.నరకము నుండి - నను రక్షించి\nపరలోకములో - చేర్చుకున్నాడు\n\nఆనంద జలనిధి - నానందించి\nకొనియాడు సదా యేసుని   ||ఆనంద||\n\nఆనంద జలనిధి - నానందించి\nకొనియాడు సదా యేసుని\n\n2.సార్వత్రికాధి - కారి యేసు\nనా రక్షణకై నిరుపేద యాయె ||ఆనంద||\n\nఆనంద జలనిధి - నానందించి\nకొనియాడు సదా యేసుని \n\n3.పాప దండన భయమును బాపి\nపరమానందము మనకొసగెను  ||ఆనంద||\n\nఆనంద జలనిధి - నానందించి\nకొనియాడు సదా యేసుని\n\n4.మన ప్రియ యేసు -వచ్చుచున్నాడు\nమహిమ శరీరము మనకొసగును  ||ఆనంద||\n\nఆనంద జలనిధి - నానందించి\nకొనియాడు సదా యేసుని "},{"n":120,"ei":"There's a  work for Jesus","ci":"I will sing unto the Lord as","ti":"నా ప్రాణ ప్రియుడా యేసు రాజా","es":"1.There’s a work for Jesus\nReady at your hand,\n’Tis a task the Master\nJust for you has planned.\nHaste to do His bidding,\nYield Him service true;\nThere’s a work for Jesus\nNone but you can do.\n\nWork for Jesus, day by day,\nServe Him ever, falter never, Christ obey.\nYield Him service, loyal, true:\nThere’s a work for Jesus none but you can do.\n\n2.There’s a work for Jesus,\nHumble though it be,\n‘Tis the very service\nHe would ask of thee.\nGo where fields are whitened,\nAnd the labourers few;\nThere’s a work for Jesus\nNone but you can do.\n\n3.There’s a work for Jesus,\nPrecious souls to bring;\nTell them of His mercies,\nTell them of your King.\nFaint not, grow not weary,\nHe will strength renew;\nThere’s a work for Jesus\nNone but you can do.","ec":"I will sing unto the Lord as long as I live,\nI will sing praise  to my  God while I have my being,\nMy meditation of Him shall be sweet\nI will be glad, I will be glad in the Lord.\nbless thou the Lord, Oh,my soul,Praise ye the Lord. (4)","ts":"నా ప్రాణ ప్రియుడా యేసురాజా అర్పింతును నా హృదయార్పణ విరిగి నలిగిన ఆత్మతోను హృదయ పూర్వక ఆరాధనతో సత్యముగా\n\n1.అద్భుత కరుడా ఆలోచన  ఆశ్చర్య సమాధాన ప్రభువా బలవంతుడా బహు ప్రియుడా మనోహరుడా మహిమ రాజా స్తుతించెదన్‌   ||నా ఆత్మ||\n\n2.విమోచన గానములతో సౌందర్య ప్రేమ స్తుతులతో నమస్కరించి ఆరాధింతున్‌ హర్షింతును నే పాడెదను నా ప్రభువా   ||నా ఆత్మ||\n\n3.గర్భమున పుట్టిన బిడ్డను కరుణింపక తల్లి మరచునా మరచిన గాని నీ వెన్నడు మరువవు విడువవు ఎడబాయవు కరుణరాజా  ||నా ఆత్మ||\n\n4.రక్షణాలంకారములను అక్షయమగు నీ యాహారమున్‌ రక్షకుడా నా కొసగితివి దీక్షతో నిన్ను వీక్షించుచు స్తుతింతును   ||నా ఆత్మ||\n \n5.నీ నీతిని నీ రక్షణను నా పెదవులు ప్రకటించును కృతజ్ఞతా స్తుతుల తోడ నీ ప్రేమను నే వివరింతును విమోచకా   ||నా ఆత్మ||\n \n6.వాగ్దానముల్‌ నాలో నెరవేరెను విమోచించి నాకిచ్చితివే పాడెదను ప్రహర్షింతును హల్లెలూయ  హల్లెలూయ హల్లెలూయ   ||నా ఆత్మ||"},{"n":121,"ei":"Once again the Gospel","ci":"I will worship","ti":"నాదు ప్రాణమా - నాదు ప్రాణమా","es":"1.Once again the Gospel message,\nFrom the Saviour you have heard;\nWill you heed the invitation?\nWill you turn and seek the Lord?\n\nCome believing! come believing!\nCome to Jesus! look and live!\nCome believing! come believing!\nCome to Jesus! look and live!\n\n2.Many summers you have wasted,\nRipened harvests you have seen;\nWinter snows by Spring have melted,\nYet you linger in your sin.\n\n3.Jesus for your choice is waiting;\nTarry not: at once decide!\nWhile the Spirit now is striving,\nYield, and seek the Saviour’s side.\n\n4.Cease of fitness to be thinking;\nDo not longer try to feel;\nIt is trusting, and not feeling,\nThat will give the Spirit’s seal.\n\n5.Let your will to God be given,\nTrust in Christ’s atoning blood;\nLook to Jesus now in heaven,\nRest on His unchanging word.","ec":"1.I will worship (I will worship)\nWith all of my heart.(with all of my heart)\nI will praise You (I will praise You)\nWith all of my strength. (all my strength)\nI will seek You (I will seek You)\nAll of my days. (all of my days)\nI will follow (I will follow)\nAll of Your ways. (all Your ways)\n\nI will give You all my worship,\nI will give You all my praise.\nYou alone I long to worship,\nYou alone are worthy of my praise.\n\n2.I will bow down, (I will bow down)\nHail You as king. (Hail You as King)\nI will serve You (I will serve You)\nGive You everything. (give You everything)\nI will lift up (I will lift up)\nMy eyes to Your throne, (my eyes to Your throne)\nI will trust You, (I will trust You)\nI will trust You alone. (trust You alone)","ts":"నాదు ప్రాణమా - నాదు ప్రాణమా దేవుని క్రియల్మరువకుమా ఆయన చేసిన దేనిన్‌ మరువకుమా\n\n1.వ్యర్ధుడవై – నాశనంబౌ నిన్ను రక్షించి మోక్ష నగరు చేర్చను తనదు ప్రాణమిచ్చెనె ఓ నా మనసా ఎంతటిప్రేమ దేవుని క్రియల్మరువకుమా నీ  ||దేవుని||\n\n2.ప్రియులు లేక - భ్రమసి నీవు పరుడవైనపుడు – ప్రియుడేసు నిన్ను చేరి – సంతసంబిడెనె సమర్పించు - సర్వము తనకై దేవుని క్రియల్మరువకుమా నీ   ||దేవుని||\n\n3.రక్షణాలం - కార వస్త్రము జీవాహారము – శాంతి సమాధానము నీతి - నీకు నిచ్చెనె ప్రేమ పరిమళ స్తుతులను పాడి దేవుని క్రియల్మరువకుమా నీ   ||దేవుని||\n\n4.గెత్సెమనెలో కార్చెనేసు రక్త చెమటలను - వేదనతో  విజ్ఞాపనము - నీ కొరకు జేసెన్‌  వినుమా మనసా - ఏడ్చెను నీకై దేవుని క్రియల్మరువకుమా నీ   ||దేవుని||\n \n5.వస్తాననిన – కాలమాయె తామసంబేల - ప్రభుని రాక  బూర ధ్వనించు – కాలమెప్పుడో ఆశతో ప్రభుని - రాకను కోరి దేవుని క్రియల్మరువకుమా నీ   ||దేవుని||"},{"n":122,"ei":"Send the Light, oh, send","ci":"I ll live for Jesus","ti":"మా దేవా ! మా దేవా ! నీదు విశ్వాస్యత \n","es":"1.Send the Light, oh, send it quickly\nFor across the heaving main;\nSpeed the news of full salvation\nThro’ a dear Redeemer’s name.\n\nSend the Light, oh, send it quickly\nTo the isles beyond the sea;\nLet them hear the wondrous story--\nLove is boundless, grace is free!\n\n2.Send the Light, where souls are dying\nIn their darkness gloom, and night;\nHaste, oh, haste! the days are fleeting,\nAnd the hours-- how swift their Light!\n\n3.Send the Light-- the Lord com\tmands it;\nTo His Holy Word attend:\n“Go ye forth and preach My gospel;\nLo! I’m with you to the end.”","ec":"I’ll live for Jesus, day after day\nI’ll live for Jesus, let come what may\nThe Holy spirit I will obey\nI’ll live for Jesus day after day.","ts":"మా దేవా ! మా దేవా ! నీదు విశ్వాస్యత చాలా గొప్పది మా దేవా\n\n1 దయామయుండగు - తండ్రివి నీవే తల్లిని మించిన దాతవు నీవె మాయా కల్పిత గాథల నుండి మంచిగ మము రక్షించితివి\n||మా||\n\n2 కోడి పిల్లలను కాచెడి పగిది
