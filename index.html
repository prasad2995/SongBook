as wounded for me;\nGone my transgressions and now I am free,\nAll because Jesus was wounded for me.","ts":"సిలువే నా శరణాయెను-రా నీ సిలువే నా శరణాయెను రా - సిలువ యందే ముక్తి బలము జూచితిరా\n\n1.సిలువను వ్రాలి యేసు పలికిన పలుకులందు విలువ లేని-ప్రేమామృతము గ్రోలితిరా\n\n2.సిలువను జూచుకొలది శిల సమానమైన మనసు నలిగి కరిగి నీరగుచున్నదిరా\n\n3.సిలువను దరచి తరచి విలువ కందగరాని నీ కృప కలుషమెల్లను బాపగ-జాలునురా\n\n4.పలువిధ పథములరసి ఫలితమేమి గానలేక సిలువ యెదుటను-నిలిచి నాడనురా\n\n5.శరణు యేసు శరణు శరణు - శరణు శరణు నా ప్రభువా - దురిత దూరుడ-నీ దరి జేరితిరా"},{"n":297,"ei":"","ci":"Ye are a chosen generation","ti":"ఎంతో వింత యెంతో చింత","es":"","ec":"Ye are a chosen generation\nA royal priesthood a holy nation,\nA peculiar people,\nTo show forth the praises of Him.\nWho has called you\nOut of darkness (3)\nInto His marvellous light. (2)","ts":"ఎంతో వింత యెంతో చింత యేసునాథు మరణమంత\nపంతముతో జేసి రంత సొంత ప్రజలు స్వామి నంత   ||ఎంతో||\n\n1.పట్టి కట్టి నెట్టి కొట్టి తిట్టి రేసు నాథు నకటా\nఅట్టి శ్రమల నొంది పలుక డాయె యేసు స్వామి నాడు   ||ఎంతో||\n\n2.మొయ్యలేని మ్రాను నొకటి మోపి రేసు వీపు పైని\nమొయ్యలేక మ్రాని తోడ మూర్ఛబోయె నేసు తండ్రి   ||ఎంతో||\n\n3.కొయ్యపై నేసయ్యన్‌ బెట్టి కాలు సేతులలో జీలల్‌\nకఠినులంత గూడి కొట్టిరి ఘోరముగ క్రీస్తే సున్‌ బట్టి   ||ఎంతో||\n\n4.దాహముగొన జేదు చిరక ద్రావ నిడిరి ద్రోహులకటా\nధాత్రి ప్రజల బాధ కోర్చి ధన్యుడా దివి కేగె నహహా   ||ఎంతో||\n\n5.బల్లెముతో బ్రక్కన్‌ బొడవన్‌ పారె నీరు రక్త మహహా\nఏరై పారె యేసు రక్త మెల్ల ప్రజల కెలమి నొసగు   ||ఎంతో||"},{"n":298,"ei":"","ci":"Yesterday, today for ever","ti":"సిలువ చెంత చేరిననాడే కలుషములను ","es":"","ec":"Yesterday, today for ever,\nJesus is the same,\nAll may change, but Jesus never!\nGlory to His Name (3)\nAll may change, but Jesus never!\nGlory to His Name.","ts":"సిలువ చెంత చేరిననాడే కలుషములను కడిగివేయున్‌\nపౌలు వలెను-సీల వలెను సిద్ధపడిన భక్తుల జూచి\n\n1.కొండాలాంటి బండాలాంటి మొండి హృదయంబు మండించు\nపండియున్న పాపులనైన పిలచుచుండె పరము జేర\n\n2.వంద గొఱ్ఱెల మందలో నుండి ఒకటి తప్పి ఒంటరియాయె\nతొంబది తొమ్మిది గొఱ్ఱెల విడిచి ఒంటరియైన గొఱ్ఱెను వెదకెన్‌\n\n3.తప్పిపోయిన కుమారుండు తండ్రిని విడచి తరలిపోయె\nతప్పు తెలసి తిరిగి రాగా తండ్రి యతని చేర్చుకొనెను\n \n4.పాపి రావా పాపము విడిచి పరిశుద్ధుల విందులో జేర\nపాపుల గతిని పరికించితివా పాతాళంబే వారి యంతము"},{"n":299,"ei":"","ci":"Yet to all who receive Him","ti":"నా జీవితానికి విలువ తెచ్చిన సిలువ","es":"","ec":"Yet to all who receive Him\nTo those who believe in His Name\nHe gave them the right to become\nThe children of God (2)","ts":"నా జీవితానికి విలువ తెచ్చిన సిలువ సిలువ లేనిదే నాకు లేదు విలువ అహహ హల్లెలూయ (3)\n\n1.సింహాసనము నాకివ్వ క్రీస్తు - సిలువ శ్రమలను సహించెను - ముండ్ల మకుటము ధరియించి మహిమ కిరీటం నాకిచ్చెను అహహ హల్లెలూయ(3)\n\n2.సిలువ వార్త నా శక్తి సామర్థ్యం - నశించు వారికి వెఱ్ఱితనం - సిలువ వార్తను చాటెదను సిలువను భరించెదను అహహ హల్లెలూయ (3)\n\n3.సిలువ రుధిరం పాపహరణం - సిలువ యాగమే జీవనరాగం సిలువ మరణం నా విజయం సాతానునికపజయం అహహ హల్లెలూయ (3)\n\n4.సిలువ నాథుని బలిదానం - నాదు పాప విమోచనం అపరాధములతో చచ్చిన నన్ను ధర బ్రతికించెను సిలువ అహహ హల్లెలూయ (3)"},{"n":300,"ei":"","ci":"You are my hiding place","ti":"సిలువలో సిలువలో సిలువలో నా ప్రభువా","es":"","ec":"You are my hiding place,\nYou always fill my heart with songs  of deliverence.\nWhenever I am afraid,\nI will trust in You,  (2)\nLet the weak say I am strong\nIn the strength of the Lord.\nI will trust in you..","ts":"సిలువలో సిలువలో సిలువలో నా ప్రభువా\nశ్రమలలో శ్రమలలో శ్రమలలో నలిగేవా\n\n1.సిలువలో నీ మేను నిలచేను మేకులతో\nబరువుతో నీ తనువు ఒరిగెను వేదనతో\t  ||సిలువ||\n\n2.ముండ్లతో ఒక మకుటం అల్లి నీ తలపై\nచిరకతో నీ దాహం తీర్చెనూ ఈ లోకం   ||సిలువ||\n\n3.ప్రక్కలో బల్లెముతో గ్రక్కునా బొడిచేరా\t\nరక్తమే చిందేనా శాంతమే మిగిలేనా   ||సిలువ||\n\n4.సిలువలో యేసు ప్రభో శ్రమలలో క్రీస్తు మహా\nజాలిలేని నా కోసం ఏలానో ఈ సహనం  ||సిలువ||"},{"n":301,"ei":"","ci":"You are my strenth when I am","ti":"క్రీస్తు మన కొరకు చనిపోయెను","es":"","ec":"1.You are my strength when I am weak\nYou are the treasure that I seek\nYou are my all in all,\nSeeking You as a precious Jewel\nLord to give up I’d be a fool\nYou are my all in all Your name by night\nHallelujah, to the Lord of Heaven and earth (3)\n\nPrecious Lord, reveal Your heart to me\nFather, hold me, hold me\nThe universe declares our majesty\nYou are holy, holy.","ts":"రాకడ సమయంలో కడబూర శబ్దముతో\nయేసుని చేరుకొనే విశ్వాసము నీకుందా\nరావయ్యా యేసయ్యా వేగమె రావయ్యా (2)\n\n1.యేసయ్య రాకడ సమయంలో\nఎదురేగే రక్షణ నీకుందా\nలోకయాశలపై విజయం నీకుందా\n\n2.ఇంపైన ధూప వేదికగా\nఏకాంత ప్రార్థన నీకుందా\nయేసు ఆశించే దీన మనస్సుందా\n\n3.దినమంతా దేవుని సన్నిధిలో\nవాక్యము కొరకు ఆకలి నీకుందా\nయేసు నాధునితో సహవాసం నీకుందా\n\n4.శ్రమలోన సహనం నీకుందా\nస్తుతియించే నాలుక నీకుందా\nఆత్మల కొరకైనా ఆవేదన నీకుందా\t \n\n5.నీ పాప రోత జీవితము\nనీ పాప హృదయం మారిందా\nనూతన హృదయంతో ఆరాధన నీకుందా\n\n6.అన్నిటికన్నా మిన్నగను\nకన్నీటి ప్రార్థన నీకుందా\nఎల్ల వేళల స్తుతియాగం నీకుందా"},{"n":312,"ei":"","ci":"Jesus we enthrone you","ti":"రాజాధిరాజా రా...రా రాజులకు రాజువై రా...రా","es":"","ec":"Jesus we enthrone You,\nWe proclaim You our King.\nStanding here in the midst of us,\nWe raise You up with our praise.\nAnd as we worship, build a throne, (3)\nCome, Lord Jesus, take Your place.","ts":"రాజాధిరాజా రా...రా  రాజులకు రాజువై రా...రా\nరాజా యేసు రాజ్యమేల రా...రా రవికోటి తేజ యేసు రా...రా\n\nఓ మేఘవాహనంబు మీద వేగమే\nఓ మించు వైభవంబు తోడ వేగమే\n\n1.ఓ... భూజనంబులెల్ల తేరి చూడగా\nఓ... నీ జనంబు స్వాగతంబు నీయగా\nనీ రాజ్య స్థాపనంబు సేయ భూ రాజులెల్ల కూలిపోవ\nభూమి యాకసంబు మారిపోవ నీ మహా ప్రభావమున వేగ\n\n2.ఆ... ఆకసమున దూతలార్భటింపగా\nఆ... ఆది భక్త సంఘ సమేతంబుగా\nఆకసంబు మధ్య వీధిలోన ఏకమై మహా సభ జేయ\nయేసు నాధ నీదు మహిమలోన మా కదే మహానందమౌగ\n\n3.ఓ... పరమ యెరూషలేము పుణ్య సంఘమా \nఓ... గొఱియపిల్ల క్రీస్తు పుణ్య సంఘమా\nపరమ దూతలారా భక్తులారా పౌలపోస్తులారా పెద్దలారా\nగొఱియపిల్ల యేసు రాజుపేర క్రొత్త గీత మెత్త పాడరారా"},{"n":313,"ei":"","ci":"It's the presence of your Sprit","ti":"మేఘాల మీద మన ప్రభు యేసు","es":"","ec":"1.It’s the presence of Your Spirit, Lord, we need;\nIt’s the presence of Your Spirit, Lord, we need;\nSo help us Lord, to worship You;\nIt’s the presence of Your Spirit, Lord, we need.\n\n2.It’s the guidance of Your Holy Word we need, …\n\n3.It’s the cleansing of Your Holy Blood we need, …","ts":"మేఘాల మీద మన ప్రభు యేసు మహికి ఏతెంచు వేళ ఆసన్నమాయె భువికి ఏతెంచు వేళ\n\n1.మెరుపు రథముల మీద ఉరుము బాటలపైన మన యేసుడరుదెంచగా మరణ కోటలలోన నిదురించు ప్రియులంత మహిమకాయములొందుచు మీది లోకాల మోదాంలోన ప్రియ ప్రభుని దర్శింతుము\n\n2.మధ్యాకాశములోని దూత పంక్తుల నడుమ మరియ సుతుడగు పించగా మరణమొందక మిగులు రారాజు జనులంతా కాంతి దేహములు దాల్చుచూ మెరుపు దీపాలై-మహిమ రూపాలై వరుని ముఖమును గాంతురు\n\n3.దేవా దేవుని మహిమ దిశలెల్ల విరబూయ దేవసుతుడరుదెంచెను దయనొందు ప్రియులంతా కొలువు దీర్చగ ప్రభువు దానములు దయచేయును ధవళ వస్త్రాలు-నీతి మకుటాలు ముదమార ధరియింతుము\n\n4.కలకాలము పంట వరుడేసు పరిణయము-కమనీయముగ సాగుచూ కళ్యాణకాంతులతో దేవాలోకపు కళతో వధువు వదనము మెరియగ కనకహారాలు పుణ్యవరాలు అక్షింతలై కురియుచుండ"},{"n":314,"ei":"","ci":"Lord pour out your Spirit","ti":"యేసు శ్రీఘ్రముగా వచ్చున్","es":"","ec":"Lord pour out Your Spirit\nOn all the peoples of the earth\nLet Your sons and daughters\nSpeak Your words of prophesy\nSend us dreams and visions\nReveal the secrets of Your heart\nLord our faith is rising\nLet all Heaven sound the coming of Your day.\n\nThere’s gonna be a great awakening\nThere’s gonna be a great revival in our land\nThere’s gonna be a great awakening\nAnd everyone who calls on Jesus\nThey will be saved.\n\nLord pour out Your Spirit\nOn all the nations of the world\nLet them see Your glory\nLet them fall in reverent awe\nShow Your mighty power\nShake the heavens and the earth\nLord the world is waiting\nLet creation see the coming of Your day.","ts":"యేసు శీఘ్రముగా వచ్చున్‌ ఆశతో కనిపెట్టుడి\n\n1.గురుతులెల్ల-లోకమంతా సరిగ చూడ కాననగున్‌\nపరిశుద్ధమైన ప్రవర్తనతో ప్రభుకై కనిపెట్టుడి   ||యేసు||\n\n2.ప్రొద్దు గ్రుంకి-వచ్చునేమో అర్థరాత్రి యందేమో\nఉదయము కోడికూతలపుడు వచ్చునేమో కనిపెట్టుడి   ||యేసు||\n\n3.సిద్ధపడుడి-మీరిలలో మీరు దేవుని సంధింప\nసిద్ధపడుడి-తీర్పునకై ప్రభువుకై కనిపెట్టుడి   ||యేసు||\n\n4.పరిశుద్ధులై-జీవించుడి ప్రభుని చిత్తము చేయుడి\nమరణమే యేసునందు సుమ్మా మేలుకొని కనిపెట్టుడి   ||యేసు||\n\n5.యేసువలె-జీవించుడి తీసివేయుడి మలినములన్‌\nమోసంపుటాశ-లన్ని విడిచి ఆశతో కనిపెట్టుడి   ||యేసు||\n\n6.వేషధారణ విడచి మీరు యేసు ముద్రలు ధరియించి \nపెండ్లి కుమారుని సంధింప అందరు కనిపెట్టుడి   ||యేసు||\n\n7.మేఘముపై-వెళ్లిన ప్రభు వేగముగ వచ్చు నిల\nసకల శ్రమలను-భరించి హల్లెలూయ పాడుడి   ||యేసు||"},{"n":315,"ei":"","ci":"Give God the glory","ti":"పరిశుద్ధ జీవిత మరయుడి ధరనిక","es":"","ec":"Give God the glory (3)\nAnd He will give you (3) the victory.\nAre you spending time alone with Jesus (3)\nThen He will give you (3) the victory.","ts":"పరిశుద్ధ జీవిత మరయుడి ధరనిక ప్రభురాక చాల సమీపమాయె\nతండ్రి వాగ్దానములు నెరవేరెనని సిద్ధపడుద మహా\n\n1.కరువులు యుద్ధము కాటకములు - భూ-కంపములన్‌ హతులైరి జనుల్‌ విభుపాదముల్‌ సేవింప నెగయుటకై సిద్ధపడుద మహా\t \n\n2.రాజ గృహంబుల-పేదల యిండ్లను ప్రజలకు స్వస్థత లేదు గదా ప్రభు రాకడ కిదియును సూచన యని సిద్ధపడుద మహా\n\n3.ఆకాశ శక్తులు-భీకరముగ దమ మూకల బాసియు శాఖలాయె యేసు రాకడ కిదియును సూచన యని సిద్ధపడుద మహా\n\n4.జీవపు డాంభికులీ వసుధను దమ జీవపు టాశలలోన బడె దైవ జీవము బొందగ నందరమును సిద్ధపడుద మహా\n\n5.సౌందర్య రాశియు చక్కని రూపియు సత్య దూతాళితో సరగ వచ్చున్‌ ప్రభు సారూప్య మొందియు నెదురేగుటకు సిద్ధపడుద మహా\t\t \n\n6.పెండ్లి కుమారుడు ప్రేమ స్వరూపుడు విడిది గదిని-సిద్ధపరచె నహా ప్రియ కడ జను పెండ్లి కుమార్తెవలెన్‌ సిద్ధపడుద మహా"},{"n":316,"ei":"","ci":"The windows of heaven are open","ti":"యేసురాజుగా వచ్చుచున్నాడు","es":"","ec":"1.The windows of Heaven are open,\nThe blessings are falling today\nThere’s joy, joy, joy, in my heart,\nFor Jesus has come in to stay\nI gave up my old tattered garments\nHe gave me a robe of pure white;\nI’m feasting on manna from heaven,\nAnd Jesus makes ev’rything right.\n\n2.The windows of Heaven are open,\nThe blessings are falling tonight\nThere’s joy, joy, joy, in my heart,\nFor Jesus makes ev’rything right;\nI gave up my old tattered garments,\nHe gave me a robe of pure white;\nI’m feasting on manna from heaven,\nAnd that’s why I’m happy tonight.","ts":"యేసురాజుగా వచ్చుచున్నాడు భూలోకమంత తెలుసుకుంటారు\nరవికోటి తేజుడు-రమ్యమైన దేవుడు రారాజుగా వచ్చుచున్నాడు\n\n1.మేఘాల మీద యేసు వచ్చుచున్నాడు పరిశుద్ధులందరిని తీసుకుపోతాడు\nలోకమంతా శ్రమకాలం విడువబడుట బహు ఘోరం \n\n2.ఏడేండ్లు పరిశుద్ధులకు విందౌబోతుంది ఏడేండ్లు లోకం మీదికి శ్రమరాబోతుంది\nఈ సువార్త మూయబడున్‌ వాక్యమే కరువగును\n\n3.వెయ్యేండ్లు యిలపై యేసు రాజ్యమేలును ఈ లోక రాజ్యములన్ని ఆయన యేలును\nనీతి శాంతి వర్ధిల్లున్‌ న్యాయమే కనబడును\n\n4.ఈ లోక దేవతలన్నీ ఆయన ముందర సాగిలపడి నమస్కరించి గడగడలాడును\nవంగనీ మోకాళ్ళన్నీ యేసయ్య ఎదుట వంగిపోవును\n\n5.క్రైస్తవుడా మరువవద్దు ఆయన రాకడ కనిపెట్టి ప్రార్థనచేయి సిద్ధముగా నుండి\nరెప్పపాటున మారాలి యేసయ్య చెంతకు చేరాలి"},{"n":317,"ei":"","ci":"Wonderful, so wonderful","ti":"శ్రీయేసుయొక్కరాకడ ఎంతో సమీపము","es":"","ec":"1.Wonderful, so wonderful\nIs your unfailing love\nYour cross has spoken mercy over me\nNo eye has seen no ear has heard\nNo heart could fully know\nHow glorious, how beautiful you are.\n\nBeautiful one I love you\nBeautiful one I adore\nBeautiful one my soul must sing.\n\n2.Powerful so powerful\nYour glory fills the skies\nYour mighty works displayed for all to see\nThe beauty of your majesty\nAwakes my heart to see\nHow marvelous how wonderful you are.\n\nYou opened my eyes to your wonders anew\nYou captured my heart with this love\ncause nothing on earth is as beautiful as you","ts":"1.శ్రీయేసుయొక్కరాకడ ఎంతో సమీపము ఈ ప్రొద్దొరేపొ యాకడ దినంబు వచ్చును మేఘాసనంబు నెక్కి తానా నాడు వచ్చును\n\nయావత్తు సృష్టి  బొత్తిగా వినాశ మొందును హా!య దెంతయో యఘోరము యాదెంతమోసు మోదము  దుర్మార్గికేయ ఘోరము విశ్వాసి మోదము\n\n2.దాదాపు గుఱుతులన్నియు నీడేరియున్నవి ఆ చివరి గుఱుతుకూడను ఈడేరనైనది ఇంకేమి యడ్డులేదిక నొకడ్డుయున్నది శ్రీ క్రీస్తు స్వామి వేడు-చే నిల్చి యున్నది\n\n3.ఆకాశమో ధ్వనించుచు గతించిపోవును భూతాదులన్ని రగులుచు గరంగి పోవును ఈ భూమి నిందు నుండెడి ఈ యెల్ల పనులును దహించిపోవు నగ్నిని సమూలమైనను\n\n4.మృతుల్‌ సజీవులేకమై బల్‌స్తోమమౌదురు విశిష్టల్దుష్టులందుపై విభాగమౌదురు ఆ వేళ నీవు నేనును ఆ గొప్పగుంపునన్‌ నిల్చుందుమైనదేనిలో నుండెదము తెలియునా\n\n5.ఆవేళ యేసునాథుడు ఆ గొప్ప గుంపుకే న్యాయంపు దీర్పుచేయును నిత్యంబు నుంటకే శిష్టాళికెల్ల నా ప్రభు డొసంగు మోక్షము దుష్టాళికెల్లనప్పుడు విధించునరకము\n\n6.ఆవేదన స్థలానకు నేదప్పునట్లుగా నీయందె నిల్చి యుండుటకు నన్‌ గావు రక్షకా! హా! ఘోరమౌనఘోరమే మహా యఘోరమౌ నిన్‌ నమ్మి విడ్చు ద్రోహికే  మహా యఘోరమౌ"},{"n":318,"ei":"","ci":"Change my heart oh God","ti":"గగనము చీల్చుకొని యేసు ఘనులను తీసుకొని","es":"","ec":"Change my heart oh God,\nMake it ever true.\nChange my heart oh God,\nMay I be like You.\n\nYou are the potter,\nI am the clay,\nMold me and make me,\nThis is what I pray.","ts":"గగనము చీల్చుకొని యేసు ఘనులను తీసుకొని\nవేలాది దూతలతో భువికి వేగమె రానుండె\n\n1.పరలోక పెద్దలతో పరివారముతో కదిలి \nధర సంఘ వధువునకై తరలెను వరుడదిగో\n\n2.మొదటను గొఱ్ఱెగను ముదమారగ వచ్చెను\nకొదమసింహపు రీతి కదిలెను ఘర్జనతో\n\n3.కనిపెట్టు భక్తాళి కనురెప్పలో మారెదరు\nప్రధమమున లేచెదరు పరిశుద్ధులగు మృతులు"},{"n":319,"ei":"","ci":"The nails in your hand","ti":"నమ్మవద్దు నమ్మవద్దు ఈ మాయలోకం నమ్మవద్దు","es":"","ec":"The nails in your hands\nThe nail in your feet,\nthey tell me how much you love me\nThe thorns on your brow,\nthey tell me how,\nyou bore so much shame to love me.\n\nTill the heavens pass away,\nall your scars will still remain,\nand forever they will say,\nhow much you love me.\nSo I want to say...\n\nForever my love, Forever my heart\nForever my life  is yours.","ts":"నమ్మవద్దు నమ్మవద్దు ఈ మాయలోకం నమ్మవద్దు\nఇది ఆశజూపి మోసం జేయు ఈ మాయలోకం నమ్మవద్దు\n\n1.నిన్నుగన్న తండ్రి యేడి నిన్ను గన్న తల్లి యేది\nపోయినార పోయినారా నిన్ను విడిచి పోయినారా\n\n2.నీ అక్కలేరి చెల్లెండ్లేరి నీ అన్నలేరి తమ్ముండ్లేరి\nవారాశతో సంపాదించిన వారాస్థి పాస్తులన్ని ఏవి\n\n3.ధనము సంపాదించేవారు ఈ ధరణియందు నిలువబోరు\nవారు పామునోట కప్పవలె సాగిపోదురు సమాధికి\n\n4.నీవు వచ్చేటప్పుడు తేలేదుగా నీవు వెళ్ళేటప్పుడు మోయలేవుగా\nనీవు ఒంటరిగానే  వచ్చినావు నీవు ఒంటరిగానే వెళ్లవలెను"},{"n":320,"ei":"","ci":"JESUS is the King","ti":"మాయలోకమాయలోనేల మున్గి తిరిగెదవు కాయము","es":"","ec":"J - E - S - U -  S is the king of my life (2)\nAnd He saved my soul from sin\nSet the Holy Ghost within\nHe is the king, He is the King\nThe King of my life","ts":"1.మాయలోకమాయలోనేల మున్గి తిరిగెదవు\nకాయము నిన్ను మోసము చేయు కాలమాయెను\n\nమరణమువచ్చున్‌ మరణము వచ్చున్‌ లోకము ముగియున్\nమానవులకు కృపకాలము దాటిపోవును\n\n2.పాతాళము నిన్ను మ్రింగ కాచి నిల్చెను\nప్రాణనాథుడేసు నిన్ను రక్షింప వచ్చెను\t \n\n3.వేద వాక్యము మారక పూర్తియగును\nదేవకోపము మానవులపై పోయబడును\t \n\n4.లోకము దిగుల్‌ కలహములతో తత్తరిల్లును\nమేఘమందు యేసురాజు కనిపించును\n\n5.యేసు నేనే మార్గము సత్యము జీవము నేనే\nమోసపోకు డెందుమార్గము వేరే లే దనెను\t\n\n6.పాపికై మరణించిన యేసు కాచి నిల్చెను\nపాపి నిన్ను పిలుచుచున్నాడు చెంత చేరుమా"},{"n":321,"ei":"","ci":"Take my poor heart","ti":"పరదేశులమో ప్రియులారా మన","es":"","ec":"Take my poor heart and let it be\nForver closed to all but Thee\nSeal Thou my breast and let me wear\nThat pledge of love forever there","ts":"పరదేశులమో ప్రియులారా\nమన-పుర మిదిగా దెపుడు నిజముగ\n\n1 చిత్ర వస్తువులు-చెల్లెడి యొక\nవి-చిత్రమైన సంత-లోకము     ||పర||\n\n2 సంత గొల్లు క్షమ-సడలిన చందం\nబంతయు సద్దణగున్‌ నిజముగ ||పర||\n\t \n3 మాయలోక మిది-ఛాయను బోలును\nమాయ మాయ మాయ అంతయు ||పర||\t\n\n4 స్థిరమని నమ్మకు-ధర యెవ్వరికిని\nపరలోకమె స్థిరము-నిజముగ   ||పర||\n\n5 మేడలు మిద్దెలు-మేలగు సరకులు\nపాడై కనబడవే-నిజముగ      ||పర||\n  \n6 ధనధాన్యంబులు-దరగక మానవు\nపనిపాటులు పోయె నిజముగ  ||పర||\n\n7 వచ్చితి మిచటికి-వట్టి హస్తముల\nదెచ్చిన దేదియు లేదు గదా    ||పర||\n \n8 ఎట్లు వచ్చితిమి-యీ లోకమునకు\nఅట్లు వెళ్ళవలయున్‌-మింటికి  ||పర||\n\n9 యేసు నందు వి-శ్వాసం బుంచిన\nవాసిగ నిను జేర్చున్‌-బరమున  ||పర||\n\n10 యేసే మార్గము-యేసే సత్యము\nయేసే జీవముగా-నిజముగ     ||పర||"},{"n":322,"ei":"","ci":"Holiness, holiness","ti":"కానాన్‌ పురము కరుగుదము ఓ నా సోదరులారా","es":"","ec":"1.Holiness, holiness is what I long for\nHoliness is what I need\nHoliness, holiness is what\nYou want for me, for me\n\nTake my heart, and mold it \nTake my mind transform it \nTake my will conform it \nTo Yours, to Yours, oh, Lord\n\n2.Righteousness, righteousness is what I long for....\n\n3.Faithfulness, faithfulness ....","ts":"కానాన్‌ పురము కరుగుదము\nఓ నా సోదరులారా ఓ నా సోదరులారా\nమానితంబౌ విందు నందు మనము చేరుదము\n\n1 ఆ మహిమ నగరమందు ఆకలిదప్పులు లేవు\nఆకలిదప్పులు లేవు\nక్షేమ మిచ్చు రాజ్యమందు చేరుదము రారే ||కానాన్‌||\n\n2 కన్నీరేమి కష్టంబేమి కానారాదే యందు\nకానరాదే యందు\nయెన్నడైన చూడనట్టి ఎన్నో వింతలుండు ||కానాన్‌||\n\n3 రత్న వజ్ర గోమేధికము రాజిల్లు తోరణముల్‌\nరాజిల్లు తోరణముల్‌\nముత్యాల హారంబులను ముచ్చటగ బొందుదము ||కానాన్‌||\n\n4 సుప్రశస్తమైన విందు చూడ బోదామందు\nచూడ బోదామందు\nఆ ప్రియంబౌ దూత శ్రేణిన్‌ నానందంబు నొంద ||కానాన్‌||\n\n5 పరమకానాన్‌ పురమునందు పనులు మనువులులేవు\nపనులు మనువులు లేవు\nహల్లెలూయ పాటలతో ఆనందంబు నొంద ||కానాన్‌||"},{"n":323,"ei":"","ci":"Give thanks With a grateful heart","ti":"యేసులో హర్షించెదము మహిమలో హర్షింతుము నిరతరం ","es":"","ec":"Give thanks\nWith a grateful heart\nGive thanks to the Holy One\nGive thanks because He's given\nJesus Christ His Son\n\nAnd now let the weak say\nI am strong\nLet the poor say\nI am rich\n\nBecause of what\nThe Lord has done for us\nAnd now let the weak say\nI am strong\nLet the poor say\nI am rich\nBecause of what\nThe Lord has done for us\n\n(ENDING)\nGive thanks","ts":"యేసులో హర్షించెదము మహిమలో హర్షింతుము నిరతరం\nమహిమ మహిమ మహిమలో హర్షించెదము\n\n1 పరిశుద్ధులుహర్షింప యేసు త్వరగా రమ్మని పలుక\nమారువారికి శిఖరం మనస్సారగ దేవుడిచ్చున్‌\nమహిమ ఘనము మహిమలో నానందింప\n\n2 శుద్ధ జీవులైన దేవసుతులు ప్రకాశింపన్‌\nసర్వసృష్టి యొక్క మహకర్మములన్నియు తీర\nరాజుకు మహిమ కలుగుదినములు రాగా\n\n3 స్ఫటిక జీవనదియు ఇరుప్రక్కల జీవ వృక్షమును\nఆకలిదప్పులు లేక  నట జీవఫలముల భుజించి\nతినుచు త్రాగుచు యేసులో నానందింప\n\n4 పరిశుద్ధాత్మయు, సుతుడు చేసిన రక్షణ కార్యమును\nతండ్రి దూతల గణముల్‌ నట జూచి \nప్రహర్షింపన్‌ క్రొత్త కార్యము కొరకు ఆనందింప"},{"n":324,"ei":"","ci":"He is able more than able","ti":"ఎపుడు చేరెద తేజ గృహమే","es":"","ec":"He is able more than able\nTo accomplish what concerns me today\nHe is able more than able\nTo handle anything that comes my way\nHe is able more than able\nTo do much more than I could ever dream\nHe is able more than able\nTo make me what He wants me to be\n\nHe is able more than able\nTo accomplish what concerns me today\nHe is able more than able\nTo handle anything that comes my way\nHe is able more than able\nTo do much more than I could ever dream\nHe is able more than able\nTo make me what He wants me to be\n\nTo do much more than I could ever dream\nHe is able more than able\nTo make me what He wants me to be","ts":"ఎపుడు చేరెద తేజ గృహమే\nఎపుడు చేరెద నా నివాసం\nఎపుడు చేరెదను\n\n1 దేవుడే నాకై యుంచిన వాసస్థలమే\nచేరెద సంతోషమంద\nయేసురాజు నా కొరకై సిలువనే చేర\n\n2 ఆశతీర యేసు సముఖం\nమధుర గానమే\nనిత్యమే యేసుని నామం ప్రేమించియే\nనేను పాడ ఆశతీరునే\n\n3 చెల్లించెదనే స్తోత్ర బలియే ఎల్లవేళలను\nఅర్పింతు స్తుతి ఘనమహిమ\nపేదనైన స్తోత్రము చేయ\nదేవుడనుగ్రహించె\n\n4 దైవకృపయే కరుణ యిదియే\nనేను చాటింప\nగీతముల్‌ దిన దినం మ్రోగ\nనిత్య కాలం ప్రేమహారం\nయేసుకే చెల్లున్‌\n\n5 ధ్యానించగ నా హృదయ పూర్వక\nకృతజ్ఞతాస్తుతులే \nజ్ఞప్తియే యేసుని నగరం\nప్రేమించియే నేను పాడ ఆశ తీరునే\t"},{"n":325,"ei":"","ci":"I have a Savior, He’s pleading in glory,","ti":"స్తోత్రము సేయరే - సోదరులార","es":"","ec":"1.I have a Savior, He’s pleading in glory,\nA dear loving Savior, though earth-friends be few;\nAnd now He is watching in tenderness o’er me,\nBut oh, that my Savior were your Savior too!\n\n For you I am praying,\nFor you I am praying,\nFor you I am praying,\nI’m praying for you.\n\n2.I have a Father: to me He has given\nA hope for eternity, blessed and true;\nHe’ll call me one day to the kingdom of heaven,\nBut oh, that He’d let me bring you with me too!\n\n3.I have a peace: it is calm as a river,\nA peace that the friends of this world never knew;\nMy Savior alone is its Author and Giver,\nAnd oh, could I know it was given to you!","ts":"స్తోత్రము సేయరే - సోదరులార మన యాత్మలతో దండ్రిన్‌ ధాత్రిని మన పరమాత్ముని వాక్కులు స్తోత్రములో గలిపి\n\n1 ఇచ్చట ప్రేమల కిదియే కడవరి వచ్చియున్న దేమో అచ్చట మన మందరము గలిసికొని యానందింతుముగా\n\n2 ఎక్కువ ప్రేమలు-చక్కని స్తోత్రము లక్కడ మన మంత మిక్కిలి ప్రియుడగు దేవుని కిడుదము ఒక్క మనసుతోను\n\n3 కన్నీరుండదు-చావు కష్టము లెన్నటికుండవుగా కన్నను మన శృంగారపు బ్రతుకు లెన్న దరముగాదె\n\n4 వాగును వీణెలు-సాగును పాటలు సతతముగా నచట రాగములెంతో-రమ్యమై యుండును బాగింతన లేము\n\n5 మరల నిచట గూ-డుదమో లేదో మన మందరము త్వరలో మన పర-లోకపు దండ్రి తోడనుందు మేమో\n\n6 గొఱ్ఱెపిల్ల రక్తము విలువచ్చట గొప్పది గాంతుముగా గురుతర మగు మన దేవుని ప్రేమను కూర్మితో జూతుముగా\n\n7 పరమ తండ్రితో-ప్రభు యేసునితో బరిశుద్ధాత్మునితో స్థిరముగ నుందుము-మరి దూతలతో బరలోకము నందున్‌"},{"n":326,"ei":"","ci":"My God, how wonderful thou art,","ti":"పరలోక పట్టణము  పండ్రెండు గుమ్మములు","es":"","ec":"1.My God, how wonderful thou art,\nThy majesty how bright!\nHow beautiful thy mercy-seat,\nIn depths of burning light!\n\n2.How dread are thine eternal years,\nO everlasting Lord,\nBy holy angels, day and night,\nIncessantly adored!\n\n3.O how I fear thee, living God,\nWith deepest, tenderest fears;\nAnd worship thee with trembling hope,\nAnd penitential tears.\n\n4.Yet I may love thee too, O Lord,\nAlmighty as thou art;\nFor thou hast stooped to ask of me\nThe love of my poor heart.\n\n5.No earthly father loves like thee,\nNo mother half so mild\nBears and forbears, as thou hast done\nWith me, thy sinful child.\n\n6.How wonderful, how beautiful,\nThe sight of thee will be,\nThine endless wisdom, boundless power,\nAnd aweful purity!","ts":"పరలోక పట్టణము పండ్రెండు గుమ్మములు\nపండ్రెండు ముత్యములతో పదిలముగా కట్టబడె\n\n1 మండితంబగు పునాది సూర్యకాంతపు రాయి\nరెండవది నీలము మూడవది యమునా రాయి\n\n2 పచ్చ వైఢూర్యము కెంపు సువర్ణము\nఅచ్చ గోమేధికము పుష్య రాగము తోడ\n\n3 పదియవది సూనియము పదకొండు పద్మరాగము\nపండ్రెండు సుగంధము పండ్రెండు ముత్యములు\n\n4 శుద్ధ సువర్ణ వీధుల్‌ స్వచ్ఛమైన స్ఫటికము\nసుందరముగా నుండు సిద్ధపడిరండి\n\n5 గొఱ్ఱెపిల్ల దీపం సూర్యుడక్కరలేద\nభూరాజుల్‌ తమ మహిమన్‌ తీసికొని వచ్చెదరు\n\n6 జీవజలముల నది ప్రవహించు చుండెను\nజీవంబు గల్గును జీవించుదురు ప్రజలు\n\n7 ఇరుప్రక్కల నదికి జీవ వృక్షముండె\nపండ్రెండు నెలలకు పండ్రెండు కాపులు కాయు\t"},{"n":327,"ei":"","ci":"I see the King of glory","ti":"మన బలమైన దేవాది దేవుని","es":"","ec":"1.I see the King of glory\nComing on the clouds of fire\nThe whole earth shakes, the whole earth shakes\nI see His love and mercy\nWashing over all our sin\nThe people sing, the people sing\n\nHosanna, Hosanna\nHosanna in the highest\nHosanna, Hosanna\nHosanna in the highest\n\n2.I see a generation\nRising up to take the place\nWith selfless faith, with selfless faith\nI see a near revival\nStaring as we pray and seek\nWe're on our knees, we're on our knees\n\nHeal my heart and make it clean\nOpen up my eyes to the things unseen\nShow me how to love like You have loved me\nBreak my heart for what breaks Yours\nEverything I am for Your kingdom's cause\nAs I walk from earth into eternity","ts":"మన బలమైన దేవాది దేవుని\nరాజ్యము సమీపమౌచున్నది\nతన కృపకాలము అతి త్వరితముగా \nనిల గతింపనై యున్నది\n\n1 ఆకలిదప్పులుండవచట\nవ్యాధి బాధలు లేవచట\nవిలాపములకు రోదన\nధ్వనులకును తావులేదచట\n\n2 సంతోష సునాదములు\nనీతి సమాధానములు\nఆ రాజ్యమునకు ఆధారములై\nఅవి నిలుచు కలకాలం\n\n3 అక్షయ రాజ్యమునీయా\nరక్షకుడే నిను పిలువా\nతక్షణమాయన సైన్యములో\nచేరి సాగిపోయెదవా"},{"n":328,"ei":"","ci":"The cross upon which Jesus died","ti":"ఉన్నపాటున వచ్చు చున్నాను","es":"","ec":"1.The cross upon which Jesus died\nIs a shelter in which we can hide\nAnd its grace so free is sufficient for me\nAnd deep is its fountain as wide as the sea.\n\nThere's room at the cross for you\nThere's room at the cross for you\nThough millions have come, there's still room for one\nYes there's room at the cross for you.\n\n2.Though millions have found him a friend\nAnd have turned from the sins they have sinned\nThe Savior still waits to open the gates\nAnd welcome a sinner before it's too late.\n\n3.The hand of my Savior is strong\nAnd the love of my Savior is long\nThrough sunshine or rain, through loss or in gain,\nThe blood flows from Calvary to cleanse every stain.","ts":"ఉన్నపాటున వచ్చు చున్నాను నీ పాద-సన్నిధి కో రక్షకా యెన్న శక్యముగాని పాపము లన్ని మోపుగ వీపుపైబడి యున్న నిదె నడలేక తొట్రిలు చున్నవాడను నన్ను దయగను\n\n1.కారుణ్యనిధియేసు-నా రక్షకా నీ శ-రీర రక్తము చిందుట భూరి దయతో నన్ను నీ దరి జేరరమ్మని పిలుచుటయుని ష్కారణపు నీ ప్రేమ యిది మరి వేరే హేతువు లేదు నా యెడ\n\n2.మసి బొగ్గువలె నా మా ససమెల్లగప్పె దో-ష సమూహములు మచ్చలై అసితమగు ప్రతి డాగు తుడువను గడటుగడిగి పవిత్రపరపను నసుపు లిడు నీ రక్తమే యని మసల కిప్పుడు సిలువ నిదెగని \n \n3.వెలుపట బహు యుద్ధ –ములు లోపటను భయము-కలిగె నెమ్మదిదొలగెను పలు విధములగు సందియంబుల-వలనబోరాట ములచే నే-నలసి యిటునటు గొట్టబడి దు-ర్భలుడనై గాయములతో నిదె\n\n4.కడు బీదవాడ నం-ధుడను దౌర్భాగ్యుడను-జెడిపోయి పడి యున్నాను-సుడివడిన నా మదికి స్వస్థత జెడిన కనులకు దృష్టి భాగ్యము బడయవలసినవన్ని నీచే-బడయుటకు నా యొడయడా యిదె\n\n5.నీ వాగ్దాత్తము నమ్మి-నీపై భారము పెట్టి-జీవమార్గము గంటిని కేవలంబగు ప్రేమచేతను నీవు నన్ను క్షమించి చేకొని భావశుద్ధి నోనర్చి సంతోషావసరముల నిడుదువని యిదె\n\n6.దరిలేని యానంద-కరమైన నీ ప్రేమ తరమే వర్ణన చేయను తెరవు కడ్డంబైన యన్నిటి-విఱుగ గొట్టెను గాననే నిపుడరుదుగా నీవాడ నవుటకు-మరి నిజము నీ వాడ నవుటకే"},{"n":329,"ei":"","ci":"When the spirit of the Lord moves in my heart","ti":"శ్రేష్ఠ మైన నామం శక్తి గలిగిన నామం","es":"","ec":"1.When the spirit of the Lord moves in my heart\nI will sing and praise the Lord\n\nI will sing, I will sing, I will sing and praise the Lord\n\n2.I will clap and praise the Lord...\n\n3. I will pray and praise the Lord...","ts":"1.శ్రేష్ఠ మైన నామం శక్తి కలిగిన నామం\nజుంటి తేనె ధారలకన్న మధురమైన నామం\nసాటిలేని నామం స్వస్థపరిచే నామం \nఅన్ని నామముల కన్న నిత్యమైన నామం\n\nయేసు నామం మధుర నామం\nయేసు నామం సుమధుర నామం\n\n2.త్రోవచూపి సరియైన దారిలో నన్ను నడిపించే నామం\nదుష్ఠ శక్తులు బంధకములు తొలగించే నామం\nతరములెన్నో మారినా మనుజులంతా మారినా\n\n3.జీవితమంతా జీవనమంతా స్మరించగలిగే నామం\nకలవరము నను వెంటాడినను ధైర్యము నిచ్చే ప్రభు నామం\nభారమెంతో ఉన్నను శాంతి నొసగే దివ్య నామం"},{"n":330,"ei":"","ci":"He is Jehovah, God of creation","ti":"THE END","es":"","ec":"1.He is Jehovah, God of creation\nHe is Jehovah, Lord God Almighty\nThe Balm of Gilead, the Rock of ages\nHe is Jehovah, the God that healeth thee\n\nSing Alleluia, sing Alleluia\nSing Alleluia, sing Alleluia\nHe is Jehovah, Lord God Almighty\nHe is Jehovah, the God that healeth thee\n\n2.He is the Great I AM, the God of Abraham\nJehovah Shalom, the God of peace I am\nThe God of Israel, the everlasting One\nHe is Jehovah, the God that healeth thee\n\n3.He’s your Provider, Jehovah Jireh\nGod of salvation, God the Messiah\nThe Son He sent to you, He testified of Him\nHe is Jehovah, the God that healeth thee","ts":"THE END"},{"n":331,"ei":"","ci":"Everyone needs compassion","ti":"","es":"","ec":"Everyone needs compassion\nA love that's never failing, let mercy fall on me\nEveryone needs forgiveness\nThe kindness of a Savior, the Hope of nations.\n\nSavior, He can move the mountains\nMy God is mighty to save.\nHe is mighty to save.\nForever, author of Salvation\nHe rose and conquered the grave.\nJesus conquered the grave.\n\nSo take me as You find me--all my fears and failures.\nFill my life again.\nI give my life to follow everything I believe in.\nI surrender. (I surrender.)\n\nSavior, He can move the mountains\nMy God is mighty to save.\nHe is mighty to save.\nForever, author of Salvation\nHe rose and conquered the grave.\nJesus conquered the grave.\n\nSavior, He can move the mountains\nMy God is mighty to save.\nHe is mighty to save.\nForever, author of Salvation\nHe rose and conquered the grave.\nJesus conquered the grave.\n\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King, Jesus\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King.\n\nSavior, He can move the mountains\nMy God is mighty to save.\nHe is mighty to save.\nForever, author of Salvation\nHe rose and conquered the grave.\nJesus conquered the grave.\n\nSavior, He can move the mountains\nMy God is mighty to save.\nHe is mighty to save.\nForever, author of Salvation\nHe rose and conquered the grave.\nJesus conquered the grave.\n\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King, Jesus\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King.\n\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King, Jesus\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King.\n\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King, Jesus\nShine Your light and let the whole world see\nWe're singing for the glory of the risen King.","ts":""},{"n":332,"ei":"","ci":"Blessed be Your name","ti":"","es":"","ec":"Blessed be Your name\nIn the land that is plentiful\nWhere Your streams of abundance flow\nBlessed be Your name\n\nAnd blessed be Your name\nWhen I'm found in the desert place\nThough I walk through the wilderness\nBlessed be Your name\n\nEvery blessing You pour out\nI'll turn back to praise\nWhen the darkness closes in, Lord\nStill I will say\n\nBlessed be the name of the Lord\nBlessed be Your name\nBlessed be the name of the Lord\nBlessed be Your glorious name\n\nBlessed be Your name\nWhen the sun's shining down on me\nWhen the world's all as it should be\nBlessed be Your name\n\nBlessed be Your name\nOn the road marked with suffering\nThough there's pain in the offering\nBlessed be Your name\n\nEvery blessing You pour out\nI'll turn back to praise\nAnd when the darkness closes in, Lord\nStill I will say\n\nBlessed be the name of the Lord\nBlessed be Your name\nBlessed be the name of the Lord\nBlessed be Your glorious name\n\nOh, blessed be the name of the Lord\nBlessed be Your name\nBlessed be the name of the Lord\nBlessed be Your glorious name\n\nYou give and take away\nYou give and take away\nMy heart will choose to say, Lord\nBlessed be Your name, Lord\n\nYou give and take away\nYou give and take away\nMy heart will choose to say, Lord\nBlessed be Your name\n\nYou give and take away\nYou give and take away\nMy heart will choose to say, Lord\nBlessed be Your name\n\nBlessed be the name of the Lord\nBlessed be Your name, I'll find a way to say\nBlessed be the name of the Lord\nBlessed be Your glorious name\n\nBlessed be the name of the Lord\nBlessed <!-- ── App logic (plain script, NOT module, so it runs sync and can use DB) ── -->
<script>
// State
var songs = [];
var curType = 'es';
var curNum  = null;
var curTab  = 'es';
var filteredNums = [];

var SECTIONS = {
  es:{ label:'English Songs',    idxKey:'ei', lyricKey:'es', ph:'Search by number or English song title…' },
  ec:{ label:'English Choruses', idxKey:'ci', lyricKey:'ec', ph:'Search by number or chorus title…' },
  ts:{ label:'Telugu Songs',     idxKey:'ti', lyricKey:'ts', ph:'Search by number or Telugu title…' },
};

// Immediately load from embedded DB
songs = DB;
updateCounts();

function updateCounts(){
  document.getElementById('cnt-es').textContent = songs.filter(function(s){return s.es&&s.es.trim();}).length + ' songs';
  document.getElementById('cnt-ec').textContent = songs.filter(function(s){return s.ec&&s.ec.trim();}).length + ' choruses';
  document.getElementById('cnt-ts').textContent = songs.filter(function(s){return s.ts&&s.ts.trim();}).length + ' కీర్తనలు';
}

// Try Firebase in background
function tryFirebase(){
  var rawCfg = localStorage.getItem('sb_fcfg') || localStorage.getItem('fb_cfg');
  if(!rawCfg) return;
  try{ var cfg = JSON.parse(rawCfg); if(!cfg||!cfg.apiKey) return; }
  catch(e){ return; }
  // Dynamically import Firebase and load songs
  var script = document.createElement('script');
  script.type = 'module';
  script.textContent = [
    'import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";',
    'import{getFirestore,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";',
    'var cfg='+JSON.stringify(cfg)+';',
    'try{',
    '  var ex=getApps().find(function(a){return a.name==="sbk"});',
    '  var app=ex||initializeApp(cfg,"sbk");',
    '  var db=getFirestore(app);',
    '  getDocs(query(collection(db,"songs"),orderBy("number"))).then(function(snap){',
    '    if(snap.empty){document.getElementById("db-badge").textContent="Firebase empty – using embedded data";return;}',
    '    var fbSongs=snap.docs.map(function(d){return d.data();});',
    '    // merge with local index titles',
    '    window.songs=fbSongs.map(function(s){',
    '      var loc=DB.find(function(d){return d.n===s.number;});',
    '      return{n:s.number,',
    '        ei:loc?loc.ei:(s.eng_song||"").split("\\n")[0].replace(/^\\d+\\./,"").trim().slice(0,65),',
    '        ci:loc?loc.ci:(s.eng_chorus||"").split("\\n")[0].replace(/^\\d+\\./,"").trim().slice(0,65),',
    '        ti:loc?loc.ti:(s.tel_song||"").split("\\n")[0].trim().slice(0,65),',
    '        es:s.eng_song||"",ec:s.eng_chorus||"",ts:s.tel_song||""};',
    '    });',
    '    window.updateCounts();',
    '    document.getElementById("db-badge").textContent="✓ "+window.songs.length+" songs from Firebase";',
    '    if(document.getElementById("page-list").classList.contains("active"))window.refreshList();',
    '  }).catch(function(e){document.getElementById("db-badge").textContent="Firebase error: "+e.message;});',
    '}catch(e){document.getElementById("db-badge").textContent="Firebase init error";}',
  ].join('');
  document.head.appendChild(script);
}
tryFirebase();

// Navigation
function showPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-'+id).classList.add('active');
}
function goHome(){
  showPage('home');
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  window.scrollTo(0,0);
}
function openSection(type){
  curType=type;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset&&b.dataset.t===type);});
  document.getElementById('list-label').textContent=SECTIONS[type].label;
  var inp=document.getElementById('srch');
  inp.placeholder=SECTIONS[type].ph;
  inp.value='';
  document.getElementById('srch-clear').classList.remove('show');
  renderList('');
  showPage('list');
  window.scrollTo(0,0);
}
function backToList(){
  showPage('list');
  setTimeout(function(){
    var row=document.querySelector('[data-n="'+curNum+'"]');
    if(row) row.scrollIntoView({block:'center',behavior:'smooth'});
  },60);
}

// Search
function onSearch(){
  var q=document.getElementById('srch').value;
  document.getElementById('srch-clear').classList.toggle('show',q.length>0);
  renderList(q.trim());
}
function clearSearch(){
  document.getElementById('srch').value='';
  document.getElementById('srch-clear').classList.remove('show');
  renderList('');
  document.getElementById('srch').focus();
}

// Render list
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hlite(text,q){
  if(!q) return esc(text);
  var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

function renderList(q){
  var sec=SECTIONS[curType];
  var lq=(q||'').toLowerCase();
  var base=songs.filter(function(s){return s[sec.idxKey]&&s[sec.idxKey].trim();});

  var filtered;
  if(!lq){
    filtered=base;
  } else {
    var numQ=parseInt(q);
    filtered=base.filter(function(s){
      if(!isNaN(numQ)&&String(s.n)===q) return true;          // exact number
      if(!isNaN(numQ)&&String(s.n).startsWith(q)) return true; // number prefix
      var title=(s[sec.idxKey]||'').toLowerCase();
      var lyric=(s[sec.lyricKey]||'').toLowerCase();
      return title.indexOf(lq)!==-1 || lyric.indexOf(lq)!==-1;
    });
  }

  filteredNums=filtered.map(function(s){return s.n;});
  document.getElementById('res-count').textContent=filtered.length+' / '+base.length;

  if(!filtered.length){
    document.getElementById('tbl-body').innerHTML=
      '<tr><td colspan="3"><div class="no-res"><div class="no-res-icon">🔍</div>No results for "'+esc(q)+'"</div></td></tr>';
    return;
  }

  var rows=filtered.map(function(s,i){
    var titleHtml=hlite(s[sec.idxKey],q);
    // Show lyric snippet if match is in body, not title
    var snippet='';
    if(lq&&(s[sec.idxKey]||'').toLowerCase().indexOf(lq)===-1){
      var lyric=s[sec.lyricKey]||'';
      var pos=lyric.toLowerCase().indexOf(lq);
      if(pos!==-1){
        var from=Math.max(0,pos-25);
        var raw='…'+lyric.slice(from,pos+q.length+40).replace(/\n/g,' ')+'…';
        snippet='<div class="snippet">'+hlite(raw,q)+'</div>';
      }
    }
    return '<tr class="srow" data-n="'+s.n+'" style="animation-delay:'+Math.min(i,40)*.012+'s" onclick="openSong('+s.n+')">'+
      '<td>'+s.n+'</td>'+
      '<td class="stitle">'+titleHtml+snippet+'</td>'+
      '<td>›</td>'+
      '</tr>';
  }).join('');

  document.getElementById('tbl-body').innerHTML=rows;
}

// Open song detail
function openSong(num){
  curNum=num;
  var song=songs.find(function(s){return s.n===num;});
  if(!song) return;

  document.getElementById('det-badge').textContent='Song '+num;

  // Available tabs
  var tabs=[
    {key:'es',label:'🎵 English Song'},
    {key:'ec',label:'🎶 Chorus'},
    {key:'ts',label:'🙏 Telugu'},
  ].filter(function(t){return song[t.key]&&song[t.key].trim();});

  // Choose default tab: prefer current section
  var sectionTab={es:'es',ec:'ec',ts:'ts'}[curType]||'es';
  curTab=(song[sectionTab]&&song[sectionTab].trim())?sectionTab:(tabs[0]?tabs[0].key:'es');

  function renderTab(key){
    curTab=key;
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.k===key);});
    var lyric=song[key]||'Lyrics not available.';
    var box=document.getElementById('lyric');
    box.textContent=lyric;
    box.className='lyric'+(key==='ts'?' tel':'');
    var firstLine=lyric.split('\n')[0].replace(/^\d+\.\s*/,'').trim().slice(0,90);
    document.getElementById('det-title').textContent=firstLine||('Song '+num);
  }

  // Build tab buttons
  document.getElementById('tab-row').innerHTML=tabs.map(function(t){
    return '<button class="tab-btn'+(t.key===curTab?' active':'')+'" data-k="'+t.key+'" onclick="switchTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join('');

  window.switchTab=renderTab;
  renderTab(curTab);

  // Prev / Next
  var idx=filteredNums.indexOf(num);
  var prev=idx>0?filteredNums[idx-1]:null;
  var next=idx<filteredNums.length-1?filteredNums[idx+1]:null;
  var sec=SECTIONS[curType];

  function navBtn(n,dir){
    if(!n) return '<div></div>';
    var s2=songs.find(function(x){return x.n===n;});
    var lbl=dir==='prev'?'← Previous':'Next →';
    var cls=dir==='next'?' right':'';
    return '<button class="snav'+cls+'" onclick="openSong('+n+')">'+
      '<div class="snav-lbl">'+lbl+'</div>'+
      '<div class="snav-t">'+n+'. '+esc(s2?s2[sec.idxKey]||'':'')+'</div>'+
      '</button>';
  }
  document.getElementById('song-nav').innerHTML=navBtn(prev,'prev')+navBtn(next,'next');

  showPage('detail');
  window.scrollTo(0,0);
}

// Expose for Firebase callback
window.songs=songs;
window.updateCounts=updateCounts;
window.refreshList=function(){renderList(document.getElementById('srch').value.trim());};
</script>
