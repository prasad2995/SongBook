<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Song Book</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold:#c9a84c; --gold-l:#e8c97a; --gold-d:#8a6820;
      --cream:#fdf6e9; --parch:#f5e9cc; --brown:#3b2a14;
      --mid:#6b4c26; --ink:#2c1f0e; --white:#fffdf7;
      --sh:rgba(59,42,20,0.15);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 10%,rgba(201,168,76,.07) 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(107,76,38,.06) 0%,transparent 55%);pointer-events:none;z-index:0}

    /* HEADER */
    header{position:relative;background:linear-gradient(150deg,#2c1f0e 0%,#4a2e10 55%,#6b4c26 100%);z-index:10}
    header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-l),var(--gold),transparent)}
    .hdr{max-width:1100px;margin:0 auto;padding:24px 32px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .logo{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none}
    .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--gold-l),var(--gold-d));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 12px rgba(201,168,76,.4);flex-shrink:0}
    .logo-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--gold-l);letter-spacing:.4px}
    .logo-sub{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase}
    nav{display:flex;align-items:center;gap:2px}
    .nb{background:transparent;border:1px solid transparent;color:rgba(255,255,255,.6);font-family:'Lato',sans-serif;font-size:13px;padding:8px 15px;border-radius:6px;cursor:pointer;transition:all .2s;white-space:nowrap}
    .nb:hover,.nb.on{background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.35);color:var(--gold-l)}
    .hbtn{display:none;background:none;border:1px solid rgba(201,168,76,.4);color:var(--gold-l);border-radius:6px;padding:7px 11px;font-size:17px;cursor:pointer}
    .mnav{display:none;background:#2c1f0e;border-top:1px solid rgba(201,168,76,.18);padding:10px 20px 14px;flex-direction:column;gap:3px}
    .mnav.open{display:flex}
    .mnav .nb{text-align:left}

    /* HOME */
    #ph{position:relative;z-index:1}
    .hero{text-align:center;padding:68px 24px 52px;max-width:680px;margin:0 auto;animation:up .7s ease both}
    .hero-orn{font-size:36px;margin-bottom:14px;display:block;color:var(--gold);animation:up .7s .08s ease both}
    .hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,6vw,3.8rem);font-weight:600;color:var(--brown);line-height:1.1;margin-bottom:12px;animation:up .7s .13s ease both}
    .hero p{color:var(--mid);font-size:15px;font-weight:300;line-height:1.75;margin-bottom:38px;animation:up .7s .18s ease both}
    .hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;animation:up .7s .25s ease both}
    .hcard{background:var(--white);border:1px solid rgba(201,168,76,.28);border-radius:14px;padding:26px 18px;cursor:pointer;transition:all .23s;box-shadow:0 2px 10px var(--sh);position:relative;overflow:hidden}
    .hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold-d));opacity:0;transition:opacity .23s}
    .hcard:hover{transform:translateY(-4px);box-shadow:0 8px 28px var(--sh);border-color:var(--gold)}
    .hcard:hover::before{opacity:1}
    .hcard-ico{font-size:30px;margin-bottom:10px;display:block}
    .hcard h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--brown);margin-bottom:5px}
    .hcard p{font-size:12px;color:var(--mid);font-weight:300}
    .divider{display:flex;align-items:center;gap:10px;padding:0 24px;max-width:1100px;margin:0 auto 28px;color:var(--gold-d)}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

    /* LIST */
    #pl{display:none;position:relative;z-index:1}
    .lhdr{max-width:1100px;margin:0 auto;padding:36px 32px 0;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;animation:up .5s ease both}
    .lhdr h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.7rem,4vw,2.5rem);font-weight:600;color:var(--brown)}
    .lhdr h2 small{display:block;font-size:12px;font-family:'Lato',sans-serif;font-weight:300;color:var(--mid);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
    .sbar{display:flex;gap:8px}
    .sbar input{padding:9px 14px;border:1px solid rgba(201,168,76,.38);border-radius:8px;background:var(--white);font-family:'Lato',sans-serif;font-size:14px;color:var(--ink);width:180px;outline:none;transition:border-color .2s,box-shadow .2s}
    .sbar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.13)}
    .sbar input::placeholder{color:rgba(107,76,38,.4)}
    .sbar button{padding:9px 18px;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--white);border:none;border-radius:8px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .15s;letter-spacing:.5px}
    .sbar button:hover{opacity:.88;transform:translateY(-1px)}
    .sgrid{max-width:1100px;margin:22px auto 0;padding:0 32px 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
    .sc{background:var(--white);border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .22s;display:flex;align-items:center;gap:14px;box-shadow:0 1px 5px var(--sh);animation:up .4s ease both}
    .sc:hover{border-color:var(--gold);box-shadow:0 4px 18px var(--sh);transform:translateY(-2px);background:#fffef5}
    .snum{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--gold-d);min-width:34px;text-align:center}
    .sinfo{flex:1;min-width:0}
    .sname{font-size:14px;font-weight:700;color:var(--brown);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sarr{color:var(--gold);font-size:18px;opacity:.45;transition:opacity .2s,transform .2s}
    .sc:hover .sarr{opacity:1;transform:translateX(3px)}

    /* DETAIL */
    #pd{display:none;position:relative;z-index:1}
    .dwrap{max-width:740px;margin:0 auto;padding:36px 32px 72px}
    .bbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid rgba(201,168,76,.32);border-radius:8px;padding:8px 15px;font-family:'Lato',sans-serif;font-size:13px;color:var(--mid);cursor:pointer;margin-bottom:32px;transition:all .2s}
    .bbtn:hover{border-color:var(--gold);color:var(--brown);background:rgba(201,168,76,.07)}
    .dnum{font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--gold-d);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
    .dtitle{font-family:'Cormorant Garamond',serif;font-size:clamp(1.7rem,5vw,2.7rem);font-weight:600;color:var(--brown);line-height:1.2;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid rgba(201,168,76,.28);position:relative}
    .dtitle::after{content:'';position:absolute;bottom:-1px;left:0;width:56px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
    .lbox{background:var(--white);border:1px solid rgba(201,168,76,.22);border-radius:16px;padding:34px 38px;box-shadow:0 4px 22px var(--sh);animation:up .5s ease both}
    .lbox pre{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.9;color:var(--ink);white-space:pre-wrap;word-break:break-word}

    @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:680px){
      .hdr{padding:18px 18px 14px}
      nav{display:none}
      .hbtn{display:block}
      .lhdr,.dwrap{padding-left:18px;padding-right:18px}
      .sgrid{padding:0 18px 48px;grid-template-columns:1fr}
      .lbox{padding:22px 18px}
      .lbox pre{font-size:17px}
      .sbar input{width:120px}
    }
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--cream)}
    ::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
  </style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo" onclick="goHome()">
      <div class="logo-icon">🎵</div>
      <div>
        <div class="logo-name">Song Book</div>
        <div class="logo-sub">Hymns &amp; Choruses</div>
      </div>
    </div>
    <nav id="dnav">
      <button class="nb" data-s="es" onclick="goList('es')">English Songs</button>
      <button class="nb" data-s="ec" onclick="goList('ec')">English Choruses</button>
      <button class="nb" data-s="ts" onclick="goList('ts')">Telugu Songs</button>
    </nav>
    <button class="hbtn" onclick="toggleM()">☰</button>
  </div>
  <div class="mnav" id="mnav">
    <button class="nb" onclick="goList('es');toggleM()">English Songs</button>
    <button class="nb" onclick="goList('ec');toggleM()">English Choruses</button>
    <button class="nb" onclick="goList('ts');toggleM()">Telugu Songs</button>
  </div>
</header>

<!-- HOME -->
<div id="ph">
  <div class="hero">
    <span class="hero-orn">✦</span>
    <h1>Welcome to the Song Book</h1>
    <p>A treasury of hymns and choruses in English and Telugu.<br>Browse, search, and sing along.</p>
    <div class="hcards">
      <div class="hcard" onclick="goList('es')">
        <span class="hcard-ico">📖</span>
        <h3>English Songs</h3>
        <p>Full hymn lyrics in English</p>
      </div>
      <div class="hcard" onclick="goList('ec')">
        <span class="hcard-ico">🎶</span>
        <h3>English Choruses</h3>
        <p>Short praise choruses</p>
      </div>
      <div class="hcard" onclick="goList('ts')">
        <span class="hcard-ico">🌸</span>
        <h3>Telugu Songs</h3>
        <p>తెలుగు కీర్తనలు</p>
      </div>
    </div>
  </div>
  <div class="divider"><span>✦</span></div>
</div>

<!-- LIST -->
<div id="pl">
  <div class="lhdr">
    <h2><small id="lsub"></small><span id="ltitle"></span></h2>
    <div class="sbar">
      <input type="number" id="sin" placeholder="Song number…" min="1" onkeydown="if(event.key==='Enter')doSearch()"/>
      <button onclick="doSearch()">Go</button>
    </div>
  </div>
  <div class="sgrid" id="sgrid"></div>
</div>

<!-- DETAIL -->
<div id="pd">
  <div class="dwrap">
    <button class="bbtn" id="bbtn" onclick="goBack()">← Back</button>
    <div class="dnum" id="dnum"></div>
    <h2 class="dtitle" id="dtitle"></h2>
    <div class="lbox"><pre id="dlyr"></pre></div>
  </div>
</div>

<script>
const IDX=[
  {N:1,es:"All hail the power",ec:"Abba, Father, let me be",ts:"దేవుని స్తుతియించుడి"},
  {N:2,es:"All my lifelong I had",ec:"Above all power",ts:"యెహోవా నా బలమా"},
  {N:3,es:"All things bright",ec:"Absolutely tender",ts:"ఎల్లవేళలందు - కష్టమందైనను"},
  {N:4,es:"Amazing grace!",ec:"Accept my broken",ts:"స్తోత్రము యేసునాథా"},
  {N:5,es:"And can it be",ec:"According to thy loving",ts:"కర్తా నిన్‌ స్తుతించెదము"},
  {N:6,es:"As the deer pants",ec:"Acres of diamonds",ts:"నా యాత్మా! నా యంతరంగమా!"},
  {N:7,es:"Break thou the bread",ec:"All glory laud and honour",ts:"నా దేవుడా నా యేసయ్యా"},
  {N:8,es:"Come thou fount",ec:"All I need is You",ts:"యేసు నీ నామమే"},
  {N:9,es:"Crown Him with many crowns",ec:"All my praise",ts:"ఆనందించుము సీయోను పుత్రీ"},
  {N:10,es:"Fairest Lord Jesus",ec:"All that I am",ts:"దేవా నిన్‌ స్తుతించెదను"}
];

const SB=[
  {N:1,
   es:"1.All hail the power of Jesus' Name!\nLet angels prostrate fall;\nBring forth the royal diadem,\nAnd crown Him Lord of all.\n\n2.Crown Him, ye martyrs of our God,\nWho from the altar call,\nExtol the stem of Jesse's rod\nAnd crown Him Lord of all.\n\n3.Ye saints redeemed of Adam's race,\nYe ransomed from the fall,\nHail Him who saves you by His grace,\nAnd crown Him Lord of all.\n\n4.Sinners, whose love can ne'er forget\nThe wormwood and the gall;\nGo, spread your trophies at His feet,\nAnd crown Him Lord of all.\n\n5.Let every kindred, every tribe,\nOn this terrestrial ball,\nTo Him all majesty ascribe,\nAnd crown Him Lord of all.\n\n6.Oh, that with yonder sacred throng\nWe at His feet may fall;\nJoin in the everlasting song,\nAnd crown Him Lord of all.",
   ec:"Abba Father, let me be\nYours and Yours alone.\nMay my will for ever be\nevermore Your own.\n\nNever let my heart grow cold,\nnever let me go,\nAbba Father, let me be\nYours and Yours alone.",
   ts:"దేవుని స్తుతియించుడి యెల్లప్పుడు\nదేవుని స్తుతియించుడి\n\n1.ఆయన బలమును – ప్రసిద్ధి చేయు\nఆకాశ విశాలమందు ||దేవుని||\n\n2.ఆయన పరాక్రమ కార్యములను బట్టి\nఆయన ప్రభావమును ||దేవుని||\n\n3.బూర ధ్వనితో ఆయనన్‌ స్తుతించుడి\nస్వరమండలములతో ||దేవుని||\n\n4.సన్నని తంతుల సితారతోను\nచక్కని స్వరములతో ||దేవుని||\n\n5.పిల్లన గ్రోవిని చల్లగ నూది\nఎల్ల ప్రజలు చేరి ||దేవుని||\n\n6.తంబురతోను నాట్యముతోను\nతంతి వాద్యముతోను ||దేవుని||\n\n7.మ్రోగు తాళములతో ఆయనన్‌ స్తుతించుడి\nగంభీర తాళముతో ||దేవుని||\n\n8.సకల ప్రాణులు యెహోవాన్‌ స్తుతించుడి\nహల్లెలూయ ఆమెన్‌ ||దేవుని||"},
  {N:2,
   es:"1.All my life long I had panted\nFor a draught from some cool spring,\nThat I hoped would quench the burning\nOf the thirst I felt within.\n\nHallelujah! I have found Him\nWhom my soul so long has craved!\nJesus satisfies my longings;\nThrough His life I now am saved.\n\n2.Feeding on the husks around me,\nTill my strength was almost gone,\nLonged my soul for something better,\nOnly still to hunger on.\n\n3.Poor I was, and sought for riches,\nSomething that would satisfy,\nBut the dust I gathered round me\nOnly mocked my soul's sad cry.\n\n4.Well of water, ever springing,\nBread of life, so rich and free,\nUntold wealth that never faileth,\nMy Redeemer is to me.",
   ec:"Above all powers, above all kings\nAbove all nature and all created things\n\nAbove all wisdom and all the ways of man\nYou were here before the world began.\n\nAbove all kingdoms, above all thrones\nAbove all wonders the world has ever known\n\nAbove all wealth and treasures of the earth\nThere's no way to measure what you're worth.\n\nCrucified laid behind a stone\nYou lived to die, rejected and alone\n\nLike a rose trampled on the ground\nYou took the fall and thought of me above all.",
   ts:"యెహోవా నా బలమా\nయధార్థమైనది నీ మార్గం\nపరిపూర్ణమైనది నీ మార్గం\n\n1.నా శత్రువులు నను చుట్టినను\nనరకపు పాశము లరికట్టినను\nవరదవలె భక్తిహీనులు పొర్లిన\nవిడువక నను ఎడబాయనిదేవా ||యె||\n\n2.దయగల వారిపై దయచూపించును\nకఠినుల యెడలను వికటము చూపును\nగర్విష్టుల యొక్క గర్వము నణచును\nసర్వము నెరిగిన సర్వాధికారి ||యె||"},
  {N:3,
   es:"All things bright and beautiful,\nAll creatures great and small,\nAll things wise and wonderful,\nThe Lord God made them all.\n\n1.Each little flower that opens,\nEach little bird that sings,\nHe made their glowing colours\nHe made their tiny wings.\n\n2.The purple-headed mountain,\nThe river running by,\nThe sunset, and the morning\nThat brightens up the sky.\n\n3.The cold wind in the winter,\nThe pleasant summer sun\nThe ripe fruits in the garden,\nHe made them every one.\n\n4.He gave us eyes to see them,\nAnd lips that we might tell\nHow great is God Almighty,\nWho hath done all things well.",
   ec:"Absolutely tender, absolutely true\nUnderstanding all things, understanding You,\nInfinitely lovely, always near to cheer,\nThis is God our Father, what have we to fear?",
   ts:"ఎల్లవేళలందు కష్టమందైనను\nకృతజ్ఞాస్తుతులు చెల్లింతున్‌\nయేసువా నిన్ను నే స్తుతింతున్‌\nజీవితమంతయు స్తుతింతున్‌\n\n1.ఆదియు నీవే అంతము నీవే\nజ్యోతియు నీవే నా శాంతియు నీవే ||ఎ||\n\n2.తల్లి దండ్రియు దాతవు నీవే\nకోటయు నీవే నా బాటయు నీవే ||ఎ||\n\n3.వ్యాధిలో నీవే వృద్ధిలో నీవే\nబాధలో నీవే నా సాధకుడవు ||ఎ||\n\n4.రక్షణ నీవే దీక్షయు నీవే\nకాపరి నీవే నా కర్తవు నీవే ||ఎ||"},
  {N:4,
   es:"1.Amazing grace! how sweet the sound,\nThat saved a wretch like me!\nI once was lost, but now am found,\nWas blind, but now I see.\n\n2.'Twas grace that taught my heart to fear,\nAnd grace my fears relieved;\nHow precious did that grace appear\nThe hour I first believed!\n\n3.Thro' many dangers, toils and snares,\nI have already come:\n'Tis grace that bro't me safe thus far,\nAnd grace will lead me home.\n\n4.When we've been there ten thousand years,\nBright shining as the sun\nWe've no less days to sing God's praise\nThan when we first began.",
   ec:"Accept my broken, my broken spirit Lord,\nAccept my contrite, my contrite heart.\nAccept my broken, my broken spirit Lord,\nAccept my contrite, my contrite heart.\n\n1.I know I've been wrong for so long\nAnd so I'm singing this song.\n'Cause when I come with a broken spirit\nI know that You Oh Lord, will receive it.\n\n2.Sometimes my heart becomes as stone\nSometimes my will becomes my own\nThis time I come with a broken spirit\nAnd know that You, Oh Lord, will receive it.",

const CFG={
  es:{title:"English Songs",   sub:"Hymns & Lyrics",    back:"English Songs"},
  ec:{title:"English Choruses",sub:"Praise Choruses",   back:"English Choruses"},
  ts:{title:"Telugu Songs",    sub:"తెలుగు కీర్తనలు",  back:"Telugu Songs"},
};

let cur=null, prev=null;

function show(id){document.getElementById(id).style.display=''}
function hide(ids){ids.forEach(i=>document.getElementById(i).style.display='none')}
function setNav(s){document.querySelectorAll('.nb[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s))}

function goHome(){hide(['pl','pd']);show('ph');setNav(null);cur=null;window.scrollTo(0,0)}

function goList(s){
  prev=null; cur=s;
  hide(['ph','pd']); show('pl');
  setNav(s);
  const c=CFG[s];
  document.getElementById('lsub').textContent=c.sub;
  document.getElementById('ltitle').textContent=c.title;
  const grid=document.getElementById('sgrid');
  grid.innerHTML='';
  IDX.forEach((song,i)=>{
    const d=document.createElement('div');
    d.className='sc';
    d.style.animationDelay=`${i*0.028}s`;
    const num=document.createElement('span');
    num.className='snum'; num.textContent=song.N;
    const inf=document.createElement('div');
    inf.className='sinfo';
    const nm=document.createElement('div');
    nm.className='sname'; nm.textContent=song[s]||'—';
    inf.appendChild(nm);
    const arr=document.createElement('span');
    arr.className='sarr'; arr.textContent='›';
    d.appendChild(num); d.appendChild(inf); d.appendChild(arr);
    d.onclick=()=>goDetail(song.N,s);
    grid.appendChild(d);
  });
  window.scrollTo(0,0);
}

function goDetail(n,s){
  prev=s||cur; 
  hide(['ph','pl']); show('pd');
  const song=SB.find(x=>x.N===n);
  const idx=IDX.find(x=>x.N===n);
  document.getElementById('dnum').textContent=`Song ${n}`;
  if(song){
    document.getElementById('dtitle').textContent=(idx?idx[s||cur]:'') || `Song ${n}`;
    document.getElementById('dlyr').textContent=song[s||cur]||'Lyrics not available.';
  } else {
    document.getElementById('dtitle').textContent='Song Not Found';
    document.getElementById('dlyr').textContent='No lyrics found for this number.';
  }
  const lbl=prev?`← ${CFG[prev].back}`:'← Back';
  document.getElementById('bbtn').textContent=lbl;
  window.scrollTo(0,0);
}

function goBack(){prev?goList(prev):goHome()}

function doSearch(){
  const v=parseInt(document.getElementById('sin').value,10);
  if(v&&v>=1&&cur) goDetail(v,cur);
}

function toggleM(){document.getElementById('mnav').classList.toggle('open')}
</script>
