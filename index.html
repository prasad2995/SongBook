timony of the Lord is sure,\nMaking wise the simple.\n\nMore to be desired are they than gold\nYea, than much fine gold\nSweeter also than the honey\nIn the honeycomb.\nMoreover by them is Thy servant warned\nAnd in keeping of them there is great reward (2)\n\n2.The statutes of the Lord are right,\nRejoicing the heart,\nThe commandments of the Lord are pure\nEnlightening the eyes.\n\n3.The fear of the Lord is clean\nEnduring forever,\nThe judgments of the Lord are true,\nAnd righteous altogether.","ts":"నా పేరే తెలియని ప్రజలు ఎందరొ వున్నారు\nనా ప్రేమను వారికి ప్రకటింప కొందరె వున్నారు\nఎవరైనా మీలో ఎవరైనా ఎవరైనా మీలో ఒకరైనా\nవెళతారా నా ప్రేమను చెబుతారా\n\n1 నేను నమ్మిన వారిలో కొందరు మోసం చేశారు\nవెళతామని చెప్పి వెనుకకు తిరిగారు\nమీరైనా-మీలో ఒకరైనా వెళతారా-నా ప్రేమను చెబుతారా\n\n2 రక్షణ పొందని ప్రజలు లక్షల కొలదిగా వున్నారు\nమారు మూల గ్రామాలలో ఊరి లోపలి వీధుల్లో\nఎవరైనా-మీలో-ఎవరైనా వెళతారా నా ప్రేమను చెబుతారా\n\n3 వెళ్ళ గలిగితే మీరు తప్పక వెళ్ళండి\nవెళ్ళలేక పోతే వెళ్ళే వారిని పంపండి\nఎవరైనా-మీలో-ఒకరైనా వెళతారా-నా ప్రేమను చెబుతారా"},{"n":251,"ei":"Oh, Breath of Life, come","ci":"The Lord liveth; and blessed","ti":"యెరుషలేములో గొఱ్ఱెల ద్వారము దగ్గర","es":"1.Oh, Breath of Life, come sweeping through us,\nRevive Thy Church with life and power;\nOh! Breath of Life, come cleanse, renew us,\nAnd fit Thy Church to meet this hour.\n\n2.Oh! Wind of God, come bend us, break us,\nTill humbly we confess our need;\nThen in Thy tenderness remake us\nRevive, restore, for this we plead.\n\n3.Oh! Breath of Love, come breathe within us, \nRenewing thought and will and heart;\nCome, Love of Christ, afresh to win us, \nRevive Thy Church in every part.\n\n4.Revive us, Lord! is zeal abating\nWhile harvest fields are vast and white?\nRevive us, Lord, the world is waiting, \nEquip Thy Church to spread the light.","ec":"The Lord liveth; and blessed be my Rock;\nand may the God of my Salvation be exalted (twice)\nTherefore will I give thanks unto Thee O Lord,\nAmong the nations,\nAnd sing praises to Thy name.\nThe Lord liveth; and blessed be my rock;\nAnd may the God of my Salvation be exalted.","ts":"యెరుషలేములో గొఱ్ఱెల ద్వారము దగ్గర\nబేతెస్థ కోనేరు కలదు-అందు\nమంటపములైదు చుట్టు గలవు\n\n1 కుంటివారు గ్రుడ్డివారు\nఊచకాలు సేతులు కలవారు\nగుంపులు గుంపులుగా అక్కడ పడియుండిరి \n\n2 దేవదూత దిగువేళ నీళ్ళు కదలును\nఆ నీళ్ళు కదలు వేళ రోగం బాగు పడును\nఏ రోగి ముందు దిగునో ఆ రోగి బాగుపడును\n\n3 ముప్పది ఎనిమిది యేండ్ల నుండి రోగి ఒక్కడు\nస్వస్థత నొందలేక అందు పడి యుండెను\nయేసు వచ్చి వానిని ముట్టి స్వస్థపరచెను\n\n4 యేసు లేక లోకమందు మేలు ఉండదు\nఏ మేలు ఉన్న లోకమందు శాంతి ఉండదు\nయేసు ఉంటే శాంతి ఉంది కాంతి ఉంటుంది"},{"n":252,"ei":"The Son of God goes","ci":"The Lord thy God in the midst","ti":"ఎంత మంచి దేవుడవయ్యా యేసయ్యా","es":"1.The Son of God goes forth to war,\nA kingly crown to gain;\nHis blood-red banner streams afar!\nWho follows in His train?\nWho best can drink his cup of woe,\nTriumphant over pain,\nWho patient bears his cross below,\nHe follows in His train.\n\n2.The martyr first, whose eagle eye\nCould pierce beyond the grave;\nWho saw his Master in the sky,\nAnd called on Him to save,\nLike Him, with pardon on his tongue,\nIn midst of mortal pain,\nHe prayed for them that did the wrong:\nWho follows in his train?\n\n3.A glorious band, the chosen few\nOn whom the Spirit came,\nTwelve valiant saints, their hope they knew,\nAnd mocked the cross and flame.\nThey met the tyrant’s brandished steel,\nThe lion’s gory mane;\nThey bowed their necks the death to feel:\nWho follows in their train?\n\n4.A noble army, men and boys,\nThe matron and the maid,\nAround the Saviour’s throne rejoice,\nIn robes of light arrayed.\nThey climbed the steep ascent of heaven\nThrough peril, toil and pain;\nO God, to us may grace be given\nTo follow in their train.","ec":"The Lord thy God in the midst of thee is mighty, is mighty,\nHe will save, He will rejoice over thee with joy ,with joy,\nHe will rest in His love\nHe will joy over thee with singing\nThe Lord thy God in the midst\nOf thee is mighty, is mighty, is mighty.","ts":"ఎంత మంచి దేవుడవయ్యా యేసయ్యా\nచింతలన్ని తీరెనయ్యా-నిన్ను చేరినా\nనా చింతలన్ని తీరెనయ్యా నిన్ను చేరినా\n\n1 సంతోషం ఎక్కడ వుందని\nసమాధాన మెచ్చట నాకు దొరికేనని\nజగమంతా వెదికాను జనులందరి నడిగాను\nచివరికది నీలోనే కనుగొన్నాను\n\n2 ప్రేమనేది ఎక్కడ ఉందనీ\nక్షమ అనేది ఎచట నాకు దొరికేనని\nబంధువులలో వెతికాను స్నేహితులను అడిగాను\nచివరికది నీలోనే కనుగొన్నాను\t\n\n3 సత్యమనేది ఎక్కడ ఉందనీ\nనిత్య జీవమనేది ఎచట నాకు దొరికేనని\nఎందరికో మ్రొక్కాను ఏమేమో చేశాను\nచివరికది నీలోనే కనుగొన్నాను  \n\n4 నెమ్మదనేది ఎక్కడ ఉందని\nశాంతనేది ఎక్కడ నాకు దొరికేనని\nదిశలన్ని తిరిగాను యాత్రలెన్నో చేశాను\nచివరికది నీలోనే కనుగొన్నాను"},{"n":253,"ei":"Thou Christ of burning","ci":"There are two ways built for you","ti":"యెహోవా నాకు వెలుగాయె","es":"1.Thou Christ of burning, cleansing flame,\nSend the fire! Send the fire!\nThy blood-bought gift today we claim,\nSend the fire! Send the fire!\nLook down and see this waiting host,\nGive us the promised Holy Ghost,\nWe want another Pentecost,\nSend the fire! Send the fire!\n\n2.God of Elijah, hear our cry:\nSend the fire! Send the fire!\nOh, make us fit to live or die,\nSend the fire! Send the fire!\nTo burn up every trace of sin,\nTo bring the light and glory in,\nThe revolution now begin,\nSend the fire! Send the fire!\n\n3.’Tis fire we want, for fire we plead:\nSend the fire! Send the fire!\nThe fire will meet our every need;\nSend the fire! Send the fire!\nFor strength to ever do the right\nFor grace to conquer in the fight,\nFor power to walk the world in white:\nSend the fire! Send the fire!\n\n4.To make our weak hearts strong and brave\nSend the fire! Send the fire!\nTo live a dying world to save,\nSend the fire! Send the fire!\nOh, see us on Thy altar lay\nOur lives, our all, this very day;\nTo crown the offering now, we pray, \nSend the fire! Send the fire!","ec":"1.There are two ways built for you and me,\nThat’s the Bible story,\nThe broad way is with danger filled,\nThe straight one leads to Glory.\n\n(So then) Which way are you travelling? (3)\nThe broad or narrow way.\n\n2.Oh, ’tis sweet to know that day by day\nJesus walks beside me;\nWith my hand in His I cannot stray\nAnd safely He will guide me.","ts":"యెహోవా నాకు వెలుగాయె యెహోవా నాకు రక్షణాయె\nనా ప్రాణదుర్గమాయె నేను ఎవరికి ఎన్నడు భయపడను (2)\n\n1 నా తల్లియు-నా తండ్రియు ఒకవేళ విడిచినను\nఆపత్కాలమున-చేయి విడువకను యెహోవా నన్ను చేరదీయును\n\n2 నా కొండయు-నా కోటయు నా ఆశ్రయము తానే\nనేనెల్లప్పుడు-ప్రభు సన్నిధిలో స్తుతిగానము చేసెదను\n\n3 నాకు మార్గమును-ఉపదేశమును ఆలోచన అనుగ్రహించి\nనీ ఆజ్ఞలలో జీవించుటకు కృపతో నింపి కాపాడుము"},{"n":254,"ei":"Through all the changing","ci":"There has never been a friend","ti":"రుచి చూచి యెరిగితిని యెహోవా ఉత్తముడనియు","es":"1.Through all the changing scenes of life,\nIn trouble and in joy,\nThe praises of my God shall still\nMy heart and tongue employ.\n\n2.Oh, magnify the Lord with me! \nWith me exalt His Name; \nWhen in distress to Him I called, \nHe to my rescue came.\n\n3.The hosts of God encamp around\nThe dwellings of the just;\nDeliverance He affords to all\nWho on His succour trust.\n\n4.Oh, make but trial of His love!\nExperience will decide \nHow blest they are, and only they,\nWho in His truth confide.\n\n5.Fear Him, ye saints; and you will then\nHave nothing else to fear; \nMake you His service your delight,\nYour wants shall be His care.","ec":"1.There has never been a friend like Jesus,\nI have never found a friend so true;\nWhen I weaken and my steps grow wayward,\nThen He comes to me with strength anew.\n\nWe walk hand in hand through this pilgrim land¬\nHere we linger for a day;\nBut soon we’ll leave this land of night\nFor that land so bright— There my friend and I will stay.\n\n2.Let me recommend this friend so faithful\nHe will understand your deepest need;\nFor He walked this lonely path before us,\nAnd He’s able ev’ry step to lead.","ts":"రుచి చూచి యెరిగితిని యెహోవా ఉత్తముడనియు\nరక్షకునాశ్రయించి నే ధన్యుడనైతిని\n\n1 గొప్ప దేవుడవు నీవే స్తుతులకు పాత్రుడ వీవే\nతప్పక ఆరాధింతు దయాళుడవు నీవే\n\n2 మహోన్నతుడవగు దేవా ప్రభావము గలవాడా\nమనసార పొగడెదను నీ ఆశ్చర్య కార్యములన్‌\n\n3 మంచి తనము గల దేవా అతి శ్రేష్టుడవు అందరిలో\nముదమార పాడెద నిన్ను అతి సుందరుడ వనియు\n\n4 నా జీవిత మంతయును యెహోవాను స్తుతియించెదను\nనా బ్రతుకు కాలములో నా దేవుని కీర్తింతున్‌\n\n5 సంతోషింతు నెల్లప్పుడు కష్ట దుఃఖ బాధలలో\nఎంతో నెమ్మది నిచ్చు నా రక్షకుడు నా యేసు\n\n6 ప్రార్థింతును యెడ తెగక ప్రభు సన్నిధిలో చేరి\nసంపూర్ణముగా పొందెదను అడుగు వాటన్నిటిని\n\n7 కృతజ్ఞత చెల్లింతు ప్రతి దాని కొరకు నేను\nక్రీస్తుని యందే తృప్తి పొంది హర్షించెదను"},{"n":255,"ei":"We rest on thee","ci":"There is a name I love to hear","ti":"జీవజల ప్రవాహములు పారుచున్నవి","es":"1.“We rest on Thee”— our Shield and our Defender! \nWe go not forth alone against the foe;\nStrong in Thy strength, safe in Thy keeping tender, \n“We rest on Thee, and in Thy Name we go.”\n\n2.Yea, “in Thy Name,” O Captain of salvation! \nIn Thy dear Name, all other names above;\nJesus our Righteousness, our sure Foundation, \nOur Prince of glory and our King of love.\n\n3.“We go” in faith, our own great weakness feeling, \nAnd needing more each day Thy grace to know:\nYet from our hearts a song of triumph pealing; \n“We rest on Thee, and in Thy Name we go.”\n\n4.“We reston Thee”— Our Shield and our Defender! \nThine is the battle, Thine shall be the praise,\nWhen passing through the gates of pearly splendour, \nVictors—we rest with Thee, through endless days.","ec":"1.There is a name I love to hear;\nI love to sing its worth;\nIt sounds like music in my ear,\nThe sweetest name on earth.\n\nOh, how I love Jesus, (3)\nBecause He first loved me!\n\n2.Oh, for a thousand tongues to sing\nMy great Redeemer’s praise!\nThe glories of my God and King,\nThe triumphs of His Grace.","ts":"జీవజల ప్రవాహములు పారుచున్నవి\nపరిశుద్ధాత్మ వరములతో సాగుచున్నవి\nయేసుక్రీస్తు నాయకుడై సాగుచున్నవి\nఅదే అదే సార్వత్రిక క్రైస్తవ సహవాసము\nహల్లెలూయ పాటలతో అలరారుచున్నది\n\n1 దేవుడే దీని శిల్పి యీ భువిలో ఆయనే దీనిని నిల్పి\nవిశ్వమంత యీ జలములు ప్రవహింపగ జేసెను\nకులము మతము భాషాబేధములు లేనిదీ\nఅదే అదే సార్వత్రిక క్రైస్తవ సహవాసము\nహల్లెలూయ పాటలతో అలరారుచున్నది\n\n2 ఈ నది ఓరన నాటబడిన క్రైస్తవా నెలకు మూడు కాపులుగా విరబూయుమురా \nకలువరిగిరి సిలువ జ్వాలవై కొనసాగుమురా\nఅదే అదే మార్గము క్రీస్తు జీవమార్గము\n\n3 మరువబోకుమోయి మన యేసు ప్రేమను\nకలువరిలో చిందించిన ప్రేమామృతమును\nకడదాక దానిని-విడువబోకుము\nఅదే అదే మోక్ష మార్గము పరమునకు సాక్షి మార్గము\n"},{"n":256,"ei":"What a Friend we have","ci":"There is a redeemer","ti":"ఇది ప్రజ్వరిల్లుచున్న-ఉజ్జీవ జ్వాల","es":"1.What a Friend we have in Jesus,\nAll our sins and griefs to bear!\nWhat a privilege to carry\nEverything to God in prayer!\nOh, what peace we often forfeit!\nOh, what needless pain we bear!\nAll because we do not carry\nEverything to God in prayer.\n\n2.Have we trials and temptations?\nIs there trouble anywhere?\nWe should never be discouraged;\nTake it to the Lord in prayer.\nCan we find a friend so faithful\nWho will all our sorrows share?\nJesus knows our every weakness;\nTake it to the Lord in prayer.\n\n3.Are we weak and heavy-laden,\nCumbered with a load of care?\nPrecious Saviour, still our refuge—\nTake it to the Lord in prayer.\nDo thy friends despise, forsake thee?\nTake it to the Lord in prayer;\nIn His arms He’ll take and shield thee,\nThou wilt find a solace there.","ec":"1.There is a Redeemer,\nJesus, God’s own Son,\nPrecious Lamb of God,\nMessiah, Holy One.\n\nThank you O my Father, for giving us Your Son\nAnd leaving Your Spirit, till The work on earth is done.\n\n2.Jesus my Redeemer,\nName above all names,\nPrecious Lamb of God, Messiah,\nO for sinners slain.\n\n3.When I stand in glory,\nI will see his face,\nAnd there I’ll serve my King forever\nIn that Holy place.","ts":"ఇది ప్రజ్వరిల్లుచున్న-ఉజ్జీవ జ్వాల\nప్రభుయేసు సిలువ నుండి ప్రవహించుధార\nపవిత్రమై-పరిశుద్ధమై ప్రవహించు జీవధార\n\n1 మౌన ప్రార్థన-మోకాటి ప్రార్థన\nకన్నీటి ప్రార్థన-ఉపవాస ప్రార్థన\nసిలువ శక్తితో-విలువైన భక్తితో\nసిలువ సాక్షిగా-శ్రీయేసు సాక్షిగా\n\n2 విశ్వాసఘాతకుల్‌-విద్రోహ చర్యలు\nవిచిత్ర మనుజుల-విషమైన  మనసులు\nసాతాను యుక్తులు-సహించి నేటికి\nసాగిపోతుంది-సజీవసాక్షిగా\n\n3 ఎల్లలు దాటింది శ్రీ యేసు సువార్త\nఎంత ప్రయాణం-ఎంతెంత దూరము\nఎన్ని మేలులు-ఎన్నెన్ని దీవెనల్‌\nపొందినవారంతా-దీవించబడితిరి\n\n4 లేచి తేజరిల్లింది ప్రభు సహవాసం\nఒంటరి వాడయ్యాడు వేలమందిగా\nఎండిన భూమిపై జీవజలములు\nదప్పిక గలవారిపై కుమ్మరించాడు"},{"n":257,"ei":"I heard the Saviour say","ci":"There is no one too good","ti":"తరుణమిదే-తరుణమిదే పాపికి తరుణమిదే","es":"1.I hear the Saviour say,\n“Thy strength indeed is small;\nChild of weakness, watch and pray,\nFind in Me thine all in all.”\n\nJesus paid it all--\nAll to Him I owe;\nSin had left a crimson stain;\nHe washed it white as snow.\n\n2.Lord, now indeed I find \nThy power, and Thine alone, \nCan change the leper’s spots, \nAnd melt the heart of stone.\n\n3.For nothing good have I \nWhereby Thy grace to claim--\nI’ll wash my garments white \nIn  the blood of Calvary’s Lamb.\n\n4.And when before the throne \nI stand in Him complete, \n“Jesus died my soul to save,” \nMy lips shall still repeat.","ec":"1.There is no one too good,\nThere is no one too vile,\nThere is no one too great or too small;\nThere is no one too wise, And no one too dull,\nHis love reaches out to all.\n\nHe has a welcome for all,\nFor all those who seek,\nGuilt He removes,\nAnd He gives us His love ---\nThis He promised to the meek.\n\n2.One starts early to seek, And another starts late\nTo make use of the offer of God;\nThere are some who wait till locked is the gate\nDo not wait, O heed to the Lord.","ts":"తరుణమిదే-తరుణమిదే పాపికి తరుణమిదే\nపరలోకము చేరుటకు ఆ నరకము తప్పుటకు\n\n1 నీ ఆయువు నాలోచించుము నీ బ్రతుకును ఆలోచించుము\nనీ పాప ఫలితమెపుడో బహు భయంకర నరకమయా\n\n2 నీ పాపపు పరుగులతో ప్రళయాగ్నిలో చేరెదవా\nపరలోకపు మార్గమును తిరస్కారము చేసెదవా\n\n3 నీ కొరకై శ్రీ యేసు ఆ సిలువలో బలియాయెన్‌\nనీ రక్షణ గోరి సదా సువార్తను వినిపించెన్‌\n\n4 ప్రభు యేసుని రక్తములో పరిశుద్ధుడవై ధరలో\nపరమానందము నొందన్‌ త్వరపడిరా ప్రార్థింపన్‌\n\n5 కృప కాలము దాటగనే అపాయపు దినములలో\nమనుజాళికి మహ శ్రమలు కనిపించదు ఆశ్రయము\n\n6 నీ దేవుని సన్నిధిలో కనబడుటకు సిద్ధపడుమా\nనేడే రక్షణ దినము లోక కీడును విడచి రమ్ము"},{"n":258,"ei":"Faith of our Fathers!","ci":"There is power in the name of","ti":"దొరుకుతావురా సహోదరా!","es":"1.Faith of our fathers! living still\nIn spite of dungeon, fire and sword,\nO how our hearts beat high with joy\nWhene’er we hear that glorious Word!\nFaith of our fathers! holy faith!\nWe will be true to Thee till death!\n\n2.Our fathers, chained in prisons dark,\nWere still in heart and conscience free:\nHow sweet would be their children’s fate,\nIf they, like them, could die for Thee!\nFaith of our fathers! holy faith!\nWe will be true to Thee till death!\n\n3.Faith of our fathers! we will love\nBoth friend and foe in all our strife:\nAnd preach Thee, too, as love knows how\nBy kindly words and virtuous life:\nFaith of our fathers! holy faith!\nWe will be true to Thee till death!","ec":"1.There is power in the name of Jesus;\nWe believe in His name.\nWe have called on the name of Jesus;\nWe are saved! We are saved!\nAt His name the demons flee.\nAt His name captives are freed;\nFor there is no other name that is higher, Than Jesus!\n\n2.There is power in the name of Jesus,\nLike a sword in our hands.\nWe declare in the name of Jesus,\nWe shall stand! We shall stand!\nAt His name God’s enemies;\nShall be crushed beneath our feet,\nFor there is no other name that is higher, than Jesus.","ts":"దొరుకుతావురా సహోదరా! దొరుకుతావురా – నీవు\nతరిమి తరిమి కీడు చేయ పరుగులెత్తిన గాని తుదకు\n\n1 చిన్న చూపుచూచి తమ్ముని కన్నెరుంగక చంపినగాని\nఅన్న కయీను దేవుని హస్తమునకు దొరికినరీతిగా\n\n2 వరములొందిన తమ్ముని జంప వలయునని పంతము పగబట్టి\nనరకవచ్చి లోబడి ఏడ్చిన దురిత చరితుని ఏశావువలె\n\n3 విగ్రహమునకు మ్రొక్కనిదైవ పిల్లల నగ్నిలో పడవైచి\nఆగ్రహించిన నెబుకద్నెజరు గడ్డి మేసి దొరికిన విధముగ\n\n4 చెడుగుచేసి పరులు దానిని చేసినారని చెప్పియున్న\nవడిగ దేవుని న్యాయమనెడి పరమ త్రాసులో నిలువబడి"},{"n":259,"ei":"Far, far away in heathen","ci":"There is victory for me","ti":"విశ్వాసి నీలోనీవే-విమర్శ చేసికొనుమా","es":"1.Far, far away in heathen darkness dwelling, \nMillions of souls for ever may be lost;\nWho, who will go---Salvation’s story telling--- \nLooking to Jesus, counting not the cost?\n\n“All power is given unto Me!\nAll power is given unto Me!\nGo ye into all the world and preach the Gospel;\nAnd lo! I am with you alway.”\n\n2.See o’er the world, wide open doors inviting; \nSoldiers of Christ, arise and enter in!\nChristians, awake! your forces all uniting, \nSend  forth the Gospel, break the chains of sin!\n\n3.“Why will ye die?” the voice of God is calling;\n“Why will ye die?” re-echo in His Name;\nJesus hath died to save from death appalling; \nLife and salvation therefore go proclaim.\n\n4.God speed the day when those of every nation, \n“Glory to God” triumphantly shall sing;\nRansomed, redeemed, rejoicing in salvation, \nShout, “Hallelujah, for the Lord is King!”","ec":"There is victory for me,\nThere is victory for me,\nThrough the blood of Christ, my Saviour,\nThere is victory for me.\nFor me, yes me, for me, yes me,\nThrough the blood of Christ my Saviour, there is victory.","ts":"విశ్వాసి నీలోనీవే-విమర్శ చేసికొనుమా\nవిశ్వాస పూరిత హృదయ ముండెనో లేదో నీకు\n\n1 సేవచేయుచుంటి వటంచు సంతసించు చుంటివేమో\nకొయ్యకాలు కఱ్ఱ గడ్డి కాలురీతిగా నున్నదేమో\n\n2 పదిమంది కన్యకలేమో పిలువబడిరి పెండ్లి విందుకు\nపోలేక పోయి రందు ఐదుగురు అజాగ్రత్తచే\n\n3 మునుపున్న రీతిగానే నేడుంటినని సంసోను\nయెరుగలేక దేవుని విడుపు పొందెనోయి అంధత్వమును\t \n\n4 విస్తారమగు పనులెన్నో వేసికొనియె మన మార్తమ్మ\nఉత్తమమగు దారిలో నున్నావో లేదో నీవు\n\n5 నీ విధిని మరచి నీవు పాతిపెట్టి నావ తలాంతు\nదొంగ వచ్చినట్లు వచ్చి దండించు నేమో నిన్ను\n\n6 నీ జీవిత లక్ష్యమేమి నీకున్నదీక్ష యేమి\nగురిలేని పోరాటములో గడచు చుండె నేమో కాలం"},{"n":260,"ei":"Fear not, I am with thee","ci":"There's no greater name than","ti":"ఓహో క్రైస్తవుడా-జయ జీవితమేది","es":"1.“Fear not, I am with thee”; \nBlessed golden ray,\nLike a star of glory, \nLighting up my way!\nThrough the clouds of midnight \nThis bright promise shone,\n“I will never leave thee, \nNever will leave thee alone.”\n\nNo, never alone; \nNo, never alone;\nHe promised never to leave me, \nNever to leave me alone.\n\n2.Roses fade around me, \nLilies bloom and die,\nEarthly sunbeams vanish---\nRadiant still the sky!\nJesus, Rose of Sharon, \nBlooming for His own,\nJesus, heaven’s sunshine, \nNever will leave me alone.\n\n3.Steps unseen before me, \nHidden dangers near;\nNearer still my Saviour, \nWhispering, “Be of cheer.”\nJoys, like birds of spring-time, \nTo my heart have flown,\nSinging all so sweetly, \n“He will not leave me alone.”","ec":"There’s no greater name than Jesus,\nName of Him who came to save us,\nIn that saving Name of Jesus \t\nev’ry knee shall bow.\nLet ev’rything that is ‘neath the ground,\nLet ev’rything in the world around,\nLet ev’rything that is high o’er the sky,\nBow at Jesus Name---\nIn our minds by faith professing,\nIn our hearts by inward blessing,\nOn our tongues by word confessing,\nJesus Christ is Lord!","ts":"ఓహో క్రైస్తవుడా-జయ జీవితమేది\nజల్లించెను సాతాను నిన్ను జారితివే మరి వేసారితివే\n\n1 విజయముగా బ్రతుకను వృజినమున\nనిజదైవము నిను సృజి యించెనుగా\nజారితివే వేసారితివే - వెనుకాడియు వేషము విడువవా\n\n2 సాతానుని ఒడిలో నిదురించి\nసర్వేశుని బోధలు ఎదిరించి\nమానసము మసిగారినను\nమలినమును మలుపగలేవా\n\n3 గద్దించెడు మనస్సాక్షిని ద్రోసి\nఘనదేవుని మార్గములను రోసి\nదాస్యమను ధనమోహమును\nదాహముతో త్రాగెదవేమి?\n\n4 ఆత్మలో ఆనందము అణగారి\nఆవేశము లేకను దిగజారి\nఅన్నిటిలో నే నధికుడ ననుచు\nఆర్భాటము చేసెదవేమి?\n\n5 ఎన్నో మేలులు తరుణములు\nయేసుడు నీకివ్వగ కరుణించి\nతామసము మరి జేయుదువా\nతండ్రి కౌగిలి జేరవా"},{"n":261,"ei":"Jesus is all the world","ci":"Therefore the redeemed of the","ti":"ఓ మానవుండ నీ గతి ఏమౌనో తెలియునా","es":"1.Jesus is all the world to me,\nMy life, my joy, my all;\nHe is my strength from day to day,\nWithout Him I would fall.\nWhen I am sad to Him I go,\nNo other one can cheer me so;\nWhen I am sad He makes me glad\nHe’s my Friend.\n\n2.Jesus is all the world to me,\nMy Friend in trials sore;\nI go to Him for blessings, \nAnd He gives them o’er and o’er.\nHe sends the sunshine and the rain,\nHe sends the harvest’s golden grain;\nSunshine and rain, harvest of grain\nHe’s my Friend.\n\n3.Jesus is all the world to me,\nAnd true to Him I’ll be;\nO how could I this Friend deny,\nWhen He’s so true to me?\nFollowing Him I know I’m right,\nHe watches o’er me day and night;\nFollowing Him by day and night\nHe’s my Friend.\n\n4. Jesus is all the world to me,\nI want no better friend;\nI trust Him now, I’ll trust Him when\nLives’ fleeting days shall end.\nBeautiful life with such a Friend,\nBeautiful life that has no end;\nEternal life, Eternal joy\nHe’s my Friend.","ec":"Therefore the redeemed of the Lord shall return\nAnd come with singing unto Zion,\nAnd everlasting joy shall be upon their head.\nTherefore ......\nThey shall obtain gladness and joy\nAnd sorrow and mourning shall flee away.\nTherefore…..","ts":"ఓ మానవుండ నీ గతి ఏమౌనో తెలియునా\nఏమేమి చేయుచుంటివో తప్పించుకొందువా?  ఆహా ఆ... \n\n1 ఆ అంత్యతీర్పున యేసూ నీ రక్షకుడే\nమహా భయంకరమగు సింహంబుగా నుండు\n\n2 లోకాలు పుట్టినప్పటి నుండి మృతులైన\nఏకులజుడైన నాటికి తీర్పులో నిలుచును\n\n3 మృతులైన ఘనులు హీనులు యేసయ్య యెదుటను\nప్రతివారు నిలచియుందురు బ్రతికినరీతిగనే\n\n4 గ్రంథాలు విప్పబడగ గ్రంథాలలో వారి\nగ్రంథంబు బట్టబయలై పొందుదురు తీర్పును\n\n5 నరులెల్ల క్రియల చొప్పున మరి తీర్పుపొందుదురు\nమరణము మృతుల లోకము గురియౌను అగ్నికి\n\n6 ఈనాడు నీవు కూడను యేసుని విడచినచో\nఆనాడు నీవు కూడను అందుండి  యేడ్చెదవు\n\n7 దేవుని జీవగ్రంథము దేవుడు తెరచును\nఎవ్వని పేరందుండదో వాడగ్నిలో బడును"},{"n":262,"ei":"Fight the goog fight","ci":"Theare's just something about","ti":"నీ జీవితములో గమ్యంబు ఏదో\n","es":"1.Fight the good fight with all thy might!\nChrist is thy strength and Christ thy right;\nLay hold on life, and it shall be\nThy joy and crown eternally.\n\n2. Run the straight race through God’s good grace,\nLift up thine eyes, and seek His face;\nLife with its way before us lies,\nChrist is the path, and Christ the prize.\n\n3.Cast care aside, lean on thy Guide;\nHis boundless mercy will provide;\nLean, and thy trusting soul shall prove\nChrist is its life, and Christ its love.\n\n4. Faint not, nor fear, for He is near,\nHe changeth not, and thou art dear;\nOnly believe, and thou shalt see\nThat Christ is all in all to thee.","ec":"There’s just something about my Jesus,\nSomething that I can’t explain,\nFor since I met this blessed  Saviour\nMy life has been so re-arranged:\nWell, if you’re looking for friendship,\nContentment and peace\nJust try Him and you will see—\nThere’s something about my Jesus,\nSomething about my Lord.","ts":"నీ జీవితములో గమ్యంబు ఏదో ఒకసారి యోచించవా\nఈనాడే నీవు ప్రభు యేసు కొరకు నీ హృదయ మర్పించవా\n\n1 నీ తల్లి గర్భమున నీ వుండినపుడే నిను చూచె ప్రభు కన్నులు\nయోచించినావా ఏ రీతి నిన్ను నిర్మించె తన చేతులు\n\n2 నీలోన తాను నివసింపగోరి దినమెల్ల చేజాచెను\nహృదయంబు తలుపు తెరువంగ లేవా యేసు ప్రవేశింపను\n\n3 తన చేతులందు రుధిరంపు ధారల్‌ స్రవియించె నీ కోసమే\nభరియించె శిక్ష నీ కోసమేగా ఒకసారి గమనించవా\n\n4 ప్రభుయేసు నిన్ను సంధించునట్టి సమయంబు ఈనాడెగా\nఈ చోటనుండి ప్రభు యేసు లేక పోబోకుమో సోదరీ"},{"n":263,"ei":"Sound the battle cry","ci":"There's no other one so real","ti":"న్యాయాధిపతియైన దేవుడు","es":"1.Sound the battle cry,\nSee! the foe is nigh:\nRaise the standard high For the Lord!\nGird your armour on,\nstand firm every one,\nRest your cause upon  His Holy Word!\n\nRouse, then, soldiers!\nRally round the banner!\nReady, steady, Pass the word along. \nOnward! forward! Shout aloud Hosanna!\nChrist is Captain Of the mighty throng!\n\n2. Strong to meet the foe, Marching on we go,\nWhile our cause we know Must prevail;\nShield and banner bright Gleaming in the light,\nBattling for the right, We ne’er can fail!\n\n3.O Thou God of all, Hear us when we call!\nHelp us, one and all, By Thy grace:\nWhen the battle’s done, And the victory won,\nMay we wear the crown Before Thy face!","ec":"1.There’s no other one so real to me as Jesus,\nNo one to whom I’d rather go;\nThere’s no other one so real to me as Jesus,\nNo other one can love me so.\n\nHe takes away the fear,\nWhen days are dark and drear,\nHe gives the peace of God above;\nThere’s no other one so real to  me as Jesus,\nNo other one can love me so.\n\n2.When I’m sad and feeling blue I come to Jesus,\nHe loves me when the teardrops start,\nThere’s no other one so real to me as Jesus,\nHe lifts the burden from my heart.","ts":"న్యాయాధిపతియైన దేవుడు నిను తీర్పు తీర్చేటి వేళలో\nఏ గుంపులో నీవుందువు యోచించుకో.. ఓ క్రైస్తవా\n\n1 ఆకలితో అలమటించగా దాహముతో తపియించగా (2)\nరోగముతో, కృశియించగా\nనను చేర్చుకొనలేదు నీ వెందుకు?\nఅని యేసు నిన్నడిగిన-యేమందువు\n\n2 గొఱ్ఱెలనే నీతిమంతులు మేకలనే పాపాత్ములు (2)\nమందలుగా విభజించగా\nఏ వైపున నీవు నిలిచి యుందువు?\nఅని యేసు నిన్నడిగిన-యేమందువు?\n\n3 గొఱ్ఱెలకు నిత్య జీవము మేకలకు నిత్య నరకము (2)\nప్రతిఫలముగా నీకొసగునుగా\nఈ రెంటిలో ఏది నీ స్థానము?\nఅని యేసు నిన్నడిగిన-యేమందువు "},{"n":264,"ei":"Soldiers of Christ, arise","ci":"These are the days of Elijah","ti":"నరకమనునది-నిరంతముండునయో","es":"1.Soldiers of Christ, arise,\nAnd put your armour on,\nStrong in the strength which God supplies\nThrough His eternal Son:\n\n2.Strong in the Lord of hosts, \nAnd in His mighty power;\nWho in the strength of Jesus trusts \nIs more than conqueror.\n\n3.Stand then in His great might,\nWith all His strength endued; \nAnd take, to arm you for the fight, \nThe panopy of God.\n\n4.From strength to strength go on,\nWrestle, and fight, and pray; \nTread all the powers of darkness down,\nAnd win the well-fought day:\n\n5.That, having all things done,\nAnd all your conflicts past,\nYe may o’ercome through Christ alone\nAnd stand complete at last.","ec":"1.These are the days of Elijah\nDeclaring the Word of the Lord\nAnd these are the days of Your servant Moses’,\nRighteousness being restored\nAnd though these are days of great trials\nOf famine and darkness and sword\nStill we are the voice in the desert crying\nPrepare ye the way of the Lord.\n\nBehold He comes riding on the clouds\nShining like the sun at the trumpet call\nSo lift your voice it’s the year of Jubilee\nAnd out of Zion’s hill salvation comes\n\n2.And these are the days of Ezekiel\nThe dry bones becoming as flesh\nAnd these are the days of your servant David\nRebuilding the temple of praise\nAnd these are the days of the harvest\nThe fields are white in the world\nAnd we are Your labourers in Your vineyard\nDeclaring the Word of the Lord.","ts":"1 నరకమనునది-నిరంతముండునయో\nఆ ఘోర నరకము-నందు పాపులు\nబాధపడుదురయో మరియు నగ్ని\nపురుగులందున-కొరుకుచుండును\nతరుగులేకను ధరణికాదిది దరియుకాదు\nమరణమెదికిన దొరకదందున\n\n2 గప్పుగప్పున రగులుచుండునయ్యో\nఆ ఘోరనరకము నిప్పులెగయుచు\nపొంగుచుండునయ్యో\nమబ్బువలె పొగ పైకి లేచును- అబ్బ! అబ్బని యేడ్చుచుందురు\nబొబ్బలిడుదురు అడ్డమొచ్చెడి\nఅబ్బలెవ్వరు కానరందున\n\n3 నోరు నెత్తి కొట్టుకొందురయ్యో\nప్రభు యేసు క్రీస్తును నమ్మనందుకు\nనొచ్చుకొందురయ్యో\nపురుగు చావదు అగ్ని ఆరదు\nకొరుకుచుందురు-పండ్లు పటపట\nతిరిగితిరిగి చూచుచుందురు\nపరుగులెత్తక యేడ్చు చుందురు"},{"n":265,"ei":"Dying with Jesus,","ci":"Things are different now","ti":"ఓ మానవుడా-పాపమనే విషమున్నది","es":"1.Dying with Jesus, by death reckoned mine;\nLiving with Jesus a new life divine:\nLooking to Jesus till glory doth shine;\nMoment by moment, O Lord, I am Thine.\n\nMoment by moment I’m kept in His love,\nMoment by moment I’ve life from above\nLooking to Jesus till glory doth shine;\nMoment by moment, O Lord, I am Thine.\n\n2.Never a battle with wrong for the right,\nNever a contest that He doth not fight;\nLifting above us His banner so white--\nMoment by moment I’m kept in His sight.\n\n3.Never a trial that He is not there,\nNever a burden that He doth not bear,\nNever a sorrow that He doth not share--\nMoment by moment I’m under His care.\n\n4.Never a heart-ache, and never a groan,\nNever a tear-drop, and never a moan;\nNever a danger but there on the throne\nMoment by moment He thinks of His own.\n\n5.Never a weakness that He doth not feel,\nNever a sickness that He cannot heal;\nMoment by moment, in woe or in weal,\nJesus, my Saviour abides with me, still.","ec":"Things are different now,\nSomething happened to me,\nWhen I gave my heart to Jesus.\nThings are different now,\nI was changed, it must be,\nWhen I gave my heart to Him.\nThings I loved before have passed away,\nThings I love far more have come to stay.\nThings are different now,\nSomething happened to me,\nWhen I gave my heart to Jesus.","ts":"ఓ మానవుడా-పాపమనే విషమున్నది యీ లోకములో\nయేసు మాట వినరమ్ము మానవుడా\n\n1 రాజును రారాజునని విఱ్ఱవీగకు\nఈ లోక వైభవములు ఒక్క నాటికే\nప్రతి మనిషి ఒకనాడు చనిపోవలెను\nనీ క్రియలను బట్టియే నీకు ప్రతిఫలము\n\n2 అందము నాకున్నదని ఆర్భటించకూ\nనీ వయస్సు నడిప్రాయము వాడిపోవును\nనీవేమి చేయుచూ-తిరుగుచుంటివో\nనీ క్రియలను బట్టియే నీకు ప్రతిఫలము\n\n3 ధనము ధనము ధనమని ధనములో పడిపోకుము\nఒంటె సూది బెజ్జములో దూరుట సులభం\nధనవంతుడు పరలోక రాజ్యములో\nప్రవేశించుట ఎంతో-దుర్లభము"},{"n":266,"ei":"When the Lord shall come","ci":"This is the day that the","ti":"ఓ మానవా ఒకసారి ఆలోచించుము నీ జీవితం","es":"1.When the Lord shall come upon us\nAnd His glory we shall see\nSense and know His power within us\nFeel His perfect liberty\nWhen the Lord our love possesses\nAnd His love pervades the whole\nHow we easily surrender\nOh how Jesus fills the soul.\n\n2.When He has our every portion\nAnd His blood has touched the heart\nCleansed – we gaze and gaze upon Him\nCan it be! My Lord, my God!\nHow I love Him! Oh I love Him!\nHow I clasp that matchless Name!\nJesus, Jesus, Precious Jesus!\nKing of kings! To me He came!\n\n3.Oh I bend in adoration \t\nJesus Thou dost flood my soul!\nJesus fills the very heavens,\nHe the way, the Life, the Goal,\nHe the Saviour, His the glory!\nMortals worship; angels, all!\nJesus, Jesus only Jesus!\nWhile eternal ages roll.","ec":"This is the day (2)\nThat the Lord has made (2)\nWe will rejoice, we will rejoice\nAnd be glad in it (2)\nThis is the day that the\nLord has made\nWe will rejoice and be glad in it;\nThis is the day (2)\nThat the Lord has made.","ts":"ఓ మానవా ఒకసారి ఆలోచించుము నీ జీవితం\nరేపు ఏమి సంభవించునో నీకు తెలియదురా\nవెఱ్ఱి మానవా ఓ మానవా ఆ...ఆ...\n\n1 ఎండిపోయే గడ్డివంటా రాలిపోయే పూవువంటా\nచేద నుండి జారే బిందువంటా సాగిపోయే నీడవంటా\nత్రాసు మీద ధూళివంటా మానవా పగిలి మట్టి కుండవంటా\n\n2 నీ జీవము కొంత సేపు కనబడే అంతలోన మాయమై పోయెను\nఆవిరివంటా ఎగిరి పోదుమా కానరాని దుమ్మువంటా\nనీ జీవితం మాయరా మానవా నీ బ్రతుకే మాయరా ఓ మానవా\n\n3 నీలో ఉన్న ఆత్మ మంట దేవుడు పెట్టిన దీపమంటా\nఆ దీపము ఆరిపోయినా మరలా మండదురా ఏనాడైనా\nదీపముండగానే ఇల్లు చక్కబెట్టుకో ప్రాణముండగానే నీవు\n\nప్రభుని నమ్ముకో యేసయ్యను నమ్ముకోరా మానవా \nపరలోకం చేరుకోరా మానవా... మానవా...\n\n\n\n\n"},{"n":267,"ei":"Blest be the tie that binds","ci":"Thou wilt keep him in perfect","ti":"రేయింబవళ్ళలోన వెళ్లేటి త్రోవలోన","es":"1.Blest be the tie that binds\nOur hearts in Christian love;\nThe fellowship of kindred minds\nIs like to that above.\n\n2.Before our Father’s throne\nWe pour our ardent prayers; \nOur fears, our hopes, our aims are one,\nOur comforts and our cares.\n\n3.We share each other’s woes,\nEach other’s burdens bear;\nAnd often for each other flows\nThe sympathising tear.\n\n4.When we are called apart\nIt gives us inward pain;\nBut we shall still be joined in heart,\nAnd hope to meet again.","ec":"1.Thou wilt keep him in perfect peace (3)\nWhose mind is stayed on Thee\n\n2.They that wait upon the Lord (3)\nThey shall renew their strength\n\n3.Whom shall I send and who will go (3)\nHere am I Lord, send me\n\n4.If the son shall make you free (3)\nYe shall be free indeed.","ts":"రేయింబవళ్ళలోన వెళ్లేటి త్రోవలోన యేసయ్య నేల మరతువు\nఅయ్యయ్యో... క్షణంబులో లోకంబు విడుతువు\n\n1 ఎక్కడి కోయీ యాత్ర పోయేది \nనీ యిల్లు స్థిరముగాదు నీ ఒళ్ళు మరిచెదవు\nనీ వచ్చిన దారినే వెళ్ళిపోవాలి, మళ్ళీ పోవాలి\n\n2 యేసయ్య దారిలో ఎడారిలేదు\nఇరుకైన దారిలోన బరువైన కాడితోను\nప్రార్థన ఖడ్గముతోను బయలుదేరాలి, ప్రభుని చేరాలి\n\n3 బానిస పిల్ల మాటలు నమ్మి\nఅన్యుడైన నయమాను అప్పుడె మార్పు నొందేనోయి\nలోకాశ గేహాజికి లోటు తెచ్చెనోయి గొప్ప కుష్టు తెచ్చెనోయి\n\n4 సొదొమ, గొమొఱ్ఱా చోద్యము చూడ\nలోతు భార్య ఆనాడు లోకాశకు లోబడి\nఊరి వెలుపల ఉప్పు స్థంభమాయె గొప్ప స్థంభమాయె\n\n5 కయ్యమునకై కాలు దువ్వుచు\nగొల్యాతను శూరుడు ఆరుమూర్ల జానెడు\nదేవుని ధిక్కరించి ముక్క చెక్కలాయె చెక్కముక్కలాయె\n\n6 నోవహు ఓడ నేటికి జూడ\nనమ్మిన వారేమైనారో నమ్మని వారేమైనారో\nఆనాటి సాక్ష్యము అక్కడే ఉన్నది, కనబడుచున్నది"},{"n":268,"ei":"God holds the key of all","ci":"Though the fig tree does not","ti":"అమూల్య రక్తము ద్వార","es":"1.God holds the key of all unknown, And l am glad:\nIf other hands should hold the key,\nOr if He trusted it to me, I might be sad.\n\n2.What if tomorrow’s cares were here Without  its rest?\nI’d rather He unlocked the day, \t\nAnd, as the hours swing open, say, “My will is best.”\n\n3.The very dimness of my sight \tMakes me secure;\nFor, groping in my misty way,\nI feel His hand; I hear Him say, “My help is sure.”\n\n4.I cannot read His future plans;\tBut this I know:\nI have the smiling of His face,\nAnd all the refuge of His grace, While here below.\n\n5.Enough: this covers all my wants; And so I rest!\nFor what I cannot, He can see,\nAnd in His care I saved shall be, For ever blest.","ec":"Though the fig tree does not blossom\nAnd there be no fruit on the vines;\nThe produce of the olive fails\nAnd the fields yield no food,\nTho’  the flock be cut off from the fold\nAnd there be no herd in the stalls,\nYet will I rejoice in the Lord\nYet will I rejoice in the Lord\nI will joy in the God of my salvation\nGod the Lord is my strength.","ts":"అమూల్య రక్తము ద్వారా రక్షణ పొందిన జనులారా\nసర్వశక్తుని ప్రజలారాపరిశుద్ధులారా పాడెదము\nఘనతా మహిమ స్తుతులను పరిశుద్ధులారా పాడెదము\n\n1.మన యౌవన జీవితముల్‌ శరీరాశలకు లోబరచి\t\t\nచెడుమాటలను పలుకుచు శాంతి లేక యుంటిమిగా   ||అమూ||\n\n2.చెడు మార్గమున బోతిమి దాని యంతము మరణము\nనరక శిక్షకు లోబడుచు పాపపు ధనము పొందితిమి   ||అమూ||\n\n3.నిత్య సత్య దేవుని నామమున మొరలిడక\nస్వంత నీతి తోడనే దేవుని రాజ్యము కోరితిమి   ||అమూ||\n\n4.కనికరము గల దేవుడు మానవ రూపము దాల్చెను\nప్రాణము సిలువను బలి చేసి మనల విమోచించెను   ||అమూ||\n\n5.తన రక్త ధారలలో మన పాపములను కడిగి\nమన కన్నులను తెరచి మనల నింపెను జ్ఞానముతో   ||అమూ||\n\n6.పాపులమైన మన మీద తన యాశ్చర్య ఘన ప్రేమ\nకుమ్మరించెను మన ప్రభువు కృతజ్ఞత చెల్లింతుము   ||అమూ||\n\n7.మన రక్షకుని స్తుతించెదము మనలను జేసెను ధన్యులుగా\nమన దేవుని కర్పించెదము ఆత్మ జీవ శరీరములన్‌   ||అమూ||"},{"n":269,"ei":"O perfect Love, all human","ci":"Though my disappointments","ti":"అలలపైనే నడచిన నాదు యేసయ్యా","es":"1.O perfect Love, all human thought transcending,\nLowly we kneel in prayer before Thy Throne,\nThat theirs may be the love which knows no ending,\nWhom Thou for evermore dost join in one.\n\n2.O perfect Life, be Thou their full assurance \nOf tender charity and steadfast faith, \nOf patient hope, and quiet brave endurance, \nWith childlike trust that fears nor pain nor death.\n\n3.Grant them the joy which brightens earthly sorrow, \nGrant them the peace which calms all earthly strife; \nAnd to life’s day the glorious unknown morrow, \nThat dawns upon eternal love and life.","ec":"1.Through my disappointments, strife and discontentment,\nI cast my ev’ry care on the Lord,\nNo matter what obsession,\nPain or deep depression,\nI’m standing on the Solid Rock.\n\nI’m standing on the Rock of Ages\nSafe from all the storm that rages,\nRich, but not from satan’s wages,\nI’m standing on the Solid Rock.\n\n2.Even though He’s gone now,\nI don’t feel alone now,\nWith comfort came the Spirit of the Lord,\nNow with His Word to guide me, from temptations hide me,\nI’m standing on the Solid Rock.\n\n3.Now I’m pressing onward, each step leads me homeward,\nI’m trusting in my Saviour day by day,\nAnd close is our relation, firm is its foundation,\nSo on this Solid Rock I’ll stay.","ts":"అలలపైనే నడచిన నాదు యేసయ్యా నాదు యేసయ్యా\nగలిబిలిని నా కలవరములను  తొలగజేసిన కలుషహారుడా\nఆదుకోవయ్యా నాదు యేసయ్యా\n\n1 శుద్ధుడా నీ పిలుపు వింటిని అద్దరికినే పయనమయితిని(2)\nప్రొద్దుపోయెను భయములాయెను ఉద్ధరించగా స్వామిరావా\n\n2 నట్టనడి సంద్రాన రేగెను అట్టహాసపు పెనుతుఫాను(2)\nగట్టు చూడగా చాలా దూరము ఇట్టి శ్రమలలో చిక్కుకొంటిని\n\n3 అలలు నాపై విసరి కొట్టగా నావ నిండుగా నీరు చేరెను(2)\nబ్రతుకుటెంతో భారమాయెను రేవు చేరే దారి లేదే\n\n4 మాట మాత్రపు సెలవు చేత సూటిగా అద్భుతములెన్నో (2)\nచాలా చేసిన శక్తిమంతుడా జాలి చూపి మమ్ము బ్రోవుమా\n\n5 చిన్న జీవిత నావనాది నిన్నే గురిగా పయనమయినది(2)\nఎన్నో శోధన లెన్నో భయములు కన్న తండ్రి కావరావా"},{"n":270,"ei":"The voice that breathed","ci":"Thy loving kindness is better","ti":"గొఱ్ఱెపిల్ల వివాహోత్సవ సమయము వచ్చెను ","es":"1.The voice that breathed o’er Eden,\nThat earliest wedding day,\nThe primal marriage blessing,\nIt hath not pass’d away.\n\n2.Still in the pure espousal\nOf christian man and maid\nThe Holy Three are with us,\nThe threefold grace is said.\n\n3.For dower of bless’d children,\nFor love and faith’s sweet sake,\nFor high mysterious union,\nWhich nought on earth may break.\n\n4.Be present, awful Father,\nTo give away this bride,\nAs Eve Thou gav’st to Adam,\nOut of his own pierced side.\n\n5.Be present, Son of Mary,\nTo join their loving hands,\nAs Thou didst bind two natures\nIn Thine Eternal bands.\n\n6.Be present, Holiest Spirit,\nTo bless them as they kneel,\nAs Thou for Christ, the Bridegroom,\nThe heavenly spouse does seal.\n\n7.O spread Thy pure wings o’er them,\nLet no ill power find place,\nWhen onward to Thine Altar\nThe hallow’d path they trace.\n\n8.To cast their crowns before Thee\nIn perfect sacrifice,\nTill to the home of gladness\nWith Christ’s own Bride they rise.","ec":"Thy loving kindness is better than life,\nThy loving kindness is better than life,\nMy lips shall praise Thee\nThus will I bless Thee,\nThy loving kindness is better than life.\n\nI lift my hands up unto Thy name\nI lift my hands up unto Thy name\nMy lips shall praise Thee\nThus will I bless Thee\nI lift my hands up unto Thy name","ts":"గొఱ్ఱెపిల్ల వివాహోత్సవ సమయము వచ్చెను రండీ\n\n1 సర్వాధికారియు-సర్వోన్నతుండైన\nమన తండ్రిని ఘనపరచి  మనముత్సహించెదము\n\n2 సిద్ధపడెను వధువు-సుప్రకాశముగల\nనిర్మల వస్త్రములతో నలంకరించుకొనెన్‌\n\n3 పరిశుద్ధుల నీతి-క్రియలే యా వస్త్రములు\nగొఱ్ఱెపిల్ల రక్తములో శుద్ధినొందినవారు\n\n4 తెల్లని గుఱ్ఱముపై-కూర్చుండినవాడు\nనమ్మకమైయున్నట్టి పెండ్లి కుమారుడు\n\n5 దేవుని వాక్యమను నామము గలవాడు\nరక్తములో ముంచిన వస్త్రమున్‌ ధరియించె\n\n6 పరలోక సేనలు-తెల్ల వస్త్రములతో\nతెల్ల గుఱ్ఱముల నెక్కి వెంబడింతురు ప్రభుని\n\n7 ప్రేమించి సంఘముకై ప్రాణంబు నిడె ప్రభువు\nపరిశుద్ధ పరచుటకై తానప్పగించుకొనెన్‌\n\n8 శ్రీ యేసు క్రీస్తుండె సంఘమునకు శిరస్సు\nవాక్య ఉదకముతోడ శుద్ధి పరచుచుండె\n\n9 యెహోవ రాజ్యములో భూలోకవాసులు\nసంతోష హృదయములతో తేజరిల్లెదరు\n\n10 దేవా! యీ కార్యములు నెరవేర్చితివి నీవె\nనిత్యమును నీ మహిమ పాడెద హల్లెలూయ"},{"n":271,"ei":"God be with you","ci":"Trust in the Lord and don't","ti":"దేవర నీ దీవెనలు ధారాళముగను ","es":"1.God be with you till we meet again!\nBy His counsels guide, uphold you;\nWith  his  sheep  securely   fold  you;\nGod be with you till we meet again!\n\nTill we meet... Till we meet...\nTill we meet at Jesus’ feet;...\nTill we meet... Till we meet...\nGod be with you till we meet again!\n\n2.God be with you till we meet again!\n’Neath His wings securely hide you,\nDaily manna still provide you;\nGod be with you till we meet again!\n\n3.God be with you till we meet again!\nWhen life’s perils thick confound you,\nPut His loving arms around you;\nGod be with you till we meet again!\n\n4.God be with you till we meet again!\nKeep love’s banner floating o’er you,\nSmite death’s threatening wave before you,\nGod be with you till we meet again!","ec":"Trust in the Lord and don’t despair,\nHe is a Friend so true;\nNo matter what your troubles are,\nJesus will see you through.\nSing when the day is bright,\nSing through the darkest night,\nEv’ry day, all the way,\nLet us sing, sing, sing.","ts":"దేవర నీ దీవెనలు ధారాళముగను వీరలపై\nబాగుగ వేగమే దిగనిమ్ము పావన యేసుని ద్వారగను\n\n1 దంపతులు దండిగ నీ ధాత్రిలో వెలయుచు సంపదలన్‌\nసొంపుగ నింపుగ పెంపగుచు సహింపున వీరు సుఖించుటకై\n\n2 ఈ కవను నీ కరుణన్‌ ఆకరువరకును లోకములో\nశోకము లేకయె యేకముగా బ్రాకటముగను జేకొనుము\n\n3 ఇప్పగిది నెప్పుడును గొప్పగు ప్రేమతో నొప్పుచు దా\nమొప్పిన చొప్పున దప్పకను మెప్పుగ బ్రతుకగ బంపు కృపన్‌\n\n4 తాపములు పాపములు మోపుగ వీరిపై రాకుండగా\nగాపుగ బ్రాపుగ దాపునుండి యాపద లన్నియు బాపుచును\n\n5 సాధులుగన్‌ జేయుటకై శోధనలచే నీవు శోధింపగా\nకదలక వదలక ముదమున నీ పాదము దాపున బాదుకొనన్‌\n\n6 మెండుగ భూమండలపు గండములలో వీరుండగను\nతండ్రిగ దండిగ నండనుండి వెండియు వానిని ఖండించవే\n\n7 ఇద్ధర వీరిద్దరును శుద్ధులై నిన్ను సేవించుటకై\nశ్రద్ధతో బుద్ధిగ సిద్ధపడన్‌ దిద్దుము నీ ప్రియ బిడ్డలుగాన్‌\n\n8 వాసిగ నీ దాసులము చేసిన యీ మొఱల్‌ దీసికొని\nమా సకలేశ్వర నీ సుతుడౌ యేసుని పేరట బ్రోవుమామేన్‌ "},{"n":272,"ei":"Nearer my God to thee","ci":"Unto Thee, Oh Lord, do I lift","ti":"మంగళమే యేసునకు మనుజావతారునకు\n","es":"1.Nearer my God to Thee,\nNearer to Thee;\nE’en though it be a cross\nThat raiseth me;\nStill all my song shall be---\nNearer, my God, to Thee,\nNearer to Thee.\n\n2.Though, like the wanderer,\nThe sun gone down,\nDarkness comes over me,\nMy rest a stone:\nYet in my dreams I’d be\nNearer, my God, to Thee,\nNearer to Thee.\n\n3.There let my way appear\nSteps unto heaven;\nAll that Thou sendest me\nIn mercy given;\nAngels to beckon me\nNearer, my God, to Thee,\nNearer to Thee.\n\n4.Then, with my waking thoughts\nBright with Thy praise,\nOut of my stony griefs\nBethel I’ll raise;\nSo by my woes to be\nNearer, my God, to Thee,\nNearer to Thee.\n\n5.Or if on joyful wing,\nCleaving the sky,\nSun, moon, and stars forgot,\nUpward I fly;\nStill all my song shall be,\nNearer, my God, to Thee,\nNearer to Thee.","ec":"1.Unto Thee, Oh Lord, do I lift up my soul (2)\nOh, my God, I trust in Thee;\nLet me not be ashamed,\nLet not my enemies triumph over me.\n\n2.Yea, let none that wait, wait on Thee be ashamed (2)\nOh, my God, I trust in Thee;\nLet me not be ashamed,\nLet not my enemies triumph over me.\n\n3.Show me Thy ways, Thy ways, Oh Lord,\nTeach me Thy paths,Thy paths, Oh Lord.\nOh, my God, I trust in Thee;\nLet me not be ashamed,\nLet not my enemies triumph over me.\n\n4.Remember not the sins, the sins of my youth (2)\nOh, my God, I trust in Thee;\nLet me not be ashamed,\nLet not my enemies triumph over me.","ts":"మంగళమే యేసునకు మనుజావతారునకు\nశృంగార ప్రభువునకు క్షేమాధిపతికి\n\n1 పరమ పవిత్రునకు వర దివ్య తేజునకు\nనిరుప మానందునకు నిపుణ వేద్యునకు\n\n2 దురిత సంహారునకు వర సుగుణోదారునకు\nకరుణ సంపన్నునకు జ్ఞాన దీప్తునకు\n\n3 సత్య ప్రవర్తునకు సద్ధర్మ శీలునకు నిత్య\nస్వయంజీవునకు నిర్మలాత్మునకు\n\n4 యుక్త స్తోత్రార్హునకు భక్త రక్షామణికి\nసత్య పరంజ్యోతి యగు సార్వభౌమునకు\n\n5 పరమ పురి వాసునకు నరదైవ రూపునకు\nపరమేశ్వర తనయునకు ప్రణుతింతుము నీకు"},{"n":273,"ei":"Safe in the arms of Jesus","ci":"Untold millions are still untold","ti":"క్రిస్మస్‌ పాపకు హోసన్న యనుచు\n","es":"1.Safe in the arms of Jesus,\nSafe on His gentle breast,\nThere by His love o’ershaded\nSweetly my soul shall rest:\nHark! ‘tis the voice of angels\nBorne in a song to me,\nOver the fields of glory,\nOver the jasper sea.\n\nSafe in the arms of Jesus\nSafe on His gentle breast,\nThere by His love o’ershaded,\nSweetly my soul shall rest.\n\n2.Safe in the arms of Jesus,\nSafe from corroding care,\nSafe from the world’s temptations,\nSin cannot harm me there:\nFree from the blight of sorow,\nFree from my doubts and fears;\nOnly a few more trials,\nOnly a few more tears.\n\n3.Jesus my heart’s dear Refuge,\nJesus has died for me,\nFirm on the Rock of Ages,\nEver my trust shall be,\nHere let me wait with patience,\nWait till the night is o’er;\nWait till I see the morning\nBreak on the golden shore.","ec":"Untold millions are still untold,\nUntold millions are outside the fold,\nWho will tell them of Jesus’ love,\nAnd the heavenly mansions\nAwaiting above?\n(Slower)\nJesus died on calvary\nTo save each one from sin;\nNow He calls to you and me\nto go and bring them in for many,\nUntold... (tempo)","ts":"క్రిస్మస్‌ పాపకు హోసన్న యనుచు\nక్రీస్తుకు పాటలు పాడుదమా\nకిన్నెర వీణెల రావంబుల\nగుడి గంటల గజ్జెల శబ్దంబులు\nమహానందముతో నుప్పొంగుచును\nమరిగంతులు వేయుచు పాడుదమా!\n\n1 పరమును విడిచిన ఆ బాలుడు\nపశు పాకలో పుట్టెను ఈ రాత్రిలో\nమరి వెళ్ళుదమా జోల పాడుదమా\nమన ప్రభువును గూడి ఆడుదమా\n \n2 గొల్లలు జ్ఞానులు ఏతెంచిరి\nమ్రొక్కి బంగరు బోళములర్పించిరి\nసమర్పించెదమా మన హృదయములన్‌\nసద్దేవుని చూచి వచ్చెదమా\n\n3 కిన్నెర వీణెల రావంబులు\nగుడి గంటల గజ్జెల శబ్దంబులు\nమహానందముతో నుప్పొంగుచును\nసద్భక్తుని చూచి వచ్చెదమా"},{"n":274,"ei":"Sun of my soul","ci":"Vaster faster than any occan","ti":"శ్రీ యేసుoడు జంన్మించే రేయీలో","es":"1.Sun of my soul, Thou Saviour dear, \nIt is not night if Thou be near; \nO may no earth-born cloud arise \nTo hide Thee from Thy servant’s eyes!\n\n2.When the soft dews of kindly sleep \nMy wearied eyelids gently steep, \nBe my last thought, how sweet to rest \nFor ever on my Saviour’s breast!\n\n3.Abide with me from morn till eve, \nFor without Thee I cannot live; \nAbide with me when night is nigh, \nFor without Thee I dare not die.\n\n4.If some poor wandering child of Thine\nHave spurned today the voice divine,\nNow, Lord, the gracious work begin:\nLet him no more lie down in sin.\n\n5.Watch by the sick; enrich the poor\nWith blessings from Thy boundless store:\nBe every mourner’s sleep tonight\nLike infant’s slumbers, pure and light.\n\n6.Come near and bless us when we wake, \nEre through the world our way we take; \nTill, in the ocean of Thy love \t\nWe lose overselves in heav’n above.","ec":"Vaster faster than any ocean\nDeeper than the deepest sea\nIs the love of Christ my Saviour\nReaching through eternity.","ts":"శ్రీ యేసుండు జన్మించె రేయిలో\nనేడు పాయక బెత్లెహేమ యూరిలో\n\n1.కన్నియ మరియమ్మ-గర్భమందున\nనిమ్మానుయేలనెడి-నామమందున   ||శ్రీ||\n\n2.సత్రమందున బశువుల-సాలయందున\nదేవపుత్రుండు-మనుజుండాయె నందున   ||శ్రీ||\n\n3.పట్టి పొత్తి గుడ్డలతో-జుట్టబడి\nపశుల తొట్టిలో-బరుండ బెట్టబడి   ||శ్రీ||\n\n4.గొల్లలెల్లరు-మిగుల భీతిల్లగ\nదెల్పె  గొప్ప-వార్త  దూత చల్లగ   ||శ్రీ||\n\n5.మన కొరకొక్క-శిశువు పుట్టెను\nధరను మన దో-షముల  బోగొట్టను   ||శ్రీ||\n\n6.పరలోకపు-సైన్యంబు గూడెను\nమింట వర రక్ష-కుని గూర్చి పాడెను   ||శ్రీ||\n\n7.అక్షయుండగు-యేసు వచ్చెను\nమనకు రక్షణంబు సిద్ధ పర్చెను   ||శ్రీ||"},{"n":275,"ei":"When all my labours and trials","ci":"We are one in the bond of love","ti":"వినరే యో నరులారా","es":"1.When all my labours and trials are o’er,\nAnd I am safe on that beautiful shore,\nJust to be near the dear Lord I adore\nWill thro’ the ages be glory for me.\n\nO, that will be glory for me, glory for me, glory for me,\nWhen by His grace I shall look on His face,\nThat will be glory, be glory for me!\n\n2.When, by the gift of His infinite grace,\nI am accorded in Heaven a place,\t\nJust to be there and to look on His face,\nWill thro’ the ages be glory for me.\n\n3.Friends will be there I have loved long ago;\nJoy like a river around me will flow;\nYet, just a smile from my Saviour, I know,\nWill thro’ the ages be glory for me.","ec":"1.We are one in the bond of love (2)\nWe have joined our spirit\nWith the Spirit of the Lord, we are...\n\n2.Let us sing now every one\nLet us feel His love begun\nLet us join our hands\nThat the world will know. We are...","ts":"వినరే యో నరులారా వీనుల కింపుమీర మనల రక్షింప క్రీస్తు \nమనుజావతారుడయ్యె వినరే \nఅనుదినమును దేవుని తనయుని పద వనజంబులు మన\nమున నిడికొనుచును   ||వినరే||\n\n1.నరరూపు బూని ఘోర నరకుల రారమ్మని దురితము బాపు దొడ్డ\nదొరయౌ మరియా వరపుత్రుడు కర మరుదగు క-ల్వరి\nగిరి దరి  కరి-గి రయంబున ప్రభు కరుణను గనరే   ||వినరే||\n\n2.ఆనందమైన మోక్ష మందరి కియ్య దీక్ష బూని తనమేని సిలువ\nమ్రాను నణఁచి మృతి బొందెను దీనదయాపరుడైన\nమహాత్ముడు జానుగ యాగము  సలిపిన తెరంగిది   ||వినరే||\n\n3.పొందు గోరిన వారి విందా పరమోపకారి యెంద రెందరి బరమా\nనంద పద మొందగ జేసెను అందమునన్‌ దన\nబొంది సురక్తము జిందెను భక్తుల డెందము గుందగ   ||వినరే||\n\n4.ఇల మాయావాదుల మాని ఇతడే సద్గురు డని తలపోసి చూచి మతి\nని-శ్చల భక్తిని గొలిచిన వారికి నిల జనులకు గలుముల నలరెడు\nధని-కుల కందని సుఖ-ములు మరి యొసగును   ||వినరే||\n\n5.దురితము లణప వచ్చి మరణమై తిరిగి లేచి నిరత మోక్షానంద \nసుందర మందిరమున కరుదుగ జనె బిరబిరమన మం-దర మా\nకరుణా-శరనిధి చరణమె శరణని పోదము   ||వినరే||"},{"n":276,"ei":"I must needs go home","ci":"We are one in the Spirit","ti":"రక్షకుండుదయీoచినాడట","es":"1.I must needs go home by the way of the cross,\nThere’s no other way but this;\nI shall ne’er get sight of the gates of light,\nIf the way of the cross I miss.\n\nThe way of the cross leads home,\nThe way of the cross leads home;\nIt is sweet to know, as I onward go,\nThe way of the cross leads home.\n\n2.I must needs go on in the blood sprinkled way,\nThe path that the Saviour trod,\nIf I ever climb to the heights sublime,\nWhere the soul is at home with God.\n\n3.Then I bid farewell to the way of the world\nTo walk in it never more;\nFor my Lord says, “Come,” and I seek my home\nWhere He waits at the open door.","ec":"1.We are one in the Spirit,\nwe are one in the Lord,     (2)\nAnd we pray that all unity may\none day be restored:\n\nAnd they’ll know we are\nChristians by our love, by our love\nYes, they’ll know we are\nChristians by our love\n\n2.All praise to the Father,\nfrom whom all things come\nAnd all praise to Christ Jesus, His only Son,\nAnd all praise to His Spirit\nwho makes us one:","ts":"రక్షకుండుదయించినాడట మన కొరకు బరమ రక్షకుం డుదయించినాడట\nరక్షకుం డుదయించినాడు రారె గొల్ల బోయలార  \nతక్షణమున బోయి మన ని-రీక్షణ ఫల మొందుదము   ||రక్ష||\n\n1.దావీదు వంశమందు ధన్యుడు జన్మించినాడు\nదేవుడగు యెహోవా మన దిక్కుదేరి చూచినాడు   ||రక్ష||\n\n2.గగనము నుండి డిగ్గి ఘనుడు గబ్రియేలు దూత \nతగినట్లు చెప్పె వారికి మిగుల సంతోష వార్త   ||రక్ష||\n\n3.వర్తమానము జెప్పి దూత వైభవమున పోవుచున్నాడు\nకర్తను జూచిన వెనుక కాంతుము విశ్రమం బప్పుడు   ||రక్ష||\n\n4.పశువుల తొట్టిలోన భాసిల్లు వస్త్రముల జుట్టి\nశిశువును కనుగొందురని శీఘ్రముగను దూత తెల్పె   ||రక్ష||\n\n5.అనుచు గొల్ల లొకరి కొక రానవాలు జెప్పుకొనుచు\nఅనుమతించి కడకు  క్రీస్తు నందరికిని దెల్పినారు   ||రక్ష||"},{"n":277,"ei":"Lead, kindly light","ci":"We bring the sacrifice of praise","ti":"చింత లేదిక యేసు పుట్టేను","es":"1.Lead, kindly Light, amid the encircling gloom, \nLead Thou me on;\nThe night is dark, and I am far from home; \nLead Thou me on.\nKeep Thou my feet; I do not ask to see \nThe distant scene; one step enough for me.\n\n2.I was not ever thus, nor prayed that Thou, \nshould’st lead me on;\nI loved to choose and see my path; but now \nLead Thou me on.\nI loved the garish day, and, spite of fears, \nPride ruled my will: remember not past years.\n\n3.So long Thy power hath blest me sure it still, \nWill lead me on\nO’er moor and fen, o’er crag and torrent, till\nThe night is gone,\nAnd with the morn those angel--- faces smile, \nWhich I have loved long since and lost awhile.","ec":"We bring the sacrifice of praise\nInto the house of the Lord (2)\nAnd we offer unto you\nThe sacrifices of thanksgiving\nAnd we offer unto you\nThe sacrifices of joy","ts":"చింత లేదిక యేసు పుట్టెను వింతగను బేత్లెహేమందున\nచెంత జేరను రండి సర్వ జనాంగమా సంతస మొందుమా   ||చింత||\n\n1.దూత దెల్పెను గొల్లలకు శుభ-వార్త నా దివసంబు వింతగా \nఖ్యాతి మీరగ వారు యేసును గాంచిరి స్తుతు లొనరించిరి   ||చింత||\n\n2.చుక్క గనుగొని  జ్ఞానులెంతో మక్కువతో నా ప్రభుని గనుగొన\nచక్కగా బెత్లేము పురమున జొచ్చిరి కానుకలిచ్చిరి   ||చింత||\n\n3.కన్య గర్భమునందు బుట్టెను కరుణ గల రక్షకుడు క్రీస్తుడు\nధన్యులగుటకు రండి వేగమె దీనులై సర్వ మాన్యులై   ||చింత||\n\n4.పాప మెల్లను పరిహరింపను పరమ రక్షకుడవతరించెను\nదాపు జేరిన వారి కిడుగడు భాగ్యము మోక్ష భాగ్యము   ||చింత||"},{"n":278,"ei":"Sing the wondrous love","ci":"We want to see Jesus lifted high","ti":"సంతోషించుడి-యందరు నాతో సంతోషించుడి\n","es":"1.Sing the wondrous love of Jesus \nSing His mercy and His grace\nIn the mansions bright and blessed \nHe’ll prepare for us a place!\n\nWhen we all get to heaven \nWhat a day of rejoicing that will be!\nWhen we all see Jesus, \nWe’ll sing and shout the victory.\n\n2.While we walk the pilgrim pathway, \nClouds will overspread the sky\nBut when travelling days are over, \nNot a shadow not a sigh!\n\n3.Let us then be true and faithful \nTrusting, serving everyday\nJust one glimpse of Him in glory, \nWill the toils of life repay!\n\n4.Onward to the prize before us \nSoon His beauty we’ll behold\nSoon the pearly gates will open \nWe shall tread the streets of gold!","ec":"1.We want to see Jesus lifted high,\nA banner that flies across this land.\nThat all men might see the truth and know.\nHe is the way to heaven.\n\nWe want to see (3)\nJesus lifted high. (twice)\n\n2.Step by step we’re moving forward\nLittle by little taking ground\nEvery prayer a powerful weapon\nStrongholds come tumbling\nDown and down and down and down!","ts":"సంతోషించుడి-యందరు నాతో  సంతోషించుడి\nయొక- వింతయగు కీర్తన బాడ వచ్చితిని-సంతోషించుడి-నాతో \n\n1 అంధకార మయమైన భూమి నా-ద్యంతము వెలిగింప\nదాని యావేశము దొలగింప\nవందితుండు క్రీస్తేసు నాథుడు వచ్చె బ్రకాశుండై\nభూమికి-నిచ్చె ప్రకాశంబు\n\n2 కాన నంధకారంబు దొలగ ప్రకాశించెను లెండు\nమీరు ప్రకాశింపను రండు\nమానవులనుసంతోషపర్చనై మహిని నవతరించె\nభక్తుల మనము సంతసించె\n\n3 మిన్ను నుండి సంతోషోదయము మిగుల ప్రకాశించె\nహృదయ ములదగుల ప్రకాశించె\nమున్ను జేయబడిన వాగ్దత్తము తిన్నగ నెరవేరె\nభక్తుల కన్నులాశ దీరె\t\n\n4 ప్రీతియైన నీ పండుగ గూర్చి  నూతన కీర్తనను\nగలసికొని-నాతో పాడుచును\t\nనీ తరిదూరస్థుల కీ వార్తను నే తీరున నైన-దెలుపగ\nనాతురపడవలెను\n\n5 పాపులపై దేవునికి గలిగిన ప్రబలమైన దయను\nలోకమున జూపింపగ వలెను\t\nజూపకపోయిన లోపము మనపై మోపబడును నిజము\nవేగము జూపుదమాపథము\t"},{"n":279,"ei":"There's a land that is fairer","ci":"We worship and adore thee","ti":"గొల్లవారలారా- నేటి రాత్రి బెత్లెహేము నూర","es":"1.There's a land that is fairer than day,\nAnd by faith we can see it afar;\nFor the Father waits over  the way,\nTo prepare us a dwelling-place there.\n\nIn the sweet by and by,\nWe shall meet on that beautiful shore.\nIn the sweet by and by, \nWe shall meet on that beautiful shore.\n\n2.We shall sing on that beautiful shore\nThe melodious songs of the blest,\nAnd our spirits shall sorrow no more,\nNot a sigh for the blessing of rest.\n\n3.To our beautiful Father above,\nWe will offer our tribute of praise,\nFor the glorious gift of His love,\nAnd the blessings that hallow our days.","ec":"We worship and adore Thee,\nBowing down before Thee,\nSongs of praises singing,\nHallelujahs ringing,\nHallelujah! Hallelujah! Hallelujah! Amen.","ts":"గొల్లవారలారా- నేటి రాత్రి బెత్లెహేము నూర \nజేరి మోక్ష దూత-కోరిదెల్పెను క్రీస్తు \t\nవారి జాడ కన్ను-లారా జూతమువేగ \n\n1.పుట్టు చావులు లేనివాడట\nపశులతొట్టిలోపల బుట్టెనేడట\nఎట్టి వారలను జే-పట్టి పాపములూడ\nగొట్టి మోక్షపు త్రోవబెట్టు వాడట వేగ\n\n2.బహు కాలమాయెను వింటిమి\nనేడు మహికి వచ్చుట కనుగొంటిమి\nవిహితముతోడ సేవించి వత్తము మోక్ష\nమహితుని గని దుఃఖరహితులమవుదము"},{"n":280,"ei":"When the trumpet of the Lord","ci":"We'll not be defeated","ti":"కొనియాడదరమె నిన్ను కోమల హృదయ\n","es":"1.When the trumpet of the Lord shall sound,\nAnd time shall be no more,\nAnd the monring breaks, eternal, bright and fair;\nWhen the saved of earth shall gather over on the other shore,\nAnd the roll is call’d up yonder,\t I’ll be there.\n\nWhen the roll...is called up yon..der\nWhen the roll...is called up yon..der\nWhen the roll...is called up yon..der\nWhen the roll...is called up yon..der\nI’ll be there.\n\n2.On that bright and cloudless morning,\nWhen the dead in Christ shall rise,\nAnd the glory of His resurrection share;\nWhen His chosen ones shall gather to their home beyond the skies,\nAnd the roll is call’d up yonder, I’ll be there.\n\n3.Let me labour for the Master\nFrom the dawn till setting sun,\nLet me talk of all His wondrous love and care;\nThen, when all of life is over, and my work on earth is done,\nAnd the roll is call’d up yonder, I’ll be  there.","ec":"We’ll not be defeated (3) any more.\nJesus Christ God’s only Son,\nFought the battle and He won,\nWe’ll not be defeated, anymore.","ts":"కొనియాడదరమె నిన్ను కోమల హృదయ కొనియాడదరమె నిన్ను\nతన రారు దినకరు బెనుతారలను మించు\nఘనతేజమున నొప్పు కాంతి మంతుడ వీవు\n\n1 ఖెరుబులు సెరుపులు మరి దూతగణములు\nనురుతరంబుగ గొలువ నొప్పు శ్రేష్టుడ వీవు\n\n2 సర్వలోకంబులం-బర్వు దేవుడ వయ్యు\nనుర్వి స్త్రీగర్భాన నుద్భవించితివి వీవు\n\n3 విశ్వమంతయు నేలు వీరాసనుఁడవయ్యు\nపశ్వాళితో దొట్టి పడియుంటివి నీవు\n\n4 దోసంబులను మడియు దాసాళిగరుణించి\nయేసు పేరున జగతి కేగుదెంచితి నీవు\n\n5 నరులయందున గరుణ ధర సమాధానంబు\nచిరకాలమును మహిమ పరగ జేయుదు వీవు\n\n6 ఓ యేసు పాన్పుగ నాయాత్మ జేకొని\nశ్రేయముగ బవళించు శ్రీ కర వరసుత"},{"n":281,"ei":"The head that once","ci":"We're gathered here","ti":"లాలిలాలి లాలి లాలమ్మ లాలీ   లాలియని పాడరే ","es":"1.The head that once was crowned with thorns\nIs crowned with glory now:\nA royal diadem adorns \nThe mighty Victor's brow.\n\n2.The highest place that heav’n affords \nIs His by sovereign right:\nThe King of kings, and Lord of lords,\nHe reigns in perfect light.\n\n3.The joy of all who dwell above,\nThe joy of all below,\nTo whom He manifests His love,\nAnd grants His Name to know.\n\n4.To them the cross, with all its shame,\nWith all its grace, is given:\nTheir name, an everlasting name;\nTheir joy, the joy of heaven.\n\n5.They suffer with their Lord below:\nThey reign with Him above;\nTheir profit and their joy to know\nThe fulness of His love.\n\n6.His cross to them is life and health,\nThough it was death to Him;\nTheir present hope, and joy, and wealth,\nAnd their eternal theme.","ec":"1.We’re gathered here\nBecause we all love Jesus\nWe’re in this place to glorify His Name;\nOur hearts reach out to touch the Living God\nBecause we love the Lord We’re gathered here today.\n\n2.We’re gathered here\nTo sing our songs and hymns of praise\nWe’re in this place to hear the Word of God;\nOur minds reach out, O fill them with your thoughts, Lord,\nBecause we love the Lord We’re gathered here today.","ts":"లాలిలాలి లాలి లాలమ్మ లాలీ లాలియని పాడరే బాలయేసునకు \n\n1.పరలోక దేవుని తనయుడో యమ్మా పుడమి పై బాలుడుగ బుట్టెనో యమ్మా\n\n2.ఇహ పరాదుల కర్త యీతడో యమ్మా మహి పాలనము జేయు మహితుడో యమ్మా\n\n3.ఆద్యంతములు లేని దేవుడో యమ్మా ఆదాము దోషమున కడ్డు పడెనమ్మా\n\n4.యూదులకు రాజుగా బుట్టెనో యమ్మా యూదు లాతని తోడ వాదించి రమ్మా \n\n5.నరగొఱ్ఱెల మంద కాపరో యమ్మాగొరియల ప్రాణంబు క్రీస్తు తానమ్మా"},{"n":282,"ei":"Far away the noise","ci":"We'll be caught up to meet him","ti":"మనకై యేసు - మరణించే","es":"1.Far away the noise of strife upon my ear is falling,\nThen I know the sins of earth beset on every hand;\nDoubt and fear and things of earth in vain to me are calling,\nNone of these shall move me from Beulah Land.\n\nI’m living on the mountain, underneath a cloudless sky,\nI’m drinking at the fountain that never shall run dry;\nO yes, I’m feasting on the manna from a bountiful supply,\nFor I am dwelling in Beulah Land.\n\n2.Far below the storm of doubt upon the world is beating,\nSons of men in battle long the enemy withstand;\nSafe am I within the castle of God’s word retreating,\nNothing then can reach me, ’tis Beulah Land.\n\n3.Let the stormy breezes blow, their cry cannot alarm me,\nI am safely sheltered here, protected by God’s hand;\nHere the sun is always shining, here there’s naught can harm me,\nI am safe forever in Beulah Land.\n\n4.Viewing here the works of God, I sink in contemplation,\nHearing now His blessed voice, I see the way is planned;\nDwelling in the spirit, here I learn of full salvation,\nGladly will I tarry in Beulah Land.","ec":"We’ll be caught up to meet Him in the air;\nWe’ll be caught up His blessedness to share;\nVery soon He will come, to take His people home,\nCaught up to meet Him in the air!","ts":"ఇదిగో నీ రాజు వచ్చుచుండె\nసీయోను కుమారి సంతోషించు\nయెరూషలేం కుమారి ఉల్లసించు\n\n1.నీదు రాజు నీతితో\nదోషమేమియు లేకయె\nపాపరహితుడు ప్రభు వచ్చుచుండె\n\n2.రక్షణ గల వాడుగ\nఅక్షయుండగు యేసుడు\nదీక్షతోడ యెరూషలేం వచ్చుచుండె\n\n3.సాత్వికుండు ఈ భువిన్‌\nఅత్యంత మగు ప్రేమతో\nనిత్య రాజు నరులకై వచ్చుచుండె\n\n4.దీనపరుడు నీ ప్రభు\nఘనత కలిగిన దేవుడు\nప్రాణమీయ పాపులకై వచ్చుచుండె\n\n5.ఇలను గాడిదనెక్కియే\nబాలుర స్తోత్రములతో\t\nబలుడగు నీ ప్రభు వచ్చుచుండె\n\n6.దావీదు కుమారుడు\nదేవుడు పాపులకు\nజయగీతములతో వచ్చుచుండె\n\n7.యేసుని ప్రేమించుచు\nహోసన్నా పాడెదము\nయేసుడిల వచ్చుచుండె హల్లెలూయ\n"},{"n":283,"ei":"Nearer, still nearer","ci":"We'll sing a new song of glorious","ti":"సిలువలో బలియైన","es":"1.Nearer, still nearer, close to Thy heart,\nDraw me, my Saviour, so precious Thou art;\nFold me, Oh, fold me close to Thy breast,\nShelter me safe in that “Haven of Rest,”\nShelter me safe in that “Haven of Rest.”\n\n2. Nearer, still nearer, nothing I bring,\nNaught as an offering to Jesus my King;\nOnly my sinful, now contrite heart,\nGrant me the cleansing Thy blood doth impart,\nGrant me the cleansing Thy blood doth impart.\n\n3.Nearer, still nearer, while life shall last,\n‘Til safe in glory my anchor is cast;\nThrough endless ages, ever to be,\nNearer, my Savior, still nearer to Thee,\nNearer, my Savior, still nearer to Thee.","ec":"We’ll sing a new song of glorious triumph\nFor we see the government of God in our lives (repeat)\nHe is crowned God of the whole world\nCrowned King of creation\nCrowned ruling the nations now, Yes, He is...","ts":"మనకై యేసు-మరణించె మన పాపముల కొరకే\nనిత్య జీవము నిచ్చుటకే సత్యుండు సజీవుడాయె\n\n1.తృణీకరింపబడె విసర్జింపబడెను\nదుఃఖాక్రాంతుడాయె వ్యసనముల భరించెను   ||మనకై||\n\n2.మన వ్యసనముల వహించెన్‌ మన దుఃఖముల భరించెన్‌\nమన మెన్నిక  చేయకయే మన ముఖముల ద్రిప్పితిమి   ||మనకై||\n\n3.మన యతిక్రమముల కొరకు మన దోషముల కొరకు\nమన నాథుడు శిక్ష నొందె మనకు స్వస్థత కలిగె   ||మనకై||\n\n4.గొఱ్ఱెలవలె తప్పితిమి పరుగిడితిమి మన దారిన్‌\nఅరుదెంచె కాపరియై అర్పించె ప్రాణమును   ||మనకై||\n\n5.దౌర్జన్యము నొందెను బాధింపబడెను\nతన నోరు తెరువలేదు మనకై క్రయధన మీయన్   ||మనకై||\n\n6.ఎదిరింప లేదెవరిన్‌ లేదే కపటము నోట\nయెహోవా నలుగగొట్టెన్‌ మహా వ్యాధిని కలిగించెన్   ||మనకై||\n\n7.సిలువలో వ్రేలాడెన్‌ సమాధిలో నుండెను\nసజీవుండై లేచెన్‌ స్తోత్రము హల్లెలూయ   ||మనకై||"},{"n":284,"ei":"Open my eyes that I may","ci":"We've a great big wonderful","ti":"సిలువలో బలియైన దేవుని గొఱ్ఱెపిల్ల","es":"1.Open my eyes that I may see\nGlimpses of truth Thou hast for me;\nPlace in my hands the wonderful key\nThat shall unclasp and set me free. \nSilently now I wait for Thee, \nReady, my God, Thy will to see;\nOpen my eyes, illumine me,\nSpirit Divine!\n\n2.Open my ears that I may hear \nVoices of truth Thou sendest clear; \nAnd while the wave-notes fall on my ear,\nEverything false will disappear. \nSilently, now I wait for Thee \nReady, my God, Thy will to see; \nOpen my ears, illumine me,\nSpirit Divine!\n\n3.Open my mouth and let me bear\nTidings of mercy everywhere:\nOpen my heart and let me prepare\nLove with Thy children thus to share. \nSilently now I wait for Thee, \nReady, my God, Thy will to see; \nOpen my heart, illumine me,\nSpirit Divine!\n\n4.Open my heart, that I may read \nMore of Thy love in word and deed:\nWhat shall I fear while yet Thou dost lead?\nOnly for light from Thee I plead. \nSilently now I wait for Thee, \nReady, my God, Thy will to see; \nOpen my mind, illumine me,\nSpirit Divine!","ec":"We’ve got a great big wonderful God (2)\nA God who’s always victorious,\nAlways watching over us\nGreat big wonderful God.\n\nWe’ve got a great big wonderful God (2)\nA God who loves ev’ry one of us\nDone so much for all of us,\nGreat big wonderful God.\n\nHe never, never, never leaves us,\nHe’s always standing by,\nTo pick us up if we stumble,\nWe’re the apple of His eye.\n\nWe’ve got a great big wonderful God (2)\nOh what a glory it is to sing\nPraises to the coming King\nGreat big wonderful God—\nA Great Big wonderful God.","ts":"సిలువలో బలియైన దేవుని గొఱ్ఱెపిల్ల\nవిలువైన నీ ప్రేమన్‌ వివరింతు శ్రీ యేసు\n\n1 ఆనాటి యూదులే నిను జంపిరనుకొంటి\nకాదు కాదయ్యయ్యో నా పాప ఋణమునకే\n\n2 నాయతి క్రమములకై నలుగ గొట్టబడి\nనా దోషముల నీవు ప్రియముగను మోసితివా\n\n3 మృదువైన నీ నుదురు ముండ్ల పోట్లచేత\nసురూపమును లేక సోలిపోతివా ప్రియుడా\n\n4 నా రోగములు నీపై నమ్రతతో భరియించి\nతృణీకరింపబడి ప్రాణమర్పించితివి\n\n5 వ్యసనా క్రాంతుడవుగా వ్యాధి ననుభవించి\nమౌనము ధరించి మరణమైతివా ప్రభువా\n\n6 నా పాప దోషముచే నేచచ్చి యుండగనే\nమరణమై నా కొరకు మరి తిరిగి లేచితివి\n\n7 పరమున కెత్తబడిన ప్రియ యేసు రాకడకై\nపదిలముగ కనిపెట్టి పాడెదను హల్లెలూయ"},{"n":285,"ei":"I am thinking today of that","ci":"What a mighy God we serve","ti":"భాసిల్లెను సిలువలో పాపక్షమా   \n","es":"1.I am thinking today of that beautiful land \nI shall reach when the sun goeth down;\nWhen thro’ wonderful grace by my Saviour I stand,\nWill there be any stars in my crown?\n\nWill there be any stars, any stars in my crown,\nWhen at ev’ning the sun goeth down?…\nWhen I wake with the blest In the mansions of rest,\nWill there be any stars in my crown?…\n\n2.In the strength of the Lord let me labour and pray,\nLet me watch as a winner of souls,\nThat bright stars may be mine in the glorious day\nWhen His praise like the sea billow rolls.\n\n3.Oh, what joy will it be when His face I behold,\nLiving gems at His feet to lay down;\nIt would sweeten my bliss in the city of gold, \nShould there be any stars in my crown.","ec":"What a mighty God we serve(2)\nAngels bow before Him\nHeaven and earth adore Him\nWhat a mighty God we serve.","ts":"భాసిల్లెను సిలువలో పాపక్షమా  \nయేసు ప్రభూ నీ దివ్య క్షమా\nభాసిల్లెను సిలువలో పాపక్షమా\n\n1 కలువరిలో నా పాపము పొంచి\nసిలువకు నిన్ను యాహుతి చేసే\nకలుషహరా కరుణించితివి (2)\n\n2 దోషము చేసితి నేనే గదా\nమోసముతో బ్రతికిన నేనే గదా\nమోసితివా నా శాప భారం (2)\n\n3 పాపము జేసి గడించితి మరణం\nశాపమెగా నేనార్జించినది\nకాపరివై నను బ్రోచితివి (2)\n\n4 నీ మరణపు వేదన వృధాగాదు\nనా మది నీ వేదనలో మునిగే\nక్షేమము కలిగెను హృదయములో (2)  \n\n5 నమ్మిన వారిని కాదనవనియు\nనెమ్మది నొసగెడునా ప్రభుడవని\nనమ్మితి నీ పాదంబులను (2)"},{"n":286,"ei":"We sing the realms","ci":"When he sees his children","ti":"ఇదిగో కలువరి సిలువ ప్రేమ - మరపురాని మధుర ప్రేమ ","es":"1.We sing the realms of the blest,\nOf that country so bright and so fair,\nAnd oft are its glories confessed,\nBut what must it be to be there?\n\n2.We sing of the pathway of gold\nOf its walls decked with jewels so rare,\nOf its wonders and pleasures \tuntold\nBut what must it be to be there?\n\n3.We sing of its freedom from sin\nFrom sorrow, temptation and care;\nFrom trials without and within,\nBut what must it be to be there?\n\n4.We sing of the service of love,\nOf the robes which the glorified wear\nOf the church of the first-born \tabove,\nBut what must it be to be there?\n\n5.Dear Lord, amid sorrow and woe\nMy spirit for heaven prepare,\nThat shortly, I also may know\nAnd feel what it is to be there.\n\n6.There anthems of praise we will sing\nWhen safe in that haven of rest\nTo Jesus, our Saviour and King\nWho reigns in those realms of the blest.","ec":"1.When He sees His children\nThe work of My hands,\nThey shall sanctify My holy Name\nThey shall sanctify the Holy One of Jacob,\nThey shall fear the God of Israel.\n\nThey that erred in spirit,\nWill come to understanding\nThey that murmured will learn doctrine\nWhen He sees His children\nThe work of My hands,\nThey shall sanctify My holy Name\n\n2.All your children shall be taught of the Lord\nAnd great shall be their peace\nWhen He sees His children\nThe work of My hands,\nThey shall sanctify My holy Name.","ts":"ఇదిగో కలువరి సిలువ ప్రేమ - మరపురాని మధుర ప్రేమ\nయేసు ప్రేమ - నా యేసు ప్రేమ - యేసు ప్రేమ శ్రీ యేసు ప్రేమ\n\n1.యేసుని సిలువకు పంపిన ప్రేమ - దోషిని కరుణతో పిలిచిన ప్రేమ\nమరువజాలని ప్రేమ నన్ను మరువని ప్రేమ\n\n2.మహిమైశ్వర్యము బాసిన ప్రేమ - నా దోషములను మోసిన ప్రేమ\nవిడువజాలని ప్రేమ నన్ను విడువని ప్రేమ\n\n3.చెడిన నన్ను కడిగిన ప్రేమ - పడిన నన్ను లేపిన ప్రేమ\nమరువలేని ప్రేమ మారనీ యేసు ప్రేమ"},{"n":287,"ei":"O lOrd my God!","ci":"Where the cloud of God abides","ti":"ఆహా మహాత్మ హా శరణ్య హా విమోచకా ","es":"1.O Lord my God! when I in awesome wonder\nConsider all the works Thy hands have made;\nI see the stars, I hear the mighty thunder;\nThy power throughout the universe displayed;\n\nThen sings my soul, my Saviour God, to Thee!\nHow great Thou art! How great Thou art!\nThen sings my soul, my Saviour God, to Thee;\nHow great Thou art! How great Thou art!\n\n2.When thru’ the woods and forest glades I wander,\nI hear the birds sing sweetly in the trees;\nWhen I look down from lofty mountain grandeur,\nAnd hear the brook and feel the gentle breeze;\n\n3.But when I think that God, His Son not sparing\nSent Him to die—I scarce can take it in,\nThat on the Cross, my burden gladly bearing,\nHe bled and died, to take away my sin;\n\n4.When Christ shall come with shout of acclamation\nAnd take me Home - what joy shall fill my heart!\nThen I shall bow in humble adoration\t\t\t\nAnd there proclaim, my God, how great Thou art!\n","ec":"Where the cloud of God abides, there will I abide;\nWhen the cloud moves on, it’s time to go.\nWhere the fire burns, I want to stay;\nThis world chills my soul, My bones cry for God’s flame.\nOh! what security, what blissful rest\nWhat firm assured peace is found\nNeath the fiery pillar of God\nWhen it moves I move, Where it goes I go.","ts":"ఆహా మహాత్మ హా శరణ్య హా విమోచకా దోషరహిత చంపెనిను నా - దోషమేగదా\n\n1 వీరలను క్షమించుతండ్రి నేర మేమియున్‌ కోరి తిటులు - నిన్ను జంపు కృార జనులకై\n\n2 ''నీవు నాతో బరదైసున నేడే యుందువు'' పావనుండ ఇట్లు బలికి పాపిగాచితివి\n\n3 అమ్మా! నీ సుతుడటంచు మరి-యమ్మతో బలికి క్రమ్మర 'నీ జనని' యంచు గర్త నుడివితి\n\n4 నా దేవా నా దేవా యేమి విడ - నాడితివనుచు శ్రీ దేవసుతా పలికితివి శ్రమ - చెప్పక శక్యమా\n\n5 దప్పిగొనుచున్నాన టంచు - జెప్పితివి గదా ఇప్పగిదిని బాధనొంద నేమి నీకు హా\n\n6 శ్రమ ప్రమాదములను గొప్ప శబ్దమెత్తి - హా సమాప్తమై నదంచు తెలిపి సమసితివి గదా\n\n7 అప్పగింతు దండ్రి,నీకు-నాత్మ నంచును గొప్ప యార్భాటంబు చేసి కూలిపోతివా"},{"n":288,"ei":"O Sacred head","ci":"Where the Spirit of the Lord is","ti":"మనస యేసు మరణ బాధ\n","es":"1.O Sacred Head, once wounded,\nWith grief and pain weighed down,\nHow scornfully surrounded\nWith thorns, Thine only crown!\nHow art Thou pale with anguish,\nWith sore abuse and scorn!\nHow does that visage languish,\nWhich once was bright as morn.\n\n2.O Sacred Head, what gory,\nWhat bliss till now was Thine!\nYet, though despised and gory,\nI joy to call Thee mine:\nThy grief and Thy compassion\nWere all for sinners’ gain;\nMine, mine was the transgression,\nBut Thine the deadly pain.\n\n3.What language shall I borrow\nTo praise Thee, heavenly Friend,\nFor this thy dying sorrow;\nThy pity without end!\nLord, make me Thine for ever!\nNor let me faithless prove!\nOh, let me never, never\nAbuse such dying love!","ec":"Where the Spirit of the Lord is, There is peace;\nWhere the Spirit of the Lord is, There is love.\nThere is comfort in life’s darkest hour,\nThere is light and life,\nThere is help and power,\nIn the Spirit, in the Spirit of the Lord.","ts":"మనస యేసు మరణ బాధ లెనసి పాడవే-తన-నెనరు జూడవే - యా ఘనునిగూడవే నిను మనుప జచ్చుటరసియే మరక వేడవే\t\n\n1 అచ్చి పాపములను బాప వచ్చినాడట  వా-క్కి-చ్చి తండ్రితో  నా-గెత్సెమందున-తా జొచ్చి యెదను నొచ్చి బాధ-హెచ్చుగనెనట\n\n2 ఆ నిశీధ రాత్రి వేళ నార్భటించుచు - నయ్యో నరాంతకుల్‌ - చేబూని యీటెలన్‌ - ఒక ఖూని వాని వలెను గట్టి కొంచుబోయిరా\n\n3 పట్టి దొంగవలెను గంత గట్టికన్నులన్‌ -మరి గొట్టి చెంపలన్‌ - వడిదిట్టి నవ్వుచున్‌ - నిను గొట్టి రెవ్వరదియు మాకు జెప్పు మనిరట\n\n4 ముళ్ళతోడ నొక కిరీట మల్లిప్రభు తలన్‌ - బెట్టి రెల్లుకఱ్ఱతో - నా కల్ల జనములు - రా జిల్లుమనుచుకొట్టి నవ్వి గొల్లుబెట్టిరా\n\n5 మొయ్యలేక సిల్వ భారము మూర్ఛబోయెనా - ఆ య్యయ్యో జొక్కెనా - యే సయ్యతూలెనా మాయయ్యనిన్‌ దలంప గుండె-లదరి పోయెనా\n\n6 కాలుసేతులన్‌ గుదించి కల్వరి గిరిపై -నిన్‌ గేలిజేయుచు - నీ కాళ్ల మీదను - నినుప చీలలతో గ్రుచ్చి - నిన్ను సిల్వ గొట్టిరా\n\n7 దేవ సుతుండవైతి వేని తీవరంబుగా - దిగి నీవు వేగమే - రమ్ము గావు మనుచును - ఇట్లు గావరించి పల్కు వగర కరుణ జూపెనా\n\n8 తన్ను జంపు శత్రువులకు దయను జూపెనా - తన నెనరు జూపెనా - ప్రభు కనికరించెనా - ఓ జనక ఈ జనుల క్షమించు మనుచు వేడెనా\t\n\n9 తాళలేని బాధ లెచ్చి దాహ మాయెనా నన్నేలువానికి నా పాలి స్వామికి నే-నేల పాపములను జేసి హింసపరచితి\t\t\n\n10 గోడు బుచ్చి సిలువపైన నేడు మారులు - మాట్లాడి ప్రేమతో  నా-నాడు శిరమును వంచి నేఁడు ముగిసె సర్వమనుచు వీడె బ్రాణము\t\t\n\n11 మరణమైన ప్రభుని జూచి ధరణి వణకెనా బల్‌ గిరులు బగిలెనా గుడి తెరయుజీలెనా దివా కరుడు చీకటాయె మృతులు తిరిగి లేచిరి\n\n12 ఇంత జాలి యింత ప్రేమ యింత శాంతమా నీ యంతఃకరుణను నే జింతచేయగా నీ వింత లెల్ల నిత్యజీవ విధము లాయెనా"},{"n":289,"ei":"All glory , laud and honour","ci":"Whisper a prayer in the morning","ti":"చూడుము యీ క్షణమె కల్వరిని ","es":"1.All glory, laud and honour,\nTo Thee, Redeemer, King,\nTo whom the lips of children\nMade sweet hosannas ring!\n\n2.Thou art the King, of Israel, \nThou David’s royal Son,\nWho in the Lord’s Name comest,\nThe King and blessed One. All...\n\n3.The company of angels\nAre praising Thee on high;\nAnd mortal men, and all things\nCreated, make reply. All...\n\n4.The people of the Hebrews\nWith palms before Thee went:\nOur praise and prayer and anthems\nBefore Thee we present. All...\n\n5.To Thee, before Thy Passion, \nThey sang their hymns of praise:\nTo Thee, now high exalted, \nOur melody we raise. All...\n\n6.Thou didst accept their praises;\nAccept the prayers we bring,\nWho in all good delightest, \nThou good and gracious King. All...","ec":"Whisper a prayer in the morning\nWhisper a prayer at noon\nWhisper a prayer in the evening\nSo keep your hearts in tune\n\nJesus may come in the morning\nJesus may come at noon\nJesus may come in the evening,\nSo keep your hearts in tune","ts":"చూడుము యీ క్షణమె కల్వరిని - ప్రేమా ప్రభువు నీకై నిలుచుండెను - గొప్ప రక్షణ నివ్వ శ్రీ యేసుడు - సిలువలో వ్రేలాడు చున్నాడుగా\n\n1.మానవులెంతో చెడిపోయిరీ మరణించెదమని తలపోయక  ఎరుగరు మరణము నిక్కమని నరకమున్నదని వారెరుగరూ \n\n2.ఇహమందు నీకు కలవన్నియు - చనిపోవు సమయాన వెంటరావు చనిపోయినను నీవు లేచెదవు తీర్పున్నదని ఎరుగుము ఒక దినమున\n\n3.మనలను ధనవంతులుగ చేయను - దరిద్రుడాయెను మన ప్రభువు - రక్తము కార్చెను పాపులకై అంగీకరించుము శ్రీ యేసుని\n\n4.సిలువపై చూడుము ఆ ప్రియుని - ఆ ప్రేమకై నీవేమిత్తువు – అర్పించుకో నీదు జీవితము ఆయన కొరకై జీవించుము"},{"n":290,"ei":"Praise Him, Praise Him","ci":"Why do you let the troubles of","ti":"చూడరే క్రీస్తుని జూడరే నా సఖులార ","es":"1.Praise Him, praise Him,\nall ye little children,\nHe is love, He is love;\nPraise Him, praise Him,\nall ye little children,\nHe is love, He is love.\n\n2.Thank Him,thank Hlm,\nall ye little children,\nHe is love, He is love;\nThank Him, thank Him,\nall ye little children,\nHe is love, He is love.\n\n3.Love Him, love Him,\nall ye little children,\nHe is love, He is love;\nLove Him, love Him,\nall ye little children,\nHe is love, He is love.\n\n4.Crown Him, crown Him,\nall ye little children,\nHe is love, He is love;\nCrown Him, crown Him,\nall ye little children,\nHe is love, He is love.","ec":"Why do you let the troubles of tomorrow,\nBring sorrow to your heart and burdens too,\nFor if the Father’s eye is on  the sparrow,\nThen surely He will care for you.\nHe knoweth and careth, each burden, He beareth\nFor if the Father’s eye is on the sparrow,\nThen surely He will care for you.","ts":"చూడరే క్రీస్తుని జూడరే నా సఖులార - చూడరే క్రీస్తుని జూడరే - చూడరేనా ముక్తి పదవికి - ఱేడు యేదశ గూడినాడో\n\n1.మించి పొంతి పిలాతు సత్యమొ - కించుకైనదలంప కక్కట - వంచనను గొట్టించి యూదుల- మంచితనమే కోరి యప్ప-గించెనా మేలు గ-ణించెనా ఇతనిగాంచి కాంచి భక్తులెట్లు స హించిరో పరికించి మీరిది\n\n2.మంటికిని నాకాశమునకును మధ్యమున వ్రేలాడుచుండగ నంటగొట్టగ సిలువ మ్రాని కప్పగించుటకొరకు నిన్ను గాంచెనా యిది మది నెంచెనా హానా-కంట - నే నిటువంటి యాపదగంటి బ్రాణములుండునే యిక\n\n3.ఊటగా రక్తంబు కారుచు నుండ బల్లెపు బ్రక్కపోటు మాటిమాటికి జూడ దుఃఖము మరలునే తలమీద ముళ్ళకిరీటమా యితనికి వాటమా యూదులు మోటులై బాహాటమున నీ పాటులను గాటముగ జేసిరి"},{"n":291,"ei":"King of my life","ci":"Why worry when you can pray","ti":"చూడరే సిలువను వ్రేలాడు యేసయ్యను\n","es":"1.King of my life, I crown Thee now,\nThine shall the glory be;\nLest I forget Thy thorn-crowned brow,\nLead me to Calvary.\n\nLest I forget Gethsemane;\nLest I forget Thine agony;\nLest I forget Thy love for me,\nLead me to Calvary.\n\n2.Show me the tomb where Thou wast laid,\nTenderly mourned and wept;\nAngels in robes of light arrayed\nGuarded Thee while Thou slept.\n\n3.Let me like Mary, through the gloom,\nCome with a gift to Thee;\nShow to me now the empty tomb,\nLead me to Calvary.\n\n4.May I be willing, Lord, to bear\nDaily my cross for Thee;\nEven Thy cup of grief to share,\nThou hast borne all for me.","ec":"Why worry when you can pray?\nTrust Jesus He’ll be your stay:\nDon’t be a “doubting Thomas”\nRest fully on His promise,\nWhy worry, worry, worry, worry,\nWhen you can pray?","ts":"చూడరే సిలువను వ్రేలాడు యేసయ్యను పాడు లోకంబునకై గోడు జెందెగదా \n\n1.నా చేతులు చేసినట్టి దోషంబులే గదా నా రాజు చేతులలో ఘోరంపు జీలలు\n\n2.దురితంపు దలపులే పరమగురుని శిరముపై నెనరు లేకమొత్తెనయ్యో ముండ్ల కిరీటమై\n\n3.పరుగెత్తి పాదములు చేసిన పాపంబులు పరమరక్షకుని పాదములలో - మేకులు\n\n4.పాపేచ్ఛ తోడఁగూడ నాదు చెడ్డ పడకలే పరమగురుని ప్రక్కలోని బల్లెంపు పోట్లు"},{"n":292,"ei":"THE END","ci":"Wide, wide as the Ocean","ti":"కన్నీటి అభిషేకమూ నీ సిలువ కడు ఘోరమూ\n","es":"THE END","ec":"Wide, wide as the Ocean,\nHigh as the heavens above:\nDeep, deep,\nas the deepest sea\nIs my Saviour’s love;\n\nI, though so unworthy,\nStill am a child of His care,\nFor His Word teaches me\nThat His love reaches me  ev’rywhere.","ts":"కన్నీటి అభిషేకమూ నీ సిలువ కడు ఘోరమూ\nనా పాపమే-నా శాపమే నీ సిలువ ఓ యేసూ (2)\n\n1.నే తులువనై కడు పాపినై కఠినాత్మునై-కలుషుండనై\nగర్విష్టినై నిను గొట్టగా దోషుండనై పట్టించితిన్‌\n\n2.కొరడాలతో కొట్టించితిన్‌ ముళ్ళ కిరీటంబు పెట్టించితిన్‌\nనా సిలువనే నీ పై పెట్టించితిన్‌ నడిపించితినా గొల్గొతకు\n\n3.నీ రుధిరమే బహుగా కారెన్‌ - నీ రక్తమే స్రవియించగా\nనీ దాహమే చేదు చిరకాయెనా నా పాపమె నీ శిక్షయై\n\n4.నా క్రీస్తువా నీ రక్తము నను కడిగెను పవిత్రించెను\nనే చేరెదా-నీ సిలువకు నను బ్రోవవే నా రక్షకా"},{"n":293,"ei":"","ci":"With Christ in the vessel we can","ti":"కల్వరి ప్రేమ తలంచునపుడు కలుగుచున్నది దుఃఖం\n","es":"","ec":"With Christ in the vessel we can\nSmile at the storm, (3)\nWith Christ in the vessel we can smile at the storm,\nAs we go sailing Home.\nSailing, sailing Home, (2)\nWith Christ in the vessel...","ts":"కల్వరి ప్రేమ తలంచునపుడు కలుగుచున్నది దుఃఖం\nప్రభువా నీ శ్రమలను ధ్యానించినపుడు - పగులు చున్నది హృదయం\n\n1.గెత్సెమనె అను తోటలో విలపించుచు ప్రార్థించు ధ్వని – నలువైపుల వినబడుచున్నది  పగులుచున్నవి మా హృదయములు కలుగుచున్నది దుఃఖం\n\n2.సిలువపై నలుగగొట్టినను అనేక నిందలు మోపినను ప్రేమతో వారిమన్నింపునకై  ప్రార్థించిన ప్రియ యేసు రాజా నీ ప్రేమ పొగడెదము\n\n3.మమ్మును నీ వలె మార్చుటకై నీ జీవమును ఇచ్చితివే నేలమట్టుకు తగ్గించుకొని సమర్పించితివి నీ కరములతో మమ్మును నడిపించుము"},{"n":294,"ei":"","ci":"Without faith it's impossible","ti":"కల్వరి లోని శ్రేష్టుడా","es":"","ec":"Without faith it’s impossible, it’s impossible, it’s impossible to please God.\nHe who comes to God must believe that He is\nAnd He rewards those who seek Him.\nAll things are possible, all things are possible, all things are possible, just believe;\nGod will do ev’ry thing that He says He will do, and He rewards those who seek Him.","ts":"కల్వరి లోని శ్రేష్టుడా కరుణా భరిత యేసువా\nనను రక్షించుము నాథుడా సిలువలోని మిత్రుడా\n\n1.స్తుతికి పాత్రుండగు దేవా సతతము స్తోత్రము లందుమయా\nసుదతి మరియ పుత్రుడా సిలువలోని మిత్రుడా   ||కల్వరి||\n\n2.పాపులకై వచ్చినవాడా ప్రేమా కల్గిన రక్షకుడా\nపాదములపై బడితిమి సిలువలోని మిత్రుడా   ||కల్వరి||\n\n3.దీవెనల నిచ్చువాడా వసుధ కేతెంచిన వాడా\nనీవె సుంకరులాప్తుడవు సిలువలోని మిత్రుడా   ||కల్వరి||\n\n4.ఐదు రొట్టెలు మరి రెండు చేపలతో నైదువేల\nజనులను పోషించిన తండ్రి సిలువలోని మిత్రుడా   ||కల్వరి||\n\n5.నీళ్ళను రసముగ మార్చితివి నీళ్ళ మీద నడిచితివి\nమేళ్ళనొసగు మా దాతా సిలువలోని మిత్రుడా   ||కల్వరి||\n\n6.రోగుల బాగు చేయువాడా గ్రుడ్డికి నేత్రములిచ్చితివి\nఅనాథుల నాయకుడా సిలువలోని మిత్రుడా   ||కల్వరి||\n\n7.హల్లెలూయ కర్హుడా ఎల్లరును కొనియాడు వాడా\nబలముతో వచ్చు రాజా సిలువలోని మిత్రుడా   ||కల్వరి||"},{"n":295,"ei":"","ci":"Wonderful and marvellous is Jesus","ti":"ఘోర పాపము ద్రుంచ ధరణిపై కేతెంచి\n","es":"","ec":"Wonderful and marvellous is Jesus to me\nSweeter than the honey in the honey comb is He\nMy God is real He’ll never fail\nI’ll serve Him valiantly through all eternity.","ts":"ఘోర పాపము ద్రుంచ ధరణిపై కేతెంచి మరణమై లేచినావు మా యేసు-మమ్ముద్ధరించినావు\n\n1 ఘోరమైన సిలువ భారంబును నీవు భరియించి మోసినావు మా కొరకు-బాధలే బొందినావు\n\n2 దుష్టజనులు నిన్ను దూషణములాడుచు దుష్టుడే బొడవగాను నీ ప్రక్క-రుధిరంబు నీరు గారె\n\n3 కలువరి గిరి పైన సిలువ బాధయు నొంది కలవరము నొందినావు నా కొరకు-కష్టములు బొందినావు\n\n4 కడలి పైన నీవు కడు నేర్పుతో నుండి ఒడలు నర్పించినావు నీ యొక్క వేడుకను జూపినావు\n\n5 మూడు గంటల వేళ యేడు మాటలు బలికి గోడున జెందినావు నీ యొక్క ప్రాణంబు విడిచినావు\n\n6 పరమధాముం డేసు మరణమొందగ జూచి సూర్యుండు చీకటాయె మృతులైన-పరిశుద్ధులు లేచిరి\n\n7 కరుణగల మా యేసు మరణమొందగ జూచి ధరగిరుల పగిలినవా మా తండ్రి-గుడితెరలు చిరిగినవా\n\n8 రండి రండి మీరు రక్షకుని నమ్మండి నిండు శాంతము నిచ్చును మా తండ్రి-దండి దయను జూపును"},{"n":296,"ei":"","ci":"Wounded for me! Wounded for me","ti":"సిలువే నా శరణాయెను-రా","es":"","ec":"Wounded for me! wounded for me!\nThere on the cross He w
