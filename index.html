<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Song Book</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0e0c;--surface:#1a1814;--card:#221f1a;--border:#2e2a24;
  --gold:#c8a84b;--gold-dim:#8a6f2e;--gold-bright:#e8c96a;
  --text:#e8e0d0;--muted:#8a8070;--subtle:#4a4438;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Source Sans 3",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:3px}

/* HEADER */
header{background:linear-gradient(180deg,#000 0%,var(--surface) 100%);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.brand-icon{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold-bright),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.brand-name{font-family:"Playfair Display",serif;font-size:1.15rem;color:var(--gold-bright)}
nav{display:flex;gap:4px}
.nav-btn{background:none;border:1px solid transparent;color:var(--muted);font-family:"Source Sans 3",sans-serif;font-size:13.5px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .18s;white-space:nowrap}
.nav-btn:hover{color:var(--text);border-color:var(--border)}
.nav-btn.active{color:var(--gold-bright);border-color:var(--gold-dim);background:rgba(200,168,75,.08)}
.hamburger{display:none;background:none;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:16px}
.mob-nav{display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;flex-direction:column;gap:5px}
.mob-nav.open{display:flex}
@media(max-width:620px){nav{display:none}.hamburger{display:block}}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* HOME */
#page-home{min-height:calc(100vh - 60px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(200,168,75,.06) 0%,transparent 65%)}
#page-home.active{display:flex}
.hero-orn{font-size:2.2rem;margin-bottom:18px;opacity:.5;color:var(--gold)}
.hero-title{font-family:"Playfair Display",serif;font-size:clamp(2.2rem,6vw,3.8rem);font-weight:700;text-align:center;line-height:1.15;margin-bottom:12px;background:linear-gradient(135deg,var(--gold-bright),var(--gold),var(--gold-dim));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{color:var(--muted);font-size:1rem;text-align:center;max-width:420px;line-height:1.7;margin-bottom:44px}
.home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;max-width:760px;width:100%}
.hcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 22px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.hcard:hover{border-color:var(--gold-dim);transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.hc-icon{font-size:1.9rem;margin-bottom:12px}
.hc-title{font-family:"Playfair Display",serif;font-size:1.18rem;color:var(--gold-bright);margin-bottom:5px}
.hc-count{font-size:13px;color:var(--muted)}  /* NO uppercase */
.hc-arrow{position:absolute;bottom:18px;right:18px;color:var(--gold-dim);font-size:1.2rem;transition:transform .18s}
.hcard:hover .hc-arrow{transform:translateX(4px)}
.db-badge{font-size:11px;color:var(--gold-dim);text-align:center;margin-top:18px}

/* LIST PAGE */
#page-list{padding:0}
.list-topbar{position:sticky;top:60px;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px}
.list-topbar-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:"Source Sans 3",sans-serif;font-size:13px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .18s;white-space:nowrap}
.back-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.list-label{font-family:"Playfair Display",serif;font-size:1.05rem;color:var(--gold-bright);flex-shrink:0}
.srch-wrap{flex:1;min-width:190px;position:relative;display:flex;align-items:center}
.srch-wrap svg{position:absolute;left:11px;color:var(--muted);pointer-events:none;flex-shrink:0}
.srch{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 36px 8px 36px;font-family:"Source Sans 3",sans-serif;font-size:14px;color:var(--text);outline:none;transition:border .18s}
.srch::placeholder{color:var(--subtle)}
.srch:focus{border-color:var(--gold-dim)}
.srch-clear{position:absolute;right:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px;display:none;line-height:1}
.srch-clear.show{display:block}
.res-count{font-size:12px;color:var(--muted);white-space:nowrap}

/* TABLE */
.list-body{max-width:1000px;margin:0 auto;padding:16px 24px 80px}
.idx-table{width:100%;border-collapse:collapse}
.idx-table thead th{text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:131px;background:var(--bg);z-index:9}
.idx-table thead th:first-child{width:48px;text-align:center}
.idx-table thead th:last-child{width:28px}
.srow{cursor:pointer;border-bottom:1px solid rgba(46,42,36,.4);transition:background .13s}
.srow:hover{background:var(--card)}
.srow td{padding:10px 12px;vertical-align:middle}
.srow td:first-child{text-align:center;font-family:"Playfair Display",serif;font-size:.9rem;color:var(--gold-dim)}
.srow:hover td:first-child{color:var(--gold)}
.stitle{font-size:.92rem;color:var(--text)}
.stitle mark{background:rgba(200,168,75,.2);color:var(--gold-bright);border-radius:2px;padding:0 2px}
.snippet{font-size:.76rem;color:var(--muted);margin-top:2px}
.srow td:last-child{color:var(--subtle);font-size:1rem;text-align:right}
.srow:hover td:last-child{color:var(--gold)}
.no-res{text-align:center;padding:50px 20px;color:var(--muted)}
.no-res-icon{font-size:2rem;margin-bottom:10px}

/* DETAIL */
#page-detail{padding:0}
.det-topbar{position:sticky;top:60px;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px}
.det-badge{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:3px 8px;flex-shrink:0}
.det-body{max-width:750px;margin:0 auto;padding:28px 24px 80px}
.det-title{font-family:"Playfair Display",serif;font-size:clamp(1.4rem,4vw,2.1rem);line-height:1.3;color:var(--gold-bright);margin-bottom:22px}
.tab-row{display:flex;gap:7px;margin-bottom:22px;flex-wrap:wrap}
.tab-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:"Source Sans 3",sans-serif;font-size:13px;padding:6px 16px;border-radius:20px;cursor:pointer;transition:all .18s}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.tab-btn:hover:not(.active){border-color:var(--gold-dim);color:var(--text)}
.lyric{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 30px;white-space:pre-wrap;font-size:.98rem;line-height:2.05;color:var(--text)}
.lyric.tel{font-size:1.07rem;line-height:2.2}
@media(max-width:580px){.lyric{padding:18px 16px}}
.song-nav{display:flex;gap:10px;margin-top:24px;justify-content:space-between}
.snav{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:"Source Sans 3",sans-serif;font-size:12.5px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:all .18s;max-width:210px}
.snav.right{text-align:right;margin-left:auto}
.snav:hover{border-color:var(--gold-dim);color:var(--text)}
.snav-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px}
.snav-t{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.srow{animation:fadeUp .28s ease both}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand" onclick="goHome()">
      <div class="brand-icon">✝</div>
      <div class="brand-name">Song Book</div>
    </div>
    <nav id="desk-nav">
      <button class="nav-btn" data-t="es" onclick="openSection('es')">English Songs</button>
      <button class="nav-btn" data-t="ec" onclick="openSection('ec')">Choruses</button>
      <button class="nav-btn" data-t="ts" onclick="openSection('ts')">Telugu Songs</button>
    </nav>
    <button class="hamburger" onclick="document.getElementById('mob-nav').classList.toggle('open')">☰</button>
  </div>
</header>
<div class="mob-nav" id="mob-nav">
  <button class="nav-btn" onclick="openSection('es');document.getElementById('mob-nav').classList.remove('open')">English Songs</button>
  <button class="nav-btn" onclick="openSection('ec');document.getElementById('mob-nav').classList.remove('open')">Choruses</button>
  <button class="nav-btn" onclick="openSection('ts');document.getElementById('mob-nav').classList.remove('open')">Telugu Songs</button>
</div>

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="hero-orn">✦</div>
  <h1 class="hero-title">Telugu &amp; English<br/>Song Book</h1>
  <p class="hero-sub">355 hymns, choruses &amp; Telugu songs. Search, browse, and sing together.</p>
  <div class="home-cards">
    <div class="hcard" onclick="openSection('es')">
      <div class="hc-icon">🎵</div>
      <div class="hc-title">English Songs</div>
      <div class="hc-count" id="cnt-es">0 songs</div>
      <div class="hc-arrow">→</div>
    </div>
    <div class="hcard" onclick="openSection('ec')">
      <div class="hc-icon">🎶</div>
      <div class="hc-title">English Choruses</div>
      <div class="hc-count" id="cnt-ec">0 choruses</div>
      <div class="hc-arrow">→</div>
    </div>
    <div class="hcard" onclick="openSection('ts')">
      <div class="hc-icon">🙏</div>
      <div class="hc-title">Telugu Songs</div>
      <div class="hc-count" id="cnt-ts">0 కీర్తనలు</div>
      <div class="hc-arrow">→</div>
    </div>
  </div>
  <div class="db-badge" id="db-badge">Using embedded data</div>
</div>

<!-- LIST -->
<div id="page-list" class="page">
  <div class="list-topbar">
    <div class="list-topbar-inner">
      <button class="back-btn" onclick="goHome()">← Home</button>
      <span class="list-label" id="list-label">Songs</span>
      <div class="srch-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="srch" id="srch" placeholder="Search…" oninput="onSearch()" autocomplete="off" spellcheck="false"/>
        <button class="srch-clear" id="srch-clear" onclick="clearSearch()">✕</button>
      </div>
      <span class="res-count" id="res-count"></span>
    </div>
  </div>
  <div class="list-body">
    <table class="idx-table">
      <thead><tr><th>#</th><th>Song Title</th><th></th></tr></thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>
</div>

<!-- DETAIL -->
<div id="page-detail" class="page">
  <div class="det-topbar">
    <button class="back-btn" onclick="backToList()">← Back</button>
    <span class="det-badge" id="det-badge">Song 1</span>
  </div>
  <div class="det-body">
    <div class="det-title" id="det-title"></div>
    <div class="tab-row" id="tab-row"></div>
    <div class="lyric" id="lyric"></div>
    <div class="song-nav" id="song-nav"></div>
  </div>
</div>

<!-- ── Embedded DB ── -->
<script>
const DB=[{"n":1,"ei":"All hail the power","ci":"Abba, Father, let me be","ti":"దేవుని స్తుతియించుడి","es":"1.All hail the power of Jesus’ Name!\nLet angels prostrate fall;\nBring forth the royal diadem,\nAnd crown Him Lord of all.\n\n2.Crown Him, ye martyrs of our God,\nWho from the altar call,\nExtol the stem of Jesse’s rod\nAnd crown Him Lord of all.\n\n3.Ye saints redeemed of Adam’s race,\nYe ransomed from the fall,\nHail Him who saves you by His grace,\nAnd crown Him Lord of all.\n\n4.Sinners, whose love can ne’er forget \nThe wormwood and the gall;\nGo, spread your trophies at His feet,\nAnd crown Him Lord of all.\n\n5.Let every kindred, every tribe,\nOn this terrestrial ball,\nTo Him all majesty ascribe,\nAnd crown Him Lord of all.\n\n6.Oh, that with yonder sacred throng\nWe at His feet may fall;\nJoin in the everlasting song,\nAnd crown Him Lord of all.","ec":"Abba Father, let me be\nYours and Yours alone.\nMay my will for ever be\nevermore Your own.\n\nNever let my heart grow cold,\nnever let me go,\nAbba Father, let me be\nYours and Yours alone.","ts":"దేవుని స్తుతియించుడి యెల్లప్పుడు\nదేవుని స్తుతియించుడి - ఆ...ఆ...\n\n1.ఆయన బలమును – ప్రసిద్ధి చేయు \nఆకాశ విశాలమందు -ఆ..ఆ.. ||దేవుని||\n\n2.ఆయన పరాక్రమ- కార్యములను బట్టి  \nఆయన ప్రభావమును-ఆ..ఆ.. ||దేవుని||\n\n3.బూర ధ్వనితో - ఆయనన్‌ స్తుతించుడి\n స్వరమండలములతో-ఆ...ఆ.. ||దేవుని||\n\n4.సన్నని తంతుల - సితారతోను\nచక్కని స్వరములతో-ఆ...ఆ... ||దేవుని||\n\n5.పిల్లన గ్రోవిని - చల్లగ నూది\n ఎల్ల ప్రజలు చేరి - ఆ...ఆ..   ||దేవుని||\n\n6.తంబురతోను - నాట్యముతోను\nతంతి వాద్యముతోను -..ఆ.. ||దేవుని||\n\n7.మ్రోగు తాళములతో - ఆయనన్‌ స్తుతించుడి\nగంభీర తాళముతో - ఆ...ఆ... ||దేవుని||\n\n8.సకల ప్రాణులు యెహోవాన్‌ స్తుతించుడి \nహల్లెలూయ ఆమెన్‌-ఆ...ఆ...  ||దేవుని||"},{"n":2,"ei":"All my lifelong I had","ci":"Above all power","ti":"యెహోవా నా బలమా","es":"1.All my life long I had panted\nFor a draught from some cool spring,\nThat I hoped would quench the burning\nOf the thirst I felt within.\n\nHallelujah! I have found Him\nWhom my soul so long has craved!\nJesus satisfies my longings;\nThrough His life I now am saved.\n\n2.Feeding on the husks around me,\nTill my strength was almost gone,\nLonged my soul for something better,\nOnly still to hunger on.\n\n3.Poor I was, and sought for riches,\nSomething that would satisfy,\nBut the dust I gathered round me\nOnly mocked my soul’s sad cry.\n\n4.Well of water, ever springing,\nBread of life, so rich and free,\nUntold wealth that never faileth,\nMy Redeemer is to me.","ec":"Above all powers, above all kings\nAbove all nature and all created things\n\nAbove all wisdom and all the ways of man\nYou were here before the world began.\n\nAbove all kingdoms, Above all thrones\nAbove all wonders the world has ever known\n\nAbove all wealth and treasures of the earth\nThere’s no way to measure what you’re worth.\n\nCrucified laid behind a stone\nYou lived to die, rejected and alone\n\nLike a rose trampled on the ground\nYou took the fall and thought of me above all.\n","ts":"యెహోవా నా బలమా\nయధార్థమైనది నీ మార్గం\nపరిపూర్ణమైనది నీమార్గం\n\n1.నా శత్రువులు నను చుట్టినను\nనరకపు పాశము లరికట్టినను\nవరదవలె భక్తిహీనులు పొర్లిన\nవిడువక నను ఎడబాయనిదేవా ||యె||\n\n2.దయగల వారిపై దయచూపించును\nకఠినుల యెడలను వికటము చూపును\nగర్విష్టుల యొక్క గర్వము నణచును\nసర్వము నెరిగిన సర్వాధికారి ||యె||\n\n3.మరణపు టురులలో మరువక మొరలిడ \nఉన్నత దుర్గమై రక్షణ శృంగమై\nతన యాలయములో నా మొర వినెను\nఅదరెను ధరణి భయకంపముచే ||యె||\n\n4.పౌరుషము గల ప్రభు కోపింపగ\nపర్వతముల పునాదులువణకెను \nతన నోట నుండి వచ్చిన యగ్ని\nదహించి వేసెను వైరులనెల్ల ||యె||\n\n5.మేఘములపై ఆయన వచ్చును\nమేఘములను తన మాటుగ జేయును\nఉరుములు మెరుపులు మెండుగజేసి\nఅపజయమిచ్చును అపవాదికిని ||యె||\n\n6.నా దీపమును వెలిగించువాడు  \nనా చీకటిని వెలుగగ  జేయును\nజలరాసులనుండి బలమైన చేతితో\nవెలుపల జేర్చిన  బలమైన దేవుడు ||యె||\n\n7.నా కాళ్ళను లేడి కాళ్ళగజేసి\nఎత్తైన స్థలములో శక్తితో నిలిపి\nరక్షణ కేడెము నాకందించి\nఅక్షయముగ తన పక్షము జేర్చిన ||యె||\n\n8.యెహోవా జీవముగల దేవా  \nబహుగా స్తుతులకు అర్హుడవీవె \nఅన్య జనులలో ధన్యత జూపుచు \nహల్లెలూయ స్తుతి గానము చేసెద ||యె||"},{"n":3,"ei":"All things bright","ci":"Absolutely tender","ti":"ఎల్లవేళలందు - కష్టమందైనను","es":"All things bright and beautiful,\nAll creatures great and small,\nAll things wise and wonderful,\nThe Lord God made them all.\n\n1.Each little flower that opens, \nEach little bird that sings, \nHe made their glowing colours \nHe made their tiny wings.\n\n2.The purple-headed mountain, \nThe river running by, \nThe sunset, and the morning \nThat brightens up the sky.\n\n3.The cold wind in the winter, \nThe pleasant summer sun \nThe ripe fruits in the garden, \nHe made them every one.\n\n4.He gave us eyes to see them, \nAnd lips that we might tell \nHow great is God Almighty, \nWho hath done all things well.","ec":"Absolutely  tender, absolutely true\nUnderstanding all things;\nUnderstanding You,\nInfinitely lovely,\nAlways near to cheer,\nThis is God our Father,\nWhat have we to fear?","ts":"ఎల్లవేళలందు - కష్టమందైనను\nకృతజ్ఞాస్తుతులు - చెల్లింతున్‌\nయేసువా నిన్ను నే - స్తుతింతున్‌ స్తుతింతున్\n‌జీవిత - మంతయు - స్తుతింతున్‌\n\n1.ఆదియు నీవే - అంతము నీవే\nజ్యోతియు నీవే-నా శాంతియు నీవే ||ఎ||\n\n2.తల్లి దండ్రియు - దాతవు నీవే\nకోటయు నీవే-నా బాటయు నీవే ||ఎ||\n\n3.వ్యాధిలో నీవే - వృద్ధిలో నీవే\nబాధలో నీవే - నా సాధకుడవు ||ఎ||\n\n4.రక్షణ నీవే - దీక్షయు నీవే\nకాపరి  నీవే - నా కర్తవు నీవే ||ఎ||\n\n5.ఆధారం నీవే - ఆనందం నీవే\nమోక్షము నీవే - నిరీక్షణ నీవే ||ఎ||\n\n6.దివిలో నీవే - భువిలో నీవే\nఅపాయములో-సహాయము నీవే ||ఎ||\n\n7.దైవము నీవే - జీవము నీవే\nరాజువు నీవే - నా సర్వము నీవే ||ఎ||"},{"n":4,"ei":"Amazing grace!","ci":"Accept my broken","ti":"స్తోత్రము యేసునాథా - నీకు సదా","es":"1.Amazing grace! how sweet the sound,\nThat saved a wretch like me!\nI once was lost, but now am found,\nWas blind, but now I see.\n\n2.‘Twas grace that taught my heart to fear,\nAnd grace my fears relieved;\nHow precious did that grace appear\nThe hour I first believed!\n\n3.Thro’ many dangers, toils and snares,\nI have already come:\n‘Tis grace that bro’t me safe thus far,\nAnd grace will lead me home.\n\n4.When we’ve been there ten thousand years,\nBright shining as the sun\nWe’ve no less days to sing God’s praise\nThan when we first began.","ec":"Accept my broken, my broken spirit Lord,\nAccept my contrite, my contrite heart.\nAccept my broken, my broken spirit Lord,\nAccept my contrite, my contrite heart.\n\n1.I know I’ve been wrong for so long  \nAnd so I’m singing this song.\n’Cause when I come with a   broken spirit\nI know that You Oh Lord, will receive it.\n\n2.Sometimes my heart  becomes as stone\nSometimes my will becomes my own\nThis time I come with a broken spirit\nAnd know that You, Oh Lord, will receive it.","ts":"1.స్తోత్రము యేసునాథా - నీకు సదా \nస్తోత్రము యేసునాథా\nస్తోత్రము చెల్లింతుము – నీదు\nదాసులము – పిత్ర పుత్రాత్మలకు\n\n2.నేడు నీదు నామ మం – దున మేము\nచేరి స్తుతించునట్లు చేసిన కృపకై - నీకే నిరతము - \nస్తోత్రము చేసెదము\n\n3.నీదు రక్తధారచే - కలిగిన - సజ్జీవ నవ మార్గము\n దాసులము తండ్రి - సన్నిధి చేరను నిత్యము స్వతంత్రము\n\n4.ఇట్టి ప్రభావమైన - పదవిని \nపురుగుల మగు మాకు\nఇంత దయతోడ - నిచ్చిన కృప\nమా కెంతయో  నాశ్చర్యము\n\n5.దూతల సైన్యములు - శృంగార గీతముల\nనెప్పుడు రాజాధిరాజా \nనీకు - స్తుతులు పాడుచు - నార్భటించుచుందురు\n\n6.నీవు తప్ప మాకు - పరమందున\nవేరెవ్వరు గలరు\nఇద్ధరయందు - నీవు తప్ప మాకు\nఆదరణ యెవరు"},{"n":5,"ei":"And can it be","ci":"According to thy loving","ti":"కర్తా నిన్‌ స్తుతించెదము","es":"1.And can it be that I should gain\nAn int’rest in the Saviour’s blood?\nDied He for me, who caused His pain?\nFor me, who Him to death pursued?\nAmazing love! how can it be\nThat Thou, my God, should’st die for me?\n\n2.’Tis mystery all! The Immortal dies!\nWho can explore His strange design?\nIn vain the first-born seraph tries\nTo sound the depths of love Divine!\n‘Tis mercy all! let earth adore, \nLet angel minds inquire no more.\n\n3.He left His Father’s throne above,\nSo free, so infinite His grace;\nEmptied Himself of all but love,\nAnd bled for Adam’s helpless race;\n‘Tis mercy all, immense and free;\nFor, O my God, it found out me.\n\n4.Long my imprisoned spirit lay\nFast bound in sin and nature’s night;\nThine eye diffused a quickening ray,\nI woke, the dungeon flamed with light;\nMy  chains fell off, my heart was free;\nI rose, went forth, and followed Thee.\n\n5.No condemnation now I dread;\nJesus, and all in Him, is mine!\nAlive in Him, my living Head,\nAnd clothed in righteousness divine,\nBold I approach the eternal throne,\nAnd claim the crown, through Christ my own.","ec":"1.According to Thy lovingkindness\nFather, Have mercy on my sinful, wretched soul;\nMake me to know once more Thy joy and gladness, Blot out my sin,\n\nO cleanse and make me whole.I humbly now acknowledge my transgerssion,\nAgainst Thee only, Father is my sin; Restore to me the joy of Thy salvation\nO purify my life, without within.\n\n2.A contrite heart I offer Thee, Dear Father O hide Thy face from all my sin,I pray;\nAccording to Thy tender love and mercy,O pardon Lord,This soul that went astray.","ts":"కర్తా నిన్‌ స్తుతించెదము\nపరిశు...ద్ధ సంఘము పాడి కొనియాడి\nఇహమందెన్నడు కానని ఆశ్చర్\nకార్యముల్‌ మాకై చేసితి వనుచు\n\n1.సీయోను సంతసించు\nపరమానందము నీకు లభించె గాన\nసీయోను సంతసించు \nరక్షకుడేసుని - మనసార మ్రొక్కి\nపరవశమొందు-ధన్యత నిచ్చిన ||కర్తా||\n\n2.కన్నార చూచితిమి - దైవ రక్షణను\nరుచియించి యెరిగితి కన్నార చూచితిమి \nలెక్కింపలేని - కృపలతో నిన్ను\nదర్శించి – దీవింప నిశ్చయించిన ||కర్తా||\n\n3. పవిత్ర సంఘమా - యేసు వెదకి \nవెండి స్వంతము చేసిన పవిత్ర సంఘమా\nసత్తులేకుండా - పడియున్న నీకు\nరక్తము నిచ్చి - జీవింపజేసిన ||కర్తా||\n\n4.అన్యురాలా! సీయోనూ! – నిన్ను తృణీకరించక\nచేతనెత్తికొనె అన్యురాలా! సీయోనూ! \nయేసుని నీతి - ధరింప జేసి పెండ్లి \nకుమార్తె  సౌందర్యమిచ్చిన ||కర్తా||\n\n5.శృంగార కన్యలారా! - పరిశు...ద్ధ \nగానముతో స్తుతించుడి శృంగార కన్యలారా!\nసాటి లేని - పెండ్లి కుమారుడేసుని \nమహిమ పరచు-భాగ్యంబు నొసగిన"},{"n":6,"ei":"As the deer pants","ci":"Acres of diamonds","ti":"నా యాత్మా! నా యంతరంగమా!","es":"1.As the deer pants for the water,\nSo my soul longs after You.\nYou alone are my heart’s desire\nAnd I long to worship You.\n\nYou alone are my strength, my shield,\nTo You alone may my spirit yield.\nYou alone are my heart’s desire\nAnd I long to worship you\n\n2.I want You more than gold or silver,\nOnly You can satisfy.\nYou alone are the real joy-giver\nAnd the apple of my eye.\n\n3.You  are my Friend and You are my Brother,\nEven though You are a King.\nI love You more than any other\nSo  much more than anything.","ec":"Acres of diamonds, Mountains of gold,\nRivers of silver, jewels untold;\nAll  these  together wouldn’t buy you  or  me\nPeace when we’re sleeping, a conscience that’s free.\nA heart that’s contented, a satisfied mind;\nThese are the treasures money can’t buy:\nIf you have Jesus, there’s more wealth in your soul,\nThan acres of diamonds and mountains of gold.","ts":"నా యాత్మా! నా యంతరంగమా! \nనీ ప్రభువును స్తుతియించుము\nయిన్నాళ్లు-ప్రేమించి – కాపాడిన\nనీ ప్రభువును - స్తుతియించుము\n\n1.పరలోక వాసుల్‌ - భూలోక వాసుల్‌\nకొనియాడ తరమే-నీ మహిమన్ ‌||నా||\n\n2.తరతరములకు - మార్పు చెందని\nఅంతములేని - దేవుని ||నా||\n\n3.నీ దోషములు - లోపములన్నియు\nక్షమియించి - మరచుదేవుని ||నా||\n\n4.వ్యాధిలో బాధలో - దయ చూపించి \nస్వస్థత నిచ్చిన - దేవుని ||నా||\n\n5.కరుణను - కిరీటముగా నీకు\nధరియింప - జేసిన దేవుని ||నా||\n\n6.అనుదినము - నా హృదయమా \nనీవు స్తుతియించు-ప్రభుని మనసార ||నా||"},{"n":7,"ei":"Break thou the bread","ci":"Ah Lord God","ti":"సాగిలపడి మ్రొక్కెదము -  సత్యముతో ఆత్మలో మన","es":"1.Break thou the Bread of Life,Dear Lord, to me,\nAs Thou didst break the bread Beside the sea;\nBeyond the sacred page I seek Thee, Lord;\nMy spirit longs for Thee, Thou Living Word.\n\n2.Thou art the Bread of Life, O Lord, to me,\nThy Holy Word the truth That saveth me\nGive me to eat and live With Thee above;\nTeach me to love Thy truth, For Thou art love.\n\n3.Oh, send Thy Spirit, Lord, Now unto me,\nThat He may touch my eyes And make me see;\nShow me the truth concealed Within Thy Word,\nAnd in Thy Book revealed, I see Thee, Lord.\n\n4.Bless Thou the Bread of life To me, to me,\nAs Thou didst bless the loaves By Galilee;\nThen shall all bondage cease, All fetters fall,\nAnd I shall find my peace, My All in all.","ec":"Ah Lord God,\nThou hast made the heavens\nAnd the earth by Thy great  power.\nAh Lord God Thou hast made the heavens\nAnd the earth  by Thine out-stretched arm.\nNothing is too difficult for Thee,(2)\nO great and mighty God,\nGreat in counsel and mighty in deed,\n\nNothing , nothing,\nAbsolutely nothing,\nNothing is too difficult for Thee.","ts":"సాగిలపడి మ్రొక్కెదము - \nసత్యముతో ఆత్మలో మన \nప్రభు యేసుని - ఆ....ఆ....ఆ....\n\n1.మోషే కంటె శ్రేష్టుడు - అన్ని మోసముల నుండి విడిపించున్‌ \nవేషధారులను ద్వేషించున్‌  ఆశతో మ్రొక్కెదము ||సాగి||\n\n2.అహరోను కంటె శ్రేష్టుడు మన ఆరాధనకు పాత్రుండు \nఆయనే ప్రధాన యాజకుడు అందరము మ్రొక్కెదము ||సాగి||\n\n3.ఆలయము కన్న శ్రేష్టుడు – నిజ ఆలయముగ తానే యుండెన్‌\nఆలయము మీరే యనెను ఎల్లకాలము మ్రొక్కెదము ||సాగి||\n\n4.యోనా కంటె శ్రేష్టుడు ప్రాణదానముగా తన్ను అర్పించెన్‌\nమానవులను విమోచించెన్‌ ఘనపరచి మ్రొక్కెదము ||సాగి||\n\n5.సొలోమోను కన్న శ్రేష్టుడు సర్వజ్ఞానమునకు ఆధారుండు\nపదివేలలో అతి ప్రియుండు  పదిలముగా మ్రొక్కెదము ||సాగి||\n\n6.రాజులకంటె శ్రేష్టుడు యాజకులనుగా మనలను చేసెన్\nరారాజుగ త్వరలో వచ్చున్‌ రయముగను మ్రొక్కెదము ||సాగి||\n\n7.అందరిలో అతి శ్రేష్టుడు – మన కందరికి తానే ప్రభువు\nహల్లెలూయకు పాత్రుండు అనుదినము మ్రొక్కెదము ||సాగి||"},{"n":8,"ei":"Christ triumphant","ci":"Alive, alive, alive","ti":"యేసు పరిశుద్ధ నామమునకు","es":"1.Christ triumphant, ever reigning, \nSaviour, Master, King,\nLord of heav’n our lives sustaining, \nHear us as we sing:\n\nYours the glory and the crown, \nThe high renown,\nThe  eternal Name.\n\n2.Word incarnate truth revealing, \nSon of Man on earth,\nPower and majesty concealing \nBy Your humble birth.\n\n3.Suffering servant, scorned,  ill-treated, \nVictim crucified,\nDeath is through the cross defeated \nSinners justified.\n\n4.Priestly King, enthroned for ever \nHigh in heaven above,\nSin and death and hell shall never \nStifle hymns of love.\n\n5.So, our hearts and voices raising \nThrough the ages long,\nCeaselessly upon You gazing \nThis shall be our song.","ec":"Alive, alive, alive for evermore;\nMy Jesus is alive,\nAlive for evermore.\n(He’s) Alive, alive, alive for evermore;\nMy Jesus is alive\n\nSing hallelujah, (2)\nMy Jesus is alive for evermore\nSing hallelujah, (2)\nMy Jesus is alive","ts":"యేసు పరిశుద్ధ నామమునకు\nఎప్పుడు అధిక స్తోత్రమే\n\n1.ఇహపరమున మేలైన నామము \nశక్తి గలిగి నట్టి నామమిది \nపరిశుద్ధులు స్తుతించు నామమిది  పరి...  ||యేసు||\n\n2.సైతానున్‌ - పాతాళమును జయించు\nవీరత్వము గల నామమిది\nజయమొందెదము\nఈ నామమున జయ... ||యేసు||\n\n3.నశించు పాపుల రక్షింప లోక\nమున కేతెంచిన నామమిది\nపరలోకమున చేర్చు నామమిది  పర... ||యేసు||\n\n4.ఉత్తమ భక్తులు పొగడి స్తుతించు\nఉన్నత దేవుని నామమిది\nలోకమంతా ప్రకాశించు నామమిది \tలోక... ||యేసు||\n\n5.శోధన గాధల కష్ట సమయాన\nఓదార్చి నడుపు నామమిది\nఆటంకము తీసివేయు నామమిది  ఆటం... ||యేసు||"},{"n":9,"ei":"Come,let us all unite","ci":"All hail the lamb","ti":"తేనియ కంటెను-యేసుని నామం","es":"1.Come, let us all unite to sing, \nGod is love;\nLet heaven and earth their Praises bring, \nGod is love;\nLet ev’ry soul from sin awake,\nEach in his heart sweet music make,\nAnd sing with us for Jesus’ sake,\nFor God is love.\n\nGod is love! God is love!\nCome, let us all unite to sing\nThat God is love.\n\n2.Oh, tell to earth’s remotest bound, \nGod is love;\nIn Christ we have redemption found,\nGod is love;\nHis blood has washed our sins away,\nHis Spirit turned our night to day,\nAnd now we can rejoice to say,\nThat God is love.\n\n3.How happy is our portion here,\nGod is love;\nHis promises our spirits cheer\nGod is love;\nHe is our Sun and Shield by day,\nOur help, our hope, our strength and stay,\nHe will be with us all the way,\nOur God is love.","ec":"All hail the Lamb enthroned on high\nHis praise shall be our battle cry\nHe reigns victorious forever glorious\nHis name is Jesus, He is the Lord","ts":"తేనియ కంటెను-యేసుని నామం దివ్య మధుర – మౌను\nనీవు పరుగిడి రమ్ము-దివ్య సన్నిధికి దినము - ఓ మనసా!\n\n1.లోకములోన – కష్టములెల్ల యేసుడు - భరియించెన్‌\nపాపకీడును బాపెన్‌ - శాపము మాపెన్‌ తెలిసికో ఓ మనసా! ||తేనియ||\n\n2.పాపిన్‌ రక్షింప - ప్రాణము  నిచ్చెన్‌ యేక కుమారుండు\nఇది యెంతటి కరుణ నిరంతర ముండున్‌ స్తుతించుము ఓ మనసా! ||తేనియ||\n\n3.అరుణోదయమున - మంచువలె నీ లోకము మాయమగున్‌\nనీవు యేసుని నామం నిరతము నమ్ము హత్తుకో  ఓ మనసా! ||తేనియ||\n\n4.కష్టములోన - సంతోషమిచ్చు మిత్రుడు ఆ ప్రభువే\nతన రెక్కల క్రింద ఆశ్రయమిచ్చున్‌ నిశ్చయం ఓ మనసా! ||తేనియ||\n\n5.భూలోక వాసుల్‌ - పరలోక వాసుల్‌ ప్రభువుని – స్తుతియించుడి\nయేసు నెరిగిన వారే పరమున చేర తగుదురు ఓ మనసా! ||తేనియ||"},{"n":10,"ei":"Come,ye that love","ci":"All the way to Calvary","ti":"ఎల్లప్పుడు స్తుతించు- నా యాత్మ దేవుని","es":"1.Come, ye that love the Lord,\nAnd let your joys be known,\nJoin in a song with sweet accord,\nAnd thus surround the throne.\n\nWe’re marching to Zion,\nBeautiful, beautiful Zion;\nWe’re marching upward to Zion,\nThe beautiful city of God.\n\n2.Let those refuse to sing \nWho never knew our God;\nBut children of the heavenly King \nMust speak their joys abroad.\n\n3.The hill of Zion yields \nA thousand sacred sweets,\nBefore we reach the heavenly fields, \nOr walk the golden streets.\nAnd every tear be dry;\n\n4.Then let our songs abound,\nAnd every tear be dry;\nWe’re marching through Immanuel’s ground,\nTo fairer  worlds on high.","ec":"1.All the way to Calvary\nHe *went for me; (3)\nAll the way to Calvary\nHe *went for me,\nHe died to set me free.\n\n2.He *wept...\n\n3.He *bled..","ts":"ఎల్లప్పుడు స్తుతించు- నా యాత్మ దేవుని ఎల్లప్పుడు స్తుతించు \nఇన్నాళ్ళ వరకు - దేవుడు చేసిన(2)\nఎన్నలేని మేళ్ళన్ మరువకుండ నీవు\n\n1.నీ పాపంబులన్నియు -క్షమియించి \nమరచి నీ పాపంబులన్నియు\nనాశనకరంబైన వ్యాధిన్‌ తొలగించె (2)\nపృధివిన్‌ చూపిన ఇట్టి ప్రేమ నెంచి\n\n2.ఎంత కృప జూపెను-నీ బ్రతుకునందు \nఎంత కృప జూపెను\nనిత్యము-నీ తలపై కిరీటముంచి (2) \nచావకుండ నీదు ప్రాణంబున్‌ కాపాడె\n\n3.మేలుతో - నీ నోటిని \nతృప్తి పరచెను మేలుతో-నీ నోటిని \nపక్షిరాజువలె నీదు యౌవనమున్‌ (2)\nక్రొత్తదగుచుండు నట్లుగ జేసెను\n\n4.భూమికి - ఆకాశము – యెంత \nదూరమున్నదో భూమికి –ఆకాశము \nఆయన-యందు భయభక్తులున్నట్టి(2)\nవారియెడ నంత - కృపనధికంబు\n\n5.మన్నింపు మహిమయు \nమన దేవుడిచ్చును మన్నింపు మహిమయు \nతూర్పునకు-పడమరకెంత దూరమో(2)\nనీ పాపంబులట్లు దూరంబు జేసెగా\n\n6.తండ్రి జాలి పడడా? \nతన పిల్లలయందు తండ్రి జాలి పడడా?     \nనీవు రక్షకుని - నమ్ముకొనినచో (2)\nముదిమి వరకు - నిన్నెత్తి కొనును"},{"n":11,"ei":"Crown him with many","ci":"All there is of me, Lord","ti":"స్తోత్రింతుము నిను-మాదు తండ్రీ","es":"1.Crown Him with many crowns,\nThe Lamb upon His throne;\nHark, how the heavenly anthem drowns\nAll music but its own:\nAwake, my soul and sing\nOf Him who died for thee,\nAnd hail Him as thy matchless King\nThrough all eternity.\n\n2.Crown Him the Lord of life,\nWho triumphed o’er the grave,\nAnd rose victorious in the strife\nFor those He came to save:\nHis glories now we sing\nWho died, and rose on high;\nWho died eternal life to bring,\nand lives that death may die.\n\n3.Crown Him the Lord of love;\nBehold His hands and side,\nThose wounds yet visible above\nIn beauty glorified:\nNo angel in the sky\nCan fully bear that sight,\nBut downward bends His burning eye\nAt mysteries so bright.\n\n4.Crown Him the Lord of peace,\nWhose power a sceptre sways,\nFrom pole to pole that wars may cease,\nAnd all be prayer and praise;\nHis reign shall know no end,\nAnd round His pierced feet\nFair flowers of Paradise extend\nTheir fragrance ever sweet.\n\n5.Crown Him the Lord of years,\nThe Potentate of time,\nCreator of the rolling spheres,\nIneffably sublime!\nAll hail, Redeemer, hail!\nFor Thou hast died for me;\nThy praise shall never, never fail\nThroughout eternity.","ec":"All there is of me, Lord,\nAll there is of me,\nTime and talent day by day,\nAll I give to Thee,\nAll there is of me, Lord,\nAll there is of me,\nOn Thine altar here I lay,\nAll there is of me.","ts":"స్తోత్రింతుము నిను-మాదు తండ్రీ\nసత్యముతో నాత్మతో నెపుడు\nపరిశుద్ధాలంకారములతో\nదర్శించెదము శరణం శరణం ||స్తో||\n\n1.ధవళ వర్ణుడ - రత్న వర్ణుడ \nసత్యరూపి యనబడువాడ \nనను రక్షించిన రక్షకుండ \nనాథ నీకె శరణం శరణం  ||స్తో||\n\n2.శ్రేష్టయీవుల నిచ్చినందున \nశ్రేష్ట యీవుల ఊట నీవె \nత్రిత్వమై యేకత్వమైన త్రి \nయేకదేవా శరణం శరణం ||స్తో||\n\n3.పాపి మిత్రుడ పాప నాశుడ \nపరమ వాసుడ ప్రేమ పూర్ణుడ\nవ్యోమపీఠుడ స్వర్గ పూజ్యుడ\nపరిశుద్ధాంగుడ శరణం శరణం ||స్తో||\n\n4.సంఘమునకు శిరస్సు నీవె\nరాజ నీకె నమస్కారములు\nముఖ్యముగను మూలరాయి\nకోట్ల కొలది శరణం శరణం ||స్తో||\n\n5.నీదు సేవకుల పునాదిది \nజ్ఞానమునకు మించిన తెలివి\nఅందముగను కూడుకొనుచు\nవేడెదము శరణం శరణం  ||స్తో||\n\n6.రాజ నీకె స్తుతి స్తోత్రములు\nగీతముల మంగళ ధ్వనులు\nశుభము శుభము శుభము నిత్యము \nహల్లెలూయ ఆమెన్‌ ఆమెన్‌      ||స్తో||"},{"n":12,"ei":"Dear Lord and Father","ci":"All things work together","ti":"జై జై జై జై రాజుల రాజ","es":"1.Dear Lord and Father of mankind,\nForgive our foolish ways;\nReclothe us in our rightful mind;\nIn purer lives Thy service find,\nIn deeper  reverence, praise.\n\n2.In simple trust like theirs who heard\nBeside the Syrian sea,\nThe gracious calling of the Lord,\nLet us, like them, without a word\nRise up and follow Thee.\n\n3.Oh, Sabbath rest by Galilee! \nOh, calm of hills above,\nWhere Jesus knelt to share with Thee \nThe silence of eternity,\nInterpreted by love.\n\n4.With that deep hush subduing all\n Our words and works that drown\n The tender whisper of Thy call,\n As noiseless let Thy blessing fall\n As fell Thy manna down.\n\n5. Drop Thy still dews of quietness,\n Till all our strivings cease;\n Take from our souls the strain and stress,\n And let our ordered lives confess\n The  beauty of Thy peace.\n\n6.Breathe through the heats of our desire\n Thy coolness and Thy balm;\n Let sense be dumb, let flesh retire\n Speak through the earthquake, wind, and fire,\n O still small voice of calm!","ec":"All things work together for good,\nT’gether for good. (2)\nAll things work together for good,\nTo them that love God.\n...To them that love God,\n...To those called by God.\nAll things work together for good,\nTo them that love God.\nIn everything give thanks!(2),\nIn everything, yes, every thing,\nIn everything, give thanks.\n(Repeat theme)","ts":"జై జై జై జై రాజుల రాజ\nపాత్రుడ నీవే మా ప్రభు నీవే\nజై జై జై జై రాజుల రాజా\n\n1.అన్ని కాలములలో నీ నామము  \nమహోన్నతంబౌ - మహోన్నతుండ \nవాగ్దానము నెరవేర్చిన దేవ మాట తప్పని  మహోపకారి ||జై||\n\n2. దూతల మాదిరి గీతముల్‌ పాడుచు \nసతతము నిన్నే స్తోత్రించెదము \nగొల్లలు గాంచిన ఘన కాపరి మా\nఉల్లములందు ఉల్లసించెదము ||జై||\n\n3. తూర్పున తారను గాంచిన జ్ఞానులు \nరాజుల రాజ నీవే యనుచు \nబంగారము సాంబ్రాణి బోళమును \nఅర్పించి ఆరాధించిరిగా  ||జై||\n\n4. ధనవంతుడ వగు ఓ మా ప్రభువా \nధనహీనుడుగా నైతివ మాకై-మా \nదారిద్య్రము తీసివేయ\nనరరూపమున - జన్మించితివా  ||జై||\n\n5. యేసు ప్రభుండ రక్తము కార్చి \nఎంచి మమ్ము విమోచించితివా \nఎంచలేము నీ మేలుల నెపుడు \nఎన్నదగిన మా దేవుడ  వీవె ||జై||\n\n6.మాకై సిలువలో మరణించితివా \nమరణపు ముల్లును విరచిన  ప్రభువా \nయుగయుగములకు నీకె మహిమ\nనిరతము స్తోత్రము హల్లెలూయ ||జై||"},{"n":13,"ei":"Fairest Lord Jesus","ci":"All through the day","ti":"ఎంత ఆనందము – ఎంత ఆనందము","es":"1.Fairest Lord Jesus,\nLord of all creation, \nJesus, of God and man the Son;\n\nYou will I cherish, \nYou will I honour, \nYou are my soul’s delight and crown.\n\n2.Fair are the rivers, \nMeadows and forests \nClothed in the fresh green robes of Spring;\n\nJesus is fairer, Jesus is purer, \nHe makes the saddest heart to sing.\n\n3.Fair is the sunrise, \nStarlight and moonlight \nSpreading their glory across the sky;\n\nJesus shines brighter, \nJesus shines clearer, \nThan all the heavenly host on high.\n\n4.All fairest beauty, \nHeavenly and earthly, \nJesus, my Lord, in You I see;\n\nNone can be nearer, \nFairer or dearer, \nThan you, my Saviour, are to me.","ec":"All through the day,\nAll through the night,\nMy Saviour has been\nwatching over me;  (2)\nHe saves me, He keeps me,\nHe satisfies completely;\nHe washed me in His all atoning blood;\nMy sins are all forgiv’n\nI’m on my way to heaven,\nWalking in the smile of God.","ts":"1. ఎంత ఆనందము – ఎంత ఆనందము\nచెప్ప శక్యమా  రాజైన క్రీస్తు నా పాపంబులన్నియు\nమన్నించి వేసెగా\n\n2.పాడెదం - ఆడెదం - కూడెదం మేము\nజయమార్భాటింతుము \nపాపము మన్నించి –  జీవము నిచ్చిన \nయేసుని - స్తుతించెదం\n\n3.పాపము - కోపము -శాపములన్నియు పరిహరించెను \nదేవాది దేవా ! నా  యెదలో కేతెంచి ఆదరణ నిచ్చెన్‌\n\n4.అక్షయమైన రక్షణతో - తన పక్షము చేర్చెను \nనిశ్చయముగను - సాక్షులైయుండి \t\nయేసుని - చాటింతుము\n\n5.ధవళ వస్త్రము - బంగరు మకుటం వాద్యముల తోను \nఇహము కేతెంచి - పరము చేరిన \nరాజును - స్తుతింతుము"},{"n":14,"ei":"Fill thou my life,O Lord","ci":"And I'm forgiven","ti":"సర్వమేసువే - నాకు సర్వమేసువే","es":"1.Fill Thou my life, O Lord my God,\nIn every part with praise,\nThat my whole being may proclaim\nThy  being and Thy ways.\n\n2.Not for the lip of praise alone, \nNor e’en the praising heart,\nI ask, but for a life made up \nOf  praise in every part.\n\n3.Praise in the common things of life,\nIts goings out and in;\nPraise in each duty and each deed, \nHowever  small and mean.\n\n4.Fill every part of me with praise:\nLet all my being speak\nOf Thee and of Thy love, O Lord, \nPoor  though I be and weak.\n\n5.So shalt Thou, Lord, from me, e’en me,\nReceive the glory due;\nAnd so shall I begin on earth\nThe song for ever new.\n\n6.So shall each fear, each fret, each care,\nBe turned into a song;\nAnd ev’ry winding of the way\nThe echo shall prolong.\n\n7.So shall no part of day or night \nFrom sacredness be free;\nBut all my life, in every step, \nBe fellowship with Thee.","ec":"And I’m forgiven because You were forsaken\nAnd I’m accepted\nYou were condemned\nAnd I’m alive and well\nYour Spirit is within me\nBecause You died and rose again\n\nAmazing love, how can it be\nThat You my King would die for me\nAmazing love, I know it’s true\nIt’s my joy to honour You\nIn all I do, I’ll honour You.","ts":"సర్వమేసువే - నాకు సర్వమేసువే\nసర్వ దుఃఖ నష్ట పరిహార మేసువే\n\n1.కాపరి - నన్‌ మేపును  కాపుదల నిచ్చును \nభావశుద్ధి - భాగ్యమొసగు \nరక్షకుండేసుడే  ||సర్వ||\n\n2.తల్లిదండ్రుల్‌-సోదరుల్‌ \nసర్వము నాకేసువే \nబంధువర్గం - మిత్రులు \nసంపూర్ణ భాగ్యమేసువే  ||సర్వ||\n\n3.దుఃఖములో – ఆదరణ \nచీకటిలో జ్యోతియు \nఅన్ని వ్యాధి బాధల్‌ మాన్పు  \nచెంతనుండు ఔషధం  ||సర్వ||\n\n4.బోధకుండు – సాధకుండు \nయేసుడు నా నాథుడే \nరాకపోకలందు నాకు తోడుగుండు మిత్రుడే ||సర్వ||\n\n5.అందము – సుగంధము\nఆస్థియు నా స్వాస్థ్యము \nవిమోచించి-హత్తుకొను \nప్రియ మధ్య వర్తియే ||సర్వ||\n\n6.జీవాహార మయ్యెను \nవాంఛలన్ని తీర్చును \nజ్ఞానము – నిరీక్షణయు \nఅంతులే నానందము  ||సర్వ||"},{"n":15,"ei":"Glorious things of thee","ci":"Are you downhearted?","ti":"యేసయ్య నామం - శక్తిగల నామం","es":"1.Glorious things of thee are spoken,\nZion, city of our God!\nHe, whose word cannot be broken,\nFormed thee for His own abode.\nOn the Rock of Ages founded,\nWhat can shake thy sure repose?\nWith salvation’s walls surounded,\nThou may’st smile at all thy foes.\n\n2.See the streams of living waters,\nSpringing from eternal love.\nWell supply thy sons and laughters,\nAnd all fear of want remove.\nWho can faint, while such a river\nEver flows their thirst to assuage?\nGrace, which like the Lord, the Giver, \nEver flows from age to age.\n\n3.Round each habitation hovering,\nSee the cloud and fire appear!\nFor a glory and a covering,\nShowing that the Lord is near.\nHe who gives them daily manna,\nHe who listens when they cry:\nLet Him hear the loud hosanna\nRising to His throne on high.\n\n4.Saviour, if of Zion’s city\nI through grace a member am,\nLet the world deride or pity,\nI will glory in Thy Name.\nFading is the worldling’s  pleasure,\nAll his boasted pomp and show;\nSolid joys and lasting treasure\nNone but Zion’s children know.","ec":"Are you  downhearted? No! no! no! (2)\nTroubles may come\nand troubles may go\nWe’ll trust in Jesus\nCome weal or woe\nAre you down hearted? No! No! No!","ts":"యేసయ్య నామం - శక్తిగల నామం\nసాటిలేని నామం - మధుర నామం\n\n1.పాపము పోవును - భయమును పోవును \nపరమ సంతోషము - భక్తులకీయును\n\n2.పరిమళ తైలము – యేసయ్య నామం \nభువిలో సువాసన - యిచ్చెడి నామం\n\n3.మోకాళ్ళన్నియు - వంచెడి నామం\nసూటిగా ఒకటిగా - ప్రకాశించె నామం\n\n4.దివిలో భువిలో - యేసయ్య నామం \nసైన్యాధిపతియగు – యేసయ్య నామం\n\n5.నిన్న నేడు - మారని నామం\nనమ్మిన వారిని - విడువని నామం\n\n6.సాతాను సేనను - జయించెడి నామం \nపాప పిశాచిని - తరిమెడి నామం\n\n7.మధురం మధురం - యేసయ్య నామం \nజీవము నిచ్చును – యేసయ్యనామం"},{"n":16,"ei":"God of all ages","ci":"As the deer pants for","ti":"స్తోత్రము చేసెదను రక్షకుని స్తోత్రము చేసెదను","es":"1.God of all Ages Thou art the same \nJesus the Saviour, is Thy Name\nThrough all of time, in every clime \nThy Name brings hope and joy sublime.\n\n2.Sing hosts of heaven, “Jesus reigns”, \nRing in the new Millennial strains\nTimeless as ever the Saviour lives \nLift high His Cross, What pow’r He gives!\n\n3.Oh what a Saviour is Jesus my Lord! \nTrue and faithful, unchangeable friend,\nHe sets sin-ridden hearts a flame \nMatchless in love, He’s ev’r the same.\n\n4.Fill with Thyself Lord Jesus Christ\nTo wrestle in pray’r for eternal souls,\nPleasing you ever doing Your will \nThrough paths unknown, You’ll lead us still.\n\n5.God of all Ages walk ahead \nIn Thy footsteps we’ll safely tread,\nShouting Thy triumph through all Earth’s storms, \n‘Neath us are Thine everlasting arms.","ec":"1.As the deer pants for the water,\nSo my soul longs after You.\nYou alone are my heart’s desire\nAnd I long to worship You.\n\nYou alone are my strength, my shield\nTo You alone may my spirit yield.\nYou alone are my heart’s desire\nAnd I long to worship you.\n\n2.I want You more than gold or silver\nOnly You can satisfy.\nYou alone are the real joy-giver,\nAnd the apple of my eye.\n\n3.You’re my Friend and\nYou are my Brother\nEven though You are a King.\nI love You more than any other\nSo much more than anything.","ts":" స్తోత్రము చేసెదను \nరక్షకుని స్తోత్రము చేసెదను(3)\nకరుణ గల ప్రభు ప్రేమస్వరూపుడు \nయూదాగోత్రపు సింహము నీవు \n\n1.కన్య మరియ సుతుడై\nపశువుల తొట్టిలో పరుండెను (3)\nపశువుల పాకలో బాలయేసుని \nస్తుతియించి పూజించి కీర్తించెదను ||స్తో||\n\n2.జ్ఞానులు వెదకిరి \nసర్వోన్నత జ్ఞానమూర్తిని (3)\nఆకాశవీధిని సింహాసనాసీనున్‌ \nప్రేమాస్వరూపిని ఆరాధించిరి ||స్తో|| \n\n3.పొత్తిగుడ్డలతోడ\nచుట్టబడినట్టి రక్షకుని (3)\nదూతలు ఆరాధించిరి \nగొల్లలు వచ్చిరి మహిమను చూచిరి\nఆరాధించిరి సంతోషించిరి ||స్తో||\n\n4.పాపుల కొరకై \nవచ్చిన పాపనాశకుడు (3)\nఇదిగో లోకపు పాపము మోసిన\nరక్షకుడైన దేవుని గొఱ్ఱెపిల్ల ||స్తో||"},{"n":17,"ei":"God of all power ,and truth","ci":"As we come with praise","ti":"లెక్కింపలేని స్తోత్రముల్‌ - దేవా ఎల్లప్పుడు","es":"1.God of all power, and truth, and grace,\nWhich shall from age to age endure,\nWhose Word, when heaven and earth shall pass,\nRemains and stands for ever sure.\n\n2.That I Thy mercy may proclaim,\nThat all mankind Thy truth may see,\nHallow Thy great and glorious Name,\nAnd perfect holiness in me.\n\n3.Purge me from every evil blot;\nMy idols all be cast aside;\nCleanse me from every sinful thought,\nFrom  all the filth of self and pride.\n\n4.Give me a new, a perfect heart,\nFrom doubt, and fear, and sorrow free;\nThe mind which was in Christ impart\nAnd let my spirit cleave to Thee.\n\n5.O that I now, from sin released,\nThy Word may to the utmost prove,\nEnter into the promised rest,\nThe Canaan of Thy perfect love!","ec":"1.As we come with praise before His majesty,\nWe will celebrate with joy and victory\nFor the Lord has come and set His people free,\nWe are marching on with Him,\nHe’s our deliverer.\n\n2.The two edged sword is sharpen’d in our hand\nWe come with vengeance to possess our land.\nWe bind the kings because of God’s right hand\nAnd carry out the sentence that our God has plann’d.","ts":"లెక్కింపలేని స్తోత్రముల్‌ - దేవా \nఎల్లప్పుడు నే పాడెదన్\nఇంతవరకు నా బ్రతుకులో - నీవు\nచేసిన మేళ్ళకై    (2) ||లె||\n\n1.ఆకాశ మహాకాశముల్‌ - దాని\nయందున్న సర్వంబును\nభూమిలో కనబడు వన్నీ - ప్రభువా\nనిన్నే కీర్తించును  ||లె||\n\n2. అడవిలో నివసించుచున్నవన్నీ -\nసుడిగాలియు మంచును\nభూమిపై నున్న వన్నీ - దేవా \nనిన్నే పొగడును  ||లె||\n\n3.నీటిలో నివసించు ప్రాణుల్‌ \n- ఈ భువిలోని జీవరాసులు \nఆకాశమున ఎగురున వన్నీ - \nప్రభువా నిన్నే కీర్తించున్‌  ||లె||"},{"n":18,"ei":"Great is thy Faithfulness","ci":"Be bold, be strong","ti":"హల్లెలూయ యేసు ప్రభున్‌ ఎల్లరు స్తుతియించుడి","es":"1.Great is Thy faithfulness,  O God my Father, \nThere is no shadow of turning with Thee;\nThou changest not, Thy  compassions, they fail not;\nAs Thou hast been Thou for ever wilt be.\n\nGreat is Thy faithfulness!\nGreat is Thy faithfulness!\nMorning by morning new mercies I see;\nAll I have needed Thy hand hath provided;\nGreat is Thy faithfulness, Lord, unto me!\n\n2.Summer and winter, and spring- time and harvest, \nSun, moon and stars in their courses above,\nJoin with all nature in manifold witness, \nTo Thy great faithfulness, mercy and love.\n\n3.Pardon for sin and a peace that endureth, \nThy own dear presence to cheer and to guide;\nStrength for today and bright hope for tomorrow, \nBlessings all mine, with ten thousand beside!","ec":"Be bold, be strong\nFor the Lord your God is with you. (2)\nI am not afraid,\nI am not dismayed;\nFor I’m walking in faith and victory.\nCome on and walk in faith and victory,\nFor the Lord, your God is with you.","ts":"1.హల్లెలూయ యేసు ప్రభున్‌ ఎల్లరు స్తుతియించుడి\nవల్లభుని చర్యలను తిలకించి స్తుతియించుడి\nబలమైన పనిచేయు బలవంతున్‌ స్తుతియించుడి \nఎల్లరిని స్వీకరించు యేసుని స్తుతియించుడి\n\nపః  రాజులరాజైన యేసురాజు భూజనుల నేలును\nహల్లెలూయ హల్లెలూయ దేవుని స్తుతియించుడి\n\n2.తంబురతోను వీణతోను ప్రభువును స్తుతియించుడి\nపాపమును రక్తముతో తుడిచెను స్తుతియించుడి\nబూరతోను తాళములన్ మ్రోగించి స్తుతియించుడి\nనిరంతరము మారని యేసుని స్తుతియించుడి\n\n3.సూర్యచంద్రులార ఇల  దేవుని స్తుతియించుడి\nహృదయమును వెలిగించిన యేసుని స్తుతియించుడి\nఅగ్నివడగండ్లార మీరు కర్తను స్తుతియించుడి\nహృదయమును ఛేదించిన నాధుని స్తుతియించుడి\n\n4.యువకులారా,పిల్లలారా దేవుని స్తుతియించుడి\nజీవితముల్‌ ప్రభుపనికై సమర్పించి స్తుతియించుడి\nపెద్దలారా ప్రభువులారా  యెహోవాను స్తుతియించుడి\nఆస్తులను యేసునికై  అర్పించి స్తుతియించుడి\n\n5.అగాధమైన జలములారా యెహోవాను స్తుతియించుడి\nఅలలవలె  సేవకులు లేచిరి స్తుతియించుడి\nదూతలారా భక్తులారా దేవుని స్తుతియించుడి\nపరమందు పరిశుద్ధులు ఎల్లరు స్తుతియించుడి"},{"n":19,"ei":"Holy ,  Holy , Holy!","ci":"Be still and know that","ti":"కృతజ్ఞతతో స్తుతింతు ఎల్లప్పుడు యేసుని","es":"1.Holy, Holy, Holy!, Lord God  Almighty!\nEarly in the morning our song shall rise to Thee;\nHoly, Holy, Holy! merciful and mighty,\nGod, in Three Persons, blessed Trinity!\n\n2.Holy, Holy, Holy! all the saints adore Thee,\nCasting down their golden crowns around the glassy sea;\nCherubim and seraphim falling down before Thee\nwho wert, and art, and evermore shalt be.\n\n3.Holy, Holy, Holy! though the darkness hide Thee,\nThough the eye of sinful man\nThy glory may not see;\nOnly Thou art holy, there is none beside Thee\nPerfect in power, in love, and purity.\n\n4.Holy, Holy, Holy! Lord God Almighty!\nall Thy works shall praise Thy Name, in earth, and sky and sea;\nHoly, Holy, Holy! merciful and mighty,\nGod in Three Persons, blessed Trinity!","ec":"Be still and know that I am God. (3)\nI am the Lord that healeth thee. (3)","ts":"కృతజ్ఞతతో స్తుతింతు ఎల్లప్పుడు\nయేసుని స్తుతియింతు\nశక్తిమంతుడు,శ్రేష్టుడును\nసత్యవంతుడునగు ప్రభు\n\n1.యెరికో గోడలు యెదురొచ్చినా \nమార్గదర్శి యేసు ప్రభువే\nభయపడకు, వెనుకాడకు\nస్తుతియించిన కూలును\n\n2.ఎఱ్ఱ సముద్రము దాట వచ్చినా,\nసిలువ నీడలో సాగిపో \nపాడెదము, స్తుతించెదము \nమార్గము తెరువబడును\n\n3.శరీరం, జీవం, ఆత్మయును \nఅలసిన సమయములో\nయెదస్తుతితో నిండినచో \nదివ్య బలమొందెదము"},{"n":20,"ei":"I stand amazed in the","ci":"Beautiful people with","ti":"యేసు నీ దివ్య పాదాలకు","es":"1.I stand amazed in the presence\nOf Jesus the Nazarene,\nAnd wonder how He could love me,\nA sinner, condemned, unclean.\n\nHow marvellous! How wonderful!\nAnd my song shall ever be:\nHow marvellous! How wonderful! \nIs my Saviour's love for me!\n\n2.For me it was in the garden\nHe prayed: \"Not my will, but Thine;\"\nHe had no tears for His own griefs,\nBut sweat-drops of blood for mine.\n\n3.He took my sins and my sorrows,\nHe made them His very own;\nHe bore the burden to Calvary,\nAnd suffered, and died alone.\n\n4.When with the ransomed in glory\nHis face I at last shall see,\n‘Twill be my joy through the ages \nTo sing of His love for me.","ec":"Beautiful people with beautiful feet,\nLined up and ready to go\nInto the world with the Gospel of Peace---\nLined up and ready to go!\n\n1.Lifting up banners of lands far and near,\ncovered with “banner of love.”\nMarching “in-step” with the heart beat of God,\nHovered by God’s Holy Dove.\n\n2.Into a war-ridden, dark, angry world,\nArmed with glad tidings of peace.\nLove motivated, they pray while they sow;\nPraise as God gives the increase!\n\n3.Loving their Lord more than life or themselves;\nLoving the people they tell\nColourful,passionate, sanctified honed;\nReady to rescue from hell.\n\n4.Called and commissioned to go in His name---\nName above all, Jesus Christ,\nServing their Captain, the Lord Jesus Christ---\nHearts racing fast for the world.\n\n5.Ready to go through whatever it takes,\nTakes to deliver God’s word.\nReady to go to the ends of the earth,","ts":"యేసు నీ దివ్య పాదాలకు \nశరణం శరణం శరణం  \nఆత్మనాథ పూజార్హుడవు \nశరణం శరణం శరణం\n\n1.దూతలు కొనియాడు పరిశుద్ధుడవు \nమహారాజువు మానాధుడవు\nభయమెల్ల పారద్రోలు సహాయుడవు\nశరణం శరణం శరణం ||యేసు||\n\n2.విశ్రాంతి నిచ్చు దేవుడవు\nమాకష్టంబుల్‌ బాపువాడవు \nపేదనైన నన్ను ఆదరించుము\nశరణం శరణం శరణం ||యేసు||\n\n3.కృంగిన నన్ను బలపర్చువాడవు \nబలమిచ్చి నడిపించువాడవు \nనా శరీరాత్మల నర్పింతును\nశరణం శరణం శరణం  ||యేసు||\n"},{"n":21,"ei":"I will sing of my redeemer","ci":"Beautiful, Beautiful Jesus","ti":"సుందర పరమదేవ కుమారుడైన","es":"1.I will sing of my Redeemer,\nAnd His wondrous love to me;\nOn the cruel cross He suffered,\nFrom the curse to set me free.\n\nSing, oh sing, of my Redeemer!\nWith His blood He purchased me!\nOn the cross He  sealed my pardon,\nPaid the debt, and made me free.]\n\n2.I will tell the wondrous story,\nHow, my lost estate to save,\nIn  His boundless love and mercy\nHe the ransom freely gave.\n\n3.I will praise my dear Redeemer\nHis triumphant power I’ll tell;\nHow the victory He giveth\nOver sin, and death, and hell.\n\n4.I will sing of my Redeemer,\nAnd His heavenly love to me;\nHe from death to life hath brought me.\nSon of God, with Him to be.","ec":"Beautiful, beautiful, Jesus is beautiful,\nAnd Jesus makes beautiful\nThings of my life.\nCleansing me, filling me,\nMaking me more like Him,\nAnd Jesus makes beautiful things of my life.","ts":"సుందర పరమదేవ కుమారుడైన యేసుక్రీస్తున్‌ స్తోత్రించి పొగడి నిత్యం కొనియాడెదం అందలం భువికి తెచ్చి ప్రాణమును ధారబోసెను ఆదరించి మమ్ములను ఐక్యపర్చెన్‌ ఆత్మను కుమ్మరించెన్‌ కృపలతో నాదరించెన్‌-స్తుతి   ||స్తు||\n\n1.పాపకూపమున పడి పాప శాపము నొందిన పాపులను రక్షింపను ప్రాణమిచ్చెను దేవుని కిష్టులైన ప్రజలుగ మార్చిన మెస్సయ్యాను విశ్వసించు భక్తులార నీతిపరుడైన న్యాయాధిపతి పాదముల చేరుడి, పశ్చాత్తాపమొందుడి జయోత్సవం చేయుడి\nస్తుతి చెప్పి పాడుడి-పాడుడియంచు ||స్తు||\n\n2.ఆకాశపు జ్యోతులన్ని లెక్కలేని దూతసైన్యం అద్భుతముగ క్రీస్తును ఆరాధించిరి మంటిలోని జాతులన్ని శ్రేష్టమైన వస్తువులన్ని శక్తిమంతుడని స్తుతి  పాడి పొగడిరి అందరికి తండ్రి యొకే పావన కుమారుని కీర్తించను పాదములు మ్రొక్కను నేకులు చేరను - స్తుతి గీతి పాడుడి - పాడుడి యంచు  ||స్తు||\n\n3.రాజులు జ్ఞానులు మేధావుల  యందరును కలసి కృపతో జీవించుచుండగాను ఏ ప్రాంతభక్తులైన విశ్వాసులందరును సమాధానంతో జీవించుచుండగా సద్బోధకులు సత్యసంఘములు లేచి జీవించిన సైతాన్‌ పారిపోవును జయం మనది యగును యని పాడి పాడుడి - పాడుడి యంచు ||స్తు||"},{"n":22,"ei":"I am pressing on","ci":"Because he lives","ti":"నీ పాదం మ్రొక్కెదన్‌ నిత్యము స్తుతించి","es":"1.I’m pressing on the upward way,\nNew heights I’m gaining ev’ry day;\nStill praying as I’m onward bound,\n“Lord, plant my feet on higher ground.”\n\nLord, lift me up, and let me stand,\nBy faith, on heaven’s tableland,\nA higher plane than I have found;\nLord, plant my feet on higher ground\n\n2.My heart has no desire to stay \nWhere doubts arise and fears dismay;\nTho’ some may dwell where these abound,\nMy prayer, my aim, is higher ground.\n\n3.I want to live above the world,\nTho’ Satan’s darts at me are hurled;\nFor faith has caught the joyful sound,\nThe song of saints on higher ground.\n\n4.I want to scale the utmost height, \nAnd catch a gleam of glory bright;\nBut still I’ll pray till heav’n I’ve found,\n“Lord, lead me on to higher ground.”","ec":"God sent His Son,\nThey called Him Jesus;\nHe came to love, heal, and forgive;\nHe lived and died to buy my pardon,\nAn empty grave is there\nTo prove my Saviour lives.\n\nBecause He lives I can face tomorrow;\nBecause He lives all fear is gone;\nBecause I know He holds the future,\nAnd life is worth the living\nJust because He lives.\n\nHow sweet to hold a new-born baby,\nAnd feel the pride and joy he gives;\nBut greater still the calm assurance,\nThis child can face uncertain days\nBecause He lives.\n\nBecause He lives I can face tomorrow;\nBecause He lives all fear is gone;\nBecause I know He holds the future,\nAnd life is worth the living\nJust because He lives.\n\nAnd then one day I'II cross the river;\nI'II fight life's final war with pain;\nAnd then as death gives way to victory,\nI'II see the lights of glory\nAnd I'II know He lives.\n\nBecause He lives I can face tomorrow;\nBecause He lives all fear is gone;\nBecause I know He holds the future,\nAnd life is worth the living\nJust because He lives.","ts":"నీ పాదం మ్రొక్కెదన్‌ నిత్యము స్తుతించి \nనిన్ను పాడి కీర్తించెదను యేసయ్యా\t\nనీ ప్రేమ పొంగుచున్నది యేసయ్యా (2)\n\n1.పరిశుద్ధమైన పరవశమే\nపరమ యేసుని కృపావరమే(2)\nవెదకి నన్ను కనుగొంటివి పాడుటకు పాట నిచ్చితివి(2)  ||నీ||\n\n2.మా హృదయ దీపము నీవు\nమాదు రక్షకా నా ప్రార్థన(2)\nప్రేమించెదన్‌ యేసు నాథా\nప్రేమ ముఖము దర్శించెదను(2)  ||నీ||\n\n3.పరిశుద్ధమైన కీర్తితోను ప్రకాశమైన శిఖరముపై (2)\nశ్రీఘ్రముగా చేర్చెదవు\nసీయోనులో నిన్ను కీర్తించెదన్‌(2)  ||నీ||"},{"n":23,"ei":"Immortal, invisible","ci":"Behold the Lamb!","ti":"కుతూహల మార్భాటమే నా యేసుని సన్నిధిలో","es":"1.Immortal, invisible, God only wise,\nIn light inaccessible hid from our eyes,\nMost blessed, most glorious, the Ancient of Days,\nAlmighty, victorious, Thy great Name we praise.\n\n2.Unresting, unhasting, and silent as light,\nNor wanting, nor wasting, Thou rulest in might;\nThy justice like mountains high soaring above,\nThy clouds which are fountains of goodness and love.\n\n3.To all life Thou givest, to both great and small;\nIn all life Thou livest, the true life of all;\nWe blossom and flourish as leaves on the tree,\nAnd wither and perish, but naught changeth Thee.\n\n4.Great Father of Glory, pure Father of Light,\nThine angels adore Thee, all veiling their sight;\nAll laud we would render, oh, help us to see\n‘Tis only the splendour of light hideth Thee.\n\n5.Immortal, invisible, God only  wise,\nIn light inaccessible hid from our eyes,\nMost blessed, most glorious, the Ancient of Days,\nAlmighty, victorious, Thy great Name we praise","ec":"Behold the Lamb!\nBehold the Lamb!\nSlain from the foundation of the world.\nFor sinners crucified,\nOh! Holy sacrifice!\nBehold the Lamb of God!\nBehold the Lamb!","ts":"కుతూహల మార్భాటమే\nనా యేసుని సన్నిధిలో ఆనందమానందమే\nనాయేసుని సన్నిధిలోన\n\n1. పాపమంత పోయెను - రోగమంతా\nతొలగెను-యేసుని రక్తములో\nక్రీస్తునందు జీవితం-కృపద్వారా రక్షణ\nపరిశుద్ధ ఆత్మలో  ||కుతూ||\n\n2.దేవాది దేవుడు ప్రతిరోజు\nనివసించె దేవాలయం నేను\nఆత్మలోన దేవుడు గుర్తించె నన్ను\nఅద్భుత మద్భుతమే  ||కుతూ||\n\n3.శక్తినిచ్చు యేసు జీవమిచ్చు యేసు\nజయంపై జయమిచ్చును\nఏకముగా కూడి హోసన్నా\nపాడి ఊరంతా చాటెదము ||కుతూ||\n\n4. బూరాధ్వనితో పరిశుద్ధులతో యేసు\nరానై యుండే ఒక్క క్షణములోనే\nరూపాంతరము పొంది మహిమలో ప్రవేశిద్దాం ||కుతూ||\n"},{"n":24,"ei":"Jesus lover of my soul","ci":"Behold what manner of","ti":"స్తుతించి పాడను పాత్రమైన పావన యేసుని నామమదే","es":"1.Jesus Lover of my soul,\nLet me to Thy bosom fly,\nWhile the nearer waters roll,\nWhile the tempest still is high:\nHide me, O my Saviour, hide,\nTill the storm of life be past,\nSafe into the haven guide,\nOh, receive my soul at last!\n\n2.Other refuge have I none,\nHangs my helpless soul on Thee;\nLeave, ah, leave me not alone,\nStill support and comfort me.\nAll my trust on Thee is stayed,\nAll my help from Thee I bring\nCover my defenceless head\nWith the shadow of Thy wing.\n\n3.Thou, O Christ, art all I want;\nMore than all in Thee I find:\nRaise the fallen, cheer the faint,\nHeal the sick, and lead the blind.\nJust and holy is Thy Name,\nI am all unrighteousness;\nVile, and full of sin I am,\nThou art full of truth and grace.\n\n4.Plenteous grace with Thee is found,\nGrace to pardon all my sin;\nLet the healing streams abound\nMake and keep me pure within.\nThou of life the fountain art;\nFreely let me take of Thee,\nSpring Thou up within my heart,\nRise to all eternity.","ec":"Behold what manner of love\nthe Father hath given unto us. (2)\nThat we should be called the sons of God. (2)","ts":"1.స్తుతించి పాడను పాత్రమైన\nపావన యేసుని నామమదే\nస్తుతుల మధ్యలోన వాసంచేయు\nపవిత్రుని భక్తితో స్తోత్రింతుము\n\nఆ..అద్భుతమే - ఆ...నడుపుదల\nఆనందమే పరమానందమే\nకృతజ్ఞ-స్తుతితో యెద పొంగుచుండె\nమనం హల్లెలూయా స్తుతి చాటెదము\n\n2.గతించినట్టి కాలమెల్లన్‌\nకంటి పాపగ మము కాపాడెన్‌\nప్రభువు నే నమ్మి జీవించగా\nకృపను చూపెన్‌ స్తోత్రింతుము\n\n3.అగ్ని మధ్యను నడచినను\nలోతైన జలమును దాటినను\nశోధనలు ఎన్నో పెరిగినను\nజయం మనదేయని స్తోత్రింతుము\n\n4.ఈ అరణ్య యాత్రలో\nమంచి యేసు మనతో నుండును\nమన రాకపోకలయందును\nకాచును గావున స్తోత్రింతుము"},{"n":25,"ei":"Jesus shall reign","ci":"Behold, behold","ti":"ఆనందం –ఆనందం దినదినం ఆనందం","es":"1.Jesus shall reign where’er the sun\nDoth his successive journeys run;\nHis kingdom stretch from shore to shore     \t\nTill moons shall wax and wane no more.\n\n2.For him shall endless prayer be made,\nAnd princes throng to crown His head:\nHis name like sweet perfume shall rise\nWith every morning sacrifice.\n\n3.People and realms of every tongue\nDwell on His love with sweetest song:\nAnd infant voices shall proclaim\nTheir early blessings on His Name.\n\n4.Blessings abound where’er He reigns;\nThe prisoner leaps to lose his chains,\nThe weary find eternal rest,\nAnd all the sons of want are blest.\n\n5.Let every creature rise and bring.\nPeculiar honours to our king:\nAngels descend with songs again,\nAnd earth repeat the loud Amen!","ec":"Behold, behold;\nI stand at the door and knock, knock, knock; (2)\nIf any girl hears my voice,\nIf any boy hears my voice,\nAnd will open, open, open the door,\nI will come in.","ts":"ఆనందం –ఆనందం\nదినదినం ఆనందం\nయేసురాజు నా స్వంతమాయెను\nఈలోకమందు నా బంధువాయనే \nనామదిలో స్వంతమాయెను (2)\n\nఆ...ఆనందమే-పరమానందమే\nఇది మహా గొప్ప భాగ్యమే   ||ఈ||\n\n1.చిన్న ప్రాయమునే - నన్నెరిగియుండెన్‌\nతప్పిపోయినన్‌ కనుగొనెను (2)\nతనదు ప్రాణము నాకర్పించి\nజీవం పొందుమని చెప్పెను\n\n2.ఏ స్థితిలోనైన ప్రభుప్రేమతో\nనన్ను విడువక కాపాడును\nతాను నమ్మి నాకు ఇచ్చిన పనిని\nప్రభు వచ్చువరకు-కాచుకొందును\n\n3.ప్రభు వచ్చు దినమున-తనచేయి చాచి \nప్రేమతో పిలిచి చేర్చుకొనును\nప్రభు సమూహమందు అచ్చటాయనతో\nఆడిపాడి సంతోషించెదన్‌\n \t \t\n\n"},{"n":26,"ei":"Jesus the Name high","ci":"Bind us together Lord","ti":"ఆయనే నా సంగీతము బలమైనకోటయును","es":"1.Jesus, the Name high over all,\nIn hell, or earth, or sky;\nAngels and men before it fall,\nAnd devils fear and fly.\n\n2.Jesus, the Name to sinners dear,\nThe Name to sinners given;\nIt scatters all their guilty fear, \nIt turns their hell to heaven.\n\n3.Jesus, the prisoner’s fetters breaks, \nAnd bruises Satan’s head;\nPower into strengthless souls it speaks,\nAnd life into the dead.\n\n4.Oh, that the world might taste and see\nThe riches of His grace!\nThe arms of love that compass me\nWould all mankind embrace.\n\n5.His only righteousness I show,\nHis saving truth proclaim:\n‘Tis all my business here below\nTo cry, “Behold the Lamb!”\n\n6.Happy, if with my latest breath \nI may but gasp His Name:\nPreach Him to all, and cry in death;\n“Behold, behold the Lamb!”","ec":"Bind us together, Lord\nBind us together with cords that cannot be broken.\nBind us together Lord, (2)\nBind us together with Love.\nThere is only one God,\nThere is only one King.\nThere is only one Body,\nThat’s why we sing.\nBind us...","ts":"ఆయనే నా సంగీతము\nబలమైనకోటయును జీవాధిపతియు ఆయనే\nజీవితకాలమంత స్తుతించెదను\n\n1. స్తుతుల మధ్యలోన వాసంచేసి \nదూతలెల్ల పొగడె దేవుడాయనే\nవేడుచుండు భక్తుల మొరలు విని\nదిక్కులేని పిల్లలకు దేవుడాయనే\n\n2. ఇద్దరు ముగ్గురు నా నామమున\nఏకీభవించిన వారి మధ్యలోన\nవుండెదననిన నా దేవుని\nకరములు చాచి నిత్యము స్తుతించెదను\n\n3.సృష్టికర్త క్రీస్తు యేసు నామమును\nజీవిత కాలమంత కీర్తించెదను\nరాకడలో ప్రభుతో నిత్యముందును\nమ్రొక్కెదను కీర్తింతును పొగడెదను"},{"n":27,"ei":"Jesus, the very thought","ci":"Blessed are the pure","ti":"ఆరాధింతున్‌ నేనారాధింతున్‌","es":"1.Jesus, the very thought of Thee\nWith sweetness fills my breast;\nBut sweeter far Thy face to see,\nAnd in Thy presence rest.\n\n2.Nor voice can sing, nor heart can frame,\nNor can the memory find\nA sweeter sound than Thy blest Name,\nO Saviour of mankind!\n\n3.Oh, hope of every contrite heart,\nOh, joy of all the meek;\nTo those who fall, how kind Thou art,\nHow good to those who seek!\n\n4.But what to those who find? Ah! this \nNor tongue nor pen can show;\nThe love of Jesus, what it is\nNone but His loved ones know.\n\n5.Jesus, our only joy be Thou,\nAs Thou our prize wilt be;\nJesus, be Thou our glory now,\nAnd through eternity.","ec":"Blessed are the pure in heart,\nFor they shall see God. (2)\n\n1.To see God, the Alpha and Omega.\nTo see God, Creator, life-sustainer.\nTo see God, To think that this is possibility.\n\n2.To see God, The everlasting father,\nTo see God, Whose love endures Forever.\nTo see God, how wonderful to think that this could be.\n\n3.To see God, the God who talked with Moses.\nTo see God, Whose mercies are so endless\nTo see God, what better incentive for purity\n\n4.To see God, The one I’ve loved and longed for.\nTo see God, the Father of my Saviour\nTo see God a dream come true at last His face I’ll see.","ts":"ఆరాధింతున్‌ నేనారాధింతున్‌\nనా ప్రభు యేసుని ఆరాధింతున్‌\n\n1.బలమైన దేవుని ఆరాధింతున్‌\nనిజమైన దేవుని ఆరాధింతున్‌  ||ఆరా||\n\n2.చూస్తున్న దేవుని ఆరాధింతున్‌\nకాపాడు దేవుని ఆరాధింతున్‌  ||ఆరా||\n\n3.పరిశుద్ధమనస్సుతో ఆరాధింతున్‌\nసాష్టాంగపడి నేనారాధింతున్‌  ||ఆరా||\n\n4.ఆత్మతో నేను ఆరాధింతున్‌\n సత్యముతో నేనారాధింతున్‌  ||ఆరా||\n\n5.దూతలతో నేనారాధింతున్‌\nస్తుతియాగములతో ఆరాధింతున్‌ ||ఆరా||\n\n\n"},{"n":28,"ei":"Jesus, where'er thy people","ci":"Blessed are they that hunger","ti":"మహిమ ప్రభు నీకే ఘనత ప్రభు నీకే","es":"1.Jesus, where’er Thy people meet,\nhere they behold Thy mercy-seat:\nWhere’er they seek Thee, Thou art found,\nAnd every place is hallowed ground.\n\n2.For Thou, within no walls confined.\nInhabitest the humble mind\nSuch ever bring Thee where they come,\nAnd going, take Thee to their home.\n\n3.Great Shepherd of Thy chosen few,\nThy former mercies here renew:\nHere to our waiting hearts proclaim\nThe sweetness of Thy saving Name.\n\n4.Here may we prove the power of prayer,\nTo strengthen faith, and sweeten care;\nTo teach our faint desires to rise,\nAnd bring all heaven before our eyes.\n\n5.Lord, we are few, but Thou art near,\nNor short Thine arm, nor deaf Thine ear;\nOh, rend the heavens, come quickly down, \nAnd make a thousand hearts Thine own!","ec":"Blessed are they that hunger,\nAnd thirst after righteousness.\nBlessed are they that hunger,\nFor they shall be filled.\nBe filled, Be filled,\nBe filled for He satisfies;\nBe filled, Be filled,\nBe filled with the Sun of Righteousness.\nBlessed are they...","ts":"మహిమ ప్రభు నీకే ఘనత ప్రభు నీకే\nస్తుతులు వందన స్తోత్రములు  పరిశుద్ధ ప్రభు నీకే\n\nఆరాధన, ఆరాధన నా ప్రియుడు యేసునికే నా ప్రియుడు దేవునికే\n\n1.అమూల్యమైన నీ రక్తముతో విడుదల నిచ్చితివి\nరాజులవలె యాజకులవలె నీకై పిలిచితివి  ||ఆరా||\n\n2.వెలుగుగ త్రోవన్‌ తోడైయుండి నడిపించు దైవమా\nప్రేమశక్తితో అగ్నితో వెలిగించు అభిషేక నాథుడా  ||ఆరా||\t\n\n3.ఏ వేళ వున్నట్టి రాబోవుచున్నట్టి మా గొప్పరాజువు\nనీ నామం హెచ్చున్‌ నీ రాజ్యం వచ్చున్ నీ చిత్తం నెరవేరును   ||ఆరా||\n\n"},{"n":29,"ei":"Joyful, joyful, we adore","ci":"Blessed be the Lord","ti":"జీవమైన యేసయ్య రమ్ము","es":"1.Joyful, joyful, we adore Thee, \nGod of glory, Lord of love;\nHearts unfold like flow’rs before thee, \nOpening to the sun above.\nMelt the clouds of sin and sadness; \nDrive the dark of doubt away;\nGiver of immortal gladness, \nFill us with the light of day!\n\n2.All Thy works with joy surround Thee, \nEarth and heav’n reflect Thy rays,\nStars and angels sing around Thee, \nCenter of unbroken praise.\nField and forest, vale and mountain, \nFlowery meadow, flashing sea,\nChanting bird and flowing fountain \nCall us to rejoice in Thee.\n\n3. Thou art giving and forgiving, \nEver blessing, ever blest,\nWell-spring of the joy of living, \nOcean depth of happy rest!\nThou our Father, Christ our Brother \nAll who live in love are Thine;\nTeach us how to love each other, \nLift us to the joy divine.\n\n4.Mortals join the mighty chorus \nWhich the morning stars began;\nFather love is reigning o’er us, \nBrother love binds man to man.\nEver singing, march we onward, \nVictors in the midst of strife;\nJoyful music leads us sunward \nIn the triumph song of life.","ec":"Blessed be the Lord,\na  mighty fortress\nBlessed be the Lord,\nMy sword and shield\nBlessed be the Lord,\nwho reigns victorious\nBlessed be, Blessed be,\nthe name of the Lord.\n\n1.Your power is like the raging sea,\nYour grace  brought it down  to me\nAnd now I walk in victory,\nBlessed be the name of the Lord.\n\n2.Your blood set the captive free,\nYour love is giving life to me\nAnd now I’m Yours eternally,\nBlessed be the name of the Lord.","ts":"1.జీవమైన యేసయ్య రమ్ము\nజీవమార్గమందు నడుపుము\nజీవ జల ఊటబుగ్గల\nజీవదాత నన్ను నడుపుమూ...\n\nయేసయ్యా గొప్ప దేవుడా\nయేసయ్యా పరిశుద్ధుడా యేసయ్యా మంచి దేవుడా\nయేసయ్యా శక్తి మంతుడా\nయేసు నీకు ఆరాధనా చెల్లింతుమూ నిరతమూ\n\n2.మేము పాపద్రోహులమయ్యా \nపాప ఆదాము జనులము\nపాపులబ్రోవ పాపముగనూ \nపరిహరింప సిలువ నొందితివా ||యే||\n\n3.పాపపు ప్రజల కోసము\nపారె నీ రక్తధారలు\nఅంత బాధ నొంది నీవు\nప్రేమగల ఆత్మనొసగితివా ||యే||\n\n4.వాగ్దాన జనులమయ్యా మేము\nమారని దేవుడ వీవు\nనీవు మాకు రక్షకుడవు\nనిన్ను మేము కొలుతుము సదా ||యే||\n"},{"n":30,"ei":"Lord, I am fondly","ci":"Blessed be the name","ti":"ప్రేమా - ప్రేమా ప్రేమా  ప్రియుడవు నీవే","es":"1.Lord, I am fondly, earnestly longing\nInto Thy holy likeness to grow;\nThirsting for more and deeper communion,\nYearning Thy love more fully to know.\n\nOpen the wells of grace and salvation,\nPour the rich streams deep into my heart;\nCleanse and refine my tho’t and affection,\nSeal me and make me pure as Thou art.\n\n2.Dead to the world would I be, O Father,\nDead unto sin, alive unto Thee;\nCrucify all the earthly within me,\nEmptied of sin and self may I be.\n\n3.I would be Thine, and serve Thee for ever,\nFilled with Thy Spirit, lost in Thy love;\nCome to my heart, Lord, come with anointing, \nShowers of grace send down from above.","ec":"1.Blessed be the Name of the Lord, (3)\nThe most high.\n\n2.Glory to the Name of the Lord, (3)\nThe most high.\n\nThe Name of the Lord is a strong tower,\nThe righteous run into it and they are saved. (twice)\n\n3.Holy is the name of the Lord, (3)\nThe most high.","ts":"ప్రేమా - ప్రేమా ప్రేమా  ప్రియుడవు నీవే ఆనందమానందమే\n\n1.నీ ప్రేమ రుచియించిననాడే నన్ను నేను మరచితినయ్యా\nనీ ప్రేమధికమయ్యా నా పై నీ ప్రేమధికమయ్యా  ||ప్రేమా||\n\n2.పరలోక ప్రశస్తరాజా ప్రేమతో నేతెంచినావా\nప్రేమ తెలియగలనా నీ ప్రేమ లోతు నెరుగగలనా ||ప్రేమా||\n\n3.ద్రోహినై ఎన్నాళ్ళో నిన్ను గాంచక తిరిగితినయ్యా\nప్రేమతో నా ప్రియుడా నన్ను కౌగలించితివే   ||ప్రేమా||\n\n4.ఇహలోక సకల మహిమ పువ్వులవలె వాడిపోవున్‌\nవాడదే అయ్యా నీ ప్రేమ వాడిపోదయ్యా    ||ప్రేమా||\n\n5.నీ ప్రేమ మాధుర్యమును వివరింప తరమౌనే నాకు\nఅతి సులభముగానే పరమున వివరించగలను  ||ప్రేమా||"},{"n":31,"ei":"Love Divine all loves","ci":"Blessing and honor","ti":"నా నోటన్‌ క్రొత్త పాట నా యేసు యుంచెను","es":"1.Love Divine all loves excelling,\nJoy of heaven, to earth come down!\nFix in us Thy humble dwelling,\nAll Thy faithful mercies crown.\nJesus, Thou art all compassion,\nPure, unbounded love Thou art;\nVisit us with Thy salvation,\nEnter every trembling heart.\n\n2.Breathe, oh, breathe Thy loving Spirit\nInto every troubled breast!\nLet us all in Thee inherit,\nLet us find Thy promised rest.\nTake away the love of sinning;\nAlpha and Omega be;\nEnd of faith, as its beginning,\nSet our hearts at liberty.\n\n3.Come, Almighty to deliver,\nLet us all Thy grace receive!\nSuddenly return, and never,\nNever more Thy temples leave,\nThee we would be always blessing,\nServe Thee as Thy hosts above,\nPray, and praise Thee without ceasing,\nGlory in Thy perfect love.\n\n4.Finish then Thy new creation,\nPure and spotless may we be;\nLet us see our whole salvation\nPerfectly restored in Thee!\nChanged from glory into glory,\nTill in heaven we take our place;\nTill we cast our crowns before Thee,\nLost in wonder, love, and praise.","ec":"Blessing and Honour, Glory and Power,\nBe unto the ‘Ancient of Days’\nFrom every nation all of creation\nBow before the ‘Ancient of Days’\nEvery tongue in Heaven and Earth\nShall declare Your glory\nEvery knee will bow at Your throne\nIn worshipYou’ll be exalted, O God\nAnd Your Kingdom will not pass away\nO ‘Ancient of Days’","ts":"నా నోటన్‌ క్రొత్త పాట నా యేసు యుంచెను\nఆనందించెదను ఆయననే పాడెదన్\nజీవిత కాలమంత - హల్లెలూయ\n\n1.పాపపు బురద నుండి – లేవనెత్తెను\nజీవ మార్గమున నన్ను – నిలువబెట్టెను\n\n2.వ్యాధి బాధలందు నన్ను – ఆదుకొనెను\nకష్టములన్ని తొలగించి- శుద్ధీకరించెను\n\n3.తల్లిదండ్రి బంధుమిత్రు-దూరమాయెనే\nనిందనుభరించి ఆయన  మహిమ చాటెదన్‌\n\n4.ఇహలోక శ్రమలు - నన్నేమి చేయును\nపరలోక జీవితమునే - వాంఛించెదను"},{"n":32,"ei":"Love Divine, so great","ci":"Bring a psalm to the Lord","ti":"ప్రభుపై భారమెల్ల మోపుమయా కలత చెందకుమా","es":"1.Love Divine, so great and wondrous,\nDeep and mighty, pure, sublime;\nComing from the heart of Jesus—\nJust the same through tests of time.\n\nHe the pearly gates will open, \nSo that I may enter in;\nFor He purchased my redemption,\nAnd forgave me all my sin.\n\n2.Like a dove when hunted, frightened,\nAs a wounded fawn was I;\nBroken-hearted, yet He healed me-\nHe will heed the sinner’s cry.\n\n3.Love Divine, so great and wondrous-\nAll my sins He then forgave,\nI will sing His praise for ever,\nFor His blood, His pow’r to save.\n\n4.In life’s eventide, at twilight,\nAt His door I’ll knock and wait;\nBy the precious love of Jesus,\nI shall enter heaven’s gate.","ec":"Bring a psalm to the Lord,\nFrom the Spirit and from His word.\nLift your voice and rejoice,\nFor our God is a mighty King,\nSo come and clap your hands,\nRaise a shout,\nas we stand before the Lord,\nFor the Lord is He,\nwho has the pow’r to free,\nWho by His mighty arm gives strength and victory; \nSo as we hail the King,\nthen let His praises ring,\nAnd bring a psalm of joy before the Lord.\t","ts":"ప్రభుపై భారమెల్ల మోపుమయా కలత చెందకుమా\nకాపాడు ప్రభుడొక్కడున్నాడయా \nకనుపాపలా కాచునూ\n\n1.నీతిమంతుడు పడిపోడయ్యా\nనిత్యము కాపాడి నడిపించును ||ప్రభు||\n\n2.నీడగ ఉండి కాపాడును\nఆశ్రయమిచ్చి ఆదుకొనును  ||ప్రభు||\n\n3.తల్లియు తండ్రియు విడిచిననూ\nకౌగిలిలో నన్ను దాచుకొనును  ||ప్రభు||\n\n4.మన పక్షమున ప్రభువుండగా\nకదలక మెదలక నేనుందును  ||ప్రభు||"},{"n":33,"ei":"Loved with everalasting","ci":"Built for you, O Lord","ti":"ఎవరు నన్ను చేయి విడిచినన్‌","es":"1.Loved with everlasting love,\nLed by grace that love to know,\nSpirit, breathing from above,\nThou hast taught me it is so.\nOh, this full and perfect peace!\nOh, this transport all divine!\nIn a love which cannot cease,\nI am His, and He is mine.\n\n2.Heaven above is softer blue,\nEarth around is sweeter green;\nSomething lives in every hue\nChristless eyes have never seen:\nBirds with gladder songs o’erflow,\nFlowers with deeper beauties shine\nSince I know, as now I know,\nI am His, and He is mine.\n\n3.Things that once were wild alarms\nCannot now disturb my rest;\nClosed in everlasting arms,\nPillowed on the loving breast:\nOh, to lie for ever here!\nDoubt and care and self resign,\nWhile He whispers in my ear—\nI am His, and He is mine.\n\n4.His for ever, only His;\nWho the Lord and me shall part?\nAh, with what a rest of bliss\nChrist can fill the loving heart!\nHeaven and earth may fade and flee:\nFirstborn light in gloom decline;\nBut, while God and I shall be,\nI am His, and He is mine.","ec":"Built for You, O Lord, my King\nFit me in everything;\nTo be Your dwelling place\nHumbly I plead for grace.\nThough made in Your likeness\nI have no real fitness;\nMake me a vessel meet\nLord, I fall at Your feet.\nCleans’d thro’ with Holy burnings\nThen borne on Angel wings;\nAt Thy holy footstool\nWhat a place for a fool!","ts":"ఎవరు నన్ను చేయి విడిచినన్‌\nయేసు చేయి విడువడు\nచేయి విడువడు నిన్ను చేయి విడువడు\n\n1.తల్లియాయెనే తండ్రియాయెనే\nలాలించును పాలించును  ||ఎవ||\n\n2.వేదన శ్రమలు ఉన్నప్పుడెల్ల\nవేడుకొందునే కాపాడునే  ||ఎవ||\n\n3.రక్తముతోడ కడిగివేశాడే\nరక్షణ సంతోషము నాకు ఇచ్చాడే  ||ఎవ||\n\n4.ఆత్మచేత అభిషేకించి \nవాక్యముచే నడుపుచున్నాడే  ||ఎవ||"},{"n":34,"ei":"Make me a captive, Lord","ci":"By His Word","ti":"ఎవని అతిక్రమము - మన్నింపబడెనో","es":"1.Make me a captive, Lord,\nAnd then I shall be free;\nForce me to render up my sword,\nAnd I shall conq’ror be.\nI sink in life’s alarms\nWhen by myself I stand;\nImprison me within Thine arms,\nAnd strong shall be my hand.\n\n2.My heart is weak and poor\nUntil it Master find:\nIt has no spring of action sure,\nIt varies with the wind:\nIt cannot freely move\nTill Thou hast wrought its chain,\nEnslave it with Thy matchless love,\nAnd deathless it shall reign.\n\n3.My power is faint and low\nTill I have learned to serve:\nIt wants the needed fire to glow,\nIt wants the breeze to nerve;\nIt cannot drive the world\nUntil itself be driven;\nIts flag can only be unfurled\nWhen Thou shalt breathe from Heaven.\n\n4.My will is not my own\nTill Thou hast made it Thine;\nIf it would reach the monarch’s throne\nIt must its crown resign:\nIt only stands unbent\nAmid the clashing strife\nWhen on Thy bosom it has leant,\nAnd found in Thee its life.","ec":"By His Word\nI have no fear in me;\nBy His Word, death cannot swallow me;\nBy His Word, I have prosperity,\nBy His Word, sickness can’t dwell in me,\nBy His Word, I walk in victory;\nBy His Word, I’ve been set free.","ts":"ఎవని అతిక్రమము - మన్నింపబడెనో\nపాప పరిహార మెవడొందేనో\nవాడే ధన్యుండు\n\n1.యెహోవాచే నిర్దోషిగా - తీర్చబడియు\nఆత్మ - లో కపటములేని వాడే ధన్యుండు ||ఎవని||\n\n2.మౌనియైయుండ దినమెల్ల \nనే చేసినట్టి ఆర్త - ధ్వనిచే నా యెముకలు - క్షీణించెను    ||ఎవని||\n\n3.దివారాత్రులు నీ చెయ్\nనాపై బరువైయుండ నా సారము\nవేసవిలో ఎండినట్లాయె   ||ఎవని||\n\n4.నేను నా దోషమును – కప్పుకొనక\nనీ యెదుట నా పాపము\nనొప్పుకొంటిని   ||ఎవని||\n\n5.నీ సన్నిధి నా యతిక్రమము \nనొప్పు కొనగా నీవు నా\nదోషమును మన్నించితివిగా  ||ఎవని||\n\n6.కావున నీ దర్శన- కాలమందు\nభక్తి గలవారందరు నిన్ను ప్రార్థింతురు  ||ఎవని||\n\n7.విస్తారము జలప్రవాహము పొర్లినను\nనిశ్చయముగా నవి వారి మీదికి రావు ||ఎవని|| "},{"n":35,"ei":"Marvelous grace of our","ci":"By your side I would stay","ti":"యేసుని కుటుంబమొకటున్నది","es":"1.Marvellous grace of our loving Lord,\nGrace that exceeds our sin and our guilt,\nYonder on Calvary’s mount outpoured,\nThere where the blood of the Lamb was spilt.\n\nGrace, grace, God’s grace,\nGrace that will pardon and cleanse within;\nGrace, grace, God’s grace,\nGrace that is greater than all our sin.\n\n2.Sin and despair like the sea waves cold, \nThreaten the soul with infinite loss\nGrace that is greater, yes, grace untold, \nPoints to the Refuge, the mighty Cross.\n\n3.Dark is the stain that we cannot hide,\nWhat can avail to wash it away?\nLook! there is flowing a crimson tide;\nWhiter than snow you may be today.\n\n4.Marvellous, infinite, matchless grace, \nFreely bestowed on all who believe;\nYou that are longing to see His face, \nWill you this moment His grace receive?","ec":"By Your side I would stay;\nIn Your arms I would lay.\nJesus, Lover of my soul,\nNothing from You I withhold.\nLord, I love You, and adore You;\nWhat more can I say?\nYou cause my love to grow stronger\nWith every passing day.","ts":"యేసుని కుటుంబమొకటున్నది \nప్రేమతో నిండిన   స్థలమొకటున్నది\nరాజాధిరాజైన యేసు నిరంతరం పాలించును  (2)\n\n1.హెచ్చు తగ్గుల్‌ అక్కడసలె లేవు\nపేద గొప్ప బేధములే లేవు   ||రా||\n\n2.పాపం లేదు అక్కడ, శాపం లేదు\nవ్యాధిలేదు, ఆకలసలే లేదు  ||రా||\n\n3.సంతోషము, సమాధానముంది\nవిజయముంది, స్తుతి గీతముంది   ||రా||"},{"n":36,"ei":"Meekness and majesty","ci":"Cause me to too me","ti":"దాసులార ధరణిని యేసుకు","es":"1.Meekness and majesty\nManhood and Deity,\nIn perfect harmony,\nThe man who is God.\nLord of eternity\nDwells in humanity,\nKneels in humility\nAnd washes our feet.\n\nO what a mystery\nMeekness and majesty,\nBow down and worship\nFor this is your God.\n\n2.Father’s pure radiance,\nPerfect in innocence,\nYet learns obedience\nTo death on a cross.\nSuffering to give us life,\nConquering through sacrifice,\nAnd as they crucify\nPrays: “Father forgive.”\n\n3.Wisdom unsearchable\nGod the invisible\nLove indestructible\nIn frailty appears\nLord of Infinity\nStooping so tenderly\nLifts our humanity\nTo the heights of His throne.","ec":"1.Cause me to come to Thy river O  Lord. (3)\n\nCause me to come,\nCause me to drink,\nCause me to live.\n\n2.Cause me to come to Thy banqueting hall,\nCause me to come to Thy table O Lord\nCause me to come to Thy presence O Lord\n\nCause me to come,\nCause me to dine,\nCause me to live.","ts":"దాసులార ధరణిని యేసుకు ప్రేమతో స్వంతము చేసెదం ప్రేమతోయేసుని చాటెదం\nప్రభుని చూపింతుం చీకటి పోగొట్టి వెల్గు ప్రకాశింప\n\n1.ప్రయాసపడి భారము మోయువారిని \nఅతి ప్రేమతో ఆహ్వానింతుము \nపాప భారమెల్ల ప్రభువు మనో\nదుఃఖముల సర్వాధికారముతో\nమోసి తీర్చెను    ||దాసు||\n\n2.ఆకలి వ్యాధులు గలవారికి ప్రేమతో సాయము జేసెదం\n ఉచితముగ మేళ్లతో నిండి\nతనను తానే మరచి యేసు ఓర్పుతో తిరిగెన్‌   ||దాసు||\n\n3.ఇరుకులు ఇబ్బందులు \nగలవారిని నీచులన్‌ ఘనులుగ \nమార్చెదం సహించలేని కష్టములలో \nనిష్ఠూరములలో అగాధ\nగోతిలో పడినవారిని||దాసు||\n\n4.హిందూదేశ స్త్రీ పురుషులను\nవింత వెలుగునకు మార్చెదం \nసుందర సుగుణ శీలుఁడై అధిక జ్ఞానుండై\nబంధంబుల్‌ దెంచి  ప్రవర్థమానుండై  ||దాసు||\n\n5.మార్గము తప్పి నడుచువారిని\nసత్య మార్గములో చేర్చెదం\nపట్టుతో ప్రార్థన చేతుము\nఆరాధింతుము సేవను\nజేతుము  జయమొందెదం   ||దాసు||"},{"n":37,"ei":"More about Jesus","ci":"Cheer up for I have","ti":"ఉన్నత దేవుని – చాటున నివసించువాడే","es":"1.More about Jesus would I know,\nMore of His grace to others show;\nMore of His saving, fulness see,\nMore of His love who died for me.\n\nMore, more about Jesus,\nMore, more about Jesus;\nMore of His saving fulness see,\nMore of His love who
