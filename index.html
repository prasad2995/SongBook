ఆపద లన్నిటి బాపితివయ్య సర్వకాలముల యందున నీకె  చక్కగ సంస్తుతులగు నీకె\n||మా|| \n\n3 సింహపు పిల్లలు ఆకలి గొనిన సింహపు బోనులో నను వేసినను సిగ్గు కలుగకుండగ నను నీవు కాపాడుచున్నా వీ యిలలో\n ||మా|| \n\n4 మరణ లోయ లందున నే నున్న తరుణములు నాకు విరోధమైన చరణముల్‌ పాడెడు విధమున నీవు నన్నొనర్చు చున్నావుగా     \n||మా||\n\n5 వ్యాధులు నన్ను బాధించినను వ్యాకులములు హృదయములో నున్న వదలవు నన్నిల అనాథునిగ నెప్పుడు నన్ను బ్రోచుచు నుందువుగా \n||మా|| \n\n6 నీదు సత్య మాకాశము కంటె అత్యున్నతముగ స్థాపింపబడె నీదు సత్యమును నీచుడనగు నా కనులకు ప్రత్యక్ష పరచితివి     \n||మా|| \n\n7 పర్వతములు తొలగిన గాని పలువిధ కొండలు తత్తరిల్లినను పావనుడా నీ వెలలేని యట్టి కృప నను విడువదు-హల్లెలూయా \n||మా|| "},{"n":123,"ei":"A Christian band","ci":"I ll tell the world that I'm","ti":"జీవితమంత నీ ప్రేమగానం ప్రణుతింతుము యేసుదేవా ","es":"1.A Christian band... from far and near...\nWe meet to learn... of Jesus here;...\nTo read His Word,... whose ev’ry line...\nIs filled with hope...  and joy divine...\n\nMay our Endeavour Band,\nNow gathered in His name,\nUnited heart and hand,\nGo forth to spread His fame!\nThen firmly let us stand,\nFor God and native land,\nAnd pray that He may bless\nAnd keep our Christian band.\n\n2.We gather here,... where all may sing...\nGlad songs of praise... to Christ our King;...\nWhere youthful hearts... may \tfind the way...\nThat leads to life... and endless day...\n\n3.The Master’s work... we’ll still pursue,...\nAnd here again... our pledge \trenew,...\nTo follow Him;... to trust His love,...\nTill gathered home... with Him above...","ec":"1.I’ll tell the world that I’m a Christian\nI’m not ashamed His name to bear;\nI’ll tell the world that I’m a Christian-\nI’ll take Him with me anywhere.\nI’ll tell the world how Jesus saved me\nAnd how He gave me a life brand new,\nAnd I know that if you trust Him\nThat all He gave me He’ll give to you.\nI’ll tell the world that He’s my Saviour\nNo other one could love me so;\nMy life, my all is His forever\nAnd where He leads me I will go.\n\n2.I’ll tell the world that He is coming\nIt may be near or far away;\nBut we must live as if His coming\nWould be tomorrow or today,\nFor when He comes and life is over,\nFor those who love Him there’s more to be,\nEyes have never seen the wonders,\nThat He’s preparing for you and me,\nO tell the world that you’re a Christian,\nBe not ashamed His name to bear;\nO tell the world that you’re a Christian,\nAnd take Him with you ev’rywhere.","ts":"జీవితమంత నీ ప్రేమగానం ప్రణుతింతుము యేసుదేవా ప్రచురింతు మేము నీ కీర్తిన్‌ ఆనంద గానంబుతో  ||జీవిత||\n\n1.సర్వ సమయములలో నీ స్తుతిగానం ఎల్ల వేళలయందు నీ నామ ధ్యానం మాదియే మేలు ఈ జీవితమున స్తుతియింతు నా రక్షకా\n\n2.సృష్టినంతటిని నీ మాటచేత సృజియించితివిగా మా దేవదేవా  నీ ఘనమగు మహిమన్‌ వర్ణింపతరమా స్తుతియింతు నా రక్షకా\n\n3.కలుషాత్ములమైన మా కొరకు నీ విలువైన ప్రాణంబు నర్పించితివిగా కల్వరిగిరిపై చూపిన ప్రేమన్‌ స్తుతియింతు నా రక్షకా\t\n\n4.పరిశుద్ధమైన నీ సన్నిధిలో శాశ్వతమైన నీ రాజ్యంబులో ప్రేమతో నన్ను చేర్చుకొంటివిగా స్తుతియింతు నా రక్షకా "},{"n":124,"ei":"Oh, spread the tidings","ci":"I m gonna set my mind","ti":"దేవుని యందు - నీరీక్షణ నుంచి","es":"1.Oh, spread the tidings round, wherever man is found,\nWherever human hearts and human woes abound;\nLet ev’ry Christian tongue proclaim the joyful sound:\nThe Comforter has come!\n\nThe Comforter has come, the Comforter has come!\nThe Holy Ghost from heav’n,the Father’s promise giv’n;\nOh, spread the tidings round,wherever man is found:\nThe Comforter has come!\n\n2.The long, long night is past,the morning breaks at last;\nAnd hush’d the dreadful wail and fury of the blast,\nAs o’er the golden hills the day advances  fast:\nThe Comforter has come!\n\n3.The mighty King of kings,with healing in His wings,\nTo ev’ry captive soul a full deliv’rance brings;\nAnd thro’ the vacant cells the song of triumph rings:\nThe Comforter has come!\n\n4.Oh, boundless love Divine! how shall this tongue of mine\nTo wondering mortals tell the matchless grace Divine--\nThat I may with Him dwell,and in His image shine!--\nThe Comforter has come!\n\n5.Oh, let the echoes fly above the vaulted sky,\nAnd all the saints above to all below reply\nIn strains of endless love,the song that  ne’er will die:\nThe Comforter has come!","ec":"I’m gonna set my mind on things above\nSet my mind on Your great love\nI’m gonna think about\nThe things You told me to\nLord I’m gonna set my mind on You.\nThings that are good, honest and true\nAll of the wonderful deeds You do\nThings that are right and pure in Your sight\nWith all of my might\nI’m gonna set My mind on You.","ts":"దేవుని యందు - నిరీక్షణ నుంచి ఆయనను స్తుతించు నాప్రాణమా!\t\n\n1.ఏ అపాయము - రాకుండ నిన్ను\nదివారాత్రులు – కాపాడువాడు\nప్రతిక్షణం - నీ పక్షముండు రక్షకుడు   ||దేవుని||\n\n2.చీకటిని - వెలుగుగ చేసి\nఆయన నీ - ముందు పోవువాడు\nసత్యమగు జీవమగు మార్గము యేసే   ||దేవుని||\n\n3.నీకు సహాయముచేయువాడు\nసదా ఆదుకొను -వాడు ఆయనే\nఆధారము – ఆదరణ ఆయనలో   ||దేవుని||\n\n4.తల్లితన బిడ్డను - మరచినను\nమరువడు నీ - దేవుడు నిన్ను\nతల్లికన్న – తండ్రికన్న ఉత్తముడు   ||దేవుని||\n\n5.నీకు విరోధముగా - రూపించిన\nఏవిధ ఆయుధమును - వర్ధిల్లదు \nశత్రువులు మిత్రులుగ మారుదురు   ||దేవుని||\n\n6.పర్వతములు తొలగి - పోయినను \nతన కృప నిన్ను - ఎన్నడు వీడదు \nకనికర సంపన్నుడు నీ దేవుడు   ||దేవుని||\n\n7.స్తుతి మహిమలు - నీకే ప్రభు\nనిత్యము నిన్నే కొనియాడెద\nహల్లెలూయ – హల్లెలూయ హల్లెలూయ   ||దేవుని||"},{"n":125,"ei":"Tis the grandest theme","ci":"I m on the rock, Halleluiah","ti":"పరిశుద్ధ పరిశుద్ధ పరిశుద్ధ ప్రభువా","es":"1.’Tis the grandest theme thro’ the ages rung,\n’Tis the grandest theme for a mortal tongue,\n’Tis the grandest theme that the world e’er sung,\n“Our God is able to deliver thee!”\n\nHe is able to deliver thee\nHe is able to deliver thee\t\nTho’ by sin opprest,\nGo to Him for rest:\n “Our God is able to deliver thee!”\n\n2.‘Tis the grandest theme heard on earth or main,\n‘Tis the grandest theme for a mortal strain,\n‘Tis the grandest theme, tell it out again,\n“Our God is able to deliver thee!”\n\n3.’Tis the grandest theme, let the tidings roll\nTo the guilty heart, to the  weary soul;\nLook to God in faith, He will make thee whole:\n“Our God is able to deliver thee!”","ec":"I’m on the rock, Hallelujah,\nI’m on the rock to stay ! Hallelujah!\nFor He lifted me from the miry clay\nI’m on the rock to stay!\nI’m in the fold, Hallelujah!\nI’m in the fold to stay, Hallelujah!\nFor He brought me back from the path astray\nI’m in the fold to stay.","ts":"పరిశుద్ధ పరిశుద్ధ పరిశుద్ధ ప్రభువా\nవరదూతలైన నిన్‌ - వర్ణింపగలరా\n\n1.పరిశుద్ధ జనకుడ - పరమాత్మ రూపుడ  నిరుపమ బల బుద్ధి - నీతి ప్రభావా\t\t\n\n2.పరిశుద్ధ తనయుడ నరరూపధారుడ నరులను రక్షించు - కరుణ సముద్రా\t\n \n3.పరిశుద్ధమగు నాత్మ-వరము లిడు నాత్మ పరమానంద ప్రేమ - భక్తుల కిడుమా\t\n\n4.జనక కుమారాత్మ - లను నేక దేవా ఘన మహిమ చెల్లును – దనర నిత్యముగా"},{"n":126,"ei":"There is a Redeemer","ci":"I m satisfied with just a","ti":"చూచుచున్నాము నీవైపు \nమా ప్రియ జనక ","es":"1.There is a Redeemer, Jesus, God’s own Son,\nPrecious Lamb of God, Messiah, Holy One.\n\nThank You, O my Father,or giving us Your Son,\nAnd leaving Your Spirit till the work on earth is done.\n\n2.Jesus my Redeemer, Name above all names,\nPrecious Lamb of God, Messiah, O for sinners slain.\n\n3.When I stand in glory I will see His face.\nAnd there I’ll serve my King for ever in that Holy place.","ec":"I’m satisfied with just a cottage below,\nA little silver and a little gold:\nBut in that city where the\nransomed will shine,\nI want a gold one that’s silver-lined.\nI’ve got a mansion just over the hill top,\nIn that bright land where\nwe’ll never grow old;\nAnd some day yonder\nwe’ll never more wander\nBut walk the streets that\nare purest gold.","ts":"చూచుచున్నాము నీవైపు మా ప్రియ జనక చూచుచున్నాము నీవైపు\nచూచుచు నీ ప్రేమ - సొంపు సువార్తను జాచుచు గరములు - చక్కగా నీవైపు\n\n1.మే మరులమై యుంటిమి మార్గము వీడి మేమందరము పోతిమి ప్రేమచేనప్పుడు ప్రియతనయు నంపించి క్షేమమార్గము మాకు బ్రేమను జూపితివి  ||చూచు||\n\n2.నిను నమ్ము పాపులకు వారెవరైన నీ శరణుజొచ్చు వారలకు ఇనుడపు కేడెంబు నీ జగతిలో నగుచు గనుపరచుచుందువు ఘనమైన నీ కృప  ||చూచు||\n\n3.నీ భయము మాయెదలను నిలుపుము నీదు ప్రాభవ మొనరంగను నీ భయముచే మేము వైభవ మొందుచు నే భయము లేకుండ నీ భువిని గొన్నాళ్ళు  ||చూచు||\n\n4.దయజూచి మము నెప్పుడు మంచివి యన్ని – దయచేయు మెల్లప్పుడు దయచేయరానివి దయచేయుమని కోరదయజూపి మన్నించు దయగల మా తండ్రి  ||చూచు||"},{"n":127,"ei":"There were ninety and nine","ci":"I ve been redeemed","ti":"యేసు నీ నామామృతము మా- కేంతో రుచియయ్య","es":"1.There were ninety and nine that safely lay\nIn the shelter of the fold;\nBut one was out on the hills away,\nFar off from the gates of gold\nAway on the mountains wild and bare,\nAway from the tender Shepherd’s care.\n\n2.“Lord, Thou hast here Thy ninety and nine,\nAre they not enough for Thee?”\nBut the Shepherd made answer, “This of mine\nHas wandered away from Me;\nAnd although the road be rough and steep\nI go to the desert to find My sheep.”\n\n3.But none of the ransomed ever knew\nHow deep were the waters crossed,\nNor how dark was the night that the Lord passed through\nEre He found His sheep that was lost.\nOut in the desert He heard its cry,\nSick, and helpless, and ready to die.\n\n4.Lord, whence are those\nblood-drops all the way,\nThat mark out the mountain’s track?\n“They were shed for one who had gone astray\nEre the Shepherd could bring him back.”\n“Lord, whence are Thy hands so rent and torn?”\n“They are pierced tonight by many a thorn.”\n\n5.But all through the mountains, thunder-riven,\nAnd up from the rocky steep\nThere arose a cry to the gate of heaven,\n“Rejoice! I have found My sheep!”\nAnd the  angels echoed around the throne:\n“Rejoice, for the  Lord brings back His own!”","ec":"I’ve been redeemed\nby the Blood of the Lamb (3)\nSaved and sanctified I am,\nAll my sins are washed away\nI’ve been redeemed.","ts":"యేసు నీ నామామృతము మా-కెంతో రుచియయ్యా - దేవ మా దోసములను హరించి మోక్షని-వాసులుగ జేయుటకు భాసుర ప్రకాశమైన\t\n \n1.వేడు కలరగ గూడి నిను గొని యాడు వారికి - దేవ-యెంతో కీడు జేసినపాడు వైరిని- గోడుగోడనంగ వాని  తాడనము జేసితివి\n \n2.పాపములు హరింప నీవే ప్రాపుమాకయ్యా-దేవ- నీ- దాపు జేరిన  వారికందరి-కాపదలు బాపి నిత్య-కాపుగతి జూపినావు\n \n3.అక్షయ కరుణేక్ష భువన-రక్షకా  నీవే-దేవ -మమ్ము పక్షముగ రక్షించి మోక్షసు- రక్షణకు దీక్షగొని వీక్షితులమైన మాకు\n\n4.అందమగు నీ మందిరమున బొందుగా మేము- దేవ-నీ సుందర-కరుణామృతము మా-డెందములయందుగ్రోలు టందుకు సుందరమైన"},{"n":128,"ei":"There will never be","ci":"I ve gotta be like a tree","ti":"హల్లెలూయ - స్తుతి మహిమా","es":"1.There will never be a sweeter story,\nStory of the Saviour’s love divine,\nLove that brought Him from the realms of glory\nJust to save a sinful soul like mine.\n\nIsn’t the love of Jesus something wonderful,\nwonderful, wonderful,\nO, isn’t the love of Jesus something wonderful,\nWonderful it is to me.\n\n2.Boundless as the universe around me,\nReaching to the farthest soul away,\nSaving, keeping love it was that found me,\nThat is why my heart can truly say:\n\n3.Love beyond all human comprehending,\nLove of God in Christ how can it be,\nThis will be my theme and never ending,\nGreat redeeming love of Calvary.","ec":"1.I’ve gotta be like a tree planted by the water\nTrusting in the Father to keep me strong\nI’ve gotta be like a tree planted by the water\nTrusting in the name of the Lord.\nI’ve gotta be like a tree planted by the water\nTrusting in the Father to help me grow\nI’ve gotta be like a tree planted by the water\nTrusting in the name of the Lord.\n\nThe deeper the roots go, the better the fruits grow\nThe blessings bloom out for all to see\nThe deeper the roots go, the more my life shows\nThat Jesus is the Lord of me.\n(Repeat chorus and verse)\n\n2.I’ve gotta be like a tree planted by the water\nTrusting in the Father to keep me strong\nI’ve gotta be like a tree planted by the water\nTrusting in the name of the Lord.\nTrusting in the name of the Lord.\nTrusting in the name of the Lord.\nTrusting in the name of the Lord.","ts":"హల్లెలూయ- స్తుతి మహిమ ఎల్లప్పుడు - దేవుని స్తుతించెదము\t\nఆ... హల్లెలూయ హల్లెలూయ హల్లెలూయ\n\n1.అల సైన్యములకు - అధిపతియైనఆ దేవుని స్తుతించెదము అలసాంద్రములను - దాటించిన ఆ యెహోవాను స్తుతించెదము\n\n2.ఆకాశమునుండి - మన్నాను పంపిన దేవుని స్తుతించెదము బండ నుండి మధుర జలమును పంపిన ఆ యెహోవాను స్తుతించెదము\n\n3.పరలోకమునుండి - ధరకేతెంచిన దేవుని స్తుతించెదము నశియించిన దానిని -వెదకి రక్షించిన ఆ యేసుని - స్తుతించెదము\n"},{"n":129,"ei":"Come, every soul by sin","ci":"I ve take my harp down","ti":"త్రాహిమాం క్రీస్తు నాథా\nదయఁజూడ రావే ","es":"1. Come, every soul by sin oppressed,\nThere’s mercy with the Lord;\nAnd He will surely give you rest\nBy trusting in His Word.\n\nOnly trust Him,Only trust Him,\nOnly trust Him now,\nHe will save you,He will save you !\nHe will save you now!\n\n2.For Jesus shed His precious blood,\nRich blessings to bestow;\nPlunge now into the crimson flood\nThat washes white as snow.\n\n3.Yes, Jesus is the truth, the way\nThat leads you into rest;\nBelieve in Him without delay,\nAnd you are fully blest.\n\n4.Come then, and join this holy band,\nAnd on to glory go,\nTo dwell in that celestial land\nWhere joys immortal flow.","ec":"I’ve taken my harp down, from the willow tree\nMy heart is singing the victory\nMy past is forgiven, my home is in Heaven,\nAll sorrow is gone, the glory has come\nAnd now I am free.\n\nThy loving-kindness is better than life (2)\nMy lips shall praise Thee\nThus will I bless Thee\nThy loving-kindness is better than life.","ts":"త్రాహిమాం క్రీస్తు నాథా దయజూడ రావే – నేను \nదేహీయనుచు నీ పాదములే దిక్కుగా జేరితిని పుడు\n\n1.గవ్వ చేయరాని చెడ్డ కర్మేంద్రియాధీనుడనై రవ్వపాలైనేనెంతో నెవ్వబొందితిఁత్రవ్వుచున్న కొలది పెరుగు దరగదు నా పాప రాశి యివ్విధమున జెడిపోతినినే నేమి సేతు నోహో హోహో\n||త్రాహి||\n\n2.నీ యందు భయభక్తులు లేని - నిర్లజ్జాచిత్తముఁబూని చేయరాని దుష్కర్మముల - చేసినాడను దయ్యాలరాజు చేతిలో జేయివేసి వాని పనులఁజేయసాగినే  నిబ్బంగి –జెడిపోయితినే నయ్యయ్యయ్యొ\n||త్రాహి|| \n3.నిబ్బర మొక్కించుకైన నిజము రవ్వంతైన లేక దబ్బర లాడుటకు ము-త్తాత నైతిని అబ్బురమైన ఘోర పా - పాంధకార కూపమందు దబ్బున బడిపోతినయ్యో దారి చెడి నేనబ్బబ్బబ్బా\t   \n||త్రాహి||\n\n4.నిన్నుఁజేరి సాటిలేని నిత్యానంద మందఁబోవు చున్నప్పుడు నిందలు నా -కెన్ని చేరినా  విన్నదము లేకుండ నీవే నా మదికి ధైర్యమిచ్చియన్నిట రక్షించితివి నా  యన్న నీకు స్తోత్రమహహా     \n||త్రాహి|||"},{"n":130,"ei":"Come with thy sins","ci":"If any man come after me","ti":"యేసయ్యా యేసయ్యా యేసయ్యా యేసయ్యా నిన్నే \n","es":"1.Come with thy sins to the fountain,\nCome with thy burden of grief;\nBury them deep in its waters—\nThere thou wilt find a relief.\n\nHaste thou away! Why wilt thou stay?\nRisk not thy soul on a moment’s delay;\nJesus is waiting to save thee,\nMercy is pleading today!\n\n2.Come as thou art to the fountain--\nJesus is waiting for thee;\nWhat though thy sins be like crimson!\nWhite as the snow they shall be!\n\n3.These are the words of the Saviour:\nThey who repent and believe,\nThey who are willing to trust Him,\nLife at His hands shall receive.\n\n4.Come and be healed at the fountain\nList to the peace-speaking voice;\nOver a sinner returning,\nNow let the angels rejoice!","ec":"If any man come after me,\nLet him deny himself,\nPick up his cross and follow Me\nInto Life eternally;\nDeny yourself,  pick up the cross\nAnd follow Jesus,\nHe is the Way, Truth and Life.\n\nAlleluia, praise the Lord\nWorship Him in one accord;\nAlleluia, He is King,\nMaster, Lord of everything;\nJesus Christ, Lord of all,\nLoving great and small,\nHe is the Way, Truth and Life.","ts":"యేసయ్యా యేసయ్యా యేసయ్యా యేసయ్యా నిన్నే \nనిన్నే నే కొలుతునయ్యా నీవే నీవే నా రాజువయ్యా \nయేసయ్యా యేసయ్యా యేసయ్యా యేసయ్యా \n1. కొండలలో లోయలలో, అడవులలో ఎడారులలో నన్ను గమనించినావా, నన్ను  నడిపించినావా యేసయ్యా యేసయ్యా యేసయ్యా యేసయ్యా\n\n2.ఆత్మీయులే నన్ను అవమానించగా అన్యులే నన్ను అపహసించగా అండ నీవైతివయ్యా నా కొండ నీవే యేసయ్యా...\n\n3.మరణచ్ఛాయలలో మెరిసిన నీ ప్రేమ నలిగిన బ్రతుకున కురిసిన నీ కృప నన్ను బలపరచెనయ్యా నిన్నే ఘనపరతునయ్యా, యేసయ్యా...\n\n4.వంచన వంతెన ఒరిగిన, భారాన పొసగక విసిగిన విసిరే కెరటాన్నకలలా కడతేర్చినావా  నీ వలలో నను మోసినావా,  యేసయ్యా... "},{"n":131,"ei":"Drinking at the springs","ci":"If my people who bear","ti":"యెహోవ గద్దె ముందట జనంబూలార మ్రొక్కుడి ","es":"Drinking at the springs of living water,\nHappy now am I, my soul they satisfy; \t\t\t\nDrinking at the springs of living water,\nO wonderful and bountiful supply!\n\n1.I thirsted in the barren land of sin and shame,\nAnd nothing satisfying there I found;\nBut to the blessed cross of Christ one day I came,\nWhere springs of living water did abound.\n\n2.How sweet the living water from the hills of God,\nIt makes me glad and happy all the way;\nNow glory, grace and blessing mark the path I’ve trod,\nI’m shouting “Hallelujah” ev’ry day.\n\n3.O sinner, won’t you come today to Calvary?\nA fountain there is flowing deep and wide;\nThe Saviour now invites you to the water free,\nWhere thirsting spirits can be satisfied.","ec":"If my people who bear my name,\nWill humble themselves and pray,\nIf they seek my presence and turn \ntheir backs on their wicked ways.\nThen I will hear from heaven\nI’ll hear from heaven and forgive;\nI will forgive their sins\nAnd will heal their land,\nYes, I will heal their land.","ts":"1.యెహోవ గద్దె ముందట జనంబూలార మ్రొక్కుడి \nయెహోవ దేవుడే సుమీ సృజింప జంప గర్తయే\n\n2.స్వశక్తిచేత నాయనే మమున్‌ సృజించె మట్టిచే భ్రమించు గొఱ్ఱె రీతిగా దప్పంగ మళ్లి చేర్చెను\n\n3.సుకీర్తి పాడి గుంపులై ప్రసిద్ధిచేతు మాయనన్‌ జగత్తు వేయి నోళ్లతో స్తుతించు దివ్యమౌ ధ్వనిన్‌\n\n4.ప్రభుత్వ ముండు నంతకున్‌ ఆగున్‌ నీ ప్రేమ నిత్యము చిరంబు నీదు సత్యము వసించు నెల్లకాలము."},{"n":132,"ei":"Hark! The voice of Jesus","ci":"If we confess our sins","ti":"స్తోత్రమే మా ప్రాణము స్తుతులె మా ఆహారము ","es":"1.Hark! the voice of Jesus crying:\n“Who will go and work today?” \nFields are white and harvest waiting; \n“Who will bear the sheaves away?” \nLoud and strong the Master calleth, \nRich reward He offers thee; \nWho will answer, gladly saying,\n“Here am I; send me, send me”?\n\n2.If you cannot speak like angels,\nIf you cannot preach like Paul,\nYou can tell the love of Jesus,\nYou can say He died for all.\nIf you cannot rouse the wicked\nWith the Judgment’s dread alarms,\nYou can lead the little children\nTo the Saviour’s waiting arms.\n\n3.If, among the older people, \nYou may not be apt to teach,\n“Feed My lambs,” said Christ our Shepherd,\n“Place the food within their reach.”\nAnd it may be that the children\nYou have led with trembling hands\nWill be found among your jewels\nWhen you reach the better land.\n\n4.Let none hear you idly saying, \n“There is nothing I can do.” \nWhile the souls of men are dying, \nAnd the Master calls for you. \nTake the task He gives you gladly, \nLet His work your pleasure be; \nAnswer quickly when He calleth, \n“Here am I: send me, send me!”","ec":"If we confess our sins,\nHe is faithful and just,\nAnd will forgive us our sins And purify us (2)\nFrom all unrighteousness.","ts":"స్తోత్రమే మా ప్రాణము స్తుతులె మా ఆహారము సిలువయే మా ధ్యానము\nప్రభు పొలములో పనివారము   ||స్తో||\n\n1.యేసు క్రీస్తే మార్గము ప్రభు యేసు క్రీస్తే గమ్యము \nకొండమీది ప్రసంగము మా జీవితమునకు గమ్యము   ||స్తో||\n\n2.సిలువ వేదం చదువుకుంటు ప్రభు శ్రమల పల్లకి మోసికుంటూ అనుదినము స్తోత్రించుకుంటూ చేరెదం ప్రభు రాజ్యము ||స్తో|| \n\n3.హల్లెలూయ పాడెదం ప్రభు అద్భుతాలను చాటెదం కోటి కాంతుల వెలుగుమయుని కరుణపీఠం చేరెదం  ||స్తో|| \n"},{"n":133,"ei":"I heard an old, old story","ci":"If you love me","ti":"నీతిగల యెహోవ స్తుతి మీ యాత్మతో నర్పించుడీ ","es":"1.I heard an old, old story,\nHow a Saviour came from glory,\nHow He gave His life on Calvary\nTo  save a wretch like me.\nI heard about His groaning,\nOf His precious blood’s atoning,\nThen I repented of my sins and won the victory.\n\nO, victory in Jesus,\nMy Saviour forever,\t\nHe sought me and bought me\nWith  His redeeming blood.He loved me ere I knew Him,\nAnd all my love is due Him,\nHe plunged me to victory beneath the cleansing flood.\n\n2.I  heard about His healing,\nOf His cleansing power revealing,\nHow He made the lame to walk again,\nAnd caused the blind to see:\nAnd then I cried, “Dear Jesus,\nCome and heal my broken spirit:”\nAnd somehow Jesus came and brought —\nTo  me the victory.\n\n3.I heard about a mansion \nHe’s built for me in glory,\nAnd I heard about the streets of gold \nBeyond  the crystal sea.\nAbout the angels singing\nAnd the old redemption’s story,\nAnd some sweet day I’ll sing\nUp there, ‘The Song of Victory.’","ec":"If you love me\nkeep my commandments\nIf you love me keep them true\nIf you love me keep my commandments\nNot forgetting the old or new.\n\n1.On the mountain Sinai,\nGod gave Moses ten great laws,\nTo be kept by His own people\nThroughout time.\nThen came Jesus on the scene,\nWith one new great law of love,\nKnowing love would bring the best\nFrom us, He said.\n\n2.Now then Jesus could have said,\nYou must do this or do that,\nBut instead He left us choice to prove our love.\nThough sometimes if we but could,\nWe would change the laws of God,\nBut the words of Jesus echo in our minds.","ts":"నీతిగల యెహోవ స్తుతి మీ యాత్మతో నర్పించుడీ యాత్మతో సేవించుడీ \nదాతయౌ మన క్రీస్తు నీతిని  దాల్చుకొని సేవించుడీ \n\n1.చదలబుడమిని రవిని జలధిని నదులగిరులను జక్కగా సదమలంబగుదైవ  నామము సర్వదా నుతిచేయనీ   ||నీతి||\n\n2.సర్వశక్తుని కార్యములకీ సర్వ రాష్ట్రములన్నియు గర్వముల్‌ విడితలలు వంచుచు నుర్విలో నుతిజేయనీ  ||నీతి||\n\n3.గీత తాండవ వాద్యములచే బ్రీతిపరచెడు సేవతో బాతకంబులు పరిహరించెడు దాతనే సేవించుడీ   ||నీతి||\n\n4.పరమ దూతలు నరులు పుడమిని మొరలుబెట్టుచు దేవుని బరమునందున్నట్టి యేసుని పాదములు సేవింపనీ  ||నీతి||\n\n5.ఇలను భక్తులు గూడుకొనుచును బలము గల్గిన దేవుని వెలయు స్తుతులను నోళ్ళతోడను విసుకకుండగ జేయనీ   ||నీతి|| "},{"n":134,"ei":"Jesus is calling: forth","ci":"If you want joy,real joy","ti":"సన్నుతింతుమో ప్రభో \nసదమలమగు భక్తితో ","es":"1.Jesus is calling: forth to the fray!\nIn line be falling, serve Him today!\nFollow Him ever, call no retreat!\nHis soldiers never suffer defeat.\n\nOn to victory, follow your mighty Commander!\nOn to victory, follow where Jesus may go!\nOn to victory, close to your Shield and Defender!\nOn to victory, conquering every foe!\n\n2.He needs you, brother,do thou His will;\nYour place no other ever can fill.\nGird on the armour, take up the sword;\nJoin your Commander, follow your Lord.\n\n3.Morning is coming,night will be past\nSoon will the dawning break in at last\nThen with the morning, glorious and bright,\nRich crowns adorning victors of light!","ec":"If you want joy, real joy, wonderful joy,\nLet Jesus come into your heart.\nIf you want joy, real joy, wonderful joy\nLet Jesus come into your heart.\nYour sins He’ll wash away,\nYour night He’ll turn today,\nYour life He’ll make it over anew.\nIf you want joy, real joy, wonderful joy,\nLet Jesus come into your heart.","ts":"1. సన్నుతింతుమో ప్రభో సదమలమగు భక్తితో కన్నతండ్రి కావుమా కలుషము నెడబాపుమా\n\n2.నీతిసూర్య తేజమా జ్యోతిరత్న రాజమా పాతకజన రక్షకా పతితపావన నామకా\n\n3.మానవ సంరక్షకా దీన నిచయ పోషకా దేవమానవ నందనా దివ్య సుగుణ మందనా\n\n4.ప్రేమ తత్వబోధకా క్షేమదాత వీవెగా కామిత ఫలదాయక స్వామి యేసు నాయక\n\n5.పాపచింతలన్నిటిన్‌ పారదోలుమో ప్రభో నీ పవిత్ర నామమున్‌ నిరతము స్మరియించెదన్‌"},{"n":135,"ei":"Jesus loves me this","ci":"If you want to be great","ti":"నూతన గీతము పాడెదను\nనా ప్రియుడేసునిలో\n","es":"1.Jesus loves me this I know,\nFor the Bible tells me so;\nLittle ones to Him belong,\nThey are weak, but He is strong.\n\nYes, Jesus loves me,\nYes, Jesus loves me,\nYes, Jesus loves me,\nThe Bible tells me so.\n\n2.Jesus loves me! He who died\nHeaven’s gate to open wide;\nHe will wash away my sin,\nLet His little child come in.\n\n3.Jesus loves me! loves me still,\nWhen I’m very weak and ill;\nFrom His shining throne on high\nComes to watch me where I lie.\n\n4.Jesus loves me! He will stay\nClose beside me all the way;\nIf I love Him, when I die\nHe will take me home on high","ec":"If you want to be great in God’s Kingdom,\nLearn to be the servant of all (2)\nLearn to be the servant of all (2)\n(Repeat lines 1 & 2)","ts":"నూతన గీతము పాడెదను నా ప్రియుడేసునిలో\nహల్లెలూయా హల్లెలూయా హల్లెలూయా ఆమెన్‌\n\n1.ఆత్మలోనె పాడెదను  ఆర్భటించి పాడెదను అభినయించి పాడెదను\nఅనుభవించి పాడెదను అనుదినము నే పాడెదను అందరిలో నే పాడెదను\n\n2.యేసే నా మంచి కాపరి యేసే నా గొప్ప కాపరి యేసే నా ప్రధాన కాపరి\nయేసే నా ఆత్మ కాపరి యేసే నన్ను కొన్న కాపరి యేసే నాలో వున్న కాపరి\n\n3.శత్రుసేనలు ఎదురైనా దుష్టులంతా ఒకటైనా అజేయుడేసుని చేరెదనూ\nవిజయగీతము పాడెదను ధ్వజమునెత్తి సాగెదను భజన చేయుచు పాడెదను"},{"n":136,"ei":"Rescue the perishing","ci":"If you're saved and","ti":"తిక్షణం స్తుతియించెద ప్రభుయేసు ప్రేమ ఘనత ","es":"1.Rescue the perishing, care for the dying,\nSnatch them in pity from sin and the grave;\nWeep o’er the erring one,lift up the fallen,\nTell them of Jesus, the Mighty to save.\n\nRescue the perishing,Care for the dying;\nJesus is merciful,Jesus will save.\n\n2.Though they are slighting Him, still He is waiting,\nWaiting the penitent child to receive:\nPlead with them earnestly,\nplead with them gently;\nHe will forgive if they only believe.\n\n3.Down in the human heart,crushed by the tempter,\nFeelings lie buried that grace can restore;\nTouched by a loving hand, wakened by kindness,\nChords that were broken will vibrate once more.\n\n4.Rescue the perishing, duty demands it\nStrength for thy labour the Lord will provide:\nBack to the narrow way patiently win them;\nTell the poor wanderers a Saviour has died.","ec":"If you're saved and you're glad about it,\nShow it in your face (3)\nIf you're saved and you're glad about it,\nShow it in your face (2)\nLet the joy of salvation be a shining light,\nThat will lead souls to Jesus,\nAnd to paths of right.\nIf you're saved and you're ....\n\n","ts":"1.ప్రతిక్షణం స్తుతియించెద ప్రభుయేసు ప్రేమ ఘనత ప్రతి  దినము కొనియాడెద ప్రభు  యేసు దివ్యచరిత \nప్రతి నోట పాడాలి ఒక చక్కని తియ్యనిపాట ప్రతి చోట పాడాలి ప్రభుమేలుల గూర్చి \n\nఓ...దేవ మహాదేవ-నీకె స్తోత్రము సంపూర్ణ హృదయంతో ధ్యానించెదం ఓ దేవ మహరాజ-నీకే చెల్లును\n\n2.మరణదూత మమ్ములను వెంటాడగా దరిచేర కరముచాచి కాపాడిన దేవా మా బ్రతుకుల జీవమిచ్చి బ్రతికించగా స్తుతి నీకె అర్పింతుము\n\n3.మనుజునిగ అరుదెంచిన మహిమతేజుడా కొనియాడ తరముగాదు నీదు ప్రేమను మా రక్షణకై నీదురక్తమిచ్చినావు స్తుతి నీకె అర్పింతుము"},{"n":137,"ei":"Saved by the blood","ci":"If you've tried everything","ti":"స్తుతి సింహాసనాశీనుడా\nయేసురాజా దివ్య తేజా\n","es":"1.Saved by the blood of the Crucified One!\nNow ransomed from sin and a new work begun,\nSing praise to the Father and praise to the Son,\nSaved by the blood of the Crucified One!\n\nSaved!...saved!...\t\nMy sins are all pardoned, my guilt is all gone!\nSaved!...saved!...\nI am saved by the blood of the Crucified One!\n\n2.Saved by the blood of the Crucified One!\nThe angels rejoicing because it is done:\nA child of the Father, joint heir with the Son, \nSaved by the blood of the Crucified One!\n\n3.Saved by the blood of the Crucified One! \nThe Father He spake, and His will it was done; \nGreat price of my pardon, His own precious Son, \nSaved by the blood of the Crucified One!\n\n4.Saved by the blood of the Crucified One! \nAll hail to the Father, all hail to the Son, \nAll hail to the Spirit, the great Three in One!\nSaved by the blood of the Crucified One!","ec":"1.If you’ve tried everything\nAnd everything has failed;\nTry Jesus (Repeat)\n\nHe’ll be your dearest friend,\nStay with you to the end,\nSo, if you’ve tried eveything and \neverything has failed, try Jesus.\n\n2.If you need a helping hand,\nSomeone to understand;\nTry Jesus (Repeat)\nHe’ll be your . . .","ts":"స్తుతి సింహాసనాశీనుడా యేసురాజా దివ్య తేజా\n\n1.అద్వితీయుడవు పరిశుద్ధుడవు అతి సుందరుడవు నీవే ప్రభూ నీతి న్యాయములు నీ సింహాసనాధారం కృప సత్యము  నీ సన్నిధాన వర్తులు\t     \n||స్తు||\n\n2.బలియు అర్పణ కోరవు నీవు బలియైతివి నా దోషము కొరకై నా హృదయమె నీ ప్రియమగు  ఆలయం - స్తుతి యాగమునే చేసెద నిరతం\n||స్తు||\n\n3. బూర ధ్వనులే నింగిని మ్రోగగ రాజాధిరాజా నీవే వచ్చు వేళ సంసిద్ధతతో - వెలిగే సిద్దెతో పెండ్లి కుమారుడా  నిన్నెదుర్కొందును \t     \n||స్తు|| "},{"n":138,"ei":"Shackled by a heavy burden","ci":"In each heart there is a","ti":"క్రొత్తయేడు మొదలుబెట్టెను మన బ్రతుకునందు క్రొత్త...\n","es":"1.Shackled by a heavy burden, \n‘Neath a load of guilt and shame\nThen the hand of Jesus touched me, \nAnd now I am no longer the same.\n\nHe touched me, O He touched me, \nAnd O what joy that floods my soul;\nSomething happened, and now I know, \nHe touched me and made me whole.\n\n2.Since I met this blessed Saviour, \nSince He cleansed and made me, whole,\nI will never cease to praise Him \nI’ll shout it while eternity rolls.","ec":"In each heart there is a longing\nIn each soul a desperate cry,\nTo know if life has some true meaning,\nOr do we simply live and die;\nEarthly pleasures, and possessions\nLeave the sinking spirit dry\nIn each heart there is a longing\nOnly Jesus satisfies.\nIn each life there comes a question,\nIs there more than meets the eye?\nAnd do we see of the eternal\nWhen the well of days runs dry;\nSo few searching, so few finding\nThe difference between truth and lies,\nWhile in each heart there is a longing,\nOnly Jesus satisfies.","ts":"క్రొత్తయేడు మొదలుబెట్టెను మన బ్రతుకునందు క్రొత్త... \nక్రొత్త మనసుతోడ మీరు క్రొత్త యేట ప్రభుని సేవ \nదత్తర పడకుండ జేయు టుత్తమోత్తమంబు జూడ\n\n1. పొందియున్న మేలులన్నియు బొంకంబు మీఱ డెందమందు స్మరణ చేయుడీ యిందు మీరు మొదలుబెట్టు పందెమందు గెల్వవలయు నందముగను రవిని బోలి నలయకుండ మెలయకుండ\n\n2.మేలు సేయ దడ వొనర్పగా మీ రెఱుగునట్లు కాలమంత నిరుడు గడచెగా ప్రాలు మాలి యుండకుండ జాలమేల సేయవలయు జాల జనముల కిమ్మాను యేలు నామ ఘనత కొఱకు\n\n3.బలములేని వారమయ్యును బల మొందవచ్చు గలిమి మీఱ గర్త వాక్కున నలయకుండ నడుగుచుండ నలగకుండ మోదమొంది బలమొసంగు సర్వవిధుల నెలమి మీ రొనర్చుచుండ"},{"n":139,"ei":"Sing them over again to me","ci":"In heavenly armour wel'll","ti":"వందనం బొనర్తుమో \nప్రభో - ప్రభో \n","es":"1.Sing them over again to me,\nWonderful words of life!\nLet me more of their beauty see,\nWonderful words of life!\n\nWords of life and beauty,\nTeach me faith and duty!\nBeautiful words,wonderful words,\nWonderful words of life!\n\n2.Christ the blessed one, gives to all\nWonderful words of life!\nSinner,list to the loving call,\nWonderful words of life!\nAll so freely given,\nWooing us to heaven!\n\n3.Sweetly echo the gospel call,\nWonderful words of life!\nOffer pardon and peace to all,\nWonderful words of life!\nJesus,only Saviour,\nSanctify forever!","ec":"1.In heavenly armour we’ll enter the land\nThe battle belongs to the Lord.\nNo weapons that’s fashioned\nagainst us shall stand,\nThe battle belongs to the Lord.\n\nWe sing glory and honour\nPower and strength to the Lord.(2)\n\n2.The power of darkness comes in like a flood,\nThe battle belongs to the Lord.\nHe’s raised up a standard the power of His blood,\nThe battle belongs to the Lord.\n\n3.When your enemy presses in hard, do not fear;\nThe battle belongs to the Lord.\nTake courage, my friend your redemption is near;\nThe battle belongs to the Lord.","ts":"వందనం బొనర్తుమో ప్రభో - ప్రభో వందనం బొనర్తుమో ప్రభో - ప్రభో\nవందనంబు తండ్రి తనయ,శుద్ధాత్ముడా వందనంబు లందుకో ప్రభో\n\n1. ఇన్నినాళ్ళు ధరను మమ్ము బ్రోచియు గన్న తండ్రి మించి యెపుడు గాచియు ఎన్నలేని దీవెన-లిడు నన్న యేసువా యన్ని రెట్లు స్తోత్రము లివిగో  ||వం||\n\n2.ప్రాత వత్సరంపు బాప మంతయు బ్రీతిని మన్నించి మమ్ము గావుము నూతనాబ్దమునను నీదు నీతి నొసగు మా-దాత క్రీస్తు నాథ రక్షకా   ||వం||\n\n3.దేవమాదుకాలు సేతు లెల్లను సేవకాళి తనువు దినములన్నియు నీ వొసంగు వెండి,పసిడి-జ్ఞానమంత నీ సేవకై యంగీకరించుమా  ||వం||\n\n4.కోత కొరకు  దాస జనము నంపుము ఈ తరిమా లోటు పాట్లు దీర్చుము పాతకంబు లెల్ల మాపి-భీతి బాపుము ఖ్యాతి నొందు నీతి సూర్యుడా  ||వం||\n\n5.సభలను పెద్ద జేసి పెంచుము నీ సువార్త జెప్పశక్తినీయుము మోసపుచ్చు నంధ కార- మంత ద్రోయుము  యేసు కృపన్‌ గుమ్మరించుము ||వం|| "},{"n":140,"ei":"Sowing in the morning","ci":"In His time, In His time","ti":"ఘనదేవా మా ప్రభువా కృతజ్ఞతస్తుతులతో \n","es":"1. Sowing in the morning, sowing seeds of kindness \nSowing in the noontide and the dewy eves,\nWaiting for the harvest and the time of reaping \nWe shall come rejoicing, bringing in the sheaves.\n\nBringing in the sheaves, bringing in the sheaves, \nWe shall come rejoicing, bringing in the sheaves.\nBringing in the sheaves, bringing in the sheaves, \nWe shall come rejoicing, bringing in the sheaves.\n\n2. Sowing in the sunshine, sowing in the shadows, \nFearing neither clouds nor winter’s chilling breeze;\nBy and by the harvest and the labour ended\nWe shall come rejoicing, bringing in the sheaves.\n\n3. Going forth with weeping, sowing for the Master, \nThough the loss sustained our spirit often grieves;\nWhen our weeping’s over He will bid us welcome \nWe shall come rejoicing, bringing in the sheaves.","ec":"1.In His time, In His time,\nHe makes all things beautiful in His time,\nLord, please show me every day,\nAs you’re teaching me your way,\nThat you do just what you say, in your time.\n\n2.In your time, in your time,\nYou make all things beautiful, in your time.\nLord, my life to you I bring,\nMay each song I have to sing\nBe to you a lovely thing, in your time.","ts":"ఘనదేవా మా ప్రభువా కృతజ్ఞతస్తుతులతో\nవందన సమర్పణతో ఆరాధింతుము\n\n1.ఒంటరియైన వానిని పిలిచి పదివందలుగా దీవించితివి\nబలమైన జనముగా జేసి వాగ్దానము నెరవేర్చి (2)\n\n2.ఉపవాస కన్నీటి ప్రార్థన బలముతో సహోదర ప్రేమ సమైక్య కృషిలో \nస్థిరమైన విశ్వాసముతో కట్టితిరీ సహవాసం (2)\n\n3.నీ విశ్వాస్యత కరుణామృతము నీ ప్రేమ కృపా వాత్యల్యము\nస్థిరముగా యున్నందులకు  చెల్లింతుము స్తోత్రము (2)"},{"n":141,"ei":"Take the name of Jesus","ci":"In Jesus' Name, in Jesus","ti":"స్తుతించెదను - నిన్ను నేను ","es":"1.Take the name of Jesus with you,\nChild of sorrow and of woe;\nIt will joy and comfort give you-\nTake it then where’er you go.\n\nPrecious name,O how sweet,\nHope of earth and joy of Heaven!\nPrecious name, O how sweet,\nHope of earth and joy of Heaven!\n\n2.Take the name of Jesus ever,\nAs a shield from ev’ry snare;\nIf temptations round you gather,\nBreathe that holy name in prayer.\n\n3.Oh, the precious name of Jesus!\nHow it thrills our souls with joy,\nWhen His loving hands receive us,\nAnd His songs our tongues employ.\n\n4.At the name of Jesus bowing,\nFalling prostrate at His feet,\nKing of kings in heaven we’ll crown Him,\nWhen our journey is complete.","ec":"1.In Jesus’ Name, in Jesus’ Name,\nIn Jesus’ wonderful Name,\nWe’ll stake our claim for victory\nIn Jesus’ wonderful Name.\nIn Jesus’ Name, in Jesus’ Name\nIn Jesus’ wonderful Name,\nWe’ll take our stand, reclaim our land,\nIn Jesus’ wonderful Name.\n\nIn His Name, wonderful Name,\nPowerful Name, We’ll claim the victory.  (Repeat)\n\n2.In Jesus’ name, In Jesus’ Name,\nIn Jesus’ wonderful Name,\nWe’ll break the bonds that bind our friends,\nIn Jesus’ wonderful Name.\nIn Jesus’ Name, In Jesus’ Name,\nIn Jesus’ wonderful Name,\nWe won’t give in; we’ll fight to win,\nIn Jesus’ wonderful Name.","ts":"స్తుతించెదను - నిన్ను నేను మనసారాభజించెదను - నేను నిన్ను దినదినము\nస్తోత్రార్హుడవు - నీవే ప్రభు సమస్తము నీకర్పించెదను\n\n1. పూజార్హుడవు – పవిత్రుడవు  పాపిని క్షమియించె – మిత్రుడవు పరము చేర్చి –ఫలములిచ్చే పావనుడగు మా - ప్రభువు నీవే\n\n2.కృపాకనికరములు గల దేవా కరుణ జూపి కనికరించు కంటి రెప్పవలె - కాపాడు కడవరకు మమ్ము - కావుమయా\n\n3. సర్వశక్తిగల - మా ప్రభువా సజీవ సాక్షిగ చేయుమయా స్థిరపరచి మమ్ము బలపరచుము సదా నీకె స్తోత్రాలర్పింతున్‌"},{"n":142,"ei":"The great physician","ci":"In my heart there rings a","ti":"స్తుతియు మహిమా ఘనతా నీకే\n","es":"1.The Great Physician now is near,\nThe sympathizing Jesus:\nHe speaks the drooping heart to cheer,\nOh, hear the voice of Jesus!\n\nSweetest note in seraph song,\nSweetest name on mortal tongue,\nSweetest carol ever sung: Jesus, blessed Jesus!\n\n2.Your many sins are all forgiven,\nOh, hear the voice of Jesus!\nGo on your way in peace to heaven\nAnd wear a crown with Jesus.\n\n3.All glory to the dying Lamb!\nI now believe in Jesus!\nI love the blessed Saviour’s name,\nI love the name of Jesus.","ec":"In my heart there rings a melody,\nThere rings a melody ,\nWith heavenly harmony.\nIn my heart there rings a melody,\nThere rings a melody of love.\nJesus, Jesus, Jesus,\nSweetest name I know,\nFills my every longing,\nKeeps me singing as I go.","ts":"స్తుతియు మహిమా ఘనతా నీకే యుగయుగముల వరకు\nఎంతో నమ్మదగిన దేవా ఎంతో నమ్మదగిన దేవా\n\n1.మా దేవుడవై మాకిచ్చితివి ఎంతో గొప్ప శుభదినము మేమందరము ఉత్సహించి సంతోషించెదము కొనియాడెదము మరువ బడని మేలులు చేసెనని\n\n2.నీ ఒక్కడవే గొప్ప దేవుడవు  ఘన కార్యములు చేయుదువు నీదు కృపయే నిరంతరము నిలిచి యుండునుగా నిన్ను మేము ఆనందముతో ఆరాదించెదము\n\n3.నూతనముగ దినదినము నిలుచు నీదు వాత్సల్యత మాపై ఖ్యాతిగా నిలిచే నీ నామమును కీర్తించెద మిప్పుడు ప్రీతితో మాస్తుతులర్పించెదము దాక్షిణ్యా ప్రభువా\n\n4.నీవే మాకు పరమ ప్రభుడవై నీ చిత్తము నెరవేర్చితివి జీవమునిచ్చి నడిపించెదవు నీ ఆత్మ ద్వారా సేవించెదము సమభూమిగల ప్రదేశములలో నిను\n\n5.భరియించితివి శ్రమలు నిందలు ఓర్చితి వన్ని మా కొరకై మరణము గెలిచి ఓడించితివి సాతాను బలమున్‌ పరము నుండి మాకై వచ్చె ప్రభు యేసు జయమున్‌ "},{"n":143,"ei":"There is no love like the love","ci":"In the name of Jesus","ti":"దేవ సంస్తుతి చేయవే మనసా","es":"1.There is no love like the love of Jesus-\nNever to fade or fall,\nTill into the fold of the peace of God\nHe has gathered us all.\n\nJesus’ love, precious love,\nBoundless and pure and free;\nOh, turn to that love, weary wandering soul:\nJesus pleadeth with thee!\n\n2.There is no heart like the heart of Jesus, \nFilled with a tender love;\nNo throb nor throe that our hearts can know,\nBut He feels it above.\n\n3.There is no eye like the eye of Jesus,\nPiercing so far away;\nNe’er out of the sight of its tender light\nCan the wanderer stray.\n\n4.There is no voice like the voice of Jesus — \nTender and sweet its chime,\nLike musical ring of a flowing spring \nIn the bright summer time.\n\n5.Oh, let us hark to the voice of Jesus;\nOh, may we never roam,\nTill safe we rest on His loving breast, \nIn the dear heavenly home.","ec":"In the Name of Jesus,\nIn the Name of Jesus,\nWe’ll have the victory, Hallelujah!\nIn the Name of Jesus,\nIn the Name of Jesus,\nDemons will have to flee.\nWho can tell what God can do\nWho can tell of His love for you\nIn the Name of Jesus, Jesus\nWe’ll have the victory.","ts":"దేవ సంస్తుతి చేయవే మనసా శ్రీ-మంతుడగు యెహోవ సంస్తుతి చేయవే మనసా\nదేవ సంస్తుతి చేయుమా నా జీవమా యెహోవా దేవుని పావన నామము నుతించుమా\nనా యంతరంగములో వశించునో సమస్తమా   ||దేవ||\n \n1.జీవమా యెహోవా నీకు జేసిన మేళ్లన్‌ మరువకు నీవు చేసిన పాతకంబులను మన్నించి జబ్బు లేవియున్‌ లేకుండ జేయును ఆ కారణముచే   ||దేవ||\n \n2.చావు గోతి నుండి నిన్నులేవనెత్తి దయను గృపను జీవ కిరీటముగ వేయునునీ శిరసు మీద జీవ కిరీటముగ వేయును ఆ కారణముచే   ||దేవ||\n\n3.యౌవనంబు పక్షిరాజు యౌవనంబు వలెనె క్రొత్త యౌవనంబై వెలయునట్లుగ మేలిచ్చి నీదు భావమును సంతుష్టి పరచునుగా ఆ కారణముచే   ||దేవ||\n \n4.ప్రభువు నీతి పనులు చేయున్‌ బాధితులకు న్యాయ మిచ్చున్ విభుడు మార్గము తెలిపె మోషేకు దన కార్యములను విప్పె నిశ్రాయేలు జనమునకు ఆ కారణముచే   ||దేవ||\n\n5.అత్యధిక ప్రేమ స్వరూపి యైన దీర్ఘ శాంతపరుడు నిత్యము వ్యాజ్యంబు చేయడు ఆ కృపోన్నతుడు నీ పయి నెపుడు కోపముంచడు ఆ కారణముచే   ||దేవ||\n \n6.పామరుల మని ప్రత్యుపకార ప్రతి ఫలంబుల్‌ పంపలేదు భూమికన్న నాకసంబున్న యెత్తుండు దైవ ప్రేమ భక్తి జనుల యందున ఆ కారణముచే   ||దేవ||\n\n7.పడమటికి తూర్పెంత యెడమో పాపములకును మనకు నంత యెడము కలుగ జేసియున్నాడు మన పాపములను యెడముగానే చేసియున్నాడు ఆ కారణముచే   ||దేవ||\n\n8.కొడుకులపై దండ్రి జాలి పడు విధముగా భక్తిపరుల యెడల జాలి పడును దేవుండు తన భక్తిపరుల యెడల జాలిపడును దేవుండు ఆ కారణముచే   ||దేవ||\n \n9.మనము నిర్మితమయిన రీతి తనకు దెలిసియున్న సంగతి మనము మంటివార మంచును జ్ఞాపకము చేసి కొనుచు కరుణ జూపుచుండును ఆ కారణముచే   ||దేవ||\n \n10.పూసి గాలి వీవ నెగిరి పోయి బసను దెలియని వన వాస పుష్పము వలెనె నరుడుండు నరు నాయువు తృణ ప్రాయము మన దేవ కృప మెండు ఆ కారణముచే   ||దేవ||\n \n11.పరమ దేవ నిబంధ నాజ్ఞల్‌ భక్తితో గైకొను జనులకు నిరతమును గృప నిలిచి యుండును యెహోవా నీతి తరముల పిల్లలకు నుండును ఆ కారణముచే   ||దేవ||"},{"n":144,"ei":"There's a  not a friend like","ci":"In the very thought of","ti":"యెహోవాను స్తుతించుడి ఆయన దయాళుడు","es":"1.There’s not a friend like the lowly Jesus \nNo, not one! No, not one!\nNone else could heal all our souls’ diseases \nNo, not one! No, not one!\n\nJesus knows all about our struggles \nHe will guide till the day is done\nThere’s not a friend like the lowly Jesus \nNo, not one! No, not one!\n\n2.No friend like Him is so high and holy, \nNo, not one! No, not one!\nAnd yet no friend is so meek and lowly \nNo, not one! No, not one!\n\n3.There’s not an hour that he is not near us, \nNo, not one! No, not one!\nNo night so dark but His love can cheer us, \nNo, not one! No, not one!\n\n4.Did ever saint find this friend forsake him? \nNo, not one! No, not one!\nOr sinner find that He ‘d not take him?\nNo, not one! No, not one!\n\n5.Was e’er a gift like the Saviour given?\nNo, not one! no, not one!\nWill He refuse us a home in heaven?\nNo, not one! no, not one!","ec":"1.In the very thought of Jesus\nHis presence can be found\nHe’s as close as the mention of His Name;\nThere is never any distance\nBetween my Lord and me\nHe’s as close as the mention of His Name\n\nHe’s as close as the mention of His name\nJesus, Jesus. (2)\n\n2.In my hour of struggle so many times I’ve found,\nHe’s as close as the mention of His Name;\nJust to breathe the name of Jesus\nWill turn everything around,\nHe’s as close as the mention of His Name.","ts":"1.యెహోవాను స్తుతించుడి ఆయన దయాళుడు\n\nఆయన కృప నిరంతరముండును\nఆయన కృప నిరంతరముండును (2)\n\n2.దేవ దేవునికి స్తుతులు చెల్లించుడి   ||ఆయన||\n \n3.ప్రభువుల ప్రభువుకు స్తుతులు చెల్లించుడి    ||ఆయన||\n \n4.ఆశ్చర్య కార్యములు చేయువాని స్తుతించుడి   ||ఆయన||\n \n5.ఆకాశము జ్ఞానముచే జేసినవాని స్తుతించుడి   ||ఆయన||\n\n6.నీళ్లమీద భూమిని పరచినవాని స్తుతించుడి   ||ఆయన||\n \n7.గొప్ప జ్యోతులను నిర్మించినవాని స్తుతించుడి   ||ఆయన||\n  \n8.పగటినేలు సూర్యుని చేసినవాని స్తుతించుడి   ||ఆయన||\n \n9.రాత్రినేలు చంద్రుని చేసినవాని స్తుతించుడి   ||ఆయన||"},{"n":145,"ei":"We have heard the joyful","ci":"Into my heart! Into for","ti":"రాజులకు రాజైన యీ మన విభుని ","es":"1.We have heard the joyful sound:\nJesus saves! Jesus saves!\nTell the message all around:\nJesus saves! Jesus saves!\nBear the news to every land,\nClimb the steeps and cross the waves;\nOnward! - ‘tis our Lord’s command\nJesus saves ! Jesus saves !\n\n2.Waft it on the rolling tide:\nJesus saves! Jesus saves!\nSay to sinners far and wide,\nJesus saves! Jesus saves!\nSing, ye islands of the sea;\nEcho back, ye ocean caves;\nEarth shall keep her jubilee:\nJesus saves! Jesus saves\n\n3.Sing above the toil and strife,\nJesus saves! Jesus saves!\nBy His death and endless life\nJesus saves! Jesus saves!\nSing it softly through the gloom,\nWhen the heart for mercy craves;\nSing in triumph o’er the tomb,\nJesus saves! Jesus saves\n\n4.Give the winds a mighty voice:\nJesus saves! Jesus saves!\nLet the nations now rejoice,\nJesus saves! Jesus saves!\nShout salvation full and free\nTo every strand that ocean laves;\nThis our song of victory,\nJesus saves! Jesus saves!","ec":"Into my heart! Into my heart!\nCome into my heart Lord Jesus\nCome in today, come in to stay.\nCome into my heart Lord Jesus.","ts":"రాజులకు రాజైన యీ మన విభుని పూజసేయుటకు రండియీ జయశాలి కన్న-మన కింక రాజెవ్వరును లేరని\n\n1.కరుణ గల సోదరుండై-యీయన ధరణి కేతెంచె నయ్యా తిరముగ నమ్ముకొనిన-మనకొసగు బరలోక రాజ్యమ్మును\n\n2.నక్కలకు బొరియలుండె-నాకాశ పక్షులకు గూళ్లుండెను ఒక్కింత స్థలమైనను-మన విభుని కెక్కడ లేకుండెను\n\n3.అపహాసములు సేయుచు - నాయన యాననము పై నుమియుచు గృప మాలిన సైనికు-లందరును నెపములెంచుచు గొట్టిరి\n\n4.కరమునందొక్క రెల్లు-పుడకను దిరముగా నునిచి వారల్‌ ధరణీపతి శ్రేష్ఠుడా-నీకిపుడు దండమనుచును మ్రొక్కిరి\n \n5.ఇట్టి శ్రమలను బొందిన-రక్షకుని బట్టుదలతో నమ్మిన  అట్టహాసము తోడను-బరలోక పట్టణంబున జేర్చును\n\n6.శక్తి గల రక్షకుండై-మన కొరకు ముక్తి సిద్ధము జేసెను భక్తితో బ్రార్థించిన-మన కొసగు రక్తితో నా ముక్తిని\n\n7.త్వరపడి రండి రండి-యీ పరమ గురుని యొద్దకు మీరలు దరికి జేరిన వారిని-యీ ప్రభువు దరుమడెన్నడు దూరము"},{"n":146,"ei":"When we walk with the Lord","ci":"Is anything too hard for","ti":"యెహోవా మా తండ్రి గాఁడ\n","es":"1.When we walk with the Lord,\nIn the light of His Word,\nWhat a glory He sheds on our way!\nWhile we do His good will\nHe abides with us still,\nAnd with all who will trust and obey!\n\nTrust and obey!For there’s no other way\nTo be happy in Jesus — But to trust and obey.\n\n2.Not a shadow can rise\nNot a cloud in the skies,\nBut His smile quickly drives it away\nNot a doubt nor a fear,\nNot a sigh nor a tear\t\nCan abide while we trust and obey!\n\n3.Not a burden we bear,\nNor a sorrow we share,\nBut our toil He doth richly repay:\nNot a grief nor a loss,\nNot a frown nor a cross,\nBut is blest if we trust and obey.\n\n4.But we never can prove\nThe delights of His love\nUntil all on the altar we lay;\nFor the favour He shows,\nAnd the joy He bestows,\nAre for them who will trust and obey.\n\n5.Then in fellowship sweet\nWe will sit at His feet,\nOr we’ll walk by His side in the way;\nWhat He says we will do,\nWhere He sends we will go —\nNever fear, only trust and obey!","ec":"Is anything too hard for the Lord! (2)\nIs anything too hard! (2)\nIs anything too hard for the Lord!\nNo nothing is too hard for the Lord (2)\nNo nothing is too hard (2)\nNo nothing is too hard for the Lord.","ts":"యెహోవా మా తండ్రి గాడ యేసుడు మా యన్న గాడ\nమహిమ గల శుద్ధాత్మ యిట్టి వరుస దెలిపెంగద మా తోడ\n\n1.మోక్ష నగరు మా పుట్టిల్లు ముఖ్య దూతల్‌ మా స్నేహితులు సాక్షాత్కారమైయున్నపుడులక్ష్యపెట్ట మిహ బాధలకు\n\n2.అబ్రాహాము దావీదు మొదలైనట్టి వర భక్తాగ్రేసరులే శుభ్రముగ మా చుట్టా లైనన్‌ హర్షిమిఁక మా కేమి కొదువ\n\n3.పేతురాది సకలాపోస్తుల్‌ పేర్మిగల మా నిజ కూటస్థుల్‌ ఖ్యాతి సభలో మేమున్నప్పుడు ఘనతలిక మాకేమి వెలితి\n\n4.తనువు బలిపెట్టెను మా యన్న తప్పు ల్విడఁగొట్టెను మా తండ్రి మనసులో సాక్ష్యమిట్లున్న మనుజులెట్లన్నను-మాకేమి\n\n5.పరమ విభు జీవ గ్రంథములో బ్రభుని రక్తాక్షరముద్రితమె చిరముగా నుండు మా పేరు చెఱుపు బెట్టెడు వారింకెవరు\n\n6.కరములతో నంటరాని కన్నులకు గోచరముగాని పరమ ఫలముల్‌ మాకున్నపుడు సరకు గొన మిక్కడి లేములకు"},{"n":147,"ei":"All people that on earth","ci":"Isn't He beautiful","ti":"నీతో సమమెవరు? నీలా ప్రేమించేదెవరు?\n","es":"1.All people that on earth do dwell,\nSing to the Lord with cheerful voice;\nHim serve with fear, His praise forth tell,\nCome ye before Him and rejoice.\n\n2.Know that the Lord is God indeed:\nWithout our aid He did us make:\nWe are His flock, He doth us feed,\nAnd for His sheep He doth us take.\n\n3.O enter then His gates with praise,\nApproach with joy His courts unto:\nPraise, laud and bless His Name always,\nFor it is seemly so to do.\n\n4.For why? The Lord our God is good,\nHis mercy is forever sure;\nHis truth at all times firmly stood,\nAnd shall from age to age endure.","ec":"Isn’t He beautiful, beautiful, isn’t He!\nPrince of peace, Son of God Isn’t He!\nIsn’t He wonderful, wonderful isn’t He!\nCounsellor, Almighty God,\nIsn’t He! Isn’t He! Isn’t He!","ts":"నీతో సమమెవరు? నీలా ప్రేమించేదెవరు?\nనీలా క్షమియించేదెవరు యేసయ్యా?\nనీలా పాపికై ప్రాణంబెట్టిన వారెవరు?\n\n1.లోక బంగారము-ధన ధాన్యాదులు ఒక్క పోగేసినా-నీతో సరితూగునా?\nజీవ నదులన్నియు, సర్వ సంద్రములు ఒక్కటై యెగసినా నిన్ను తాకగలవా?\nనీలా పరిశుద్ధ దేవుడెవరున్నారయా నీవేగా మంచి దేవుడవు\n\n2.పలు వేదాలలో మతగ్రంథాలలో పాపమే సోకని పరిశుద్ధుడేడి?\nపాప పరిహారార్థం సిలువ మరణమొంది తిరిగి లేచినట్టి దైవనరుడెవ్వరు?\nనీలా జాలిగల ప్రేమగల దేవుడేడి? నీవేగా విమోచకుడవూ\n\n3.నేను వెదుకకున్నా నాకు దొరికితివి నే ప్రేమించకున్నా నన్ను ప్రేమించితివి\nనీకు గాయాలు చేసి-తరచు రేపితిని నన్నెంతో సహించి క్షమియించితివి\nలోక సౌఖ్యాలన్ని ఒక్క చోట కుమ్మరించినా నీవెగా చాలిన దేవుడవు"},{"n":148,"ei":"I have a song that Jesus","ci":"Isn't He wonderful","ti":"యేసయ్య మన దేవుడు \nలోకాన నిజ దేవుడు\n","es":"1.I have a song that Jesus gave me,\nIt was sent from heav’n above;\nThere never was a sweeter melody,\n‘Tis a melody of love.\n\nIn my heart there rings a melody,\nThere rings a melody with heavenly harmony;\nIn my heart there rings a melody;\nThere rings a melody of love.\n\n2.I love the Christ who died on Calv’ry,\nFor He washed my sins away;\nHe put within my heart a melody,\nAnd I know it’s there to stay.\n\n3.‘Twill be my endless theme in glory,\nWith the angels I will sing;\n‘Twill be a song with glorious harmony,\nWhen the courts of heaven ring.","ec":"Isn’t He wonderful, wonderful, wonderful,\nIsn’t Jesus my Lord wonderful?\nEyes have seen, ears have heard\nIt’s recorded in His word,\nIsn’t Jesus my Lord wonderful?","ts":"యేసయ్య మన దేవుడు లోకాన నిజ దేవుడు\nఅయ్యా యేసయ్యా మన దేవుడు లోకాన నిజ దేవుడు\nబేధాలే మానెయ్యాలి వాదాలే వదిలెయ్యాలి (2)\n\t \n1.లోకంలో ఎన్నెన్నో దేవతలున్నా మనుషుల్లో ఎన్నెన్నో మతములున్నా \nఈ లోకమంతటికి దేవుడొక్కడే ఆ దేవుడు క్రీస్తై యున్నాడు\n\n2.మనమంతా చేసిన పాపము కోసం తన స్వంత ప్రాణాన్ని అర్పించాడు\nమృత్యుంజయుడై లేచి వచ్చెను మరణించిన వారిని తిరిగి లేపెను\n\n3.యేసయ్యా అందరికి మంచి కాపరి లోకమంత ఏకమై చాటించాలి \nరెండవ సారి రానై యున్నాడు సిద్ధముగా ఉండమని సెలవిచ్చాడు"},{"n":149,"ei":"I have founda deep peace","ci":"It is no secret, what God","ti":"క్రీస్తుని నామము - నిత్యము నిల్చున్‌","es":"1.I have found a deep peace\nThat I never had known,\nAnd a joy this world could not afford, \nSince I yielded control\nOf my body and soul\nTo my wonderful, wonderful Lord.\n\nMy wonderful Lord, my wonderful Lord, \nBy angels and seraphs in heaven adored!\nI bow at Thy throne, my Saviour divine,\nMy wonderful, wonderful Lord.\n\n2.I desire that my life shall be ordered by Thee, \nThat my will be in perfect accord \nWith Thine own sovereign will, Thy desires to fulfill,\nMy wonderful, wonderful Lord.\n\n3.All the talents I have\nI have laid at Thy feet, \nThy approval shall be my reward;\nBe my store great or small, I surrender it all\nTo my wonderful, wonderful Lord.\n\n4.Thou art fairer to me than the fairest of earth, \nThou omnipotent, life-giving Word;\nO Thou Ancient of Days,\nThou art worthy of praise\nMy wonderful, wonderful Lord.","ec":"It is no secret, what God can do;\nWhat He’s done for others,\nHe’ll do for you.\nWith arms wide open,\nHe’ll pardon you\nIt is no secret what God can do.","ts":"1.క్రీస్తుని నామము - నిత్యము నిల్చున్‌\nసూర్యుడున్నంత - కాలము చిగుర్చున్‌\n\n2.అతనిని బట్టి - మనుష్యులెల్లరు \nతమ్మును తాము దీవించుకొనెదరు\n\n3.అన్య జను - లందరును యతని\nధన్యుడని చెప్పు - కొనుచుందురు\n \n4.దేవుడైన –యెహోవా ఇశ్రాయేలు\nదేవుడు స్తుతింప - బడును గాక\n\n5.ఆయన మాత్రమె బహు - ఆశ్చర్య కార్య \nములు చేయువాడు గాన - స్తోత్రార్హుండు\n\n6.ఆయన మహిమగల - నామము\nనిత్యమును స్తుతింప-బడునుగాక\n\n7.సర్వభూమి ఆయన - మహిమచే\nనిండియుండును గాక - ఆమెన్‌ ఆమెన్‌"},{"n":150,"ei":"I love to tell the story","ci":"It s not by might nor by","ti":"నన్ను గన్నయ్య రావె నా యేసు\n","es":"1.I love to tell the story\nOf unseen things above\nOf Jesus and His glory\nOf Jesus and His love\nI love to tell the story\nBecause I know it’s true;\nIt satisfies my longings\nAs nothing else would do.\n\nI love to tell the story\n’Twill be my theme in glory\nTo tell the old, old story\nOf Jesus and His love.\n\n2.I love to tell the story\nMore wonderful it seems\nThan all the golden fancies\nOf all our golden dreams\nI love to tell the story:\nIt did so much for me;\nAnd that is just the reason\nI tell it now to Thee.\n\n3.I love to tell the story\n’Tis pleasant to repeat\nWhat seems, each time I tell it\nMore wonderfully sweet:\nI love to tell the story;\nFor some have never heard\nThe message of salvation\nFrom God’s own holy Word.\n\n4.I love to tell the story\nFor those who know it best\nSeem hungering and thirsting\nTo hear it like the rest:\nAnd when in scenes of glory\nI sing the new, new song\n‘Twill be the old, old story\nThat I have loved so long.","ec":"“It’s not by might nor by power\nBut by my Spirit”\n“It’s not by might nor by power”,\nSays the Lord.","ts":"నన్ను గన్నయ్య రావె నా యేసు\nనన్ను గన్నయ్య రావె నా ప్రభువా\n\n1.ముందు నీ పాదారవిందము లందు నిశ్చల భక్తి ప్రేమను\nపొందికగా జేయరావే నా డెందమానంద మనంతమైయుప్పొంగ\n\n2.హద్దులేనట్టి దురాశల నవివేకినై కూడి యాడితి\nమొద్దులతో నింక కూటమి వద్దయ్య వద్దయ్య వద్దయ్య తండ్రి\n\n3.కాలము పెక్కు గతించెను గర్వాదు లెడదెగవాయెను\nఈ లోకమాయ సుఖేచ్ఛలు చాలును జాలును జాలు నోతండ్రి\n\n4.దారుణ సంసార వారధి దరి జూపి ప్రోవ నీ కన్నను\nకారణ గురువు లింకెవ్వరు లేరయ్య - లేరయ్య లేరయ్య తండ్రి\n\n5.నా వంటి దుష్కర్మ జీవిని కేవలమగు నీదు పేర్మిని\nదీవించి రక్షింపనిప్పుడే రావయ్య రావయ్య రావయ్య తండ్రి"},{"n":151,"ei":"I would love to tell you","ci":"It s  your Blood that","ti":"దేవుడే నా కాశ్రయంబు\nదివ్యమైన దుర్గము \n","es":"1.I would love to tell you what I think of Jesus\nSince I found in Him a friend so strong and true:\nI would tell you how He changed my life completely,\nHe did something that no other friend could do.\n\nNo one ever cared for me like Jesus,\nThere’s no other friend so kind as He:\nNo one else could take the sin and darkness from me,\nO how much He cared for me.\n\n2.All my life was full of sin when Jesus found me,\nAll my heart was full of misery and woe:\nJesus placed His strong and loving arms about me,\nAnd He led me in the way I ought to go.\n\n3.Ev’ryday He comes to me with new assurance, \nMore and more I understand His words of love:\nBut I’ll never know just why He came to save me,\nTill some day I see His blessed face above.","ec":"It’s Your Blood that cleanses me,\nIt’s Your Blood that gives me life,\nIt’s Your Blood that took my place,\nIn redeeming sacrifice,\nWashes me whiter than the snow, than the snow;\nMy Jesus, God’s precious sacrifice.","ts":"దేవుడే నా కాశ్రయంబు దివ్యమైన దుర్గము\nమ-హా వినోదు డాపదల స-హాయుడై నన్‌ బ్రోచును\nఅభయ-మభయ-మభయ మెప్పు\nడానందమానంద మానందమౌగ\n\n1.పర్వతములు కదిలిన నీ యుర్వి మారుపడినను\nసర్వమున్‌ ఘోషించుచు నీ సంద్రముప్పొంగినన్‌\n\n2.దేవుడెప్డు తోడుగాగ - దేశము వర్ధిల్లును\nఆ-తావునందు ప్రజలు మిగుల ధన్యులై వసింతురు\n\n3.రాజ్యముల్‌ కంపించిన భూ-రాష్ట్రముల్‌ ఘోషించిన\nపూజ్యుడౌయెహోవ వైరి బూని సంహరించును\n\n4.విల్లు విఱుచు నాయన తెగ బల్లెము నఱకు నాయన\nచెల్ల చెదర జేసిరిపుల నెల్లద్రుంచు నాయనే\n\n5.పిశాచి పూర్ణబలము నాతో బెనుగులాడ జడియును\nనశించి శత్రుగణముదేవు నాజ్ఞ వలన మడియును\n\n6.కోటయు నాశ్రయమునై యా కోబు దేవుడుండగ\nఏటికింక వెరవవలయు నెప్డు నాకు బండుగ"},{"n":152,"ei":"One day when heaven","ci":"Jehovah Jireh, God will","ti":"విశ్వాసమే విజయము - విను \nప్రియుడా ","es":"1.One day when heaven was filled with His praises,\nOne day when sin was as black as could be,\nJesus came forth to be born of a vir¬gin\nDwelt amongst men, my example is He!\n\nLiving, He loved me; dying, He saved me;\nBuried, He carried my sins far away:\nRising, He justified freely forever;\nOne day He’s coming oh, glorious day!\n\n2.One day they led Him up Calvary’s mountain\nOne day they nailed Him to die on the tree;\nSuffering anguish, despised, and rejected;\nBearing our sins, my Redeemer is He!\n\n3.One day they left Him alone in the garden,\nOne day He rested, from suffering free;\nAngels came down o’er His tomb to keep vigil;\nHope of the hopeless, my Saviour is He!\n\n4.One day the grave could conceal Him no longer,\nOne day the stone rolled away from the door;\nThen He arose, over death He had conquered;\nNow is ascended, my Lord evermore!\n\n5.One day the trumpet will sound for His coming,\nOne day the skies with His glory will shine;\nWonderful day, my beloved ones bring¬ing;\nGlorious Saviour, this Jesus is mine!","ec":"Jehovah Jireh, God will provide,\nJehovah Rophe, God heals;\nJehovah M’keddesh, God who sanctifies,\nJehovah Nissi, God is my banner.\nJehovah Rohi, God my Shepherd,\nJehovah Shalom, God is peace;\nJehovah Tsidkenu, God our righteousness,\nJehovah Shammah, God who is there.","ts":"విశ్వాసమే విజయము - విను \nప్రియుడా య-విశ్వాస మపజయము  \nవిశ్వాసాయుతమైన - విసుకని \nసుకార్యములే - విశ్వాసవంతునికి  \nవిజయ మొసగును నిజము \n\n1 భక్తుడందువలననే - బ్రతుకును మరియు - శక్తినొంది నిల్చును \nయుక్తముగ వర్తించి - యుర్విని జయించి - ముక్తి నొందున టంచు రక్తిగా బాడుదును\n\n2 మంచి పేరు నొందును - సాతాను నెదిరించి విజయ మొందును \nమించిన బాధల్స-హించి జయించును సంచిత మరణము - నానందముగ గాంచు\n\n3 ప్రవిమల మొందెదము – పాపము  నుండి - పరిహరింపబడుదుము\t \nఅవి రతమును మనము నాశ్చర్యముగ ఘనము \nభువియందున్‌ దివియందున్‌ బుధులతో నొందుదుము\n\n4 నీతిమంతుల మౌదుము నిశ్చయము ప్ర-ఖ్యాతి \nబోధను నేర్తుము ఆ తండ్రి దత్తముల-నన్ని యార్జించు \nయాతని సుభద్రములో -ననయ ముందుము నిజము\n\n5 పరిపూర్ణ విశ్వాసమే - క్రియలతో నున్న \nమరి మంచి విశ్వాసమే ధరయందున్‌ బరమందున్‌ \nధన్యాత్మునిగ జేయున్‌ - సరగు నద్దానినే – సంపాదించుము ప్రియుడా "},{"n":153,"ei":"Peace, perfect peace","ci":"Jehovah Jireh, myprovider","ti":"ఎన్నడు నెడబాయ – నేకొలది విడనాడ ","es":"1.Peace, perfect peace, in this dark world of sin?\nThe blood of Jesus whispers peace within.\n\n2.Peace, perfect peace, by thronging duties pressed?\nTo do the will of Jesus, this is rest.\n\n3.Peace, perfect peace, with sorrows surging round?\nOn Jesus’ bosom naught but calm is found.\n\n4.Peace, perfect peace, with loved ones far away?\nIn Jesus’ keeping we are safe, and they.\n\n5.Peace, perfect peace, our future all unknown?\nJesus we know, and He is on the throne.\n\n6.Peace, perfect peace, death shadowing us and ours?\nJesus has vanquished death and all its powers\n\n7.It is enough:earth’s struggles soon shall cease,\nAnd Jesus call us to heaven’s perfect peace.","ec":"Jehovah Jireh, my Provider,\nYour grace is sufficient\nFor me, for me, for me.\nJehovah Jireh, my Provider\nYour grace is sufficient for me.\nMy Lord shall supply all my needs\nAccording to His riches in glory;\nHe’ll give His angels charge over me,\nJehovah Jireh cares for me, for me, for me,\nJehovah Jireh cares for me.","ts":"ఎన్నడు నెడబాయ – నేకొలది విడనాడ - ననిన తండ్రి నిరత - మన్ని \nబాధలయందు - నన్ని దుఃఖములందు నన్ను బ్రోచు\n\n1.పాపుల రక్షింప - బ్రాణమిచ్చిన యేసు \nబ్రతికి యుండు - తన - ప్రాపుగోరినవారి \nభారము తా మోసి - ప్రాపయి యుండు\n\n2.ఎల్లకాలంబుల – నేకరీతిగ నుండు \nయేసునాధు-డాత -డెల్ల విశ్వాసుల \nనెల్ల - వేళల దలచి - యేలుచుండు\n\n3.తనవారి యక్కఱలు - తానెఱిగి \nయున్నాడు - తప్పకుండ - నాతడెనలేని \nదయబూని -వినువారి మనవులు వేడ్కమీఱ "},{"n":154,"ei":"Ye servants of God","ci":"Jesus is a wonderful","ti":"యేసువంటి ప్రియబంధుడు నాకిక\n","es":"1.Ye servants of God, your Master proclaim,\nAnd publish abroad His wonderful Name;\nThe Name all-victorious of Jesus extol;\nHis kingdom is glorious, and rules over all.\n\n2.God ruleth on high, Almighty to save;\nAnd still He is nigh, His presence we have!\nThe great congregation His triumph shall sing,\nAscribing salvation to Jesus our King.\n\n3.Let children acclaim their Saviour and Friend,\nIn songs to His Name their praises ascend:\nIn such a salvation how great is their joy;\nIn true adoration how blest their employ!\n\n4.Salvation to God, who sits on the throne;\nLet all cry aloud, and honour the Son;\nThe praises of Jesus all angels proclaim,\nFall down on their faces, and worship the Lamb.\n\n5.Then let us adore and give Him His right,\nAll glory and power, all wisdom and might,\nAll honour and blessing, with angels above,\nAnd thanks never-ceasing, and infinite love.","ec":"Jesus is a wonderful Saviour,\nHe will carry you thru;  (3)\nUntil the battle’s done and the \nvictory is won my Lord will carry you thru;\nO, my  precious brother, when the world’s on fire,\nYou’ll need my Jesus to be your Saviour;\nHe’ll hide you ever in the Rock of Ages,\nIn the Rock of Ages just cleft for you.","ts":"యేసువంటి ప్రియబంధుడు నాకిక నిహ పరములలో లేడన్న\nభాసురముగ నిజ భక్తుల కదియను భవ గోచర మెపుడగు నన్న\n\n1 ఊరు పేరు పరువులు మురువులు మరి -యూడగొట్టబడినను గాని\nకూరిమితో క్రీస్తుడు మాకుండిన కొదువరాదు గొప్పయు పోదు\n\n2 ఆడికలు తిరస్కారంబులు మా-కవమానములున్నన్‌ గాని\nతోడు క్రీస్తుడు మాకుండినను త్రోవ దప్పము ఓడిపోము\n\n3 తగ్గుపాటులును సిగ్గుపాటులును దలమీదను వ్రాలినగాని - దగ్గర మా\nపాలిట ప్రభువుండగ - సిగ్గును బొందము తగ్గున గుందము\n\n4 ఎన్నెన్నో శోధనల బాధలు చెల-రేగి మనలజుట్టిన యపుడు – కన్న తండ్రివలె\nనోదార్చును దన – ఘన వాగ్బలమున దునుమును వానిని\n\n5 మనసు క్రుంగి పలు చింతలచేత మట్టబడిన వేళను మాకు తన\nవాగ్దత్తములను జేతుల లే – వనెత్తి యెంతో సంతసమొసగును\n\n6 తల్లిదండ్రులు విడిచిన గాని తాను వదలడెప్పుడు మమ్ము\nఉల్లమునెత్తి పిలిచిన వేళ నోహోయనుచు దరికి వచ్చు\n\n7 అతడుండని పరమండలము ఇక వెదకినగాని యగపడదు\nక్షితినాతడు మామతిని వసించిన అతులిత సౌఖ్యం బదియే మోక్షము"},{"n":155,"ei":"There's a peace in my heart","ci":"Jesus ia alive today","ti":"మా సర్వానిధీ నీవయ్యా\nనీ సన్నిధి కొచ్చామయ్యా\n","es":"1.There’s a peace in my heart\nThat the world never gave\nA peace it cannot take away;\nTho’ the trials of life may surround like a cloud,\nI’ve a peace that has come there to stay\n\nConstantly abiding Jesus is mine;\nConstantly abiding Rapture divine\nHe never leaves me lonely\nWhispers O so kind,\t\n“I will never leave thee!” Jesus is mine.\n\n2.All the world seemed to sing of a Saviour and King\nWhen peace sweetly came to my heart;\nTroubles all fled away and my night turned to day\nBlessed Jesus, how glorious Thou art!\n\n3.This treasure I have in a temple of clay\nWhile here on His footstool I roam;\nBut He’s coming to take me,some glorious day,\nOver there to my heavenly home!","ec":"Jesus is Alive today (2)\nJesus is Alive, very much Alive,\nJesus is Alive Today.\n\n1.He’s living in the hearts of\nordinary people,\nHelping them to love both\nGod and man.\nGiving them the faith to\nlook for miracles,\nHelping them to know\nthey count in His plan.\n\n2.He’s always doing\nthings He used to do;\nThings like making people\nclean and new.\nEven though He’s got a\nworld to look after,\nStill He has the time to\nanswer prayer too.","ts":"మా సర్వానిధీ నీవయ్యా నీ సన్నిధి కొచ్చామయ్యా\nబహు బలహీనులము యేసయ్యా మము బలపరచుమో యేసయ్యా\nయేసయ్యా యేసయ్యా మా ప్రియమైన యేసయ్యా\n\n1 మా రక్షకుడవు మా స్నేహితుడవు పరిశుద్ధుడవు మా యేసయ్యా\nపరిశుద్ధమైన నీ నామమునే స్తుతియింపవచ్చామయ్యా\nమా స్తుతులందుకో యేసయ్యా(2)\n\n2 నీవే మార్గము నీవే సత్యము నీవే జీవము మా యేసయ్యా\nజీవపు దాత శ్రీ యేసునాథా స్తుతియింప వచ్చామయ్యా\nమా స్తుతులందుకో యేసయ్యా(2)\n\n3 విరిగితివయ్యా  నలిగితివయ్యా కలువరిలో మా యేసయ్యా\nవిరిగినలిగిన హృదయాలతోనే స్తుతియింప వచ్చామయ్యా\nమా స్తుతులందుకో యేసయ్యా(2)"},{"n":156,"ei":"Jesus is tenderly calling","ci":"Jesus is the Alpha, Alpha","ti":"క్రీస్తే సర్వాధికారి - క్రీస్తే మోక్షాధికారి\n","es":"1.Jesus is tenderly calling thee home\nCalling today, calling today!\nWhy from the sunshine of love wilt thou roam,\nFarther and farther away?\n\nCall...ing today! call...ing today!\nJe..sus is call...ing, is tenderly\nCalling today!\n\n2.Jesus is calling the weary to rest \nCalling today, calling today!\nBring Him thy burden, and thou shalt be blest;\nHe will not turn thee away.\n\n3.Jesus is waiting, oh, come to Him now \nWaiting today, waiting today!\nCome with thy sins; at His feet lowly bow, \nCome, and no longer delay!\n\n4.Jesus is pleading; oh, list to His voice\nHear Him today, hear Him today!\nThey who believe on His Name shall rejoice;\nQuickly arise and away!","ec":"Jesus is the Alpha, Alpha Omega (2)\nLike Him I want to be today and forever (2)\nI will praise Him for He’s Alpha, Alpha Omega (2)","ts":"క్రీస్తే సర్వాధికారి - క్రీస్తే మోక్షాధికారి\nక్రీస్తే మహోపకారి - క్రీస్తే ఆ సిల్వధారి\n\n1 ముక్తి విధాత నేత - శక్తినొసంగు దాత\nభక్తివిలాప శ్రోత పరమంబు వీడె గాన\n\n2 దివ్యపథంబురోసి - దైవంబుతోడు\nబాసి దాసుని రూపుదాల్చి ధరణికేతెంచెగాన\n\n3 శాశ్వత లోకవాసి - సత్యామృతంపు\nరాశి శాప భారంబు మోసి శ్రమల సహించెగాన\n\n4 సైతాను జనము గూల్పన్‌ పాతాళమునకు బంపన్‌\nనీతి పథంబు బెంప రుధిరంబు గార్చె గాన\n\n5 మృత్యువు ముల్లు తృంపన్‌ నిత్యజీవంబు బెంపన్ \nమార్త్యాళిభయము దీర్పన్‌ మరణంబు గెలిచెగాన\n\n6 పరమందు దివిజులైన - ధరయందు మనుజులైన\nప్రతి నాలుక మోకాలు ప్రభునే భజించుగాన\n\n7 ఈ నామమునకు మించు నామంబులేదటంచు\nయెహోవ తండ్రి యేసున్‌ హెచ్చించినాడు గాన"},{"n":157,"ei":"Have you any room","ci":"Jesus is the answer for","ti":"జై జై యేసు రాజా జై జై రాజాధిరాజా నీకే జై జై\n","es":"1.Have you any room for Jesus-\nHe who bore your load of sin?\nAs He knocks and asks admission,\nSinner, will you let Him in?\n\nRoom for Jesus, King of glory!\nHasten now, His word obey!\nSwing the heart's door widely open!\nBid Him enter while you may!\n\n2.Room for pleasure, room for business;\nBut for Christ, the crucified,\nNot a place that He can enter,\nIn the heart for which He died!\n\n3.Have you any time for Jesus,\nAs in grace He calls again?\nOh \"TODAY\" is \"time accepted\"\nTomorrow you may call in vain.\n\n4.Room and time now give to Jesus,\nSoon will pass God's day of grace;\nSoon thy heart be cold and silent,\nAnd thy Saviour's pleadings cease.","ec":"Jesus is the answer, for the world today;\nAbove Him there’s no other,\nJesus is the way.\nIf you have some questions in the corners of your mind,\nTraces of discouragement and peace you cannot find,\nReflections of your past, seem to face you every day,\nBut, this one thing I do know,\nJesus is the way.","ts":"జై జై యేసు రాజా జై జై రాజాధిరాజా నీకే జై జై \n\n1.పాప శాపములో బడియున్ననన్ను జూచి చేయి జాచి చకగ దరికి - చేర్చితివి\n\n2.సిలువ రక్తములో నన్ను కడిగి పాపమంతా పరిహరించిన పావనుడగు నా - ప్రభు యేసు\n\n3.నీతి హీనుడనైన నాకు నీతి రక్షణ వస్త్రములను ప్రీతితో నొసగిన-నీతి రాజా\n\n4.మంటి పురుగునైన నన్ను మంటి నుండి మింట జేర్చిన మహా ప్రభుండా - నీకే జై జై\n\n5.పాప శాపగ్రస్తుడనై యుండ నన్ను గూడ నీ స్వకీయ సంపాద్యముగా జేసితివి\n\n6.రాజులైన యాజక గుంపులో నన్ను గూడ నీ సొత్తయిన పరిశుద్ధ జనములో  జేర్చితివి\n\n7.తల్లియైన మరచిన మరచును నేను నిన్ను మరువననిన నమ్మకమైన నా ప్రభువా\n\n8.అధిక స్తోత్రార్హుడవైన ఆది యంతము లేని దేవా యుగాయుగములకు- నీకే జై జై"},{"n":158,"ei":"Hark my soul!","ci":"Jesus put this song into","ti":"స్వచ్ఛంద సీయోను వాసి\nసర్వాధికారి ","es":"1.Hark my soul! It is the Lord;\n‘Tis thy Saviour, hear His word;\nJesus speak, and speaks to thee,\n“Say, poor sinner, lov’st thou me?”\n\n2.“I delivered thee when bound,\nAnd, when bleeding,healed thy wound;\nSought thee wandering, set thee right,\nTurned thy darkness into light.”\n\n3.“Mine is an unchanging love,\nHigher than the heights above;\nDeeper than the depths beneath:\nFree and faithful, strong as death.”\n\n4.“Thou shalt see My glory soon,\nWhen the work of grace is done;\nPartner of My throne shalt be;\nSay, poor sinner, lov’st thou Me?”\n\n5.Lord! It is my chief complaint\nThat my love is weak and faint;\nYet I love Thee, and adore:\nOh, for grace to love Thee more!","ec":"1.Jesus put this song into our hearts,\nJesus put this song into our hearts,\nIt’s a song of joy no one can take away,\nJesus put this song, into our hearts.\n\n2.Jesus taught us how to live in harmony,\nJesus taught us how to live in harmony,\nDifferent faces, different races, He made us one,\nJesus taught us how to live in harmony.\n\n3.Jesus taught us how to be a family,\nJesus taught us how to be a family,\nLoving one another with the love that he gives,\nJesus taught us how to be, a family.","ts":"స్వచ్ఛంద సీయోను వాసి సర్వాధికారి కస్తూరి పూరాసి\nవర్తమాన భూత భవి-ష్యత్కాలవాసి\nఅల్ఫా ఓమేగ తానె ఆద్యంతము మన యేసే\n\n1 ఇదిగో నేనొక నిబంధనను అద్భుతముల జేతున్‌ నీ ప్రజలందరి యెదుట\nపరిశోధింప జాలని మహా పనులెల్ల ప్రభువే\nలెక్కలేని యద్భుతముల్‌ మక్కువతో చేయువాడు\n\n2 సంగీత నాదములతోడ సీయోను పురము సొంపుగను చేరితిమి\nశాశ్వత సంతోషము మా శిరములపై వెలసెన్‌\nదుఃఖము నిట్టూర్పును పోయెన్‌ మిక్కిలి ఆనందము గల్గెన్‌\n\n3 నీలముల పునాదులు వేసి నీలాంజనములతో మాణిక్యమణులతో\nసువర్ణశునీయముల సూర్యకాంతముతో\nప్రశస్త రత్నములతో ప్రవిమలముగ నిను గట్టెదను\n\n4 సుమముల హారము సంతోషానంద తైలము నీదే స్తుతివస్త్రమును నీదే\nఉల్లాస వస్త్రంబు నీదే విడుదలయు నీదే\nహితవత్సరము విముక్తి ఆత్మాభిషేకము నీదే\n\n5 జలములలో బడి దాటునపుడు బలమై యుండెదను నీ తోడై యుండెదను\nనదులలో వెళ్లునప్పుడు నీపై పారవు\nఅగ్ని మధ్యను నడచినను జ్వాలలు నిను కాల్చగలేవు\n\n6 ఇత్తడి తలుపుల బగుల గొట్టెద నినుప గడియలను విడగొట్టెదను నేను\nఅంధకార స్థలములలోనున్నట్టి నిధులను రహస్యములో\nమరుగైన ధనమును నీకొసంగెదను\n\n7 గర్భమున పుట్టినది మొదలు తల్లి యొడిలోన కూర్చుండినది మొదలు\nనేను చంకబెట్టుకొన్న-నాదు ప్రజలారా\nముదిమి వచ్చువరకు నిన్ను ఎత్తుకొనువాడను నేనే\n"},{"n":159,"ei":"Have you been to Jesus","ci":"Jesus set me absolutely","ti":"విజయ గీతముల్ పాడరే - క్రీస్తుకు జయ","es":"1.Have you been to Jesus for the cleansing power?\nAre you washed in the blood of the Lamb?\nAre you fully trusting in His grace this hour?\nAre you washed in the blood of the Lamb?\n\nAre you washed...in the blood,\nIn the soul-cleansing blood of the Lamb?\nAre your garments spotless? Are they white as snow?\nAre you washed in the blood of the Lamb?\n\n2.Are you walking daily by the Saviour’s side? \nAre you washed in the blood of the Lamb?\nDo you rest each moment in the Crucified?\nAre you washed in the blood of the Lamb?\n\n3.When the Bridegroom cometh, will your robes be white\nPure and white in the blood of the Lamb?\nWill your soul be ready for the mansions bright\nAnd be washed in the blood of the Lamb?\n\n4.Lay aside the garments that are stained with sin,\nAnd be washed in the blood of the Lamb!\nThere’s a fountain flowing for the soul unclean\nOh, be washed in the blood of the Lamb!","ec":"Jesus set me absolutely free;\nDied on Calvary, gave me liberty;\nJesus set me absolutely free,\nPraise His Name.\nAnd that’s enough to make me shout (twice)\nFor my sins are all forgiv’n and I’m on my way to heaven,\nAnd that’s enough to make me shout.","ts":"విజయ గీతముల్‌ పాడరే - క్రీస్తుకు జయ - విజయ గీతముల్‌ పాడరే\nవృజిన మంతటి మీద - విజయ మిచ్చెడు దేవ - నిజకుమారుని నామమున్‌\nహృదయములతో భజన చేయుచు నిత్యమున్   ||విజ||\n\n1.మంగళముగ యేసుడే - మనకు రక్షణ - శృంగమై మరి నిల్చెను \nనింగిన్‌  విడిచి వచ్చెను - శత్రుని యుద్ధ - రంగమందున గెల్చెను \nరంగు మీరగ దన  రక్తబలము వలన పొంగు నణగ జేసెను \nసాతానుని బల్‌ కృంగ నలిపి చీల్చెను   ||విజ||\n\n2.పాపముల్‌ దొలగింపను - మనలను దన స్వ - రూపంబునకు మార్చను\nశాపం బంతయు నోర్చెను - దేవుని న్యాయ - కోపమున్‌ భరియించెను\nపాపమెరుగని యేసు - పాపమై మన కొరకు - పాప యాగము దీర్చెను\nదేవుని నీతిన్‌-ధీరుడై నెరవేర్చెను   ||విజ||\n\n3.సిలువ మరణము నొందియుమనలను దనకై - గెలువన్‌ లేచిన\nవానికి చెలువుగన్‌ విమలాత్మునిప్రేమను మనలో - నిలువన్‌ జేసిన\nవానికి - కొలువు జేతుమె గాని ఇలను మరువక వాని - సిలువ \nమోయుచు నీ కృపా - రక్షణ చాల విలువగలదని చాటుచు   ||విజ||"},{"n":160,"ei":"I hear thy welcome voice","ci":"Jesus set the music sing","ti":"యెహోవా నా మొఱ లాలించెను ","es":"1.I hear Thy welcome voice,\nThat calls me, Lord, to Thee,\nFor cleansing in Thy precious blood \nThat flowed on Calvary.\n\nI am coming, Lord,\nComing now to Thee;\nWash me, cleanse me, in the blood \nThat flowed on Calvary.\n\n2.‘Tis Jesus calls me on \nTo perfect faith and love,\nTo perfect hope, and  peace, and trust,\nFor earth and heaven above.\n\n3.‘Tis Jesus who confirms\nThe blessed work within,\nBy adding grace to welcomed grace,\nWhere reigned the power of sin.\n\n4.And He the witness gives\nTo loyal hearts and free,\nThat every promise is fulfilled,\nIf faith but brings the plea.\n\n5.All hail, atoning blood!\nAll hail, redeeming grace!\nAll hail, the gift of Christ, our Lord.\nOur Strength and Righteousness!","ec":"Jesus set the music singing,\nJesus made the shadows part;\nJesus set the joy bells ringing,\nDeep within my heart.\nNow that my heart’s in tune,\nI know that some day soon\nI’ll join the angels in that\nHeavenly chorus up above,\nFor Jesus set the music singing,\nJesus made the shadows part;\nJesus set the joy bells ringing,\nDeep within my heart.","ts":"యెహోవా నా మొఱ లాలించెను దన-మహా దయను నను గణించెను\nఅహర్నిశల దీనహీనుడగు నా దు హాయనెడు ధ్వని గ్రహించి మనిపెను\n\n1 పిశాచి గడిమి బడగొట్టెను దన వశాన నను నిలువ బెట్టెను\nప్రశాంత  మధుర సు - విశేష వాక్ఫల నిశాంతమున జే - ర్చిసేద దీర్చెను\n\n2 మదావళము బోలు నామదిన్‌ దన - ప్రదీప్త వాక్యాం కుశాహతిన్‌\nయధేచ్ఛలన్నిటి గుదించి పాపపు మొదల్‌ తుదల్‌ నరి - కిదరికి చేర్చెను\n\n3 అనీతి వస్త్ర మెడలించెను యే - సునాధు రక్తమున ముంచెను\nవినూత్న యత్నమె - ద నూని యెన్నడు గనన్‌ వినన్‌ బ్రేమనాకు చూపెను\n\n4 విలాపములకు జెవి నిచ్చెను శ్రమ - కలాపములకు సెలవిచ్చెను\nశిలానగము పై - కి లాగి నను సుఖ - కళావళుల్‌ మన-సులోన నిలిపెను\n\n5 అగణ్య పాపియని త్రోయక న-న్ను గూర్చి తన సుతుని దాచక\nతెగించి మృతి కొప్పగించి పాపపు నెగుల్‌ దిగుల్‌ సొగసుగా నణంచెను"},{"n":161,"ei":"I was sinking deep in sin","ci":"Jesus stand among us","ti":"నీ కన్న నిఁక వేరే - వేల్పులు లేరయ్యా ","es":"1.I was sinking deep in sin, far from the peaceful shore,\nVery deeply stained within, sinking to rise no more;\nBut the Master of the sea heard my despairing cry,\nFrom the waters lifted me, now safe am I\n\nLove lifted me, love lifted me, \nWhen nothing else could help, love lifted me;\nLove lifted me, love lifted me, \nWhen nothing else could help, love lifted me.\n\n2.All my heart to Him I give, ever to Him I’ll cling,\nIn His blessed presence live, ever His praises sing.\nLove so mighty and so true merits my soul’s best songs;\nFaithful, loving service too to Him belongs.\n\n3.Souls in danger, look above, Jesus completely saves;\nHe will lift you by His love out of the angry waves.\nHe’s the Master of the sea, billows His will obey;\nHe your Saviour wants you to be saved today.","ec":"1.Jesus, stand among us\nAt the meeting of our lives;\nBe our sweet agreement\nAt the meeting of our eyes.\n\nO Jesus, we love You, so we gather here;\nJoin our hearts in unity and take away our fear.\n\n2.So to You we're gathering\nOut of each and every land;\nChrist the love between us\nAt the joining of our hands.","ts":"నీ కన్న నిక వేరే - వేల్పులు లేరయ్యా నిజముగా నా యేసువా\nనీ కరుణ యను నెనరు చేతను - నీదు సత్య సువార్త ద్వారా\nప్రాకటంబుగ నన్ను బిలిచిన - లోక రక్షక నీకు మ్రొక్కెద \n\n1 నిన్ను దెలియక మున్ను-నన్య దైవంబుల-ననుసరించిన పాపము-లన్ని పెనగొని నాదు హృదయపు-గన్ను గ్రమ్మి ప్రకాశమియ్యక-యున్న నీ విమలాత్మ వరమున నన్ను వెలిగించిన దయానిధి\n\n2 వదలకనే జేయు-తుదలేని పాపము-వదలించి నను బ్రోచితి-తుది దినంబున గలుగు బాధల-దొలగ జేయుట నీవయని నా-హృదయమందున నా నిరీక్షణ – పదిలపరచిన భక్త పాలక\n\n3 నీ వాక్యార్థము నాలో-నివసింప జేసి నీ-సేవకునిగ బ్రోవవే నీవె సత్యము నీవె జీవము నీవె మార్గము నీవె ద్వారము నీవు గాకింకెవ్వరు లేరు - కావవే నను యేసునాయక "},{"n":162,"ei":"Jesus calls us, o'er","ci":"Jesus use me, and please","ti":"బహుగా ప్రార్థన చేయుడి\nఇకమీదట బహుగా ","es":"1.Jesus calls us, o’er the tumult\nOf our life’s wild, restless sea,\nDay by day His sweet voice soundeth,\nSaying,”Christian, follow Me”.\n\n2.As of old apostles heard it\nBy the Galilean lake,\nTurned from home and toil and kindred,\nLeaving  all for His dear sake.\n\n3.Jesus calls us, from the worship\nOf the vain world’s golden store:\nFrom each idol that would keep us,\nSaying,“Christian, love Me more”.\n\n4.In our joys, and in our sorrows,\nDays of toil, and hours of ease,\nStill He calls, in cares and pleasures,\n“Christian, love me more than these”.\n\n5.Jesus calls us by Thy mercies,\nSaviour, may we hear Thy call;\nGive our hearts to thy obedience,\nServe and love Thee best of all.","ec":"Jesus use me, and please don’t refuse me\nSurely there’s a work that I can do\nEven tho’ it’s humble, help my will to crumble\nThough the task be great, I’ll work for you.\n\n1.Dear Lord, I’ll be your witness\nIf you’ll help my weakness,\nI know that I’m not worthy, Lord, of Thee;\nBy eyes of faith I see Thee,\nUpon the Cross of Calvary,\nI cry, dear Lord, let me Thy servant be.\n\n2.He’s the Lily of the valley,\nHe’s the Bright and Morning Star,\nThe Fairest of ten thousand to my soul;\nHe’s the beauiful Rose of Sharon,\nHe’s all the world to me,\nI love Him and I want the world to know.","ts":"బహుగా ప్రార్థన చేయుడి ఇకమీదట బహుగా ప్రార్థనచేయుడి \nబహుగా ప్రార్థన చేసి-బలమున్‌ సంపాదించి - మహిలో కీడును \nగెల్వుడి-దేవుని కెపుడు-మహిమ కలుగనీయుడి \n\n1.చెడుగెక్కువగుచున్నది-భూలోకమున చెడుగెక్కువగుచున్నది చెడుగుపై మంచిపై-చేయగలదౌనట్లు విడువక ప్రార్థించుడి-మీ ప్రార్థన కడవరకు బోనీయుడి\n\n2.వాగ్దానములు చూడుడి-దేవుని గ్రంథ వాగ్దానములు జూడుడి వాగ్దానముల్‌ జరుగ వలసిన కార్యంబుల్‌  వాగ్దానములు నమ్ముడి ఈ రీతిగా  ప్రభుని సన్మానించుడి\n\n3.విందు నన్న దేవుని-వాగ్దానము  విందుగా ధ్యానించుడి విందులో నుండగా-వింతగ నెరవేర్పు బొందియానందింతురు-ఇది రెండవ విందంచు గ్రహింతురు\n\n4.విసుగుదల జెందరాదు-ప్రార్థన నెరవేర్పు తత్‌క్షణమె రాదు విసుగున్నచో సిద్ధి-వెనుకకే పోవును వసియించుడి దేవుని-వాగ్దానమున భటులవలె నిల్వుడి\n\n5.సంశయము పనికిరాదు-లేశంబైన సంశయము పనికిరాదు సంశయింపక దైవ సన్నిధియందు మీ యంశము విడచెప్పుడి-దానికి గొప్ప యంశం బట్టనీయుడి\n\n6.సిద్ధి కనుపింపకున్న-వాగ్దానము సిద్ధియున్నది చూడుడి-సిద్ధి యప్పుడు మీకై సిద్ధవై వెడలి ప్ర- సిద్ధిలోనికి వచ్చును-మీ నమ్మిక వృద్ధిగాంచి నిల్చును\n\n7.సంతోషమందరారె-మన దేవుని సంస్తుతి చేయరారె-సంతోషబలముచే సర్వ కష్టములను- అంతరింపజేతుము మన దేవుని సంతోష పరచెదము\n\n8.అంతయు మనదేగదా-యేసుని కున్నదంతయు మనదె గదా అంతయు మన ప్రభువు ఆర్జించియున్నాడు-స్వంతమని అందుకొనుడి-మీ ఆత్మకు శాంతి జెందనీయుడి\n\n9.విజయ జీవనము మనదె-క్రీస్తిచ్చిన విజయ జీవనము మనదె విజయ జీవనము మనదె విశ్వమంతయు మనదె-భజన సంఘంబు మనదె దేవుడున్న పరలోకమెల్ల మనదె"},{"n":163,"ei":"Must I go - and empty - handed?","ci":"Jesus,Jesus you are the","ti":"ఆత్మ దీపమును - వెలిగించు యేసు ప్రభో ","es":"1.Must I go - and empty-handed?\nThus my dear Redeemer meet?\nNot one day of service give Him,\nLay no trophy at His feet?\n\nMust I go - and empty - handed?\nMust  I meet my Saviour so?\nNot one soul with which to greet Him:\nMust I empty-handed go?\n\n2.Not at death I shrink or falter,\nFor my Saviour saves me now;\nBut to meet Him empty-handed,\nThought of that now clouds my brow.\n\n3.Oh, the years of sinning wasted,\nCould I but recall them now,\nI would give them to my Saviour\nTo His will I’d gladly bow.\n\n4.Up,ye saints, arouse, be earnest!\nUp, and work while yet ‘tis day:\nEre the night of death o’ertake you:\nStrive for souls while yet you may.","ec":"Jesus, Jesus you are the Son of God,\nJesus, Jesus the precious Son of God,\nSweetest Rose of Sharon,\nCome to set us free,\nJesus, Jesus you’re \teverything to me,\nYes you’re all the world to me.","ts":"ఆత్మ దీపమును - వెలిగించు యేసు ప్రభో - ఆత్మదీపమును\n\n1.మార్గంబంతయు చీకటిమయము స్వర్గ నగరికి మార్గంబెటులో\nసదయా నీవే నను పట్టుకొని సరిగా నడుపుము ప్రేమపథమున\n\n2.వసియించుము నా హృదయమునందు వసియించుము నానయనమునందు\nఅన్నియు నిర్వహించుచున్నావు నన్నును నిర్వహించుము ప్రభువా\n\n3.కలుషాత్ములకై ప్రాణము బెట్టి కష్టము లంతరింప జేసి\nకల్వరిసిలువలో కార్చిన  రక్త కాలువయందు కడుగుమునన్ను\n"},{"n":164,"ei":"Out of my bondage","ci":"Jesus, Jesus this is my","ti":"ఇశ్రాయేలు సైన్యములకు\nముందు నడిచినదైవమా\n","es":"1.Out of my bondage, sorrow, and night, \nJesus, I come! Jesus, I come!\nInto Thy freedom, gladness, and light,\nJesus, I come to Thee!\nOut of my sickness into Thy health,\nOut of my want and into Thy wealth,\nOut of my sin and into Thyself,\nJesus, I come to Thee!\n\n2.Out of my shameful failure and loss,\nJesus, I come! Jesus, I come!\nInto the glorious gain of Thy cross,\nJesus, I come to Thee!\nOut of earth’s sorrows into Thy balm,\nOut of life’s storm and into Thy calm,\nOut of distress to jubilant psalm,\nJesus, I come to Thee!\n\n3.Out of unrest and arrogant pride,\nJesus, I come! Jesus, I come!\nInto Thy blessed will to abide,\nJesus, I come to Thee!\nOut of myself to dwell in Thy love,\nOut of despair into raptures above,\nUpward for aye on wings like a dove,\nJesus, I come to Thee!\n\n4.Out of the fear and dread of the tomb,\nJesus, I come! Jesus, I come!\nInto the joy and light of Thy home,\nJesus, I come to Thee!\nOut of the depths of ruin untold,\nInto the peace of Thy sheltering fold,\nEver Thy glorious face to behold,\nJesus, I come to Thee!","ec":"Jesus, Jesus, this is my song\nJesus, Jesus, the whole day long,\nHe is mine, a Saviour divine,\nPraise His Holy Name.\n\n1.All the way my Lord is leading me\nPraise His Name! (2)\nWith His heav’nly manna feeding me\nPraise His Holy Name.\n\n2.When I faint, His grace upholdeth me\nPraise His Name! (2)\nWhen I fear, His arms enfoldeth me\nPraise His Holy Name","ts":"ఇశ్రాయేలు సైన్యములకు ముందు నడిచినదైవమా\nనేడు మాతోకూడ నుండి మమ్ము నడిపించుము\n\n1.సొలోమోను దేవాలయములో మేఘమురాగనే\nయాజకులు నీతేజో మహిమకు నిలువలేకపోయిరి\n\n2.పూర్వపు ప్రవక్తలతో నరుల రక్షణ ప్రకటించి\nనన్ను వెదకెడు వారికి దొరికెద నంటివి\n\n3.నరుల యందు నీదు ప్రేమ క్రీస్తు ద్వారా బయలుపరచి\nసిల్వరక్తముచేత మమ్ము రక్షించియుంటివి\n \n4.ఆది యపోస్తలులపై నీ యాత్మ వర్షము కుమ్మరించి\nనట్లు మాపై కుమ్మరించి మమ్మునడిపించుము \n"},{"n":165,"ei":"Sinners, Jesus will receive","ci":"Jesus, name above all","ti":"నీవు తోడైయున్న జాలు-యేసు \n","es":"1.Sinners Jesus will receive;\nSound this word of grace to all\nWho  the heavenly pathway leave,\nAll who linger, all who fall!\n\nSing it o’er...and o’er again; ...\nChrist receiveth sinful men;...\nMake the mess...age clear and plain:\nChrist receiveth sinful men.\n\n2.Come and He will give you rest;\nTrust Him: for His word is plain;\nHe will take the sinfulest:\nChrist receiveth sinful men.\n\n3.Now my heart condemns me not,\nPure before the law I stand;\nHe who cleansed me from all spot,\nSatisfied its last demand.\n\n4.Christ receieveth sinful men,\nEven me with all my sin;\nPurged from every spot and stain,\nHeaven with Him I enter in.","ec":"Jesus, Name above all names,\nBeautiful Saviour, Glorious Lord,\nEmmanuel, God is with us,\nBlessed Redeemer, Living Word.","ts":"నీవు తోడైయున్న జాలు-యేసు నిత్యము నా కదిమేలు-నీవు ధరణినుండు-నీచ పాపులనెల్ల గావబ్రేమ వచ్చి-ఘన ప్రాణమిడినట్టి\n\n1 నిను బోలు రక్షకుండేడి-క్రీస్తు నను బోలు పాతకుండేడి-నిను నమ్ము వారలకు నీ వొసగుచుందువు-తనర పాపక్షమ- దయచేత నిలలోన\n\n2 నీ పాటి బలవంతుడేడి-ప్రభు నాపాటి దుర్భలుండేడి-కాపాడుచుందువు కల కాలమును నీవ
