<h2>English Chorus 220</h2><pre>Over and over,<br>Like a mighty sea ,<br>Comes the love of Jesus,<br>Rolling over me.<br>Over the sea, over the sea,<br>Jesus, Saviour, pilot me;<br>Over the sea, over the sea,<br>Over the Jasper sea.</pre></body></html>
