<h2>English Chorus 170</h2><pre>Lead me to some soul today<br>O, teach me Lord just what to say;<br>Friends of mine are lost in sin,<br>And cannot find their way.<br>Few there are who seem to care,<br>And few there are who pray;<br>Melt my heart and fill my life;<br>Give me one soul today.</pre></body></html>
