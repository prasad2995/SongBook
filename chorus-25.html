<!DOCTYPE html>
<html><head><title>Chorus 25</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    padding: 20px;
    margin: 0;
}
h1, h2 {
    color: #003049;
}
.container {
    max-width: 800px;
    margin: auto;
}
.button {
    background-color: #003049;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin: 5px;
    font-size: 18px;
}
.song-link {
    display: block;
    padding: 10px;
    background: white;
    margin: 10px 0;
    border-radius: 10px;
    text-decoration: none;
    color: #003049;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.search-box {
    margin: 20px 0;
}
input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100px;
}
</style>
</head>
<body><div class="container">
    <h2>Chorus 25</h2>
    <div style="background:white; padding:20px; border-radius:12px;">Behold, behold;<br>I stand at the door and knock, knock, knock; (2)<br>If any girl hears my voice,<br>If any boy hears my voice,<br>And will open, open, open the door,<br>I will come in.</div>
</div></body></html>
