<h2>English Chorus 207</h2><pre>O I love to hear His voice,<br>Saying,”You belong to Me.<br>You are not your own,<br>With a price you’re bought<br>And you’re mine eternally”.<br>And I love to hear Him say,<br>“I have saved you by My grace.”<br>And when I get to glory<br>It will then be grander still;<br>For I shall see His face.</pre></body></html>
