<h2>English Chorus 186</h2><pre>1.Lord, You’re beautiful<br>Your face is all I see,<br>And when Your eyes are upon this child<br>Your grace abounds to me.<br><br>2.Lord, please light the fire<br>That once burnt bright and clear,<br>Replace the lamp of my first love<br>That burns with Holy fear.</pre></body></html>
