<h2>English Chorus 312</h2><pre>Jesus we enthrone You,<br>We proclaim You our King.<br>Standing here in the midst of us,<br>We raise You up with our praise.<br>And as we worship, build a throne, (3)<br>Come, Lord Jesus, take Your place.</pre></body></html>
