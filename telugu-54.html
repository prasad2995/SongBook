                <h2>Telugu 54</h2>
                <pre>కన్నతల్లి చేర్చునట్లు<br>నన్ను చేర్చు నా ప్రియుడు <br>హల్లెలూయ  (4)<br><br>1.కౌగిటిలో హత్తుకొనున్‌ <br>నా చింతలన్‌ బాపును<br><br>2.చేయిపట్టి నడుపును<br>శిఖరముపై నిలుపును<br><br>3.నా కొరకై మరణించె<br>నా పాపం భరియించె<br><br>4.చేయి విడువడు ఎప్పుడు<br>విడనాడడు ఎన్నడు</pre>
