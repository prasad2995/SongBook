<!DOCTYPE html>
<html><head><title>Telugu 54</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body {

}

    color: #003049;
}

    max-width: 800px;
    margin: auto;
}

    background-color: #003049;

    display: block;
    padding: 10px;

    margin: 10px 0;

    margin: 20px 0;

</head>
<body><div class="container">
    <h2>Telugu 54</h2>
    <div style="background:white; padding:20px; border-radius:12px;">కన్నతల్లి చేర్చునట్లు<br>నన్ను చేర్చు నా ప్రియుడు <br>హల్లెలూయ  (4)<br><br>1.కౌగిటిలో హత్తుకొనున్‌ <br>నా చింతలన్‌ బాపును<br><br>2.చేయిపట్టి నడుపును<br>శిఖరముపై నిలుపును<br><br>3.నా కొరకై మరణించె<br>నా పాపం భరియించె<br><br>4.చేయి విడువడు ఎప్పుడు<br>విడనాడడు ఎన్నడు</div>
</div></body></html>
