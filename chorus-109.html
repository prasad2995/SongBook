<h2>English Chorus 109</h2><pre>I took a plunge in the crimson flood<br>That washes white as snow,<br>I took a drink at the Fountain head;<br>And it satisfies I know;<br>I took a look at the Christ of the cross,<br>And my burdens rolled away -<br>And I’m shouting singing “Praise the Lord!”<br>For the happy, happy day.</pre></body></html>
