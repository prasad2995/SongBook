<h2>English Chorus 152</h2><pre>Jehovah Jireh, God will provide,<br>Jehovah Rophe, God heals;<br>Jehovah M’keddesh, God who sanctifies,<br>Jehovah Nissi, God is my banner.<br>Jehovah Rohi, God my Shepherd,<br>Jehovah Shalom, God is peace;<br>Jehovah Tsidkenu, God our righteousness,<br>Jehovah Shammah, God who is there.</pre></body></html>
