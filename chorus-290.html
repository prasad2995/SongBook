                <h2>Chorus 290</h2>
                <pre>Why do you let the troubles of tomorrow,<br>Bring sorrow to your heart and burdens too,<br>For if the Father’s eye is on  the sparrow,<br>Then surely He will care for you.<br>He knoweth and careth, each burden, He beareth<br>For if the Father’s eye is on the sparrow,<br>Then surely He will care for you.</pre>
