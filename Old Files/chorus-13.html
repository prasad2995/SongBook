<!DOCTYPE html>
<html><head><title>Chorus 13</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    padding: 16px;
    margin: 0;
    color: #003049;
}
h1, h2 {
    color: #003049;
    text-align: center;
}
.container {
    max-width: 900px;
    margin: auto;
}
.button {
    background-color: #003049;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    margin: 5px;
    width: 100%;
    max-width: 300px;
}
.button:hover {
    background-color: #005f73;
}
.song-link {
    display: block;
    padding: 14px;
    background: white;
    margin: 10px 0;
    border-radius: 10px;
    text-decoration: none;
    color: #003049;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.search-box {
    text-align: center;
    margin: 20px 0;
}
input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 120px;
    font-size: 16px;
}
@media (max-width: 600px) {
    .button {
        font-size: 16px;
        padding: 12px;
    }
    .song-link {
        font-size: 16px;
    }
    input[type="number"] {
        width: 100px;
    }
}
</style>
</head>
<body><div class="container">
    <h2>Chorus 13</h2>
    <div style="background:white; padding:20px; border-radius:12px; font-size:18px; line-height:1.6; overflow-wrap:break-word;">All through the day,<br>All through the night,<br>My Saviour has been<br>watching over me;  (2)<br>He saves me, He keeps me,<br>He satisfies completely;<br>He washed me in His all atoning blood;<br>My sins are all forgiv’n<br>I’m on my way to heaven,<br>Walking in the smile of God.</div>
</div></body></html>
