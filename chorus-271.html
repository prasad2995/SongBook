                <pre>Trust in the Lord and don’t despair,<br>He is a Friend so true;<br>No matter what your troubles are,<br>Jesus will see you through.<br>Sing when the day is bright,<br>Sing through the darkest night,<br>Ev’ry day, all the way,<br>Let us sing, sing, sing.</pre>
