                <h2>Telugu 35</h2>
                <pre>యేసుని కుటుంబమొకటున్నది <br>ప్రేమతో నిండిన   స్థలమొకటున్నది<br>రాజాధిరాజైన యేసు నిరంతరం పాలించును  (2)<br><br>1.హెచ్చు తగ్గుల్‌ అక్కడసలె లేవు<br>పేద గొప్ప బేధములే లేవు   ||రా||<br><br>2.పాపం లేదు అక్కడ, శాపం లేదు<br>వ్యాధిలేదు, ఆకలసలే లేదు  ||రా||<br><br>3.సంతోషము, సమాధానముంది<br>విజయముంది, స్తుతి గీతముంది   ||రా||</pre>
