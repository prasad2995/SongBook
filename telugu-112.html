                <h2>Telugu 112</h2>
                <pre>తరతరాలలో, యుగయుగాలలో జగజగాలలో దేవుడు... దేవుడు... యేసే దేవుడు ఆ... ఆ... ఆ... ఆ... <br>హల్లెలూయా  హల్లెలూయా  హల్లెలూయా  హల్లెలూయా<br><br>1.భూమిని పుట్టించక మునుపు లోకపు పునాది లేనపుడు ||దే||<br><br>2.సృష్టికి శిల్పాకారుడు జగతికి ఆది సంభూతుడు ||దే|| <br><br>3.తండ్రి కుమార శుద్ధాత్మయు ఒకటైయున్న దేవుడు   ||దే||</pre>
