<!DOCTYPE html>
<html><head><title>Chorus 210</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    padding: 20px;
    margin: 0;
}
h1, h2 {
    color: #003049;
}
.container {
    max-width: 800px;
    margin: auto;
}
.button {
    background-color: #003049;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin: 5px;
    font-size: 18px;
}
.song-link {
    display: block;
    padding: 10px;
    background: white;
    margin: 10px 0;
    border-radius: 10px;
    text-decoration: none;
    color: #003049;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.search-box {
    margin: 20px 0;
}
input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100px;
}
</style>
</head>
<body><div class="container">
    <h2>Chorus 210</h2>
    <div style="background:white; padding:20px; border-radius:12px;">O Lord, do a work in me<br>Take all my sin and iniquity<br>O Lord, do a mighty  work in me<br>I want to be holy, pure and holy<br>To be like Thee.<br>Take it up, take it out<br>Every fear and every doubt<br>I want to be full of Your power and love.</div>
</div></body></html>
