<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telugu Songs</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    input[type="number"] {
      padding: 10px;
      font-size: 16px;
      width: 120px;
      border-radius: 8px;
      border: 1px solid #aaa;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-left: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .song-item {
      background: #fff;
      border-radius: 10px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .song-item:hover {
      background: #e6f7ff;
    }
	
	.search-box {
		text-align: center;
		margin: 20px;
	}
	.search-box input {
		padding: 8px;
		width: 60%;
		max-width: 300px;
		border-radius: 6px;
		border: 1px solid #ccc;
	}
	.search-box button {
		padding: 8px 15px;
		margin-left: 5px;
		background: #003049;
		color: white;
		border: none;
		border-radius: 6px;
		cursor: pointer;
	}
	.song-result {
		background: #ffffffaa;
		margin: 15px auto;
		padding: 15px;
		border-radius: 10px;
		max-width: 600px;
		text-align: left;
	}
  </style>
</head>
<body>
  <h1>Telugu Songs</h1>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Enter song number or text...">
  <button onclick="searchSongs()">Search</button>
</div>

<div id="results"></div>

  <script>
    let indexSongs = [];

    fetch("Index.json")
      .then(res => res.json())
      .then(data => {
        indexSongs = data;
        renderIndexList();
      });

    function renderIndexList() {
      const listContainer = document.getElementById("song-list");
      indexSongs.forEach(song => {
        const songItem = document.createElement("div");
        songItem.className = "song-item";
        songItem.innerHTML = `<strong>${song.Number}.</strong> ${song.Tel_Song_Name}`;
        songItem.onclick = () => {
          window.location.href = `telugu_song.html?number=${song.Number}`;
        };
        listContainer.appendChild(songItem);
      });
    }

   function searchSongs() {
    const input = document.getElementById("searchInput").value.trim();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    if (input === "") {
      resultsDiv.innerHTML = "<p>దయచేసి పాట నంబరు లేదా పదం ఇవ్వండి</p>";
      return;
    }

    let results = [];

    // If input is a number, search by number
    if (!isNaN(input)) {
      results = indexSongs.filter(song => song.number === parseInt(input));
    } else {
      // Otherwise search Telugu text inside title/lyrics
      results = indexSongs.filter(song =>
        song.title.includes(input) || song.lyrics.includes(input)
      );
    }

    if (results.length === 0) {
      resultsDiv.innerHTML = "<p>ఫలితాలు లేవు</p>";
    } else {
      results.forEach(song => {
        const songDiv = document.createElement("div");
        songDiv.classList.add("song-result");
        songDiv.innerHTML = `
          <h3>${song.number}. ${song.title}</h3>
          <p>${song.lyrics}</p>
        `;
        resultsDiv.appendChild(songDiv);
      });
    }
  }
  </script>
</body>
</html>
