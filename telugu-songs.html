<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Songs</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    input[type="number"] {
      padding: 10px;
      font-size: 16px;
      width: 120px;
      border-radius: 8px;
      border: 1px solid #aaa;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-left: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .song-item {
      background: #fff;
      border-radius: 10px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .song-item:hover {
      background: #e6f7ff;
    }
  </style>
</head>
<body>
  <h1>English Songs</h1>

  <div id="search-container">
    <input type="number" id="song-number-input" placeholder="Enter number" />
    <button onclick="searchSong()">Search</button>
  </div>

  <div id="song-list"></div>

  <script>
    let indexSongs = [];

    fetch("Index.json")
      .then(res => res.json())
      .then(data => {
        indexSongs = data;
        renderIndexList();
      });

    function renderIndexList() {
      const listContainer = document.getElementById("song-list");
      indexSongs.forEach(song => {
        const songItem = document.createElement("div");
        songItem.className = "song-item";
        songItem.innerHTML = `<strong>${song.Number}.</strong> ${song.Tel_Song_Name}`;
        songItem.onclick = () => {
          window.location.href = `song.html?number=${song.Number}`;
        };
        listContainer.appendChild(songItem);
      });
    }

    function searchSong() {
      const input = document.getElementById("song-number-input").value;
      if (input) {
        window.location.href = `song.html?number=${input}`;
      }
    }
  </script>
</body>
</html>
