                <pre>Follow, Jesus, I will follow Jesus<br>Anywhere He leads me I will follow,<br>Follow Jesus, I will follow Jesus;<br>Anywhere He leads I’ll go.<br>Across the river, Down through the valley,<br>Or if it be on the mountain high;<br>I’ll go, Lord, anywhere You want me;<br>Take me, here am I.</pre>
