                <h2>Chorus 70</h2>
                <pre>Glory Jesus, glory,<br>You do the fighting for me;<br>Praise you Jesus, praise you.<br>In you there’s always victory.<br>Ye are of  God’s  little children,<br>And have overcome him;<br>For greater is He that is in you,<br>Than he that is in the world.</pre>
