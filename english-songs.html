<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>English Songs</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1a1a2e;
    }
    .search-container {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #333;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      background-color: #1a1a2e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .song-list {
      max-width: 700px;
      margin: auto;
    }
    .song {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    .song-title {
      font-weight: bold;
      cursor: pointer;
      color: #1a1a2e;
    }
    .song-title:hover {
      color: #3a86ff;
    }
    .lyrics {
      display: none;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    @media screen and (max-width: 600px) {
      body {
        padding: 10px;
      }
      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<body>
  <h1>English Songs</h1>
  <div id="song-list"></div>
  <div id="song-display"></div>
</body>
  <script>
let indexSongs = [];
let fullSongs = [];

// Load both JSON files
Promise.all([
  fetch("Index.json").then(res => res.json()),
  fetch("SongBook.json").then(res => res.json())
]).then(([indexData, fullData]) => {
  indexSongs = indexData;
  fullSongs = fullData;
  renderIndexList();
});

function renderIndexList() {
  const listContainer = document.getElementById("song-list");
  listContainer.innerHTML = "";

  indexSongs.forEach(song => {
    const songItem = document.createElement("div");
    songItem.className = "song-item";
    songItem.innerHTML = `<strong>${song.Number}.</strong> ${song.Eng_Song_Name}`;
    songItem.addEventListener("click", () => showFullSong(song.Number));
    listContainer.appendChild(songItem);
  });
}

function showFullSong(songNumber) {
  const song = fullSongs.find(s => s.Number === songNumber);
  const displayArea = document.getElementById("song-display");

  if (song) {
    displayArea.innerHTML = `
      <h2>${song.Number}. ${song.Eng_Song_Name}</h2>
      <pre>${song.Eng_Song_Name}</pre>
    `;
  } else {
    displayArea.innerHTML = "<p>Lyrics not found.</p>";
  }
}
</script>
</body>
</html>
