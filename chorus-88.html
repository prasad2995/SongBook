<h2>English Chorus 88</h2><pre>He’ll go with me all the way,<br>He’s my comfort and my stay,<br>By His tender love and mercy,<br>I will never never stray.<br>O’er the mountains rough and steep,<br>Through the valleys dark and deep,<br>Till I reach my home in glory,<br>He’ll go with me all the way.</pre></body></html>
