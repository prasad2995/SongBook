                <h2>Chorus 205</h2>
                <pre>Now unto Him who is able to keep,<br>Able to keep you from falling<br>And present you faultless<br>Before the presence of His glory<br>With exceeding joy<br>To the only wise God our Saviour<br>Be glory and Majesty<br>Dominion and power<br>Both now and forever, Amen.</pre>
