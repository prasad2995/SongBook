<!DOCTYPE html>
<html><head><title>Chorus 131</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    padding: 20px;
    margin: 0;
}
h1, h2 {
    color: #003049;
}
.container {
    max-width: 800px;
    margin: auto;
}
.button {
    background-color: #003049;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin: 5px;
    font-size: 18px;
}
.song-link {
    display: block;
    padding: 10px;
    background: white;
    margin: 10px 0;
    border-radius: 10px;
    text-decoration: none;
    color: #003049;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.search-box {
    margin: 20px 0;
}
input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100px;
}
</style>
</head>
<body><div class="container">
    <h2>Chorus 131</h2>
    <div style="background:white; padding:20px; border-radius:12px;">If my people who bear my name,<br>Will humble themselves and pray,<br>If they seek my presence and turn <br>their backs on their wicked ways.<br>Then I will hear from heaven<br>I’ll hear from heaven and forgive;<br>I will forgive their sins<br>And will heal their land,<br>Yes, I will heal their land.</div>
</div></body></html>
