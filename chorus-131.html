<h2>English Chorus 131</h2><pre>If my people who bear my name,<br>Will humble themselves and pray,<br>If they seek my presence and turn <br>their backs on their wicked ways.<br>Then I will hear from heaven<br>I’ll hear from heaven and forgive;<br>I will forgive their sins<br>And will heal their land,<br>Yes, I will heal their land.</pre></body></html>
