<h2>Telugu Song 179</h2><pre>దయచేయుము పాప క్షమా<br>దయచేయుము పాపక్షమా యేసుని రక్తము-రక్తము వల్లనే (2)<br><br>1.తుడువుము పాపపు డాగులు<br>తుడువుము పాపపు డాగులు<br><br>2.అనుగ్రహింపుము జయము సదా<br>అనుగ్రహింపుము జయము సదా<br><br>3.ఇమ్ము నిజ సమాధానము<br>ఇమ్ము నిజ సమాధానము<br><br>4.పరమపురిని జేరనిమ్ము<br>పరమ పురిని జేరనిమ్ము</pre></body></html>
