<body><div class="container">
    <h2>Telugu 179</h2>
    <div style="background:white; padding:20px; border-radius:12px;">దయచేయుము పాప క్షమా<br>దయచేయుము పాపక్షమా యేసుని రక్తము-రక్తము వల్లనే (2)<br><br>1.తుడువుము పాపపు డాగులు<br>తుడువుము పాపపు డాగులు<br><br>2.అనుగ్రహింపుము జయము సదా<br>అనుగ్రహింపుము జయము సదా<br><br>3.ఇమ్ము నిజ సమాధానము<br>ఇమ్ము నిజ సమాధానము<br><br>4.పరమపురిని జేరనిమ్ము<br>పరమ పురిని జేరనిమ్ము</div>
