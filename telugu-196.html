                <h2>Telugu 196</h2>
                <pre>జీవనదిని నా హృదయములో ప్రవహింప చేయుమయా<br>శరీర క్రియలన్నియూ నాలో నశియింప చేయుమయా<br><br>1.బలహీన సమయములో నీ బలము ప్రసాదించుము<br><br>2. ఆత్మీయ వరములతో నన్ను అభిషేకం చేయుమయా<br><br>3. ఎండిన ఎముకలన్నియు తిరిగి జీవింప చేయుమయా<br><br>4.హల్లెలూయా హల్లెలూయా హల్లెలూయా హల్లెలూయా</pre>
