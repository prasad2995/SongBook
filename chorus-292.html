<h2>English Chorus 292</h2><pre>Wide, wide as the Ocean,<br>High as the heavens above:<br>Deep, deep,<br>as the deepest sea<br>Is my Saviour’s love;<br><br>I, though so unworthy,<br>Still am a child of His care,<br>For His Word teaches me<br>That His love reaches me  ev’rywhere.</pre></body></html>
