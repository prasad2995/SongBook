<h2>English Chorus 84</h2><pre>He lives, He lives<br>Christ Jesus lives today<br>He walks with me and talks with me<br>Along life’s narrow way.<br>He lives, He lives, Salvation to impart!<br>You ask me how I know He lives<br>He lives within my heart.</pre></body></html>
