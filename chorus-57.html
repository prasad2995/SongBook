                <pre>Father in heaven, how we love you,<br>We lift your name in all the earth<br>May Your Kingdom<br>be established in our praises<br>As Your people declare Your mighty works.<br>Blessed be the Lord God Almighty,<br>Who was and is and is to come;<br>Blessed be the Lord God Almighty,<br>Who reigns forever more.</pre>
