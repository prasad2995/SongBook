<h2>English Chorus 227</h2><pre>Rejoice for the steps<br>Of the righteous man<br>They are ordered by God. (2)<br>In the time of trouble<br>God will uphold you<br>God will preserve you<br>God will sustain you<br>In the time of trouble God will lift you up<br>So rejoice your steps are ordered by God.</pre></body></html>
