<h2>English Chorus 63</h2><pre>For God so loved the world,<br>He gave His only Son,<br>To die on Calv’ry’s tree<br>From sin to set me free,<br>Some day He’s coming back,<br>What glory that will be!<br>Wonderful His love to me.</pre></body></html>
