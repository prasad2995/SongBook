<!DOCTYPE html>
<html><head><title>Chorus 55</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    padding: 20px;
    margin: 0;
}
h1, h2 {
    color: #003049;
}
.container {
    max-width: 800px;
    margin: auto;
}
.button {
    background-color: #003049;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin: 5px;
    font-size: 18px;
}
.song-link {
    display: block;
    padding: 10px;
    background: white;
    margin: 10px 0;
    border-radius: 10px;
    text-decoration: none;
    color: #003049;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.search-box {
    margin: 20px 0;
}
input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100px;
}
</style>
</head>
<body><div class="container">
    <h2>Chorus 55</h2>
    <div style="background:white; padding:20px; border-radius:12px;">Faithful One, so unchanging,<br>Ageless One,<br>You’re my rock of peace;<br>Lord of all, I depend on You,<br>I call out to You again and again (2)<br>You are my rock in times of trouble,<br>You lift me up when I fall down;<br>All through the storm,<br>Your love is the anchor,<br>My hope is in You alone.</div>
</div></body></html>
