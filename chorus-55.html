<h2>English Chorus 55</h2><pre>Faithful One, so unchanging,<br>Ageless One,<br>You’re my rock of peace;<br>Lord of all, I depend on You,<br>I call out to You again and again (2)<br>You are my rock in times of trouble,<br>You lift me up when I fall down;<br>All through the storm,<br>Your love is the anchor,<br>My hope is in You alone.</pre></body></html>
