                <pre>’Silver and gold have I none;<br>But such as I have give I thee:<br>In the Name of Jesus Christ<br>Of Nazareth rise up and walk.’<br>(He went) walking and leaping and praising God (twice).<br>In the Name of Jesus Christ of Nazareth rise up and walk.</pre>
