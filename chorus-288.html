                <h2>Chorus 288</h2>
                <pre>Where the Spirit of the Lord is, There is peace;<br>Where the Spirit of the Lord is, There is love.<br>There is comfort in life’s darkest hour,<br>There is light and life,<br>There is help and power,<br>In the Spirit, in the Spirit of the Lord.</pre>
