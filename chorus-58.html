<h2>English Chorus 58</h2><pre>Father, we thank You,<br>Father, we thank You,<br>Father, we thank You, for Your love.<br>May we enter Your gates with thanksgiving,<br>May we enter Your courts with our praise,<br>May we fall at Your throne<br>Where Your glory is shown,<br>And be lost in Your love and Your grace.</pre></body></html>
