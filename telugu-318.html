                <h2>Telugu 318</h2>
                <pre>గగనము చీల్చుకొని యేసు ఘనులను తీసుకొని<br>వేలాది దూతలతో భువికి వేగమె రానుండె<br><br>1.పరలోక పెద్దలతో పరివారముతో కదిలి <br>ధర సంఘ వధువునకై తరలెను వరుడదిగో<br><br>2.మొదటను గొఱ్ఱెగను ముదమారగ వచ్చెను<br>కొదమసింహపు రీతి కదిలెను ఘర్జనతో<br><br>3.కనిపెట్టు భక్తాళి కనురెప్పలో మారెదరు<br>ప్రధమమున లేచెదరు పరిశుద్ధులగు మృతులు</pre>
            </body>
